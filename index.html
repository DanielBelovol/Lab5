ator musi zapewnić świadczenie zastępcze w ramach tej samej imprezy bez dodatkowych kosztów dla klienta.","C":"Klient nie może być obciążany różnicą kosztów.","D":"Większe porcje nie zastępują niewykonanej usługi.","tip":"Niewykonana usługa → zastępstwo bez dopłaty."}},{"n":28,"q":"Zgodnie z ustawą o usługach hotelarskich i usługach pilotów wycieczek i przewodników turystycznych, obiekt hotelarski posiadający co najmniej 30 miejsc noclegowych, dostosowany do samoobsługi oraz świadczący minimalny zakres usług związanych z pobytem gości, to","o":{"A":"motel.","B":"kemping.","C":"dom wycieczkowy.","D":"schronisko młodzieżowe."},"a":"C","img":[2575,102],"e":{"A":"Motel – przy drogach, z parkingiem; min. 10 pokoi.","B":"Kemping – teren z miejscami na namioty i przyczepy.","C":"Poprawna. Dom wycieczkowy – min. 30 miejsc noclegowych, przystosowany do samoobsługi, minimalny zakres usług (definicja z ustawy).","D":"Schronisko młodzieżowe – dla młodzieży, nadzorowane przez organy oświaty.","tip":"30 miejsc + samoobsługa = dom wycieczkowy."}},{"n":29,"q":"Klient, który wykupił pobyt z wyżywieniem BB w hotelu w Zieleńcu, ma zapewnione","o":{"A":"noclegi i obiady.","B":"noclegi i śniadania.","C":"śniadania i obiadokolacje.","D":"śniadania, obiady i kolacje."},"a":"B","img":[2677,43],"e":{"A":"Noclegi i obiady – nie odpowiada żadnemu kodowi.","B":"Poprawna. BB (Bed & Breakfast) = nocleg ze śniadaniem.","C":"Śniadania i obiadokolacje = HB.","D":"Śniadania, obiady i kolacje = FB.","tip":"BB = łóżko + śniadanie."}},{"n":30,"q":"Podczas udzielania turystom informacji o Szlaku Kopernikowskim należy uwzględnić atrakcje","o":{"A":"Łodzi.","B":"Torunia.","C":"Krakowa.","D":"Poznania."},"a":"B","img":[2720,43],"e":{"A":"Łódź – nie Kopernik.","B":"Poprawna. Szlak Kopernikowski – Toruń (dom urodzenia Kopernika), Olsztyn, Frombork, Lidzbark Warmiński.","C":"Kraków – Kopernik studiował, ale szlak koncentruje się na Toruniu i Warmii.","D":"Poznań – nie.","tip":"Kopernik urodził się w Toruniu."}},{"n":31,"q":"Obiekt, którego zwiedzanie należy zaplanować podczas wycieczki do Trójmiasta, to","o":{"A":"Wały Chrobrego.","B":"Katedra Oliwska.","C":"Panorama Racławicka.","D":"Biblioteka Raczyńskich."},"a":"B","img":[2763,44],"e":{"A":"Wały Chrobrego – Szczecin.","B":"Poprawna. Katedra Oliwska (słynne organy) znajduje się w Gdańsku – jednym z miast Trójmiasta (Gdańsk, Sopot, Gdynia).","C":"Panorama Racławicka – Wrocław.","D":"Biblioteka Raczyńskich – Poznań.","tip":"Trójmiasto = Gdańsk + Sopot + Gdynia."}},{"n":32,"q":"Które informacje dotyczące realizacji pobytu w hotelu należy wpisać w voucherze?","o":{"A":"Trasę przejazdu.","B":"Wycieczki fakultatywne.","C":"Pierwsze i ostatnie świadczenie.","D":"Miejsce zbiórki przed wyjazdem."},"a":"C","img":[2807,44],"e":{"A":"Trasa przejazdu – nie dotyczy hotelu.","B":"Wycieczki fakultatywne – nie są w voucherze hotelowym.","C":"Poprawna. Voucher hotelowy określa zakres usług: pierwsze i ostatnie świadczenie (np. od kolacji do śniadania), liczbę osób, termin.","D":"Miejsce zbiórki – w programie.","tip":"Voucher: kto, termin, od jakiego do jakiego świadczenia."}},{"n":33,"q":"Pilot wycieczek powinien czuwać nad realizacją usługi żywieniowej FB dla uczestników wycieczki, według której przysługuje im","o":{"A":"śniadanie i obiad.","B":"śniadanie i brunch.","C":"śniadanie, obiad i kolacja.","D":"śniadanie, brunch i obiadokolacja."},"a":"C","img":[2851,72],"e":{"A":"Śniadanie i obiad – niepełne.","B":"Brunch nie jest elementem FB.","C":"Poprawna. FB (full board) = śniadanie, obiad i kolacja.","D":"Obiadokolacja – HB.","tip":"FB = 3 posiłki."}},{"n":34,"q":"Dokumentami finansowymi niezbędnymi do rozliczenia imprezy turystycznej są","o":{"A":"notatki pilota wycieczek.","B":"karty rozliczenia prowizji.","C":"faktury od usługodawców.","D":"faktury zaliczkowe dla klientów."},"a":"C","img":[2923,43],"e":{"A":"Notatki pilota nie są dokumentem finansowym.","B":"Karty rozliczenia prowizji – dla agentów.","C":"Poprawna. Rozliczenie wymaga faktur od usługodawców (dowody kosztów).","D":"Faktury zaliczkowe dokumentują wpływy, nie koszty.","tip":"Koszty = faktury od usługodawców."}},{"n":35,"q":"Dokument potwierdzający sprzedaż klientowi zorganizowanej wycieczki objazdowej, który należy uwzględnić podczas rozliczania wpływów z tytułu organizacji imprezy turystycznej, to faktura","o":{"A":"VAT marża dla klienta.","B":"procedura marży dla biur podróży.","C":"za prowizję dla agenta turystycznego.","D":"za świadczone usługi przez kontrahenta."},"a":"B","img":[2966,73],"e":{"A":"„VAT marża dla klienta” – niepoprawna nazwa.","B":"Poprawna. Sprzedaż imprezy dokumentuje faktura „procedura marży dla biur podróży”.","C":"Faktura za prowizję – dla agenta.","D":"Faktura kontrahenta – dokumentuje koszt.","tip":"Wpływy = faktury procedura marży."}},{"n":36,"q":"Karta rozliczeniowa służy do","o":{"A":"zsumowania przychodów biura podróży.","B":"rozliczenia pośrednika turystycznego z klientem.","C":"zestawienia wpływów i kosztów imprezy turystycznej.","D":"porównania kosztów poszczególnych imprez turystycznych."},"a":"C","img":[3039,43],"e":{"A":"Przychody całego biura – księgowość.","B":"Rozliczenie z klientem – faktura/umowa.","C":"Poprawna. Karta rozliczeniowa zestawia wpływy i koszty jednej imprezy.","D":"Porównanie imprez – analiza, nie karta.","tip":"Karta rozliczeniowa = wpływy vs koszty imprezy."}},{"n":37,"q":"Oblicz kwotę podatku VAT przy założeniu, że touroperator uzyskał wpływy w wysokości 13 400,000 zł z tytułu organizacji wycieczki krajowej, a usługi zakupił za kwotę 11 450,00 zł.","o":{"A":"144,44 zł","B":"158,53 zł","C":"280,55 zł","D":"364,63 zł"},"a":"D","img":[3082,73],"e":{"A":"144,44 zł – błąd.","B":"158,53 zł – błąd.","C":"280,55 zł – błąd.","D":"Poprawna. Marża brutto = 13 400 − 11 450 = 1 950 zł; VAT = 1 950 × 23/123 = 364,63 zł.","tip":"Rozliczenie: VAT = marża × 23/123."}},{"n":38,"q":"Oblicz marżę brutto, jeżeli koszty brutto organizacji krajowej wycieczki wyniosły 8 290,00 zł, a wpływy ze s "},"a":"A","img":[72,73],"e":{"A":"Poprawna. W pociągach PKP Intercity (Pendolino) wydzielona jest Strefa Ciszy – obowiązek cichego zachowania.","B":"Strefa Relaksu – nie istnieje.","C":"Strefa Spokoju – nie istnieje.","D":"Strefa Wypoczynku – nie istnieje.","tip":"PKP IC: Strefa Ciszy."}},{"n":3,"q":"Doświadczonym turystom zainteresowanym wędrowaniem po bezdrożach w wysokich górach, w trudnych warunkach klimatycznych, należy zaoferować imprezę","o":{"A":"kitesurfingu.","B":"geoturystyki.","C":"turystki masowej.","D":"trekkingu klasycznego."},"a":"D","img":[145,72],"e":{"A":"Kitesurfing – sport wodny z latawcem.","B":"Geoturystyka – obiekty geologiczne.","C":"Turystyka masowa – dla wszystkich, bez trudności.","D":"Poprawna. Trekking klasyczny – wędrówki po bezdrożach wysokich gór, w trudnych warunkach.","tip":"Trekking = wędrówka w trudnym terenie."}},{"n":4,"q":"Na obszarze Borów Tucholskich, Ujścia Warty i Gór Stołowych, ze względu na atrakcyjność walorów przyrodniczych, utworzono","o":{"A":"pomniki natury.","B":"parki narodowe.","C":"rezerwaty natury.","D":"parki tematyczne."},"a":"B","img":[217,72],"e":{"A":"Pomnik przyrody – pojedynczy obiekt (drzewo, głaz).","B":"Poprawna. Bory Tucholskie, Ujście Warty i Góry Stołowe to parki narodowe – najwyższa forma ochrony przyrody.","C":"Rezerwat – mniejszy obszar.","D":"Park tematyczny – rozrywka.","tip":"W Polsce są 23 parki narodowe."}},{"n":5,"q":"Na którym zdjęciu przedstawiono szczyt Trzy Korony?","o":{"A":"Zdjęcie A","B":"Zdjęcie B","C":"Zdjęcie C","D":"Zdjęcie D"},"a":"D","pic":1,"img":[289,240],"e":{"A":"Zdjęcie A – inny szczyt.","B":"Zdjęcie B – inny szczyt.","C":"Zdjęcie C – inny szczyt.","D":"Poprawna. Zdjęcie D przedstawia Trzy Korony – wapienny masyw w Pieninach z platformą widokową nad przełomem Dunajca.","tip":"Trzy Korony = Pieniny, widok na Dunajec."}},{"n":6,"q":"W programie podróży po Polsce przygotowanym dla turystów z Japonii, którzy chcą zwiedzić miejsca związane z życiem i twórczością Fryderyka Cho rezerwacją biletów promowych.","D":"Skyscanner – loty.","tip":"Promy: Stena Line, Unity Line, Polferries."}},{"n":22,"q":"Działanie wchodzące w skład sprzedaży osobistej to","o":{"A":"obniżka cen imprez turystycznych.","B":"udział pracowników biura podróży w szkoleniu.","C":"prezentacja oferty przez pracownika w biurze podróży.","D":"umieszczanie informacji o biurze podróży w czasopiśmie branżowym."},"a":"C","img":[3324,43],"e":{"A":"Obniżka cen – cena/promocja sprzedaży.","B":"Szkolenie pracowników – personel.","C":"Poprawna. Sprzedaż osobista – bezpośrednia prezentacja oferty klientowi przez pracownika.","D":"Ogłoszenie w czasopiśmie – reklama.","tip":"Sprzedaż osobista = rozmowa z klientem."}},{"n":23,"q":"Biuro podróży zawiera z przewodnikiem turystycznym umowę","o":{"A":"najmu.","B":"zlecenia.","C":"zgłoszenia.","D":"pośrednictwa."},"a":"B","img":[3367,44],"e":{"A":"Umowa o dzieło – konkretny rezultat.","B":"Poprawna. Z przewodnikiem i pilotem zawiera się umowę zlecenia.","C":"Doradztwo – nie dotyczy.","D":"Franchising – marka.","tip":"Przewodnik/pilot = umowa zlecenia."}},{"n":24,"q":"Które dokumenty dotyczące realizacji imprezy turystycznej należy przygotować pilotowi wycieczek przed wyjazdem?","o":{"A":"Rooming list i umowę zgłoszenia.","B":"Listę uczestników i voucher do hotelu.","C":"Kartę rozliczenia wczasów i bilety komunikacyjne.","D":"Zamówienie obiadokolacji i arkusz kalkulacji wczasów."},"a":"B","img":[3411,72],"e":{"A":"Umowa zgłoszenia – nie istnieje.","B":"Poprawna. Pilot otrzymuje listę uczestników i vouchery na usługi (hotel, posiłki).","C":"Karta rozliczenia – po imprezie.","D":"Arkusz kalkulacji – wewnętrzny dokument biura.","tip":"Teczka pilota: lista uczestników, vouchery, program, zaliczka."}},{"n":25,"q":"Dokumentem potwierdzającym sprzedaż zorganizowanej imprezy turystycznej jest faktura","o":{"A":"zaliczkowa.","B":"do umowy o dzieło.","C":"procedura marży dla biur podroży.","D":"z wyszczególnieniem usług imprezy turystycznej."},"a":"C","img":[3483,43],"e":{"A":"Faktura zaliczkowa dokumentuje tylko wpłatę zaliczki.","B":"Umowa o dzieło nie dotyczy sprzedaży imprez.","C":"Poprawna. Sprzedaż imprezy turystycznej organizator dokumentuje fakturą VAT marża – procedura marży dla biur podróży.","D":"Faktura z wyszczególnieniem usług nie jest stosowana – w procedurze marży nie rozbija się kosztów.","tip":"Impreza turystyczna = faktura VAT marża."}},{"n":26,"q":"W przypadku stwierdzenia na fakturze za usługi błędu rachunkowego","o":{"A":"nabywca sporządza notę księgową.","B":"nabywca sporządza fakturę końcową.","C":"sprzedawca sporządza notę korygującą.","D":"sprzedawca sporządza fakturę korygującą."},"a":"D","img":[3526,44],"e":{"A":"Nota księgowa nie poprawia faktury.","B":"Faktura końcowa rozlicza zaliczki.","C":"Nota korygująca wystawia NABYWCA i tylko do drobnych pomyłek (np. w danych), nie kwot.","D":"Poprawna. Błąd rachunkowy (w kwotach) poprawia sprzedawca, wystawiając fakturę korygującą.","tip":"Kwoty – faktura korygująca (sprzedawca); dane – nota korygująca (nabywca)."}},{"n":27,"q":"Na podstawie danych zamieszczonych w tabeli ustal poprawnie sporządzony fragment rezerwacji.","o":{"A":"Zamawiam obiady w dniu 2.03.2019 r. o godz. 14.00 dla 8 osób przy wspólnym stole.","B":"Rezerwuję dla 8-osobowej grupy obiady 2.03.2019 r. Proszę o menu.","C":"Proszę o przygotowanie obiadów na godz. 14.00 dla 8 osób przy wspólnym stole.","D":"Proszę o zapewnienie obiadów według Państwa menu w dniu 2.03.2019 r. o godz. 14.00"},"a":"A","pic":1,"img":[3570,205],"e":{"A":"Poprawna. Zawiera wszystkie potrzebne dane: datę, godzinę, liczbę osób i sposób podania (wspólny stół).","B":"Brak godziny.","C":"Brak daty.","D":"Brak liczby osób.","tip":"Zamówienie posiłku: data, godzina, liczba osób."}},{"n":28,"q":"W którym dokumencie można sprawdzić czas trwania doby hotelowej w obiekcie?","o":{"A":"W ustawie o usługach turystycznych.","B":"W regulaminie gospodarstwa agroturystycznego.","C":"W rozporządzeniu w sprawie obiektów hotelarskich.","D":"W regulaminie kategoryzacji wiejskiej bazy noclegowej."},"a":"B","img":[3775,43],"e":{"A":"Ustawa o usługach turystycznych – nie określa doby w danym obiekcie.","B":"Poprawna. Czas doby hotelowej ustala regulamin danego obiektu (tu gospodarstwa agroturystycznego).","C":"Rozporządzenie – wymagania kategoryzacyjne, nie doba konkretnego obiektu.","D":"Regulamin kategoryzacji – standardy, nie doba.","tip":"Doba hotelowa – regulamin obiektu."}},{"n":29,"q":"Zgodnie z ustawą z dnia 29.08.1997 r. o usługach hotelarskich oraz usługach pilotów wycieczek i przewodników turystycznych przewodnik turystyczny oprowadza odwiedzających oraz","o":{"A":"reprezentuje agenta turystycznego.","B":"udziela im minimum informacji krajoznawczych.","C":"realizuje usługi tylko podczas wycieczek fakultatywnych.","D":"sprawuje nad nimi opiekę w zakresie wynikającym z umowy."},"a":"D","img":[3818,72],"e":{"A":"Przewodnik nie reprezentuje agenta.","B":"Przewodnik udziela pełnych, a nie minimalnych informacji.","C":"Nie tylko podczas fakultatywnych.","D":"Poprawna. Ustawa: przewodnik oprowadza turystów i sprawuje nad nimi opiekę w zakresie wynikającym z umowy.","tip":"Przewodnik: oprowadza + opieka."}},{"n":30,"q":"Korzystając z mapy, wskaż miasta, przez które prowadzi najkrótsza trasa przejazdu z Kłobucka do Kalisza.","o":{"A":"Turawa i Kępno.","B":"Sieradz i Wieruszów.","C":"Zduńska Wola i Sieradz.","D":"Zduńska Wola i Pabianice."},"a":"C","pic":1,"img":[3890,429],"e":{"A":"Turawa i Kępno – dłuższa trasa.","B":"Sieradz i Wieruszów – nie po drodze.","C":"Poprawna. Według mapy najkrótsza trasa Kłobuck – Kalisz prowadzi przez Zduńską Wolę i Sieradz.","D":"Pabianice – zbyt na wschód.","tip":"Odczytuj trasę z mapy."}},{"n":31,"q":"Na podstawie zamieszczonego fragmentu rozkładu jazdy określ czas kursu autobusu na trasie Łagów Lubuski, Plaża – wieś Mostki.","o":{"A":"2 minuty","B":"6 minut","C":"11 minut","D":"15 minut"},"a":"C","ctx":"Rozkład jazdy (fragment) Lp. Nazwa przystanku Godz Kierowca może jechać bez przerwy maks. 4,5 godziny, potem 45 min przerwy.","D":"5,5 godziny – za długo.","tip":"4,5 h jazdy → 45 min przerwy."}},{"n":36,"q":"Który posiłek jako pierwszy przysługuje gościom korzystającym z opcji świadczeń HB, jeżeli kończą oni pobyt w pensjonacie po śniadaniu?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"D","img":[2520,72],"e":{"A":"Obiad – nie w HB.","B":"Kolacja – w HB jest obiadokolacja.","C":"Śniadanie – po pierwszym noclegu.","D":"Poprawna. HB: pobyt zaczyna się obiadokolacją, a kończy śniadaniem.","tip":"HB: obiadokolacja → śniadanie."}},{"n":37,"q":"Do rozliczenia finansowego imprezy turystycznej niezbędna jest","o":{"A":"karta bankowa.","B":"umowa hotelowa.","C":"faktura usługodawcy.","D":"umowa z kontrahentem."},"a":"C","img":[2592,43],"e":{"A":"Raport kasowy – zestawienie operacji kasowych biura, nie rozliczenie imprezy.","B":"Umowa hotelowa określa warunki, nie dokumentuje poniesionych kosztów.","C":"Umowa z kontrahentem – jw.","D":"Poprawna. Rozliczenie imprezy wymaga dowodów rzeczywiście poniesionych kosztów – faktur od usługodawców (hotel, przewoźnik, restauracja).","tip":"Rozliczenie = faktury kosztowe."}},{"n":38,"q":"Oblicz kwotę marży brutto, jeżeli koszty wycieczki krajowej wyniosły 6 538,50 zł, a wpływy 7 000,00 zł.","o":{"A":"161,00 zł","B":"461,50 zł","C":"492,00 zł","D":"653,80 zł"},"a":"B","img":[2635,44],"e":{"A":"161 zł – błąd.","B":"Poprawna. Marża brutto = 7 000 − 6 538,50 = 461,50 zł.","C":"492 zł – błąd.","D":"653,80 zł – błąd.","tip":"Marża = wpływy − koszty."}},{"n":39,"q":"Oblicz kwotę podatku VAT, przy założeniu, że touroperator zakupił, w ramach organizacji wycieczki krajowej, usługi turystyczne za kwotę 56 000,00 zł, a wpływy ze sprzedaży imprezy wyniosły 61 000,00 zł.","o":{"A":"370,37 zł","B":"406,50 zł","C":"462,96 zł","D":"934,96 zł"},"a":"D","img":[2679,72],"e":{"A":"370,37 zł – 8/108.","B":"406,50 zł – błąd.","C":"462,96 zł – błąd.","D":"Poprawna. Marża brutto a.","tip":"Etnografia = kultura ludowa = skansen."}},{"n":9,"q":"Który rodzaj stroju ludowego przedstawiono w zamieszczonym opisie? „Barwny, bogato zdobiony ubiór jako jedyny spośród polskich strojów ludowych uznawany jest za narodowy. Nosił go nawet sam Tadeusz Kościuszko, naczelnik powstania z 1794 r.”","o":{"A":"Krakowski.","B":"Kociewski.","C":"Kaszubski.","D":"Łowicki."},"a":"A","img":[937,163],"e":{"A":"Poprawna. Strój krakowski – barwny, bogato zdobiony, uznawany za narodowy; nosił go Kościuszko (sukmana).","B":"Kociewski – Pomorze.","C":"Kaszubski – Pomorze.","D":"Łowicki – pasiaki.","tip":"Strój narodowy = krakowski."}},{"n":10,"q":"Imprezą raftingową jest","o":{"A":"lot balonem nad morzem.","B":"rejs żaglówką po jeziorach.","C":"spływ kajakami po górskich rzekach.","D":"jazda na desce na przybrzeżnych wodach."},"a":"C","img":[1100,57],"e":{"A":"Lot balonem to baloniarstwo (turystyka lotnicza), nie rafting.","B":"Rejs żaglówką po jeziorze to żeglarstwo.","C":"Poprawna. Rafting to spływ pontonem lub kajakiem po rwącej, górskiej rzece (np. Dunajec, Białka).","D":"Ślizg na nartach wodnych za motorówką to narciarstwo wodne.","tip":"Rafting – raft (ang. tratwa, ponton) + rwąca rzeka."}},{"n":11,"q":"Przedstawiony harmonogram (1. dzień – 18 października 2016 r., godziny od 7:30 do 22:00: przejazd Kraków – Wałbrzych, obiad, zwiedzanie, czas wolny, kolacja przy ognisku, wieczorek folklorystyczny, nocleg) nazywa się programem","o":{"A":"krajoznawczym.","B":"szczegółowym.","C":"pobytowym.","D":"ramowym."},"a":"B","pic":1,"img":[1157,306],"e":{"A":"Krajoznawczy – rodzaj imprezy, nie programu.","B":"Poprawna. Program szczegółowy podaje dokładne godziny i miejsca wszystkich punktów dnia.","C":"Pobytowy – rodzaj imprezy.","D":"Ramowy – tylko ogólne punkty bez godzin.","tip":"Godziny = program szczegółowy."}},{"n":12,"q":"Opracowując program wycieczki dla gościa uprawiającego trekking, należy uwzględnić","o":{"A":"pływanie po jeziorach.","B":"wędrówkę po górach.","C":"bie NW.","B":"Nie na życzenie – obowiązkowo.","C":"Nie na sezon – na czas imprezy.","D":"Nie na prośbę gospodarza.","tip":"NNW – obowiązkowe."}},{"n":16,"q":"Przedstawiony formularz (grafik z kalendarzem grudzień 2013 – styczeń 2014, „Rezerwacja dla: Andrzej Kowalski, od 2013-12-29 do 2014-01-13”) stosuje się w celu","o":{"A":"regulowania spraw obsługi mini barku w obiekcie.","B":"rezerwacji pokoi w gospodarstwie agroturystycznym.","C":"zameldowania gościa w gospodarstwie agroturystycznym.","D":"przekazywania regulaminowych informacji w obiekcie agroturystycznym."},"a":"B","pic":1,"img":[1835,547],"e":{"A":"Minibar – nie.","B":"Poprawna. Formularz z kalendarzem, okresem i nazwiskiem gościa to grafik/formularz rezerwacji pokoi.","C":"Meldunek – inny druk.","D":"Regulamin – nie.","tip":"Kalendarz + nazwisko + okres = rezerwacja."}},{"n":17,"q":"Który element marketingu mix zastosowało gospodarstwo agroturystyczne, umieszczając w popularnej gazecie spot reklamowy o swoim obiekcie?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[2382,85],"e":{"A":"Cena – rabaty.","B":"Produkt – sama usługa.","C":"Poprawna. Reklama w gazecie to promocja.","D":"Dystrybucja – sprzedaż.","tip":"Reklama = promocja."}},{"n":18,"q":"Właściciel gospodarstwa agroturystycznego wprowadzając opust 15% na usługi noclegowe dla stałych gości, zastosował rabat","o":{"A":"ilościowy.","B":"usługowy.","C":"jakościowy.","D":"lojalnościowy."},"a":"D","img":[2467,86],"e":{"A":"Obniżka cen dla wszystkich to nie rabat lojalnościowy.","B":"Zmiana aranżacji – produkt.","C":"Poprawna. Rabat lojalnościowy to opust dla stałych gości.","D":"Podarunki – promocja sprzedaży.","tip":"Lojalnościowy = stali klienci."}},{"n":19,"q":"Korzystając z opisu wycieczki jednodniowej „Poznaj Wieś Łowicką” (skansen, muzeum, gospodarstwo ze zwierzętami, ognisko; w cenie m.in. gratisowy udział 3 opiekunów/nauczycieli), wskaż odbiorcę imprezy turystycznej.","o":{"A":"Uczestnicy imprez biznesowych.","B":"Grupy konferencyjne.","C":"Uczniowie szkół.","D":"Seniorzy."},"a":"C","pic":1,"img":[2553,472],"e":{"A":"Imprezy biznesowe – nie.","B":"Konferencje – nie.","C":"Poprawna. Skansen, zwierzęta, ognisko, gratis dla opiekunów/nauczycieli – oferta dla uczniów szkół.","D":"Seniorzy – nie (opiekunowie, nauczyciele).","tip":"Opiekunowie/nauczyciele = szkoły."}},{"n":20,"q":"Wprowadzanie na rynek nowej usługi turystycznej charakteryzuje się","o":{"A":"niskimi kosztami i dużą sprzedażą.","B":"niskimi kosztami i małą sprzedażą.","C":"wysokimi kosztami i małą sprzedażą.","D":"wysokimi kosztami i dużą sprzedażą."},"a":"C","img":[3025,57],"e":{"A":"Niskie koszty – nie na początku.","B":"Niskie koszty – nie.","C":"Poprawna. Faza wprowadzenia produktu: wysokie koszty (promocja, przygotowanie) i mała sprzedaż.","D":"Duża sprzedaż – faza wzrostu/dojrzałości.","tip":"Cykl życia: wprowadzenie → wzrost → dojrzałość → schyłek."}},{"n":21,"q":"Ile minut powinna trwać obowiązkowa przerwa w pracy kierowcy bez zmiennika po 4,5 godzinnym przejeździe?","o":{"A":"25 minut.","B":"30 minut.","C":"40 minut.","D":"45 minut."},"a":"D","img":[3082,85],"e":{"A":"25 min – za mało.","B":"30 min – za mało.","C":"40 min – za mało.","D":"Poprawna. Po 4,5 godz. jazdy kierowca musi mieć 45 min przerwy.","tip":"4,5 h → 45 min."}},{"n":22,"q":"Który element bagażu podręcznego zgodnie z wymogami stosowanymi przez linie lotnicze powinien usunąć podróżny wsiadając na pokład samolotu?","o":{"A":"Telefon komórkowy.","B":"Szczotkę do włosów.","C":"Szampon o pojemności 50 ml.","D":"Wodę mineralną o pojemności powyżej 100 ml."},"a":"D","img":[3167,86],"e":{"A":"Telefon – dozwolony.","B":"Szczotka – dozwolona.","C":"Szampon 50 ml – dozwolony (do 100 ml).","D":"Poprawna. Płyny powyżej 100 ml są zabronione w bagażu podręcznym.","tip":"Płyny w podręcznym: max 100 ml."}},{"n":23,"q":"Promując ofertę „Pobyt na wsi” (wycieczki szkolne z dziećmi, poznawanie hodowli zwierząt w gospodarstwie, program 3–4 godziny) właściciel gosp  230 zł – stawka 23%.","tip":"Noclegi 8%."}},{"n":38,"q":"Oblicz koszt wynajmu autokaru dla turystów na trasie 650 km, przy założeniu, że cena wynosi 4,00 zł/km.","o":{"A":"2 040,00 zł","B":"2060,00 zł","C":"2400,00 zł","D":"2 600,00 zł"},"a":"D","img":[5900,57],"e":{"A":"2 040 zł – błąd.","B":"2 060 zł – błąd.","C":"2 400 zł – błąd.","D":"Poprawna. 650 km × 4,00 zł = 2 600,00 zł.","tip":"km × stawka."}},{"n":39,"q":"Oblicz kwotę należności za noclegi 9 osób w pokojach 3-osobowych w terminie od 11 do 13 lipca, przy założeniu, że cena pokoju wynosi 100 zł za dobę.","o":{"A":"200,00 zł","B":"300,00 zł","C":"600,00 zł","D":"900,00 zł"},"a":"C","img":[5957,85],"e":{"A":"200 zł – 1 pokój.","B":"300 zł – błąd.","C":"Poprawna. 9 osób = 3 pokoje 3-os.; 11–13 lipca = 2 noce; 3 × 100 × 2 = 600 zł.","D":"900 zł – 3 noce.","tip":"Pokoje × cena × noce."}},{"n":40,"q":"Oblicz kwotę marży, jeżeli całkowite koszty świadczeń imprezy turystycznej wynoszą 2 000,00 zł, a marża biura podróży to 12% całkowitych kosztów świadczeń imprezy.","o":{"A":"24,00 zł","B":"48,00 zł","C":"240,00 zł","D":"480,00 zł"},"a":"C","img":[6042,85],"e":{"A":"24 zł = 1,2% – błąd.","B":"48 zł – błąd.","C":"Poprawna. 12% z 2 000,00 zł = 2 000 × 0,12 = 240,00 zł.","D":"480 zł = 24% – błąd.","tip":"Marża = koszty × % marży."}}],"2016-pazdziernik":[{"n":1,"q":"Wycieczka dla osób uprawiających kajakarstwo organizowana jest w ramach turystyki","o":{"A":"etnicznej.","B":"kulturowej.","C":"motywacyjnej.","D":"kwalifikowanej."},"a":"D","img":[0,58],"e":{"A":"Etniczna – kultura grup etnicznych.","B":"Kulturowa – zabytki.","C":"Motywacyjna – nagroda.","D":"Poprawna. Kajakarstwo wymaga umiejętności i sprzętu – turystyka kwalifikowana.","tip":"Kajaki = kwalifikowana."}},{"n":2,"q":"Wskaż stwierdzenie, które nie dotyczy turystyki alternatywnej.","o":{"A":"Uczestnicy działają zgodnie z prawami przyrody.","B":"Charakteryzuje się nieznacznym nasileniem i ma charakter kameralny.","C":"Związana jest z przeżyciami grupowymi w ma skinia Raj leży na prawym brzegu rzeki Bobrzyczki (koło Chęcin).","C":"Błędne położenie.","D":"Błędne położenie.","tip":"Prawy brzeg = patrząc z biegiem rzeki."}},{"n":6,"q":"Najwięcej informacji dotyczących atrakcji turystycznych miasta, regionu i kraju znajduje się","o":{"A":"w ulotce turystycznej.","B":"w folderze turystycznym.","C":"w informatorze turystycznym.","D":"w przewodniku turystycznym."},"a":"D","img":[664,58],"e":{"A":"Ulotka – krótka informacja.","B":"Folder – kilka stron o ofercie.","C":"Informator – praktyczne dane.","D":"Poprawna. Przewodnik turystyczny (książka) zawiera najwięcej informacji o atrakcjach.","tip":"Przewodnik = najpełniejsza informacja."}},{"n":7,"q":"Na terenie którego województwa położony jest Łańcut z przedstawionym na zdjęciu Pałacem Lubomirskich?","o":{"A":"Śląskiego.","B":"Łódzkiego.","C":"Małopolskiego.","D":"Podkarpackiego."},"a":"D","pic":1,"img":[722,355],"e":{"A":"Śląskie – nie.","B":"Łódzkie – nie.","C":"Małopolskie – nie.","D":"Poprawna. Łańcut z Zamkiem/Pałacem Lubomirskich i Potockich – województwo podkarpackie.","tip":"Łańcut = Podkarpacie."}},{"n":8,"q":"Planując rajd rowerowy wokół Kotliny Jeleniogórskiej, należy uwzględnić trasy przebiegające przez góry:","o":{"A":"Kamienne, Izerskie, Krucze.","B":"Stołowe, Karkonosze, Beskid Niski.","C":"Izerskie, Rudawy Janowickie, Karkonosze.","D":"Złote, Rudawy Janowickie, Masyw Śnieżnika."},"a":"C","img":[1077,58],"e":{"A":"Góry Kamienne i Krucze – nie otaczają Kotliny Jeleniogórskiej.","B":"Beskid Niski – Karpaty.","C":"Poprawna. Kotlinę Jeleniogórską otaczają Góry Izerskie, Rudawy Janowickie i Karkonosze.","D":"Złote, Śnieżnik – Kotlina Kłodzka.","tip":"Kotlina Jeleniogórska: Karkonosze, Izerskie, Rudawy."}},{"n":9,"q":"Największa hiszpańska wyspa, która należy do archipelagu Balearów. Nazywana niegdyś „Wyspą Spokoju”, dziś jest jednym z głównych regionów turystycznych Europy. Łagodny, śródziemnomorski klimat, barwne krajobrazy skąpane w bujnej roślinności gajów cytrusowych, lazurowe morze, urokliwe zatoki kryjące złote plaże i podwodne jaskinie. Zamieszczony opis dotyczy","o":{"A":"Krety.","B":"Sycylii.","C":"Majorki.","D":"Kostaryki."},"a":"C","img":[1135,171],"e":{"A":"Kreta – Grecja.","B":"Sycylia – Włochy.","C":"Poprawna. Majorka – największa wyspa Balearów (Hiszpania).","D":"Kostaryka – Ameryka Środkowa.","tip":"Baleary: Majorka, Minorka, Ibiza."}},{"n":10,"q":"Najwyższym szczytem Beskidu Żywieckiego jest","o":{"A":"Śnieżka.","B":"Turbacz.","C":"Babia Góra.","D":"Wielka Sowa."},"a":"C","img":[1306,58],"e":{"A":"Śnieżka – najwyższy szczyt Karkonoszy i Sudetów.","B":"Turbacz – najwyższy szczyt Gorców.","C":"Trzy Korony – Pieniny.","D":"Wielka Sowa – Góry Sowie.","tip":"Babia Góra = Beskid Żywiecki."}},{"n":11,"q":"Która z proponowanych ofert gospodarstwa agroturystycznego w pełni zaspokoi oczekiwania turysty w zakresie uprawiania hippiki?","o":{"A":"Komfortowe pokoje, quady i samochody terenowe, park linowy","B":"Pokoje w stylu „Bonanza”, nauka jazdy konnej, własny hipodrom","C":"Pokoje standard, przejażdżki łodzią po jeziorze, wiejska kuźnia","D":"Luksusowe apartamenty, wędkowanie w stawie, spływy kajakowe"},"a":"B","pic":1,"img":[1364,246],"e":{"A":"Quady i park linowy – bez koni.","B":"Poprawna. Oferta B: nauka jazdy konnej i własny hipodrom – hippika (jeździectwo).","C":"Łodzie i kuźnia – bez nauki jazdy.","D":"Wędkowanie, kajaki – bez koni.","tip":"Hippika = jazda konna."}},{"n":12,"q":"Zapis BB zamieszczony w ofertach turystycznych oznacza, że cena oprócz noclegu obejmuje","o":{"A":"śniadanie i obiadokolację.","B":"śniadanie i obiad.","C":"pełne wyżywienie.","D":"śniadanie."},"a":"D","img":[1610,59],"e":{"A":"Śniadanie + obiadokolacja = HB.","B":"Śniadanie i obiad – nie.","C":"Pełne = FB.","D":"Poprawna. BB = Bed & Breakfast: nocleg + śniadanie.","tip":"BB = śniadanie."}},{"n":13,"q":"Którą kwotę, zgodnie z cennikiem, należy uwzględnić w kalkulacji kosztów imprezy za usługi przewodnika turystycznego, jeżeli zaplanowano 4-godzinne zwiedzanie miasta przez grupę obcokrajowców?","o":{"A":"210,00 zł","B":"240,00 zł","C":"250,00 zł","D":"310,00 zł"},"a":"D","pic":1,"img":[1669,280],"e":{"A":"210 zł – do 3 godz. po polsku.","B":"240 zł – do 3 godz. w języku obcym.","C":"250 zł – do 5 godz. po polsku.","D":"Poprawna. 4 godziny w języku obcym → ryczałt do 5 godzin w języku obcym: 310,00 zł.","tip":"Obcokrajowcy = cena w języku obcym."}},{"n":14,"q":"Który z podanych elementów kalkulacji imprezy turystycznej jest kosztem zmiennym?","o":{"A":"Usługa pilotażu.","B":"Ubezpieczenie uczestników.","C":"Usługa przewodnika turystycznego.","D":"Rezerwacja związana z organizacją imprezy."},"a":"B","img":[1949,58],"e":{"A":"Pilotaż – stały.","B":"Poprawna. Ubezpieczenie liczone od osoby – koszt zmienny.","C":"Przewodnik – stały.","D":"Rezerwacja – stały.","tip":"Od osoby = zmienny."}},{"n":15,"q":"Hotel, który zarezerwował dla biura podróży określoną liczbę miejsc noclegowych w określonym czasie, respektując prawo biura podróży do wcześniejszej anulacji bez ponoszenia kosztów przez biuro podróży, dokonał tego na podstawie","o":{"A":"czarteru.","B":"allotmentu.","C":"timesharingu.","D":"overbookingu."},"a":"B","img":[2007,115],"e":{"A":"Czarter – wynajem środka transportu, bez możliwości zwrotu.","B":"Poprawna. Allotment – pula miejsc w hotelu, którą biuro może zwrócić bez kosztów do określonego terminu (release).","C":"Franchising – działanie pod cudzą marką.","D":"Timesharing – wykupienie prawa do pobytu w określonym czasie co roku.","tip":"Allotment = pula z możliwością zwrotu."}},{"n":16,"q":"Na podstawie zamieszczonego grafiku rezerwacji on-line określ, na którą godzinę należy zarezerwować wejście do Muzeum Podziemia Rynku dla grupy trzech rodzin czteroosobowych pragnących zwiedzić obiekt jak najwcześniej.","o":{"A":"Na godzinę 10:15","B":"Na godzinę 11:15","C":"Na godzinę 11:45","D":"Na godzinę 13:45"},"a":"B","pic":1,"img":[2122,531],"e":{"A":"10:15 – tylko 8 miejsc.","B":"Poprawna. Grupa = 3 × 4 = 12 osób. Najwcześniej 12 wolnych miejsc jest o 11:15 (13 miejsc).","C":"11:45 – 12 miejsc, ale później.","D":"13:45 – później.","tip":"Szukaj pierwszego terminu z wystarczającą liczbą miejsc."}},{"n":17,"q":"Właściciel gospodarstwa agroturystycznego wprowadził opust 15% na usługi noclegowe dla swoich stałych klientów, stosując rabat","o":{"A":"ilościowy.","B":"usługowy.","C":"jakościowy.","D":"lojalnościowy."},"a":"D","img":[2653,86],"e":{"A":"Ilościowy – za dużą liczbę.","B":"Usługowy – nie.","C":"Jakościowy – nie.","D":"Poprawna. Rabat lojalnościowy – dla stałych klientów.","tip":"Lojalnościowy = stali klienci."}},{"n":18,"q":"Który z wymienionych instrumentów marketingu zastosował właściciel gospodarstwa agroturystycznego, umieszczając przy drodze billboard informujący o ofercie pobytu?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[2739,87],"e":{"A":"Cena – rabaty, cenniki.","B":"Produkt – sama usługa i jej jakość.","C":"Poprawna. Billboard to reklama, czyli narzędzie promocji.","D":"Dystrybucja – kanały sprzedaży.","tip":"Reklama = promocja."}},{"n":19,"q":"Który instrument promocji stosuje biuro podróży, umieszczając w witrynie plakat o imprezie dla wędkarzy?","o":{"A":"Reklamę.","B":"Public relations.","C":"Sprzedaż osobistą.","D":"Promocję sprzedaży."},"a":"A","img":[2826,58],"e":{"A":"Poprawna. Plakat w witrynie to reklama.","B":"PR – wizerunek, kontakty z mediami.","C":"Sprzedaż osobista – rozmowa z klientem.","D":"Promocja sprzedaży – rabaty, konkursy.","tip":"Plakat = reklama."}},{"n":20,"q":"Które z działań biura podróży zaliczane jest do strategii ceny?","o":{"A":"Wyremontowanie siedziby biura.","B":"Nawiązanie współpracy z hotelem.","C":"Udzielanie rabatów stałym klientom.","D":"Umieszczenie billboardów na lotniskach."},"a":"C","img":[2884,58],"e":{"A":"Remont – wizerunek/produkt.","B":"Współpraca z hotelem – dystrybucja/produkt.","C":"Poprawna. Rabaty dla stałych klientów – strategia ceny.","D":"Billboardy – promocja.","tip":"Rabaty = cena."}},{"n":21,"q":"Który dokument jest sporządzany w procesie przygotowania imprezy turystycznej?","o":{"A":"Karta rozliczeniowa.","B":"Zamówienie usługi noclegowej.","C":"Sprawozdanie pilota wycieczek.","D":"Zestawienie wpływów i kosztów."},"a":"B","img":[2942,59],"e":{"A":"Karta rozliczeniowa – po imprezie.","B":"Poprawna. Zamówienie usług noclegowych sporządza się w fazie przygotowania imprezy.","C":"Sprawozdanie pilota – po imprezie.","D":"Zestawienie wpływów i kosztów – po imprezie.","tip":"Przygotowanie: oferty, zamówienia, kalkulacja."}},{"n":22,"q":"Która, dodatkowo płatna, impreza turystyczna swoim programem uzupełni i urozmaici podstawowy program wypoczynku?","o":{"A":"Własna.","B":"Incoming.","C":"Study tour.","D":"Fakultatywna."},"a":"D","img":[3001,86],"e":{"A":"Własna – nie.","B":"Incoming – przyjazdowa.","C":"Study tour – zapoznawcza.","D":"Poprawna. Impreza fakultatywna – dodatkowo płatna, uzupełnia program podstawowy.","tip":"Fakultatywna = uzupełnienie."}},{"n":23,"q":"Konwencja AETR określa szczegółowo","o":{"A":"obowiązki pilota imprezy turystycznej.","B":"czynności pilota podczas imprezy turystycznej.","C":"zasady pracy kierowcy w czasie imprezy turystycznej.","D":"zasady współpracy kierowcy z pilotem imprezy turystycznej."},"a":"C","img":[3087,58],"e":{"A":"Obowiązki pilota – ustawa.","B":"Czynności pilota – nie.","C":"Poprawna. Konwencja AETR reguluje czas pracy kierowców w transporcie międzynarodowym (czas jazdy, przerwy, odpoczynek).","D":"Współpraca z pilotem – nie.","tip":"AETR = czas pracy kierowców."}},{"n":24,"q":"Integralną częścią umowy o wycieczkę zawieraną przez organizatora z klientem jest","o":{"A":"program imprezy.","B":"broszura reklamowa biura.","C":"polisa ubezpieczenia od ryzyka.","D":"informator o walorach miejsca docelowego."},"a":"A","img":[3145,58],"e":{"A":"Poprawna. Program imprezy jest integralną częścią umowy.","B":"Broszura – reklama.","C":"Polisa – osobny dokument.","D":"Informator – nie.","tip":"Program = część umowy."}},{"n":25,"q":"Profesjonalną obsługę w czasie wycieczki „Szlakiem Jaskiń” zapewni turystom podjęcie współpracy","o":{"A":"z geologiem.","B":"z grotołazem.","C":"z taternikiem.","D":"z hydrologiem."},"a":"B","img":[3203,58],"e":{"A":"Geolog – nauka o skałach.","B":"Poprawna. Grotołaz (speleolog) zna jaskinie i zasady bezpiecznego poruszania się w nich.","C":"Taternik – wspinaczka w Tatrach.","D":"Hydrolog – wody.","tip":"Jaskinie = grotołaz."}},{"n":26,"q":"Wskaż obiekt hotelarski, w którym należy zakwaterować 37-osobową grupę (18 kobiet, 19 mężczyzn) oraz pilota wycieczek.","o":{"A":"Hotel Nova: 10 pokoi 1-os., 13 pokoi 2-os., 0 pokoi 3-os.","B":"Hotel Maria: 8 pokoi 1-os., 14 pokoi 2-os., 0 pokoi 3-os.","C":"Pensjonat Wezyr: 3 pokoje 1-os., 18 pokoi 2-os., 1 pokój 3-os.","D":"Pensjonat Biały: 3 pokoje 1-os., 8 pokoi 2-os., 5 pokoi 3-os."},"a":"C","pic":1,"img":[3261,286],"e":{"A":"Hotel Nova: 10 + 26 = 36 miejsc – za mało dla 38 osób.","B":"Hotel Maria: 8 + 28 = 36 miejsc – za mało.","C":"Poprawna. Pensjonat Wezyr: 3 + 36 + 3 = 42 miejsca – zmieści 18 kobiet, 19 mężczyzn i pilota (np. pilot w pokoju 1-os.).","D":"Pensjonat Biały: 3 + 16 + 15 = 34 – za mało.","tip":"Policz miejsca i podział na płeć."}},{"n":27,"q":"Którą mapę należy zaproponować wędrującym niebieskim szlakiem po Beskidach?","o":{"A":"Rowerową.","B":"Turystyczną.","C":"Hydrograficzną.","D":"Administracyjną."},"a":"B","img":[3547,58],"e":{"A":"Rowerowa – szlaki rowerowe.","B":"Poprawna. Mapa turystyczna pokazuje szlaki piesze z kolorami.","C":"Hydrograficzna – wody.","D":"Administracyjna – granice jednostek.","tip":"Szlaki piesze = mapa turystyczna."}},{"n":28,"q":"Turyście planującemu podróż z Łodzi do Gdańska należy polecić skorzystanie z autostrady oznaczonej symbolem","o":{"A":"A1","B":"A2","C":"A3","D":"A4"},"a":"A","img":[3605,86],"e":{"A":"Poprawna. A1 łączy Gdańsk z Łodzią (i dalej z Śląskiem).","B":"A2 – Świecko – Poznań – Warszawa.","C":"A3 – nie istnieje (S3).","D":"A4 – Zgorzelec – Wrocław – Kraków.","tip":"A1 = północ–południe przez Łódź."}},{"n":29,"q":"Który posiłek jako pierwszy przysługuje gościom korzystającym z opcji świadczeń HB, jeżeli kończą oni pobyt w pensjonacie po śniadaniu?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"D","img":[3691,87],"e":{"A":"Obiad – nie w HB.","B":"Kolacja – w HB jest obiadokolacja.","C":"Śniadanie – po pierwszym noclegu.","D":"Poprawna. HB: pobyt zaczyna się obiadokolacją, a kończy śniadaniem.","tip":"HB: obiadokolacja → śniadanie."}},{"n":30,"q":"Jaki będzie koszt wynajmu autokaru na 3-dniową wycieczkę krajoznawczą, jeżeli przewoźnik określił minimalny dzienny przebieg przejazdu na 400 km przy stawce 5,00 zł/km, a autokar w ciągu trzech dni przejechał 950 km?","o":{"A":"2 050,00 zł","B":"2 750,00 zł","C":"4 750,00 zł","D":"6 000,00 zł"},"a":"D","img":[3778,115],"e":{"A":"2 050 zł – błąd.","B":"2 750 zł – błąd.","C":"4 750 zł – 950 km × 5 zł, ale minimum jest wyższe.","D":"Poprawna. Minimalny przebieg 3 × 400 = 1 200 km > 950 km, więc płacimy za 1 200 km × 5 zł = 6 000 zł.","tip":"Gdy przejechano mniej – płacimy minimum."}},{"n":31,"q":"Promowanie turystyki wiejskiej i agroturystyki Pogórza Dynowskiego przez Lokalną Organizację Turystyczną „Pogórze” będzie najbardziej skuteczne podczas","o":{"A":"Międzynarodowych Targów Turystycznych Wrocław.","B":"Międzynarodowych Targów Turystycznych TT WARSAW.","C":"Międzynarodowych Targów — Regiony Turystyczne NA STYKU KULTUR - Łódź.","D":"Międzynarodowych Targów Turystyki Wiejskiej i Agroturystyki AGROTRAVEL - Kielce."},"a":"D","img":[3893,87],"e":{"A":"Targi we Wrocławiu – ogólne.","B":"TT Warsaw – ogólne.","C":"Łódź – ogólne.","D":"Poprawna. AGROTRAVEL w Kielcach – targi turystyki wiejskiej i agroturystyki.","tip":"Agroturystyka = AGROTRAVEL."}},{"n":32,"q":"Którą kwotę zapłaci grupa za organizację wycieczki, jeżeli koszty świadczeń wynoszą 13 800,00 zł, a planowana marża to 10%?","o":{"A":"15 180,00 zł","B":"15  Wino i sery, Côte d'Azur, pociąg TGV – Francja.","B":"Niemcy – ICE, nie TGV.","C":"Włochy – Riwiera, nie Côte d'Azur.","D":"Hiszpania – AVE.","tip":"TGV i Lazurowe Wybrzeże = Francja."}},{"n":13,"q":"Wybrzeże klifowe, Jezioro Turkusowe, ostoja orła bielika, to atrakcje turystyczne","o":{"A":"Wolińskiego Parku Narodowego.","B":"Słowińskiego Parku Narodowego.","C":"Biebrzańskiego Parku Narodowego.","D":"Roztoczańskiego Parku Narodowego."},"a":"A","img":[1627,59],"e":{"A":"Poprawna. Woliński PN: klif, Jezioro Turkusowe, ostoja bielika i żubrów.","B":"Słowiński – wydmy.","C":"Biebrzański – bagna.","D":"Roztoczański – konik polski.","tip":"Wolin = klif + Turkusowe."}},{"n":14,"q":"Pakiet usług o nazwie 3 x S (sun, sand, sea) dotyczy turystyki","o":{"A":"motywacyjnej.","B":"alternatywnej.","C":"specjalistycznej.","D":"wypoczynkowej."},"a":"D","img":[1686,58],"e":{"A":"Motywacyjna – nagroda.","B":"Alternatywna – niszowa.","C":"Specjalistyczna – kwalifikowana.","D":"Poprawna. 3×S (sun, sand, sea) – turystyka wypoczynkowa.","tip":"3S = plaża."}},{"n":15,"q":"Biuro turystyczne organizujące imprezę turystyczną z noclegiem w gospodarstwie agroturystycznym, ubezpiecza uczestników od NNW","o":{"A":"obowiązkowo.","B":"jednorazowo na rok.","C":"na życzenie klientów.","D":"na wniosek właścicieli gospodarstwa agroturystycznego."},"a":"A","img":[1744,86],"e":{"A":"Poprawna. Organizator ma obowiązek ubezpieczyć uczestników imprezy od NNW.","B":"Nie na życzenie – obowiązkowo.","C":"Nie na sezon – na czas imprezy.","D":"Nie na prośbę gospodarza.","tip":"NNW – obowiązkowe."}},{"n":16,"q":"Podatek VAT w turystyce przy kompleksowej organizacji imprezy naliczany jest od","o":{"A":"kosztów bezpośrednich.","B":"cen jednostkowych.","C":"kosztów stałych.","D":"marży biura."},"a":"D","img":[1830,58],"e":{"A":"Koszty bezpośrednie – nie.","B":"Ceny jednostkowe – nie.","C":"Koszty stałe – nie.","D":"Poprawna. Przy kompleksowej organizacji imprezy (procedura marży) VAT liczy się od marży biura.","tip":"VAT biura = od marży."}},{"n":17,"q":"Informacje na temat przejażdżki bryczką, degustacji regionalnych potraw oraz grzybobrania należy umieścić wśród pakietów proponowanych przez lokalnych organizatorów turystyki","o":{"A":"wiejskiej.","B":"kulturowej.","C":"biznesowej.","D":"tranzytowej."},"a":"A","img":[1888,86],"e":{"A":"Poprawna. Bryczka, regionalne potrawy, grzybobranie – turystyka wiejska.","B":"Kulturowa – zabytki.","C":"Biznesowa – praca.","D":"Tranzytowa – przejazd.","tip":"Wieś = turystyka wiejska."}},{"n":18,"q":"Faza wprowadzania nowej usługi turystycznej na rynek charakteryzuje się","o":{"A":"niskimi kosztami i dużą sprzedażą.","B":"niskimi kosztami i małą sprzedażą.","C":"wysokimi kosztami i dużą sprzedażą.","D":"wysokimi kosztami i małą sprzedażą."},"a":"D","img":[1974,58],"e":{"A":"Niskie koszty – nie na początku.","B":"Niskie koszty – nie.","C":"Poprawna. Faza wprowadzenia produktu: wysokie koszty (promocja, przygotowanie) i mała sprzedaż.","D":"Duża sprzedaż – faza wzrostu/dojrzałości.","tip":"Cykl życia: wprowadzenie → wzrost → dojrzałość → schyłek."}},{"n":19,"q":"Który z elementów nie należy do marketingu mix (tzw. 4 P)?","o":{"A":"Cena.","B":"Produkt.","C":"Promocja.","D":"Segmentacja."},"a":"D","img":[2032,59],"e":{"A":"Cena – element 4P.","B":"Produkt – element 4P.","C":"Promocja – element 4P.","D":"Poprawna. Segmentacja (podział rynku) to etap planowania, nie element 4P (produkt, cena, promocja, dystrybucja).","tip":"4P: Product, Price, Promotion, Place."}},{"n":20,"q":"Promocja turystyczna obszaru działania, rozwój informacji turystycznej na szczeblu gminnym lub powiatowym to działanie","o":{"A":"LOT","B":"PIT","C":"POT","D":"WOT"},"a":"A","img":[2091,86],"e":{"A":"Poprawna. LOT – Lokalna Organizacja Turystyczna: promocja i informacja turystyczna na poziomie gminy/powiatu.","B":"PIT – punkt informacji turystycznej, nie organizacja.","C":"POT – Polska Organizacja Turystyczna (poziom krajowy).","D":"WOT – nie (regionalna to ROT).","tip":"POT – kraj, ROT – region, LOT – lokalnie."}},{"n":21,"q":"Rodzaj partnerstwa terytorialnego tworzonego na obszarach wiejskich zrzeszającego przedstawicieli lokalnych organizacji oraz mieszkańców danego obszaru, przygotowujący Lokalną Strategię Rozwoju to","o":{"A":"Lokalna Grupa Działania.","B":"Lokalna Grupa Wsparcia.","C":"Lokalna Organizacja Wiejska.","D":"Lokalna Organizacja Rozwoju."},"a":"A","img":[2177,86],"e":{"A":"Poprawna. Lokalna Grupa Działania (LGD) – partnerstwo samorządów, organizacji i mieszkańców obszarów wiejskich, opracowuje Lokalną Strategię Rozwoju.","B":"Lokalna Grupa Wsparcia – nie.","C":"Lokalna Organizacja Wiejska – nie.","D":"Lokalna Organizacja Rozwoju – nie.","tip":"LGD = Lokalna Strategia Rozwoju (program LEADER)."}},{"n":22,"q":"Który dokument jest sporządzany w procesie przygotowania imprezy turystycznej?","o":{"A":"Eurolista.","B":"Karta rozliczeniowa.","C":"Zamówienie usługi noclegowej.","D":"Zestawienie wpływów i kosztów."},"a":"C","img":[2263,58],"e":{"A":"Eurolista – dla przewoźnika, w trakcie wyjazdu.","B":"Poprawna. Zamówienie usług noclegowych sporządza się w fazie przygotowania imprezy.","C":"Sprawozdanie pilota – po imprezie.","D":"Zestawienie wpływów i kosztów – po imprezie.","tip":"Przygotowanie: oferty, zamówienia, kalkulacja."}},{"n":23,"q":"Hotel, który otrzymał od biura podróży zamówienie na usługi noclegowe, powinien wystosować do biura podróży Ą. voucher.","o":{"A":"voucher.","B":"fakturę.","C":"polecenie przelewu.","D":"potwierdzenie zamówienia."},"a":"D","img":[2321,196],"e":{"A":"Voucher wystawia biuro, nie hotel.","B":"Faktura – po wykonaniu usługi.","C":"Polecenie przelewu – dokument płatnika.","D":"Poprawna. Hotel odpowiada potwierdzeniem przyjęcia zamówienia.","tip":"Zamówienie → potwierdzenie."}},{"n":24,"q":"Kto wydaje zezwolenia na prowadzenie działalności gospodarczej w zakresie organizowania imprez turystycznych?","o":{"A":"Prezes Polskiej Izby Turystyki.","B":"Marszałek województwa.","C":"Wojewoda.","D":"Wójt."},"a":"B","img":[2517,86],"e":{"A":"Polska Izba Turystyki – organizacja branżowa.","B":"Poprawna. Wpisu do rejestru organizatorów turystyki dokonuje marszałek województwa.","C":"Wojewoda – nie.","D":"Wójt – nie.","tip":"Rejestr = marszałek."}},{"n":25,"q":"Umowa o świadczenie usług turystycznych polegających na organizowaniu imprez turystycznych wymaga formy","o":{"A":"ustnej.","B":"zdalnej.","C":"pisemnej.","D":"notarialnej."},"a":"C","img":[2603,59],"e":{"A":"Ustna – nie wystarczy.","B":"„Zdalna” – nie jest formą prawną.","C":"Poprawna. Umowa o imprezę turystyczną wymaga formy pisemnej (trwały nośnik).","D":"Notarialna – nie.","tip":"Umowa o imprezę – na piśmie."}},{"n":26,"q":"Po 4,5 godzinnym nieprzerwanym czasie prowadzenia pojazdu, kierowca autokaru powinien wykorzystać przerwę, która powinna trwać co najmniej","o":{"A":"60 minut + czas na toaletę i kawę.","B":"60 minut.","C":"50 minut.","D":"45 minut."},"a":"D","img":[2662,87],"e":{"A":"25 min – za mało.","B":"30 min – za mało.","C":"40 min – za mało.","D":"Poprawna. Po 4,5 godz. jazdy kierowca musi mieć 45 min przerwy.","tip":"4,5 h → 45 min."}},{"n":27,"q":"Którą czynność należy wykonać w pierwszej kolejności, jeżeli podczas wycieczki objazdowej nastąpiła awaria autokaru, uniemożliwiająca kontynuację podróży?","o":{"A":"Zawiadomić wskazaną pomoc drogową.","B":"Odwieźć grupę do lokalu rozrywkowego.","C":"Zorganizować zastępczy środek transportu.","D":"Skontaktować się z najbliższym konsulatem."},"a":"C","img":[2749,86],"e":{"A":"Pomoc drogowa – zajmuje się autokarem, ale priorytetem jest grupa.","B":"Lokal rozrywkowy – nie.","C":"Poprawna. Najważniejsza jest kontynuacja imprezy – organizujemy zastępczy środek transportu.","D":"Konsulat – nie w tym przypadku.","tip":"Awaria → transport zastępczy."}},{"n":28,"q":"Pociąg Kolei Mazowieckich 15361 kursuje w relacji","o":{"A":"Sierpc – Płock, w sobotę i niedzielę.","B":"Kutno – Sierpc, w poniedziałki i piątki.","C":"Płock – Sierpc, od poniedziałku do piątku.","D":"Sierpc – Kutno, od poniedziałku do soboty."},"a":"C","pic":1,"img":[2835,561],"e":{"A":"Kursuje w inne dni.","B":"Inna relacja.","C":"Poprawna. Według rozkładu pociąg 15361 jedzie z Płocka do Sierpca od poniedziałku do piątku (oznaczenie 1–5).","D":"Inna relacja.","tip":"Czytaj oznaczenia dni w rozkładzie."}},{"n":29,"q":"Który obiekt dostosowany do samoobsługi gości powinien zostać zaproponowany podróżującemu studentowi, który poszukuje taniego noclegu w centrum Krakowa?","o":{"A":"Kemping.","B":"Pensjonat.","C":"Dom wczasowy.","D":"Schronisko młodzieżowe."},"a":"D","img":[3396,86],"e":{"A":"Hotel ma pełną obsługę i jest drogi.","B":"Pensjonat – obsługa i wyżywienie, droższy.","C":"Dom wczasowy – obiekt do wypoczynku zorganizowanego z wyżywieniem.","D":"Poprawna. Schronisko młodzieżowe – tani obiekt dla młodzieży i studentów, przystosowany do samoobsługi (wspólna kuchnia).","tip":"Tanio + samoobsługa + młodzież = schronisko młodzieżowe."}},{"n":30,"q":"Oblicz koszt wstępu do Muzeum Wsi Mazowieckiej dla rodziny (2 osoby dorosłe i 1 dziecko) wraz z przewodnikiem w języku angielskim w dniu 15 sierpnia.","o":{"A":"97 zł","B":"87 zł","C":"108 zł","D":"100 zł"},"a":"A","pic":1,"img":[3482,350],"e":{"A":"Poprawna. 15 sierpnia to święto (okres maj–wrzesień): 2 × 16 + 8 = 40 zł; przewodnik 60 zł − 5% = 57 zł; razem 97 zł.","B":"87 zł – ceny z dnia powszedniego.","C":"108 zł – bez zniżki i z błędem.","D":"100 zł – bez zniżki 5%.","tip":"Sprawdź, czy dzień jest świętem."}},{"n":31,"q":"Przedstawiony na ilustracji dom podcieniowy należy do najbardziej charakterystycznych zabytków","o":{"A":"Żuław Wiślanych.","B":"Niecki Nidziańskiej.","C":"Polesia Lubelskiego.","D":"Beskidu Sądeckiego."},"a":"A","pic":1,"img":[3832,208],"e":{"A":"Poprawna. Dom podcieniowy (szachulcowy, z podcieniem) – charakterystyczny zabytek Żuław Wiślanych.","B":"Niecka Nidziańska – gipsy, Ponidzie.","C":"Polesie Lubelskie – bagna.","D":"Beskid Sądecki – cerkwie.","tip":"Domy podcieniowe = Żuławy."}},{"n":32,"q":"Przykładem dziedzictwa kulturowego Warmii są gotyckie kościoły wzniesione","o":{"A":"z cegły.","B":"z granitu.","C":"z drewna.","D":"z piaskowca."},"a":"A","img":[4040,58],"e":{"A":"Poprawna. Warmia (i Pomorze) słynie z gotyku ceglanego – kościoły i zamki z cegły (Frombork, Lidzbark).","B":"Granit – rzadko, głównie fundamenty.","C":"Drewno – Małopolska, Podkarpacie.","D":"Piaskowiec – Śląsk, Małopolska.","tip":"Północ Polski = gotyk ceglany."}},{"n":33,"q":"Przy planowaniu wycieczki przez organizatorów turystyki nie uwzględnia się","o":{"A":"celu imprezy.","B":"rodzaju transportu.","C":"własnych upodobań pilota wycieczki.","D":"życzeń klientów zainteresowanych wyjazdem."},"a":"C","img":[4098,59],"e":{"A":"Cel imprezy – uwzględnia się.","B":"Rodzaj transportu – uwzględnia się.","C":"Poprawna. Własne upodobania pilota nie są podstawą planowania wycieczki.","D":"Życzenia klientów – uwzględnia się.","tip":"Planujemy pod klienta, nie pilota."}},{"n":34,"q":"Dokumentem kredytowym umożliwiającym realizację świadczeń zamówionych przez biuro podróży u kontrahenta jest","o":{"A":"warrant.","B":"voucher.","C":"list zastawny.","D":"kwit depozytowy."},"a":"B","img":[4157,87],"e":{"A":"Warrant – papier wartościowy.","B":"Poprawna. Voucher – dokument kredytowy (skierowanie) uprawniający do świadczeń u kontrahenta.","C":"List zastawny – papier dłużny banku.","D":"Kwit depozytowy – potwierdzenie depozytu.","tip":"Voucher = skierowanie na usługę."}},{"n":35,"q":"Klient przy podpisaniu umowy otrzymuje od organizatora turystyki między innymi","o":{"A":"formularz rezerwacyjny.","B":"potwierdzenie rezerwacji.","C":"szczegółowy program imprezy.","D":"zlecenie pilotażu imprezy turystycznej."},"a":"C","img":[4244,58],"e":{"A":"Formularz rezerwacyjny – przed umową.","B":"Potwierdzenie rezerwacji – nie.","C":"Poprawna. Klient otrzymuje szczegółowy program imprezy.","D":"Zlecenie pilotażu – wewnętrzne.","tip":"Umowa + program + warunki uczestnictwa."}},{"n":36,"q":"Pilot wycieczki otrzymuje tzw. rooming list, czyli listę zawierającą wykaz turystów i ich","o":{"A":"dane adresowe.","B":"sposób zakwaterowania.","C":"wymagania dotyczące wyżywienia.","D":"oczekiwania dotyczące usług dodatkowych."},"a":"B","img":[4302,58],"e":{"A":"Adresy – nie.","B":"Poprawna. Rooming list – wykaz uczestników z podziałem na pokoje (sposób zakwaterowania).","C":"Diety – osobna lista.","D":"Usługi dodatkowe – nie.","tip":"Rooming = pokoje."}},{"n":37,"q":"W przypadku korzystania z oferty typu last minute uczestnikowi imprezy","o":{"A":"przysługuje prawo złożenia reklamacji.","B":"nie przysługuje prawo złożenia reklamacji.","C":"przysługuje prawo złożenia reklamacji dotyczące wyłącznie środka transportu.","D":"przysługuje prawo złożenia reklamacji dotyczące wyłącznie warunków noclegowych."},"a":"A","img":[4360,58],"e":{"A":"Poprawna. Oferta last minute to zwykła impreza – klientowi przysługuje pełne prawo do reklamacji.","B":"Prawo do reklamacji nie jest wyłączone.","C":"Nie tylko transportu.","D":"Nie tylko noclegów.","tip":"Last minute = pełne prawa konsumenta."}},{"n":38,"q":"Za kompleksowe zorganizowanie imprezy turystycznej biuro podróży wystawia klientowi","o":{"A":"fakturę.","B":"polecenie przelewu.","C":"rachunek uproszczony.","D":"fakturę procedura marży dla biur podróży."},"a":"D","img":[4418,58],"e":{"A":"Zwykła faktura VAT – nie przy imprezie.","B":"Przelew – dokument klienta.","C":"Rachunek uproszczony – nie.","D":"Poprawna. Faktura procedura marży dla biur podróży.","tip":"Klient biura = faktura marża (lub paragon)."}},{"n":39,"q":"Biuro podróży sprzedaje wycieczki nabywając usługi od innych podmiotów dla bezpośredniej korzyści klienta. Rozliczenie imprezy wykazało faktyczną marżę w wysokości 203,25 zł. Kwota należnego podatku VAT od marży wynosi","o":{"A":"45,08 zł","B":"46,75 zł","C":"57,50 zł","D":"55,00 zł"},"a":"B","img":[4476,114],"e":{"A":"45,08 zł – błędne obliczenie.","B":"Poprawna. VAT od marży w Polsce = 23% marży netto: 203,25 × 0,23 = 46,75 zł.","C":"55,23 zł – błędne obliczenie.","D":"57,50 zł – błędne obliczenie.","tip":"W biurach podróży VAT liczymy tylko od marży (procedura VAT marża), stawka 23%."}},{"n":40,"q":"Oblicz kwotę, którą powinno zapłacić biuro podróży kontrahentowi, jeżeli hotel zgodnie z umową wynajmie pokoje za 3 000,00 zł netto i naliczy 8% podatku VAT.","o":{"A":"3000,00 zł","B":"3160,00 zł","C":"3 200,00 zł","D":"3 240,00 zł"},"a":"D","img":[4590,87],"e":{"A":"3 000 zł – netto.","B":"3 160 zł – błąd.","C":"3 200 zł – błąd.","D":"Poprawna. 3 000 × 1,08 = 3 240,00 zł brutto.","tip":"Noclegi – 8%."}}],"2016-styczen":[{"n":1,"q":"Wycieczka dla osób wyjeżdżających z grupą zorganizowaną na wakacje do czterogwiazdkowego hotelu na Seszele organizowana jest w ramach turystyki","o":{"A":"incentive.","B":"kulturowej.","C":"kwalifikowanej.","D":"wypoczynkowej."},"a":"D","img":[0,93],"e":{"A":"Incentive to wyjazd motywacyjny – nagroda od firmy dla pracowników.","B":"Turystyka kulturowa – zwiedzanie zabytków, muzeów, udział w wydarzeniach kultury.","C":"Turystyka kwalifikowana wymaga umiejętności i sprzętu (np. żeglarstwo, wspinaczka).","D":"Poprawna. Wakacje w hotelu przy plaży nastawione na odpoczynek to turystyka wypoczynkowa (rekreacyjna).","tip":"Hotel + plaża + wakacje = wypoczynek."}},{"n":2,"q":"Zgodnie z definicją Światowej Organizacji Turystyki (UNWTO) podróżą turystyczną jest wyjazd","o":{"A":"pani Nowak do pracy w Holandii.","B":"grupy żołnierzy w ramach misji NATO.","C":"pana Kowalskiego na weekend do Krakowa.","D":"kolegi na półtoraroczny kurs językowy do Londynu."},"a":"C","img":[93,62],"e":{"A":"Wyjazd do pracy zarobkowej nie jest turystyką wg UNWTO.","B":"Misja wojskowa to wyjazd służbowy związany z wykonywaniem zadań, nie turystyka.","C":"Poprawna. UNWTO: podróż poza miejsce zamieszkania na okres krótszy niż rok, w celu innym niż praca zarobkowa w odwiedzanym miejscu – weekend w Krakowie spełnia te warunki.","D":"Półtora roku to ponad 12 miesięcy – przekracza limit roku z definicji UNWTO.","tip":"UNWTO = Światowa Organizacja Turystyki; turystyka: < 1 roku, nie w celach zarobkowych."}},{"n":3,"q":"Wycieczka w nagrodę do Paryża dla pracowników korporacji bankowej za osiągnięcie dobrych wyników finansowych to turystyka","o":{"A":"krajoznawcza.","B":"motywacyjna.","C":"biznesowa.","D":"socjalna."},"a":"B","img":[155,93],"e":{"A":"Turystyka krajoznawcza to poznawanie kraju, jego przyrody i kultury.","B":"Poprawna. Wyjazd w nagrodę za wyniki to turystyka motywacyjna (incentive travel).","C":"Turystyka biznesowa to podróże służbowe: spotkania, konferencje, targi.","D":"Turystyka socjalna to wyjazdy dofinansowane dla osób o niższych dochodach, dzieci, seniorów.","tip":"Nagroda od pracodawcy = motywacyjna (incentive)."}},{"n":4,"q":"Zapis BB zamieszczony w ofertach turystycznych oznacza, że cena oprócz zakwaterowania obejmuje","o":{"A":"śniadanie i obiadokolację.","B":"śniadanie i obiad.","C":"pełne wyżywienie.","D":"śniadanie."},"a":"D","img":[248,62],"e":{"A":"Śniadanie i obiadokolacja to HB (half board – półpensja).","B":"Śniadanie i obiad to również wariant półpensji, nie BB.","C":"Pełne wyżywienie to FB (full board).","D":"Poprawna. BB = bed & breakfast – nocleg ze śniadaniem.","tip":"RO – sam nocleg, BB – ze śniadaniem, HB – 2 posiłki, FB – 3 posiłki, AI – all inclusive."}},{"n":5,"q":"Na zdjęciu przedstawiono jeden z polskich obiektów z Listy Światowego Dziedzictwa UNESCO. Jest to","o":{"A":"Stare Miasto w Zamościu.","B":"Stare Miasto w Krakowie.","C":"Stare Miasto w Warszawie.","D":"średniowieczny zespół miejski Torunia."},"a":"D","pic":1,"img":[310,562],"e":{"A":"Zamość słynie z renesansowego rynku i ratusza z wachlarzowatymi schodami.","B":"Kraków – Rynek Główny z Sukiennicami i Kościołem Mariackim.","C":"Warszawa – odbudowany Rynek Starego Miasta, Zamek Królewski.","D":"Poprawna. Na zdjęciu gotycki Ratusz Staromiejski w Toruniu z pomnikiem Mikołaja Kopernika przed nim.","tip":"Pomnik Kopernika + ceglany gotyk = Toruń."}},{"n":6,"q":"Charakterystycznymi walorami przyrodniczymi Warmii i Mazur są","o":{"A":"skały wapienne.","B":"ruchome wydmy.","C":"największe jeziora w Polsce.","D":"największe skupiska cisów w Polsce."},"a":"C","img":[872,62],"e":{"A":"Skały wapienne kojarzą się z Jurą Krakowsko-Częstochowską.","B":"Ruchome wydmy to Słowiński Park Narodowy (Łeba).","C":"Poprawna. Na Mazurach leżą największe polskie jeziora: Śniardwy i Mamry.","D":"Największe skupisko cisów jest w rezerwacie w Wierzchlesie (Bory Tucholskie).","tip":"Mazury = Kraina Tysiąca Jezior."}},{"n":7,"q":"Miasto w zachodniej Polsce, położone na Pojezierzu Wielkopolskim, nad rzeką Wartą, u ujścia Cybiny. Jest jednym z najstarszych lokowanych miast w Polsce — nadanie praw miejskich w 1253 r. Miastem, którego dotyczy zamieszczony opis, jest","o":{"A":"Toruń.","B":"Poznań.","C":"Gdańsk.","D":"Gniezno."},"a":"B","img":[934,183],"e":{"A":"Toruń leży nad Wisłą, prawa miejskie w 1233 r.","B":"Poprawna. Poznań – nad Wartą u ujścia Cybiny, lokacja w 1253 r.","C":"Gdańsk leży nad Motławą i Wisłą przy Zatoce Gdańskiej.","D":"Gniezno leży na Pojezierzu Gnieźnieńskim, nie nad Wartą.","tip":"Warta + Cybina (Ostrów Tumski) = Poznań."}},{"n":8,"q":"Program wycieczki turystycznej do Portugalii powinien uwzględnić zwiedzanie","o":{"A":"Akropolu z Partenonem w Atenach.","B":"Chamonix z widokiem na Mont Blanc.","C":"Klasztoru Hieronimitów i wieży Belóm w Lizbonie.","D":"Gandan — zespołu klasztornego z XIX i początku XX wieku w Ułan Bator."},"a":"C","img":[1117,61],"e":{"A":"Akropol i Partenon są w Atenach – Grecja.","B":"Chamonix i Mont Blanc – Francja (Alpy).","C":"Poprawna. Klasztor Hieronimitów i Wieża Belém to zabytki Lizbony – stolicy Portugalii (lista UNESCO).","D":"Ułan Bator to stolica Mongolii.","tip":"Lizbona: Belém, Hieronimici, tramwaj nr 28."}},{"n":9,"q":"Autostrada na przedstawionym fragmencie mapy oznaczona jest symbolem","o":{"A":"53","B":"S7","C":"A1","D":"E77"},"a":"C","pic":1,"img":[1178,554],"e":{"A":"53 to numer drogi krajowej (np. Olsztyn–Ostrołęka), nie autostrady.","B":"S7 to droga ekspresowa (litera S), nie autostrada.","C":"Poprawna. Polskie autostrady oznacza się literą A – na mapie A1 biegnie przez Grudziądz i Toruń.","D":"E77 to numer trasy europejskiej, nie krajowy symbol autostrady.","tip":"A – autostrada, S – ekspresowa, liczba – krajowa, E – europejska."}},{"n":10,"q":"Opracowując program wycieczki dla gościa uprawiającego trekking, należy uwzględnić","o":{"A":"chodzenie po górach.","B":"Jazdę na nartach.","C":"pływanie.","D":"bieganie."},"a":"A","img":[1732,61],"e":{"A":"Poprawna. Trekking to wielodniowe piesze wędrówki, najczęściej w górach.","B":"Jazda na nartach to narciarstwo.","C":"Pływanie nie jest elementem trekkingu.","D":"Bieganie to inna aktywność (np. trail running).","tip":"Trekking = trek = piesza wędrówka."}},{"n":11,"q":"W programie imprezy dla turystów interesujących się batalistyką powinno się zaplanować zwiedzanie muzeum ĄA. Morskie w Gdyni.","o":{"B":"Zegarów w Jędrzejowie.","C":"Sportu i Turystyki w Karpaczu.","D":"Bitwy pod Grunwaldem w Stębarku."},"a":"D","img":[1793,209],"e":{"A":"Muzeum Marynarki Wojennej czy statki w Gdyni dotyczą morza, nie batalistyki lądowej.","B":"Muzeum Zegarów w Jędrzejowie – zegary i gnomonika.","C":"Muzeum Sportu i Turystyki w Karpaczu – historia sportów zimowych i turystyki.","D":"Poprawna. Batalistyka to tematyka bitew – Muzeum Bitwy pod Grunwaldem w Stębarku.","tip":"Batalistyka = bitwy."}},{"n":12,"q":"Który usługodawca powinien świadczyć usługi zgodnie ze wskazanym zamówieniem (formularz: Zamówienie… Dane dot. wynajmu: termin, ilość osób, rodzaj pokoi, uzgodniona cena)?","o":{"A":"Biuro podróży.","B":"Pilot wycieczki.","C":"Obiekt noclegowy.","D":"Przewodnik turystyczny."},"a":"C","ctx":1,"img":[2002,505],"e":{"A":"Biuro podróży to nadawca zamówienia – zamawia usługi, a nie je świadczy.","B":"Pilot opiekuje się grupą, nie wynajmuje pokoi.","C":"Poprawna. Formularz dotyczy wynajmu pokoi (rodzaj pokoi, termin, liczba osób) – usługę świadczy obiekt noclegowy.","D":"Przewodnik oprowadza po obiekcie/terenie, nie wynajmuje pokoi.","tip":"„Rodzaj pokoi” = obiekt noclegowy."}},{"n":13,"q":"Ile wynosi koszt uczestnictwa jednej osoby w wycieczce zorganizowanej przez biuro podróży przy założeniu, że całkowity koszt uczestnictwa dla jednej osoby w wycieczce składa się z opłaty w wysokości 1 000 złotych, marży biura w wysokości 15% oraz podatku VAT?","o":{"A":"1300,50 zł","B":"1200,00 zł","C":"1184,50 zł","D":"1050,00 zł"},"a":"C","img":[2507,124],"e":{"A":"1300,50 zł – błędnie liczony VAT od całej kwoty.","B":"1200 zł – nieprawidłowy wynik.","C":"Poprawna. Marża 15% × 1000 = 150 zł; VAT 23% od marży = 34,50 zł; 1000 + 150 + 34,50 = 1184,50 zł.","D":"1050 zł – pominięto część marży i VAT.","tip":"W procedurze marży VAT (23%) liczy się tylko od marży."}},{"n":14,"q":"Ile wynosi koszt imprezy turystycznej dla zamówionych usług bez marży i podatku VAT? (1. transport: 746 km × 3 zł; 2. noclegi: 10 pok. × 80 zł × 2 doby, 2 pok. × 70 zł × 2 doby, 2 pok. × 40 zł × 2 doby; 3. wyżywienie: śniadanie 10 zł × 2 dni × 46 osób, kolacja 10 zł × 1 dzień × 46 osób, obiadokolacja 15 zł × 1 dzień × 46 osób)","o":{"A":"6 348 zł","B":"6 248 zł","C":"4 228 zł","D":"4 028 zł"},"a":"A","ctx":1,"img":[2631,93],"e":{"A":"Poprawna. Transport 746×3 = 2238; noclegi 1600+280+160 = 2040; wyżywienie 920+460+690 = 2070; razem 6348 zł.","B":"6248 zł – błąd o 100 zł w sumowaniu.","C":"4228 zł – pominięto wyżywienie lub część noclegów.","D":"4028 zł – pominięto kilka pozycji.","tip":"Licz każdą pozycję osobno, potem sumuj."}},{"n":15,"q":"13.00 — spotkanie z przewodnikiem na Rynku Głównym koło pomnika Adama Mickiewicza; zwiedzanie: Kościoła Mariackiego, Rynku, Sukiennic, Wawelu (Komnaty Królewskie, Skarbca i Zbrojowni, Katedry Wawelskiej) — kolejność ustali przewodnik miejski. Zwiedzanie z przewodnikiem przewidziano do godz. 17.00 Dla wskazanego elementu programu, w celu prawidłowego przeprowadzenia procesu rezerwacji na etapie planowania wycieczki należy zarezerwować","o":{"A":"tylko przewodnika terenowego.","B":"przewodnika miejskiego po Toruniu.","C":"przewodnika miejskiego oraz bilet wstępu na wybrane miejsca na Wawelu.","D":"przewodnika miejskiego oraz bilet wstępu na wybrane miejsca znajdujące się na starym mieście w Toruniu."},"a":"C","img":[2724,172],"e":{"A":"Przewodnik terenowy nie oprowadza po zabytkach miasta – potrzebny przewodnik miejski.","B":"Program dotyczy Krakowa (Rynek, Wawel), nie Torunia.","C":"Poprawna. Trzeba zamówić przewodnika miejskiego po Krakowie oraz bilety na Wawel (Komnaty, Skarbiec, Zbrojownia, Katedra).","D":"Pomnik Mickiewicza, Sukiennice i Wawel są w Krakowie, nie w Toruniu.","tip":"Wawel wymaga biletów – rezerwuje się je z wyprzedzeniem."}},{"n":16,"q":"Termin first minute w ofercie biura podróży oznacza","o":{"A":"korzystną ofertę cenową dla specjalnych klientów.","B":"przedsprzedaż katalogowych ofert na kolejny sezon.","C":"sprzedaż produktu turystycznego w ostatnim momencie.","D":"ofertę najwyżej ocenianą w danym momencie przez klientów."},"a":"B","img":[2896,61],"e":{"A":"Ceny dla specjalnych klientów to oferta dedykowana/rabat lojalnościowy.","B":"Poprawna. First minute – przedsprzedaż ofert na kolejny sezon z rabatem za wczesną rezerwację.","C":"Sprzedaż w ostatnim momencie to last minute.","D":"Najwyżej oceniana oferta to ranking/opinie klientów.","tip":"First minute = najwcześniej; last minute = na ostatnią chwilę."}},{"n":17,"q":"Najczęściej stosowaną formą umowy między biurem podróży a hotelem, polegającą na wynajęciu pokoi do jego wyłącznej dyspozycji, jest","o":{"A":"charter.","B":"franchising.","C":"timesharing.","D":"freesale arrangement."},"a":"A","img":[2957,93],"e":{"A":"Poprawna. Czarter (charter) to wynajęcie całości lub stałej puli miejsc/pokoi na wyłączną dyspozycję biura.","B":"Franchising to korzystanie z marki i systemu innej firmy.","C":"Timesharing to prawo do korzystania z apartamentu przez określony czas co roku.","D":"Free sale to sprzedaż bez gwarancji puli – hotel potwierdza pokoje na bieżąco.","tip":"Wyłączna dyspozycja = czarter."}},{"n":18,"q":"Elementem promocji nie jest","o":{"A":"sprzedaż osobista.","B":"public relations.","C":"dystrybucja.","D":"reklama."},"a":"C","img":[3050,61],"e":{"A":"Sprzedaż osobista to element promocji (promotion mix).","B":"Public relations (PR) – budowanie wizerunku – to element promocji.","C":"Poprawna. Dystrybucja (place) to osobny element marketingu-mix 4P, a nie promocji.","D":"Reklama to podstawowy element promocji.","tip":"4P: produkt, cena, dystrybucja, promocja."}},{"n":19,"q":"Które z działań gospodarstwa agroturystycznego podejmowane jest w ramach strategii ceny?","o":{"A":"Modernizacja pokoi gościnnych.","B":"Udzielanie zniżek stałym klientom.","C":"Zorganizowanie przyjęcia dla turystów.","D":"Umieszczenie informacji o obiekcie w katalogu."},"a":"B","img":[3111,62],"e":{"A":"Modernizacja pokoi dotyczy produktu.","B":"Poprawna. Zniżki dla stałych klientów to decyzja cenowa – strategia ceny.","C":"Przyjęcie dla turystów to element produktu/promocji (event).","D":"Wpis do katalogu to promocja.","tip":"Rabat, zniżka, cennik = cena."}},{"n":20,"q":"Zgodnie z ustawą o usługach turystycznych pan Kowalski wyjeżdżający do Krakowa i powracający tego samego dnia do domu jest","o":{"A":"turystą.","B":"passantem.","C":"odwiedzającym.","D":"gościem hotelowym."},"a":"C","img":[3173,93],"e":{"A":"Turysta musi spędzić co najmniej jeden nocleg poza miejscem zamieszkania.","B":"Pasant to osoba przejeżdżająca tranzytem – określenie potoczne, nie ustawowe.","C":"Poprawna. Odwiedzający to osoba podróżująca poza miejsce zamieszkania na okres krótszy niż rok – jednodniowy wyjazd bez noclegu.","D":"Gość hotelowy korzysta z noclegu.","tip":"Bez noclegu = odwiedzający; z noclegiem = turysta."}},{"n":21,"q":"W zamówieniu noclegów i wyżywienia (Biuro Podróży Wierchy → Pensjonat BACA, Zakopane: noclegi i wyżywienie dla 46 osób, płatność przelewem w ciągu 7 dni) brakuje","o":{"A":"terminu pobytu.","B":"formy zapłaty z klientem.","C":"formy transportu do obiektu.","D":"informacji o rodzaju usług przewodnickich i pilotażu."},"a":"A","ctx":1,"img":[3266,465],"e":{"A":"Poprawna. W zamówieniu brakuje dat pobytu – bez terminu pensjonat nie może zarezerwować pokoi.","B":"Forma płatności jest podana (przelew w ciągu 7 dni).","C":"Transport do obiektu nie jest przedmiotem zamówienia noclegów.","D":"Usługi przewodnickie i pilotażu nie dotyczą pensjonatu.","tip":"Każde zamówienie musi mieć termin."}},{"n":22,"q":"Biwakowanie w parku narodowym dozwolone jest jedynie","o":{"A":"na obrzeżach parku.","B":"na terenie całego parku.","C":"w miejscach wskazanych przez dyrektora parku.","D":"w miejscach wskazanych przez ministra ochrony środowiska."},"a":"C","img":[3731,62],"e":{"A":"Obrzeża parku nie są automatycznie miejscem biwakowania.","B":"Na terenie całego parku obowiązuje zakaz biwakowania poza wyznaczonymi miejscami.","C":"Poprawna. Ustawa o ochronie przyrody: biwakowanie tylko w miejscach wyznaczonych przez dyrektora parku narodowego.","D":"Minister nie wyznacza takich miejsc – robi to dyrektor parku.","tip":"W parku narodowym decyduje dyrektor parku."}},{"n":23,"q":"Zgodnie z obowiązującym prawem organizator turystyki ma obowiązek zgłosić wyjazd dzieci na kolonie","o":{"A":"na policję.","B":"do Kuratorium Oświaty.","C":"do Marszałka Województwa.","D":"do szkół, do których uczęszczają dzieci."},"a":"B","img":[3793,62],"e":{"A":"Policja może kontrolować autokar, ale wypoczynek zgłasza się do kuratorium.","B":"Poprawna. Organizator wypoczynku dzieci i młodzieży zgłasza go do kuratora oświaty (dziś przez bazę wypoczynku MEN).","C":"Marszałek prowadzi rejestr organizatorów turystyki, nie przyjmuje zgłoszeń kolonii.","D":"Szkoły nie przyjmują takich zgłoszeń.","tip":"Kolonie, obozy = Kuratorium Oświaty."}},{"n":24,"q":"Podczas podróży i pobytu opiekę nad turystami sprawuje w imieniu organizatora turystyki","o":{"A":"pilot wycieczki.","B":"kierowca autokaru.","C":"pracownik działu obsługi klienta.","D":"najbardziej doświadczony uczestnik."},"a":"A","img":[3855,179],"e":{"A":"Poprawna. Pilot wycieczki sprawuje opiekę nad uczestnikami w imieniu organizatora i dba o realizację programu.","B":"Kierowca odpowiada za prowadzenie pojazdu, nie za opiekę nad grupą.","C":"Pracownik działu obsługi klienta pracuje w biurze, nie jedzie z grupą.","D":"Uczestnik nie reprezentuje organizatora.","tip":"Pilot = przedstawiciel biura w trasie."}},{"n":25,"q":"Z powodu zmiany kursu walut biuro podróży klientowi wyjeżdżającemu za 2 tygodnie na Sardynię","o":{"A":"nie może podnieść ceny.","B":"może podnieść cenę imprezy.","C":"może podnieść cenę po wcześniejszym poinformowaniu.","D":"może podnieść cenę tylko do założonego ryzyka wzrostu kursu walut."},"a":"A","img":[4034,62],"e":{"A":"Poprawna. Wg ustawy cena ustalona w umowie nie może być podwyższona w terminie 20 dni przed wyjazdem – 2 tygodnie to mniej niż 20 dni.","B":"Podwyżka jest możliwa tylko wcześniej niż 20 dni przed imprezą i z określonych powodów.","C":"Poinformowanie nie wystarcza – w tym terminie podwyżka jest zabroniona.","D":"Ustawa nie zna pojęcia „założonego ryzyka kursu”.","tip":"< 20 dni przed wyjazdem – cena zamrożona."}},{"n":26,"q":"Ilość dóbr i usług, które mogą zaoferować przedsiębiorstwa turystyczne w określonym czasie i za określoną cenę, nazywa się","o":{"A":"pakietem usług.","B":"ofertą handlową.","C":"podażą turystyczną.","D":"rynkiem agroturystycznym."},"a":"C","img":[4096,92],"e":{"A":"Pakiet usług to zestaw usług sprzedawany razem.","B":"Oferta handlowa to propozycja skierowana do konkretnego klienta.","C":"Poprawna. Podaż turystyczna to ilość dóbr i usług oferowanych w danym czasie i po danej cenie.","D":"Rynek to miejsce spotkania podaży i popytu, a nie sama podaż.","tip":"Podaż – oferują sprzedający; popyt – kupują klienci."}},{"n":27,"q":"Przedstawione na zdjęciu logo oznacza","o":{"A":"cerkwie.","B":"pomniki historii.","C":"pomniki przyrody.","D":"muzea średniowieczne."},"a":"B","pic":1,"img":[4188,231],"e":{"A":"Cerkwie mają kopuły cebulaste – logo przedstawia gotyckie okno.","B":"Poprawna. Logo w kształcie gotyckiego okna oznacza Pomnik Historii – zabytek szczególnej wartości ustanowiony przez Prezydenta RP.","C":"Pomniki przyrody oznacza się tabliczką z orłem.","D":"Nie ma takiego oficjalnego znaku dla muzeów średniowiecznych.","tip":"Pomnik Historii – nadaje Prezydent RP; znak z gotyckim oknem."}},{"n":28,"q":"Którą ulotkę dotyczącą Muzeum Powstania Warszawskiego powinien wręczyć turyście pracownik informacji turystycznej?","o":{"A":"Ulotka A (muzeum otwarte w 2004 r. w dawnej Elektrowni Tramwajów Miejskich, ul. Grzybowska 79).","B":"Ulotka B (muzeum wojskowo-historyczne powstałe w 1920 r. dekretem J. Piłsudskiego).","C":"Ulotka C (muzeum historii Polski powołane w 2006 r.).","D":"Ulotka D (muzeum utworzone w 1879 r., pierwsza narodowa instytucja muzealna)."},"a":"A","ctx":1,"img":[4419,785],"e":{"A":"Poprawna. Muzeum Powstania Warszawskiego otwarto w 2004 r. w dawnej Elektrowni Tramwajów przy ul. Grzybowskiej 79.","B":"Ulotka B opisuje Muzeum Wojska Polskiego (1920 r., J. Piłsudski).","C":"Ulotka C opisuje Muzeum Historii Polski (2006 r.).","D":"Ulotka D opisuje Muzeum Narodowe w Krakowie (1879 r.).","tip":"Muzeum Powstania = 2004, Wola, ul. Grzybowska."}},{"n":29,"q":"Państwo Kalinowscy z dwójką dzieci zarezerwowali tygodniowy pobyt w gospodarstwie agroturystycznym. Koszt pobytu osoby dorosłej to 250 zł za tydzień, a dziecka 50% ceny podstawowej. Oblicz tygodniowy koszt pobytu państwa Kalinowskich w gospodarstwie.","o":{"A":"500 zł","B":"750 zł","C":"875 zł","D":"1000 zł"},"a":"B","img":[5204,124],"e":{"A":"500 zł to koszt tylko dwojga dorosłych.","B":"Poprawna. 2 × 250 zł + 2 × 125 zł (50% ceny) = 750 zł.","C":"875 zł – błędnie przyjęta zniżka.","D":"1000 zł to 4 × 250 zł – bez zniżki dla dzieci.","tip":"Dziecko 50% = 125 zł."}},{"n":30,"q":"Który z opisanych hoteli powinien zaproponować pracownik biura podróży klientowi chcącemu wyjechać na Wyspy Kanaryjskie?","o":{"A":"Fuerteventura Princess (Jandia, lotnisko Puerto del Rosario).","B":"Mitsis Rodos Village (Kiotari, Rodos).","C":"Cala Mirto (Sardynia).","D":"Sea Front (Kreta)."},"a":"A","ctx":1,"img":[5328,994],"e":{"A":"Poprawna. Fuerteventura (Jandia, Puerto del Rosario) to jedna z Wysp Kanaryjskich (Hiszpania).","B":"Rodos to wyspa grecka na Morzu Egejskim.","C":"Sardynia to wyspa włoska na Morzu Śródziemnym.","D":"Kreta to wyspa grecka.","tip":"Kanary: Teneryfa, Gran Canaria, Lanzarote, Fuerteventura, La Palma…"}},{"n":31,"q":"Wyjazdy związane z chęcią uczestnictwa w wydarzeniach sportowych to","o":{"A":"tramping.","B":"fanoturystyka.","C":"enoturystyka.","D":"tanatoturystyka."},"a":"B","img":[6322,62],"e":{"A":"Tramping to tanie, samodzielne podróżowanie.","B":"Poprawna. Fanoturystyka to wyjazdy kibiców na wydarzenia sportowe.","C":"Enoturystyka to turystyka winiarska (enos – wino).","D":"Tanatoturystyka to odwiedzanie miejsc śmierci i tragedii.","tip":"Fan = kibic → fanoturystyka."}},{"n":32,"q":"Przedstawiony fragment dokumentu („§1 Zasady ogólne… Niniejszy regulamin określa warunki uczestnictwa w imprezach turystycznych organizowanych przez ABC-TRAVEL…”) to","o":{"A":"voucher dla grupy.","B":"regulamin imprez turystycznych.","C":"zamówienie na usługi turystyczne.","D":"rozliczenie kosztów pobytu grupy."},"a":"B","ctx":1,"img":[6384,505],"e":{"A":"Voucher to dokument uprawniający do skorzystania z usług.","B":"Poprawna. Tekst sam o sobie mówi: „niniejszy regulamin określa warunki uczestnictwa w imprezach”.","C":"Zamówienie zawiera listę zamawianych usług.","D":"Rozliczenie zawiera koszty i kwoty.","tip":"Paragrafy + „warunki uczestnictwa” = regulamin."}},{"n":33,"q":"W czasie trwania imprezy turystycznej jeden z klientów poparzył rękę. Konieczna była interwencja lekarza. Pilot w tej sytuacji","o":{"A":"musi poinformować o tym fakcie ambasadę.","B":"powinien sporządzić notatkę służbową ze zdarzenia.","C":"powinien zapisać informację w zeszycie skarg i uwag.","D":"nie musi nic robić, bo zdarzenie nie zagrażało życiu turysty."},"a":"B","img":[6889,89],"e":{"A":"Ambasadę informuje się przy poważnych zdarzeniach za granicą (np. aresztowanie, utrata dokumentów).","B":"Poprawna. Pilot sporządza notatkę służbową o wypadku – jest podstawą do roszczeń ubezpieczeniowych i dokumentacji.","C":"Zeszyt skarg i uwag służy do reklamacji, nie do opisu wypadków.","D":"Każde zdarzenie wymagające lekarza musi zostać udokumentowane.","tip":"Wypadek = notatka służbowa."}},{"n":34,"q":"Obszary, w których koncentruje się ruch turystyczny nazywane są","o":{"A":"szlakami turystycznymi.","B":"walorami turystycznymi.","C":"regionami turystycznymi.","D":"krajobrazami geograficznymi."},"a":"C","img":[6978,59],"e":{"A":"Szlaki turystyczne to oznakowane trasy.","B":"Walory turystyczne to cechy środowiska przyciągające turystów.","C":"Poprawna. Region turystyczny to obszar koncentracji ruchu turystycznego (np. Tatry, Mazury).","D":"Krajobraz geograficzny to pojęcie z geografii fizycznej.","tip":"Koncentracja ruchu = region turystyczny."}},{"n":35,"q":"Wskaż dokument pomocny w obliczaniu szkody powstałej w wyniku nierzetelności organizatora turystyki.","o":{"A":"Układ z Schengen.","B":"Tabela Frankfurcka.","C":"Umowa hotelowa.","D":"Kodeks Etyki w Turystyce."},"a":"B","img":[7037,59],"e":{"A":"Układ z Schengen dotyczy znoszenia kontroli granicznych.","B":"Poprawna. Tabela frankfurcka określa procent obniżenia ceny za konkretne uchybienia organizatora.","C":"Umowa hotelowa reguluje relacje biura z hotelem.","D":"Kodeks Etyki w Turystyce (UNWTO) to zasady ogólne, bez wyliczeń.","tip":"Wady imprezy → tabela frankfurcka (np. brak basenu = ok. 10–20%)."}},{"n":36,"q":"W kalkulacji imprez turystycznych często uwzględnia się miejsce bezpłatne, które zwyczajowo przeznaczone jest dla","o":{"A":"pilota wycieczki.","B":"najmłodszego dziecka.","C":"najstarszego klienta, który wykupił wycieczkę.","D":"klienta, który jest stałym klientem danego biura podróży."},"a":"A","img":[7096,92],"e":{"A":"Poprawna. Zwyczajowo miejsce bezpłatne (gratis) przeznacza się dla pilota wycieczki.","B":"Dziecko otrzymuje zniżkę, nie miejsce gratis.","C":"Wiek klienta nie decyduje o gratisie.","D":"Stały klient otrzymuje rabat, nie wolne miejsce.","tip":"Gratis w kalkulacji = pilot (czasem opiekun grupy)."}},{"n":37,"q":"Oblicz koszt wynajmu autokaru dla turystów, jeżeli autokar został wynajęty na dwa dni. W pierwszym dniu przejechał 250 km, w drugim 350 km. Ustalono cenę za km w wysokości 5 zł/km. Dodatkowo biuro pobrało prowizję w wysokości 10%.","o":{"A":"3850 zł","B":"3300 zł","C":"3030 zł","D":"3000 zł"},"a":"B","img":[7188,123],"e":{"A":"3850 zł – błąd w obliczeniach.","B":"Poprawna. (250 + 350) km × 5 zł = 3000 zł; prowizja 10% = 300 zł; razem 3300 zł.","C":"3030 zł – prowizja 1% zamiast 10%.","D":"3000 zł – bez prowizji.","tip":"Najpierw kilometry × stawka, potem prowizja."}},{"n":38,"q":"Na podstawie cennika usług w hotelu (nocleg osoby dorosłej 100 zł/doba, nocleg dziecka 40 zł/doba, śniadanie 10 zł/os.) oblicz, ile będzie wynosił koszt dwóch dób za świadczenie BB dla małżeństwa Nowaków z dzieckiem.","o":{"A":"270 zł","B":"300 zł","C":"520 zł","D":"540 zł"},"a":"D","ctx":1,"img":[7311,239],"e":{"A":"270 zł – koszt tylko jednej doby.","B":"300 zł – brak noclegu dziecka lub śniadań.","C":"520 zł – pominięto śniadanie dziecka.","D":"Poprawna. Jedna doba: 2×100 + 40 + 3×10 = 270 zł; dwie doby = 540 zł.","tip":"BB = nocleg + śniadanie dla każdej osoby."}},{"n":39,"q":"Oblicz koszt 5,5-godzinnej usługi przewodnickiej w języku hiszpańskim, jeżeli cena usługi do 4 godzin wynosi 450 zł, a za każdą następną rozpoczętą godzinę dodatkowo dolicza się 90 zł.","o":{"A":"540 zł","B":"595 zł","C":"630 zł","D":"695 zł"},"a":"C","img":[7550,92],"e":{"A":"540 zł – doliczono tylko jedną godzinę.","B":"595 zł – błędnie liczone pół godziny.","C":"Poprawna. 450 zł (4 h) + 2 rozpoczęte godziny (5. i 6.) × 90 zł = 630 zł.","D":"695 zł – błąd.","tip":"„Rozpoczęta godzina” – 1,5 h ponad limit = 2 godziny."}},{"n":40,"q":"Przedstawiony dokument (Dział I–IV: numer ewidencyjny, przedsiębiorca, organ dokonujący wpisu – Marszałek Woj. Kujawsko-Pomorskiego, typ gwarancji, wysokość sumy gwarancji) to","o":{"A":"wyciąg z konta bankowego wlaściciela biura podróży.","B":"polisa ubezpieczeniowa biura podróży ABC - TRAVEL.","C":"regulamin świadczenia usług turystycznych na rzecz klienta.","D":"wyciąg z Centralnej Ewidencji Organizatorów i Pośredników Turystycznych."},"a":"D","ctx":1,"img":[7642,747],"e":{"A":"Wyciąg bankowy zawiera operacje na rachunku.","B":"Polisa zawiera warunki ubezpieczenia, nie numer ewidencyjny i organ wpisu.","C":"Regulamin zawiera zasady, nie dane rejestrowe.","D":"Poprawna. Dokument zawiera numer ewidencyjny, organ wpisu (marszałek) i gwarancję – to wyciąg z Centralnej Ewidencji Organizatorów Turystyki i Pośredników.","tip":"Organizatorów wpisuje marszałek województwa (dziś: Turystyczny Rejestr)."}}],"2015-wrzesien":[{"n":1,"q":"Biuro podróży organizuje imprezę turystyczną „Neapol — 7 dni na plaży + 7 dni zwiedzania”. Jest to impreza","o":{"A":"fakultatywna.","B":"trampingowa.","C":"lokalno-pobytowa.","D":"pobytowo-objazdowa."},"a":"D","img":[0,92],"e":{"A":"Fakultatywna to dodatkowa, płatna wycieczka podczas pobytu.","B":"Tramping to tanie, samodzielne podróżowanie.","C":"Impreza lokalno-pobytowa odbywa się w jednym miejscu, bez części objazdowej.","D":"Poprawna. Łączy pobyt (7 dni na plaży) z objazdem (7 dni zwiedzania) – to impreza pobytowo-objazdowa.","tip":"Pobyt + zwiedzanie = pobytowo-objazdowa."}},{"n":2,"q":"Które usługi musi zarezerwować touroperator, przygotowując 3-dniową wycieczkę autokarową do Przemyśla?","o":{"A":"Noclegową i bankową.","B":"Żywieniową i handlową.","C":"Transportową i handlową.","D":"Transportową i noclegową."},"a":"D","img":[92,93],"e":{"A":"Usługi bankowe nie są elementem pakietu wycieczki.","B":"Usługi handlowe (skl
