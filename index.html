ultura kaszubska.","tip":"Etnografia = kultura ludowa = skansen.","long":"Szlak etnograficzny to szlak kultury ludowej – jak dawniej żyli ludzie na wsi. Na Kaszubach najważniejszy jest skansen we Wdzydzach Kiszewskich (Kaszubski Park Etnograficzny): stare chaty, wiatraki, kościół. Kórnik i Rogów to ogrody z roślinami, a Gniew to zamek, nie kultura ludowa."}},{"n":5,"q":"Oblicz długość w centymetrach odcinka między dwoma punktami na mapie w skali 1: 300 000, jeżeli w rzeczywistości odległość ta wynosi 24 km.","o":{"A":"1,8 cm","B":"7,2 cm","C":"8,0 cm","D":"8,8 cm"},"a":"C","img":[177,66],"e":{"A":"1,8 cm – błąd przeliczenia.","B":"7,2 cm – błąd przeliczenia.","C":"Poprawna. 24 km = 2 400 000 cm; 2 400 000 : 300 000 = 8,0 cm.","D":"8,8 cm – błąd przeliczenia.","tip":"km → cm: ×100 000, potem dzielimy przez mianownik skali.","long":"Skala 1 : 300 000 znaczy, że 1 cm na mapie to 300 000 cm w terenie. 300 000 cm to 3 km (bo 100 000 cm = 1 km). Czyli 1 cm na mapie = 3 km. Mamy 24 km, więc dzielimy: 24 : 3 = 8 cm. Prosty sposób: z mianownika skali skreśl 5 zer – wyjdzie, ile km jest w 1 cm."}},{"n":6,"q":"Walorami przyrodniczymi Warmii i Mazur są","o":{"A":"skały wapienne.","B":"ruchome wydmy.","C":"jeziora rynnowe.","D":"wąwozy lessowe."},"a":"C","img":[243,37],"e":{"A":"Skały wapienne – Jura Krakowsko-Częstochowska, Pieniny.","B":"Ruchome wydmy – Słowiński PN (Łeba).","C":"Poprawna. Mazury to jeziora polodowcowe, m.in. rynnowe – długie i wąskie (np. Nidzkie, Bełdany).","D":"Wąwozy lessowe – Kazimierz Dolny, Wyżyna Lubelska.","tip":"Mazury = jeziora rynnowe.","long":"Warmia i Mazury to „Kraina Tysiąca Jezior”. Jeziora rynnowe są długie i wąskie – powstały, gdy lodowiec wyżłobił w ziemi rynny. Skały wapienne są na Jurze, ruchome wydmy nad morzem (Łeba), a wąwozy lessowe w okolicach Kazimierza Dolnego. Mazury = jeziora."}},{"n":7,"q":"Walory przyrodnicze charakterystyczne dla Świętokrzyskiego Parku Narodowego to","o":{"A":"gołoborza.","B":"moreny.","C":"połoniny.","D":"jaskinie."},"a":"A","img":[280,37],"e":{"A":"Poprawna. Gołoborza – rumowiska skalne na Łysicy i Łysej Górze – symbol Świętokrzyskiego PN.","B":"Moreny – formy polodowcowe na niżu (Pojezierza).","C":"Połoniny – Bieszczady.","D":"Jaskinie – głównie Tatry, Jura.","tip":"Gołoborza = Góry Świętokrzyskie.","long":"Gołoborza to „morza kamieni” – zbocza pokryte rumowiskiem kamieni, na których nie rosną drzewa. Najbardziej znane są na Łysicy i Łysej Górze w Górach Świętokrzyskich. Klify są nad morzem, połoniny w Bieszczadach, a jeziora na Mazurach. Świętokrzyskie = gołoborza."}},{"n":8,"q":"Najwyższy szczyt w Beskidzie Żywieckim to","o":{"A":"Śnieżka.","B":"Turbacz.","C":"Trzy Korony.","D":"Babia Góra."},"a":"D","img":[317,37],"e":{"A":"Śnieżka – najwyższy szczyt Karkonoszy i Sudetów.","B":"Turbacz – najwyższy szczyt Gorców.","C":"Trzy Korony – Pieniny.","D":"Poprawna. Babia Góra (1725 m n.p.m.) – najwyższy szczyt Beskidu Żywieckiego, „Królowa Beskidów”.","tip":"Babia Góra = Beskid Żywiecki.","long":"Babia Góra (1725 m) to najwyższy szczyt Beskidu Żywieckiego, nazywana „Królową Beskidów”. Śnieżka jest w Karkonoszach, Turbacz w Gorcach, a Trzy Korony w Pieninach. Zapamiętaj pary: góry – najwyższy szczyt."}},{"n":9,"q":"W którym Parku Narodowym znajduje się rezerwat Błędne Skały?","o":{"A":"Roztoczańskim.","B":"Gór Stołowych.","C":"Karkonoskim.","D":"Ujścia Warty."},"a":"B","img":[354,37],"e":{"A":"Roztoczański PN – Zwierzyniec, konik polski.","B":"Poprawna. Błędne Skały i Szczeliniec Wielki – Park Narodowy Gór Stołowych.","C":"Karkonoski PN – Śnieżka.","D":"PN Ujście Warty – ptaki wodne.","tip":"Błędne Skały = Góry Stołowe.","long":"Błędne Skały to labirynt skalny – wąskie przejścia między wielkimi głazami. Leży w Górach Stołowych, czyli w Parku Narodowym Gór Stołowych (Sudety, okolice Kudowy-Zdroju). Karkonosze to Śnieżka, Roztocze – lasy i rzeki na wschodzie Polski, a Ujście Warty – rozlewiska i ptaki. Zapamiętaj parę: Błędne Skały – Góry Stołowe."}},{"n":10,"q":"Oblicz koszt wynajmu autokaru na jednego uczestnika, jeżeli koszt całkowity wynosi 2 438,00 złotych, a w wycieczce uczestniczy 48 osób, w tym 1 pilot wycieczek i 1 kierowca.","o":{"A":"50,79 zł","B":"51,87 zł","C":"53,00 zł","D":"54,00 zł"},"a":"C","img":[391,66],"e":{"A":"2 438 : 48 – błąd: kierowca i pilot nie płacą.","B":"2 438 : 47 – odjęto tylko jedną osobę.","C":"Poprawna. Płaci 48 − 2 = 46 uczestników: 2 438,00 : 46 = 53,00 zł.","D":"54,00 zł – błędny wynik.","tip":"Dzielimy przez płacących.","long":"Koszt autokaru dzielimy tylko na tych, którzy płacą. Pilot i kierowca nie płacą za autokar – jadą w pracy. Płacących jest więc 48 − 2 = 46 osób. Liczymy: 2438 : 46 = 53,00 zł. Gdybyśmy podzielili przez 48, wyszłoby 50,79 zł – to częsty błąd i zła odpowiedź."}},{"n":11,"q":"Klientowi chcącemu uprawiać rafting należy zapewnić","o":{"A":"balon.","B":"ponton.","C":"żaglówkę.","D":"motorówkę."},"a":"B","img":[457,37],"e":{"A":"Balon – baloniarstwo.","B":"Poprawna. Rafting to spływ pontonem po rwącej rzece górskiej.","C":"Żaglówka – żeglarstwo.","D":"Motorówka – narty wodne, przejażdżki.","tip":"Rafting = ponton.","long":"Rafting to spływ po rwącej górskiej rzece dużym, pompowanym pontonem. Do tego potrzebny jest ponton, kaski i kamizelki. Balon to lot, żaglówka i motorówka pływają po jeziorach. Rafting = ponton + rwąca rzeka."}},{"n":12,"q":"Turystom planującym wypoczynek na Wyżynie Krakowsko-Częstochowskiej należy zaproponować zwiedzanie","o":{"A":"Ojcowskiego Parku Narodowego.","B":"Magurskiego Parku Narodowego.","C":"Biebrzańskiego Parku Narodowego.","D":"Roztoczańskiego Parku Narodowego."},"a":"A","img":[494,211],"e":{"A":"Poprawna. Ojcowski PN leży na Wyżynie Krakowsko-Częstochowskiej (Maczuga Herkulesa, zamek w Pieskowej Skale).","B":"Magurski PN – Beskid Niski.","C":"Biebrzański PN – bagna nad Biebrzą (Podlasie).","D":"Roztoczański PN – Roztocze (lubelskie).","tip":"Jura = Ojcowski PN.","long":"Wyżyna Krakowsko-Częstochowska to Jura – białe skały wapienne, jaskinie i zamki na skałach (Orle Gniazda). Ojcowski Park Narodowy leży właśnie tam, blisko Krakowa (Maczuga Herkulesa, zamek w Pieskowej Skale). Magurski park jest w Beskidzie Niskim, Biebrzański na Podlasiu, a Roztoczański na Roztoczu."}},{"n":13,"q":"Który z wymienionych kosztów imprezy turystycznej zaliczany jest do kosztów stałych?","o":{"A":"Opłata klimatyczna.","B":"Ubezpieczenie NNW.","C":"Bilety wstępu do muzeum.","D":"Wynagrodzenie pilota wycieczek."},"a":"D","img":[705,183],"e":{"A":"Opłata klimatyczna – od osoby, więc zmienna.","B":"NNW – od osoby, zmienny.","C":"Bilety wstępu – od osoby, zmienne.","D":"Poprawna. Wynagrodzenie pilota jest takie samo bez względu na liczbę uczestników – koszt stały.","tip":"Stały = za grupę; zmienny = za osobę.","long":"Koszt stały to koszt, który jest taki sam bez względu na to, ile osób jedzie. Pilot dostaje jedną pensję za całą grupę – to koszt stały. Opłata klimatyczna, ubezpieczenie i bilety płaci się za każdą osobę, więc to koszty zmienne."}},{"n":14,"q":"Ile osób maksymalnie można łącznie zakwaterować w trzech pokojach typu double i dwóch pokojach typu twin?","o":{"A":"5 osób.","B":"7 osób.","C":"8 osób.","D":"10 osób."},"a":"D","img":[888,62],"e":{"A":"5 osób – to liczba pokoi, nie łóżek.","B":"7 osób – błąd.","C":"8 osób – błąd.","D":"Poprawna. Double = pokój 2-os. z łóżkiem małżeńskim, twin = 2-os. z dwoma łóżkami. 3×2 + 2×2 = 10 osób.","tip":"SGL=1, DBL=2, TWN=2, TPL=3.","long":"Pokój double i twin to oba pokoje dla 2 osób (double – jedno duże łóżko, twin – dwa osobne łóżka). Mamy 3 double + 2 twin = 5 pokoi po 2 osoby. Liczymy 5 × 2 = 10 osób."}},{"n":15,"q":"Który z wymienionych instrumentów marketingu zastosowało biuro turystyczne, umieszczając przy drodze billboard informujący o ofercie pobytu?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[950,66],"e":{"A":"Cena – rabaty, cenniki.","B":"Produkt – sama usługa i jej jakość.","C":"Poprawna. Billboard to reklama, czyli narzędzie promocji.","D":"Dystrybucja – kanały sprzedaży.","tip":"Reklama = promocja.","long":"Billboard to reklama, a reklama należy do promocji – czyli informowania klientów o ofercie. Cena to zniżki i cennik, produkt to sama oferta (pokoje, atrakcje), a dystrybucja to sposób sprzedaży."}},{"n":16,"q":"Które informacje musi zawierać zamówienie usług gastronomicznych w restauracji dla grupy turystów?","o":{"A":"Liczbę osób i godzinę posiłków.","B":"Strukturę grupy i usługi dodatkowe.","C":"Liczbę posiłków i świadczenia fakultatywne.","D":"Skład posiłków i atrakcje programu."},"a":"A","img":[1016,183],"e":{"A":"Poprawna. Restauracja musi wiedzieć, ile osób przyjdzie i o której godzinie podać posiłek.","B":"Struktura grupy i usługi dodatkowe – nie są obowiązkowe w zamówieniu posiłku.","C":"Świadczenia fakultatywne (dodatkowo płatne) nie dotyczą zamówienia posiłku.","D":"Atrakcje programu nie dotyczą restauracji.","tip":"Zamówienie posiłku: liczba osób, termin, godzina, rodzaj posiłku.","long":"Restauracja musi wiedzieć, ile osób przyjdzie i o której godzinie, żeby przygotować jedzenie i stoły. To podstawa zamówienia. Struktura grupy, atrakcje czy świadczenia fakultatywne nie są restauracji potrzebne."}},{"n":17,"q":"W czasie remontu właściciel gospodarstwa agroturystycznego zmienił wystrój jadalni. Jest to działanie w ramach strategii","o":{"A":"ceny.","B":"produktu.","C":"personelu.","D":"dystrybucji."},"a":"B","img":[1199,66],"e":{"A":"Cena – zmiana opłat.","B":"Poprawna. Zmiana wystroju to ulepszenie produktu.","C":"Personel – pracownicy.","D":"Dystrybucja – sprzedaż.","tip":"Wygląd obiektu = produkt.","long":"Wystrój jadalni to część tego, co gość dostaje i widzi – czyli produktu. Strategia produktu to ulepszanie oferty: remonty, nowe pokoje, nowe atrakcje, lepsze jedzenie. Cena to zniżki i cennik, dystrybucja to sposób sprzedaży (np. przez biuro, Internet), personel to pracownicy."}},{"n":18,"q":"Którego elementu nie zawiera umowa z biurem podróży z klientem na organizację imprezy turystycznej?","o":{"A":"Programu imprezy turystycznej.","B":"Opisu trasy wycieczki.","C":"Warunków zatrudnienia pilota.","D":"Nazwy organizatora turystyki."},"a":"C","img":[1265,183],"e":{"A":"Program jest elementem umowy.","B":"Opis trasy jest elementem umowy.","C":"Poprawna. Warunki zatrudnienia pilota to sprawa wewnętrzna biura (umowa zlecenia z pilotem), nie umowy z klientem.","D":"Nazwa organizatora musi być w umowie.","tip":"Umowa z klientem: organizator, termin, program, trasa, cena, świadczenia.","long":"W umowie z klientem jest program, trasa, nazwa organizatora, cena i termin. Warunki zatrudnienia pilota (jego pensja, umowa o pracę) to sprawa między biurem a pilotem – klienta to nie dotyczy, więc nie ma tego w umowie."}},{"n":19,"q":"Dokumentem potwierdzającym sprzedaż zorganizowanej imprezy turystycznej jest faktura","o":{"A":"zaliczkowa.","B":"do umowy o dzieło.","C":"procedura marży dla biur podroży.","D":"z wyszczególnieniem usług imprezy turystycznej."},"a":"C","img":[1448,37],"e":{"A":"Faktura zaliczkowa dokumentuje tylko wpłatę zaliczki.","B":"Umowa o dzieło nie dotyczy sprzedaży imprez.","C":"Poprawna. Sprzedaż imprezy turystycznej organizator dokumentuje fakturą VAT marża – procedura marży dla biur podróży.","D":"Faktura z wyszczególnieniem usług nie jest stosowana – w procedurze marży nie rozbija się kosztów.","tip":"Impreza turystyczna = faktura VAT marża.","long":"Biuro podróży, które sprzedaje imprezę turystyczną, płaci VAT tylko od swojego zarobku (marży). Dlatego na fakturze pisze „procedura marży dla biur podróży”. To jest dokument sprzedaży imprezy. Inne faktury dotyczą innych sytuacji."}},{"n":20,"q":"W programie imprezy turystycznej na Kurpiach, organizowanej przez gospodarstwo agroturystyczne, powinno się uwzględnić zwiedzanie","o":{"A":"planetarium w Olsztynie.","B":"arboretum w Bydgoszczy.","C":"ośrodka sztuki ludowej we wsi Łyse.","D":"skansenu budownictwa ludowego w Olsztynku."},"a":"C","img":[1485,212],"e":{"A":"Planetarium w Olsztynie – Warmia, nie Kurpie.","B":"Arboretum w Bydgoszczy – Kujawy.","C":"Poprawna. Łyse to wieś na Kurpiach (Puszcza Zielona) słynąca ze sztuki ludowej, wycinanek i Niedzieli Palmowej.","D":"Skansen w Olsztynku – Warmia i Mazury.","tip":"Kurpie: Łyse, Kadzidło, Nowogród.","long":"Kurpie to region w okolicach Ostrołęki, znany z kultury ludowej: wycinanek, palm wielkanocnych, strojów. Wieś Łyse to słynny ośrodek sztuki ludowej Kurpiów. Olsztyn i Olsztynek to Warmia i Mazury, a Bydgoszcz – Kujawy."}},{"n":21,"q":"W przypadku stwierdzenia na fakturze za usługi błędu rachunkowego","o":{"A":"nabywca sporządza notę księgową.","B":"nabywca sporządza fakturę końcową.","C":"sprzedawca sporządza notę korygującą.","D":"sprzedawca sporządza fakturę korygującą."},"a":"D","img":[1697,183],"e":{"A":"Nota księgowa nie poprawia faktury.","B":"Faktura końcowa rozlicza zaliczki.","C":"Nota korygująca wystawia NABYWCA i tylko do drobnych pomyłek (np. w danych), nie kwot.","D":"Poprawna. Błąd rachunkowy (w kwotach) poprawia sprzedawca, wystawiając fakturę korygującą.","tip":"Kwoty – faktura korygująca (sprzedawca); dane – nota korygująca (nabywca).","long":"Jeśli na fakturze jest błąd w liczeniu, sprzedawca (ten, kto wystawił fakturę) wystawia fakturę korygującą. Ona poprawia złą fakturę. Nota korygująca służy do poprawy drobnych pomyłek w danych (np. nazwisko), a nie w kwotach."}},{"n":22,"q":"Który dokument, oprócz egzemplarza podpisanej umowy, powinien otrzymać klient podczas sprzedaży imprezy turystycznej?","o":{"A":"Rezerwację pobytu.","B":"Warunki uczestnictwa.","C":"Umowę z usługodawcą.","D":"Potwierdzenie zamówienia."},"a":"B","img":[1880,206],"e":{"A":"Rezerwacja to etap przed umową.","B":"Poprawna. Warunki uczestnictwa (ogólne warunki umowy) są integralną częścią umowy i klient musi je otrzymać.","C":"Umowy biura z usługodawcami są wewnętrzne.","D":"Potwierdzenie zamówienia dotyczy usługodawców.","tip":"Klient dostaje: umowę + warunki uczestnictwa + program.","long":"Gdy klient kupuje wycieczkę, dostaje umowę i warunki uczestnictwa – czyli zasady: jak płacić, jak zrezygnować, co biuro zapewnia. Rezerwacje i umowy z hotelami to dokumenty biura, nie klienta."}},{"n":23,"q":"Oblicz kwotę marży biura podróży, jeżeli całkowity koszt świadczeń imprezy turystycznej wynosi 2 000,00 zł, a marża biura wynosi 12%.","o":{"A":"24,00 zł","B":"48,00 zł","C":"240,00 zł","D":"480,00 zł"},"a":"C","img":[2086,66],"e":{"A":"24 zł = 1,2% – błąd.","B":"48 zł – błąd.","C":"Poprawna. 12% z 2 000,00 zł = 2 000 × 0,12 = 240,00 zł.","D":"480 zł = 24% – błąd.","tip":"Marża = koszty × % marży.","long":"Marża to zarobek biura, liczony jako procent od kosztów. 12% z 2000 zł: 2000 × 0,12 = 240 zł. Łatwiej: 10% z 2000 to 200 zł, 1% to 20 zł, więc 12% = 200 + 40 = 240 zł."}},{"n":24,"q":"Którą informację pracownik biura podróży musi zapisać w umowie o udział w imprezie turystycznej?","o":{"A":"Miejsce zbiórki.","B":"Termin imprezy turystycznej.","C":"Dane adresowe przewoźnika.","D":"Imię i nazwisko pilota wycieczek."},"a":"B","img":[2152,182],"e":{"A":"Miejsce zbiórki zwykle jest w programie, ale nie jest obowiązkowym elementem z ustawy.","B":"Poprawna. Termin imprezy musi być w umowie.","C":"Dane przewoźnika nie są wymagane.","D":"Nazwisko pilota nie jest wymagane.","tip":"Umowa: kto, kiedy, gdzie, co, za ile.","long":"W umowie z klientem musi być termin imprezy – klient musi wiedzieć, od kiedy do kiedy jedzie. Imię pilota, adres przewoźnika czy godzina doby hotelowej nie są obowiązkowe (pilot może się jeszcze zmienić). Najważniejsze w umowie: kto organizuje, co jest w cenie, gdzie, kiedy i za ile."}},{"n":25,"q":"Integralną częścią umowy o organizację wycieczki jest","o":{"A":"ankieta satysfakcji klienta.","B":"program imprezy turystycznej.","C":"broszura reklamowa o biurze podróży.","D":"informator przewoźnika autokarowego."},"a":"B","img":[2334,183],"e":{"A":"Ankieta satysfakcji – po imprezie, nie część umowy.","B":"Poprawna. Program imprezy jest integralną częścią umowy.","C":"Broszura reklamowa – materiał promocyjny.","D":"Informator przewoźnika – nie jest częścią umowy.","tip":"Program = część umowy.","long":"Program imprezy jest częścią umowy – to w nim jest napisane, co dokładnie klient dostanie każdego dnia. Ankiety, broszury reklamowe i informatory przewoźnika nie są częścią umowy."}},{"n":26,"q":"Kto stanowi strony umowy agencyjnej, stosowanej w turystyce?","o":{"A":"Pilot wycieczek i klient.","B":"Klient i organizator turystyki.","C":"Organizator turystyki i agent turystyczny.","D":"Agent turystyczny i przewodnik turystyczny."},"a":"C","img":[2517,183],"e":{"A":"Pilot i klient nie zawierają umowy.","B":"Klient i organizator – umowa o udział w imprezie.","C":"Poprawna. Umowa agencyjna łączy organizatora turystyki z agentem, który sprzedaje jego imprezy za prowizję.","D":"Agent i przewodnik – brak takiej umowy.","tip":"Agencyjna = organizator + agent.","long":"Umowa agencyjna łączy organizatora turystyki (biuro, które tworzy wycieczki) z agentem (biurem, które je sprzedaje za prowizję). Agent sprzedaje „w imieniu” organizatora. Klient i pilot nie są stronami tej umowy."}},{"n":27,"q":"Który posiłek, jako pierwszy, przysługuje turystom korzystającym w pensjonacie z opcji pełnego wyżywienia, jeżeli kończą pobyt śniadaniem?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"A","img":[2700,66],"e":{"A":"Poprawna. Przy FB (pełne wyżywienie) liczba posiłków się równoważy: skoro pobyt kończy się śniadaniem, to zaczyna się od obiadu.","B":"Kolacja byłaby pierwszym posiłkiem przy HB kończącym się śniadaniem? Nie – w FB zaczyna się od obiadu.","C":"Śniadanie podaje się dopiero po pierwszym noclegu.","D":"Obiadokolacja dotyczy HB.","tip":"FB: start obiadem → koniec śniadaniem; HB: start obiadokolacją → koniec śniadaniem.","long":"Pobyt z pełnym wyżywieniem ma tyle samo posiłków każdego rodzaju. Jeśli ostatni posiłek to śniadanie (w dniu wyjazdu), to pierwszy musi być obiad w dniu przyjazdu – wtedy liczba obiadów, kolacji i śniadań się zgadza. To ważne przy liczeniu posiłków w kalkulacji."}},{"n":28,"q":"Który dokument może przesłać pracownik biura podróży do hotelu celem usprawnienia zakwaterowania grupy?","o":{"A":"Zapytanie ofertowe.","B":"Umowę allotmentu.","C":"Listę paszportową.","D":"Listę uczestników."},"a":"D","img":[2766,212],"e":{"A":"Zapytanie ofertowe wysyła się przed rezerwacją.","B":"Umowa allotmentu dotyczy puli miejsc na dłuższy okres.","C":"Lista paszportowa – do granicy/przewoźnika.","D":"Poprawna. Lista uczestników (z rozmieszczeniem – rooming list) usprawnia zakwaterowanie.","tip":"Do hotelu – lista uczestników / rooming list.","long":"Lista uczestników pozwala hotelowi przygotować pokoje i szybko zameldować grupę – ma imiona, nazwiska, często podział na pokoje. Zapytanie ofertowe wysyła się przed rezerwacją, umowa allotmentu to umowa o pulę pokoi, a lista paszportowa jest na granicę."}},{"n":29,"q":"Oblicz koszt trzech noclegów 15-osobowej grupy turystów w pokojach typu TPL, jeżeli cena pokoju za dobę wynosi 150,00 zł.","o":{"A":"1 350,00 zł","B":"1 500,00 zł","C":"2 250,00 zł","D":"3 000,00 zł"},"a":"C","img":[2978,66],"e":{"A":"1 350 zł – błąd.","B":"1 500 zł – błąd.","C":"Poprawna. TPL = pokój 3-os. 15 : 3 = 5 pokoi × 150,00 zł × 3 noce = 2 250,00 zł.","D":"3 000 zł – błąd.","tip":"TPL = triple = 3 osoby.","long":"TPL (triple) to pokój 3-osobowy. Grupa ma 15 osób, więc potrzeba 15 : 3 = 5 pokoi. Cena 150 zł jest za pokój, a nie za osobę. Liczymy: 5 pokoi × 150 zł × 3 noce = 2250 zł."}},{"n":30,"q":"Które z wymienionych muzeów powinno być uwzględnione w programie imprezy dla turystów zainteresowanych batalistyką?","o":{"A":"Muzeum Tyskie Browary Książęce.","B":"Miejskie Muzeum Zabawek w Karpaczu.","C":"Narodowe Muzeum Morskie w Gdańsku.","D":"Muzeum Bitwy pod Grunwaldem w Stębarku."},"a":"D","img":[3044,212],"e":{"A":"Muzeum browaru – piwowarstwo.","B":"Muzeum Zabawek – dla dzieci.","C":"Muzeum Morskie – historia żeglugi.","D":"Poprawna. Batalistyka = sztuka przedstawiania bitew. Muzeum Bitwy pod Grunwaldem (1410) w Stębarku.","tip":"Batalistyka = bitwy.","long":"Batalistyka to wszystko, co dotyczy bitew i wojen. Muzeum Bitwy pod Grunwaldem w Stębarku pokazuje słynną bitwę z 1410 roku. Browar, muzeum zabawek i muzeum morskie nie dotyczą bitew."}},{"n":31,"q":"Do której miejscowości w Beskidzie Śląskim zabierze pilot wycieczek grupę turystów, chcąc pokazać im regionalne wyroby koronkarskie?","o":{"A":"Do Wisły.","B":"Do Ustronia.","C":"Do Szczyrku.","D":"Do Koniakowa."},"a":"D","img":[3256,66],"e":{"A":"Wisła – skocznie, Zameczek Prezydenta.","B":"Ustroń – uzdrowisko.","C":"Szczyrk – narciarstwo.","D":"Poprawna. Koniaków słynie z koronek koniakowskich (szydełkowych).","tip":"Koronki = Koniaków.","long":"Koniaków w Beskidzie Śląskim słynie z koronek – ręcznie robionych serwetek i ozdób. To ich znak rozpoznawczy. Wisła, Ustroń i Szczyrk są znane z turystyki i narciarstwa, a nie z koronek."}},{"n":32,"q":"Folder promujący uzdrowiska Kotliny Kłodzkiej powinien zawierać informacje o sanatoriach zlokalizowanych","o":{"A":"w Szczawnicy i Polańczyku.","B":"w Ciechocinku i Inowrocławiu.","C":"w Solcu-Zdroju i Busku-Zdroju.","D":"w Lądku-Zdroju i Polanicy-Zdroju."},"a":"D","img":[3322,182],"e":{"A":"Szczawnica – Pieniny; Polańczyk – Bieszczady.","B":"Ciechocinek, Inowrocław – Kujawy.","C":"Solec, Busko – Ponidzie.","D":"Poprawna. Lądek-Zdrój i Polanica-Zdrój – Kotlina Kłodzka.","tip":"Kotlina Kłodzka: Polanica, Duszniki, Kudowa, Lądek.","long":"Kotlina Kłodzka leży w Sudetach i ma dużo uzdrowisk: Lądek-Zdrój, Polanica-Zdrój, Kudowa-Zdrój, Duszniki-Zdrój. Szczawnica i Muszyna są w Małopolsce, Ciechocinek i Inowrocław na Kujawach, a Solec i Busko w świętokrzyskim."}},{"n":33,"q":"Który dokument teczki pilota wycieczek potwierdza wykupienie usług w hotelu?","o":{"A":"Lista roomingowa.","B":"Faktura proforma.","C":"Eurolista.","D":"Voucher."},"a":"D","img":[3504,178],"e":{"A":"Rooming lista – podział na pokoje.","B":"Faktura proforma – oferta przed zapłatą.","C":"Eurolista – lista uczestników dla przewoźnika/granicy.","D":"Poprawna. Voucher potwierdza wykupienie usług i jest podstawą do ich realizacji.","tip":"Voucher = opłacona usługa.","long":"Voucher to dokument, który potwierdza, że usługi w hotelu są już opłacone. Pilot pokazuje go w hotelu. Lista roomingowa to podział gości na pokoje, faktura proforma to dokument przed zapłatą, a eurolista dotyczy przekraczania granicy."}},{"n":34,"q":"Oblicz całkowitą cenę krajowej imprezy turystycznej, jeżeli suma kosztów świadczeń wynosi 6 980,00 zł, a zakładana marża biura podróży bez podatku VAT wynosi 18% sumy kosztów świadczeń.","o":{"A":"7 268,97 zł","B":"8 236,40 zł","C":"8 525,37 zł","D":"8 585,40 zł"},"a":"C","img":[3682,66],"e":{"A":"7 268,97 zł – błąd.","B":"8 236,40 zł – brak VAT.","C":"Poprawna. Marża 18% = 1 256,40 zł; VAT 23% od marży = 288,97 zł; cena = 6 980 + 1 256,40 + 288,97 = 8 525,37 zł.","D":"8 585,40 zł – błąd.","tip":"Cena = koszty + marża + VAT od marży.","long":"Cena imprezy = koszty + marża + VAT (23% liczony tylko od marży). Marża: 6980 × 18% = 1256,40 zł. VAT: 1256,40 × 23% = 288,97 zł. Razem: 6980 + 1256,40 + 288,97 = 8525,37 zł."}},{"n":35,"q":"Kosztem zmiennym jest należność za usługę","o":{"A":"transportową zakupioną w czarterze.","B":"przewodnictwa turystycznego.","C":"wyżywienia uczestników.","D":"pilotażu wycieczek."},"a":"C","img":[3748,183],"e":{"A":"Czarter (wynajem całego środka transportu) – koszt stały.","B":"Przewodnik – stały.","C":"Poprawna. Wyżywienie liczy się od osoby – koszt zmienny.","D":"Pilot – stały.","tip":"Zmienny = od osoby.","long":"Koszt zmienny rośnie, gdy rośnie liczba osób. Jedzenie zamawia się dla każdego uczestnika, więc to koszt zmienny. Czarter, przewodnik i pilot kosztują tyle samo dla całej grupy – to koszty stałe."}},{"n":36,"q":"Dowód KP jest stosowany do potwierdzenia","o":{"A":"wpłaty przelewem.","B":"wpłaty gotówkowej.","C":"wypłaty gotówkowej.","D":"wypłaty wynagrodzenia."},"a":"B","img":[3931,183],"e":{"A":"Przelew potwierdza wyciąg bankowy.","B":"Poprawna. KP (Kasa Przyjmie) potwierdza wpłatę gotówki do kasy.","C":"Wypłata gotówki – KW (Kasa Wypłaci).","D":"Wypłata wynagrodzenia – lista płac/KW.","tip":"KP = przyjęcie, KW = wypłata.","long":"KP = „Kasa Przyjmie”. To dowód, że ktoś wpłacił gotówkę do kasy. Przelew przechodzi przez bank, a wypłaty gotówki dokumentuje KW („Kasa Wyda”)."}},{"n":37,"q":"Jaką kwotę podatku VAT należy uwzględnić w kalkulacji usług noclegowych, jeżeli dla 20 osób zarezerwowano 2-osobowe pokoje na jedną dobę, a cena bez podatku VAT za pokój 2-osobowy wynosi 120,00 zł za dobę, a stawka VAT 8%?","o":{"A":"84,00 zł","B":"96,00 zł","C":"106,00 zł","D":"124,00 zł"},"a":"B","img":[4114,95],"e":{"A":"84 zł – błąd.","B":"Poprawna. 20 osób = 10 pokoi 2-os. × 120,00 = 1 200,00 zł netto; VAT 8% = 96,00 zł.","C":"106 zł – błąd.","D":"124 zł – błąd.","tip":"Usługi noclegowe: VAT 8%.","long":"20 osób w pokojach 2-osobowych to 10 pokoi. Cena netto: 10 × 120 zł = 1200 zł. VAT 8% z 1200 zł: 1200 × 0,08 = 96 zł. Pytają tylko o podatek, nie o całość."}},{"n":38,"q":"Który dokument sporządza pracownik biura podróży, ostatecznie dokonując rozliczenia imprezy turystycznej?","o":{"A":"Tabelę wpływów.","B":"Kartę rozliczeniową.","C":"Rachunek zysków i strat.","D":"Zestawienie wpływów i kosztów."},"a":"B","img":[4209,183],"e":{"A":"Tabela wpływów to tylko część danych.","B":"Poprawna. Karta rozliczeniowa imprezy porównuje koszty i przychody po zakończeniu imprezy.","C":"Rachunek zysków i strat – dla całej firmy, za rok.","D":"Zestawienie wpływów i kosztów – pomocnicze.","tip":"Rozliczenie imprezy = karta rozliczeniowa.","long":"Po imprezie biuro robi kartę rozliczeniową – pokazuje w niej wszystkie wpływy (wpłaty klientów) i wszystkie wydatki, i sprawdza, czy zarobiło. To końcowe rozliczenie imprezy."}},{"n":39,"q":"Oblicz koszt noclegu małżeństwa z dzieckiem, w pensjonacie w pokoju 2-osobowym z dostawką, przez 3 doby, jeżeli cena brutto pokoju wynosi 500,00 zł/doba, a dostawki 150,00 zł/doba.","o":{"A":"650,00 zł","B":"1 300,00 zł","C":"1 500,00 zł","D":"1 950,00 zł"},"a":"D","img":[4392,66],"e":{"A":"650 zł – za 1 dobę.","B":"1 300 zł – za 2 doby.","C":"1 500 zł – bez dostawki.","D":"Poprawna. (500,00 + 150,00) × 3 doby = 1 950,00 zł.","tip":"Dostawka = dodatkowe łóżko, płatne za dobę.","long":"Płacimy za pokój i za dostawkę (dodatkowe łóżko dla dziecka). Jedna doba: 500 + 150 = 650 zł. Trzy doby: 650 × 3 = 1950 zł. Pułapka: 650 zł to tylko jedna doba."}},{"n":40,"q":"Oblicz cenę całkowitą wycieczki, jeżeli suma kosztów świadczeń to 27 500,00 zł, a zakładana marża bez podatku VAT stanowi 8% kosztów świadczeń.","o":{"A":"28 006,00 zł","B":"29 700,00 zł","C":"30 206,00 zł","D":"36 531,00 zł"},"a":"C","img":[4458,210],"e":{"A":"28 006 zł – błąd.","B":"29 700 zł – bez VAT.","C":"Poprawna. Marża 8% = 2 200,00 zł; VAT 23% = 506,00 zł; cena = 27 500 + 2 200 + 506 = 30 206,00 zł.","D":"36 531 zł – błąd.","tip":"Cena = koszty + marża + 23% marży.","long":"Cena = koszty + marża + VAT od marży. Marża: 27 500 × 8% = 2200 zł. VAT: 2200 × 23% = 506 zł. Razem: 27 500 + 2200 + 506 = 30 206 zł."}}],"2022-czerwiec":[{"n":1,"q":"Który rodzaj turystyki uprawiają osoby zainteresowane walorami przyrodniczymi?","o":{"A":"Ekoturystykę.","B":"Lipoturystykę.","C":"Fanoturystykę.","D":"Tanatoturystykę."},"a":"A","img":[0,44],"e":{"A":"Poprawna. Ekoturystyka to podróże do miejsc o cennej przyrodzie, z poszanowaniem środowiska (parki narodowe, obserwacja ptaków).","B":"Lipoturystyka (liposukcja) – wyjazdy na zabiegi chirurgii plastycznej; odmiana turystyki medycznej.","C":"Fanoturystyka – wyjazdy kibiców na wydarzenia sportowe lub koncerty idoli.","D":"Tanatoturystyka – odwiedzanie miejsc związanych ze śmiercią (cmentarze, obozy zagłady).","tip":"Eko = przyroda; tanato = śmierć; fano = kibice; lipo = zabiegi.","long":"Ekoturystyka to wyjazdy, żeby podziwiać przyrodę i jej nie niszczyć: parki narodowe, rezerwaty, obserwowanie ptaków i zwierząt. Lipoturystyka to wyjazdy np. na kuracje odchudzające, fanoturystyka – na mecze i koncerty (kibice), a tanatoturystyka – do miejsc związanych ze śmiercią (np. obozy, cmentarze). Przyroda = eko."}},{"n":2,"q":"Eksploracja jaskiń jest elementem turystyki","o":{"A":"wiejskiej.","B":"kulturowej.","C":"specjalistycznej.","D":"wypoczynkowej."},"a":"C","img":[44,43],"e":{"A":"Turystyka wiejska – pobyt na wsi, agroturystyka.","B":"Turystyka kulturowa – zabytki, muzea, tradycje.","C":"Poprawna. Turystyka specjalistyczna (kwalifikowana) wymaga umiejętności i sprzętu – np. speleologia, czyli eksploracja jaskiń.","D":"Turystyka wypoczynkowa – regeneracja sił bez wysiłku.","tip":"Speleologia = turystyka specjalistyczna/kwalifikowana.","long":"Zwiedzanie jaskiń wymaga sprzętu (kask, latarka, liny) i umiejętności, więc to turystyka specjalistyczna, czyli inaczej kwalifikowana. Nie da się tego robić „z marszu”, jak spaceru. Wiejska to odpoczynek na wsi, kulturowa – muzea i zabytki, wypoczynkowa – relaks. Sprzęt + umiejętności = specjalistyczna (kwalifikowana)."}},{"n":3,"q":"Jeżeli w zamówieniu na imprezę turystyczną klient zamawia wyżywienie FB, to oczekuje","o":{"A":"śniadania, obiadu i kolacji.","B":"śniadania, obiadu i obiadokolacji.","C":"śniadania, obiadu i podwieczorku.","D":"śniadania, brunchu i obiadokolacji."},"a":"A","img":[87,111],"e":{"A":"Poprawna. FB (Full Board) – pełne wyżywienie: śniadanie, obiad i kolacja.","B":"Obiadokolacja występuje przy HB (Half Board) – zamiast obiadu i kolacji.","C":"Podwieczorek nie jest elementem standardu FB.","D":"Brunch (późne śniadanie) nie należy do FB.","tip":"FB = 3 posiłki; HB = śniadanie + obiadokolacja.","long":"FB (Full Board) znaczy pełne wyżywienie: trzy posiłki – śniadanie, obiad i kolacja. Obiadokolacja pojawia się przy HB (dwa posiłki), a brunch i podwieczorek to nie są standardowe posiłki w taryfach. FB = 3 posiłki."}},{"n":4,"q":"W programie wycieczki dla turysty uprawiającego trekking należy uwzględnić","o":{"A":"pobyt na plaży.","B":"spacer w parku.","C":"wędrówkę w górach.","D":"pływanie po jeziorach."},"a":"C","img":[198,51],"e":{"A":"Plaża – wypoczynek, nie trekking.","B":"Spacer w parku – rekreacja miejska.","C":"Poprawna. Trekking to wędrówka piesza po górach i trudnym terenie.","D":"Pływanie po jeziorach – turystyka wodna.","tip":"Trekking = wędrówka w górach.","long":"Trekking to kilkudniowe piesze wędrówki, zwykle po górach i bezdrożach, z plecakiem. Rower, narty i pływanie to inne formy aktywności. Jeśli w pytaniu pojawia się słowo „trekking” – szukaj odpowiedzi o chodzeniu pieszo po górach."}},{"n":5,"q":"Oblicz długość w centymetrach odcinka między dwoma punktami na mapie w skali 1: 300 000, jeżeli w rzeczywistości odległość ta wynosi 24 km.","o":{"A":"1,8 cm","B":"7,2 cm","C":"8,0 cm","D":"8,8 cm"},"a":"C","img":[249,72],"e":{"A":"1,8 cm – błąd przeliczenia.","B":"7,2 cm – błąd przeliczenia.","C":"Poprawna. 24 km = 2 400 000 cm; 2 400 000 : 300 000 = 8,0 cm.","D":"8,8 cm – błąd przeliczenia.","tip":"km → cm: ×100 000, potem dzielimy przez mianownik skali.","long":"Skala 1 : 300 000 znaczy, że 1 cm na mapie to 300 000 cm w terenie. 300 000 cm to 3 km (bo 100 000 cm = 1 km). Czyli 1 cm na mapie = 3 km. Mamy 24 km, więc dzielimy: 24 : 3 = 8 cm. Prosty sposób: z mianownika skali skreśl 5 zer – wyjdzie, ile km jest w 1 cm."}},{"n":6,"q":"Na podstawie danych przedstawionych w tabeli, oblicz odległość, którą przejedzie autokar na trasie Konin – Rychwał – Kalisz.","o":{"A":"23,0 km","B":"57,5 km","C":"69,0 km","D":"80,5 km"},"a":"B","ctx":"Tabela odległości (fragment) Odległość (cm) na mapie w skali 1 : 1 150 000 2,0 3,0 4,0","pic":1,"img":[321,252],"e":{"A":"23 km – policzono 2 cm × 11,5 km.","B":"Poprawna. Konin–Rychwał 2,0 cm + Rychwał–Kalisz 3,0 cm = 5,0 cm. Skala 1:1 150 000 → 1 cm = 11,5 km. 5 × 11,5 = 57,5 km.","C":"69 km = 6 cm × 11,5 – złe odcinki.","D":"80,5 km = 7 cm – dodano odcinek Kalisz–Sieradz.","tip":"Mianownik skali : 100 000 = ile km w 1 cm.","long":"Skala 1 : 1 150 000 znaczy, że 1 cm na mapie to 1 150 000 cm, czyli 11,5 km. Trasa Konin – Rychwał to 2 cm, a Rychwał – Kalisz to 3 cm, razem 5 cm. Liczymy: 5 × 11,5 km = 57,5 km. Trasy Kalisz – Sieradz nie liczymy, bo jej nie ma w pytaniu."}},{"n":7,"q":"W którym mieście odbywa się Oktoberfest, czyli niemieckie dożynki chmielne, święto piwa, jeden z największych na świecie festynów ludowych?","o":{"A":"W Bonn.","B":"W Berlinie.","C":"W Hamburgu.","D":"W Monachium."},"a":"D","img":[573,80],"e":{"A":"Bonn – dawna stolica RFN.","B":"Berlin – stolica Niemiec, ale nie Oktoberfest.","C":"Hamburg – port, Reeperbahn.","D":"Poprawna. Oktoberfest odbywa się w Monachium (Bawaria) od 1810 r.","tip":"Oktoberfest = Monachium.","long":"Oktoberfest to wielkie święto piwa, które co roku odbywa się w Monachium (Bawaria, południe Niemiec). Bonn, Berlin i Hamburg to inne niemieckie miasta. Zapamiętaj: Oktoberfest = Monachium."}},{"n":8,"q":"W którym parku narodowym znajdują się gołoborza i Puszcza Jodłowa?","o":{"A":"W Ojcowskim.","B":"W Gorczańskim.","C":"W Bieszczadzkim.","D":"W Świętokrzyskim."},"a":"D","img":[653,121],"e":{"A":"Ojcowski PN – skałki wapienne, jaskinie.","B":"Gorczański PN – Gorce, Turbacz.","C":"Bieszczadzki PN – połoniny.","D":"Poprawna. Świętokrzyski PN – gołoborza na Łysogórach i Puszcza Jodłowa (z „Puszczy Jodłowej” Żeromskiego).","tip":"Gołoborza + Puszcza Jodłowa = Świętokrzyski PN.","long":"Gołoborza (rumowiska kamieni) i Puszcza Jodłowa (las z jodłami, opisany przez Żeromskiego) to symbole Świętokrzyskiego Parku Narodowego, w Górach Świętokrzyskich. Ojcowski ma skały wapienne, Gorczański – polany w Gorcach, a Bieszczadzki – połoniny."}},{"n":9,"q":"Muzeum Hymnu Narodowego w Będominie oraz Centrum Edukacji i Promocji Regionu w Szymbarku to atrakcje turystyczne, które należy uwzględnić w programie wycieczki na","o":{"A":"Kurpie.","B":"Mazury.","C":"Podhale.","D":"Kaszuby."},"a":"D","img":[774,72],"e":{"A":"Kurpie – Łyse, Nowogród.","B":"Mazury – jeziora.","C":"Podhale – Zakopane, góralszczyzna.","D":"Poprawna. Będomin (dworek Wybickiego, autora hymnu) i Szymbark (dom do góry nogami) leżą na Kaszubach.","tip":"Szymbark, Będomin, Kartuzy, Wdzydze = Kaszuby.","long":"Będomin (Muzeum Hymnu Narodowego – tu urodził się Józef Wybicki, autor słów hymnu) i Szymbark (dom do góry nogami, najdłuższa deska) leżą na Kaszubach, niedaleko Kartuz. Kurpie są koło Ostrołęki, Mazury to jeziora, a Podhale – okolice Zakopanego."}},{"n":10,"q":"Którą z wymienionych tras należy uwzględnić w programie wycieczki krajoznawczej po obiektach renesansowych Polski?","o":{"A":"Kraków – Tarnów – Krasiczyn – Zamość – Lublin.","B":"Ustroń – Rabka – Krościenko – Krynica – Iwonicz.","C":"Poznań – Ostrów Lednicki – Gniezno – Żnin – Biskupin.","D":"Mirów – Ojców – Pieskowa Skała – Olsztyn – Częstochowa."},"a":"A","img":[846,234],"e":{"A":"Poprawna. Kraków (Wawel – arkadowy dziedziniec), Tarnów (ratusz), Krasiczyn (zamek), Zamość (idealne miasto renesansu), Lublin – szlak renesansu.","B":"Ustroń, Rabka, Krynica, Iwonicz – uzdrowiska.","C":"Poznań, Gniezno, Ostrów Lednicki, Biskupin – Szlak Piastowski.","D":"Mirów, Ojców, Pieskowa Skała, Olsztyn – Szlak Orlich Gniazd.","tip":"Zamość + Krasiczyn = renesans.","long":"Renesans to styl z XVI wieku: arkady, attyki, krużganki. Trasa A ma najważniejsze renesansowe miejsca: Kraków (Wawel, Sukiennice), Tarnów (ratusz), Krasiczyn (zamek), Zamość (całe miasto renesansowe) i Lublin. Trasa B to uzdrowiska, C – początki Polski, D – Jura i zamki obronne."}},{"n":11,"q":"W programie wycieczki szkolnej dla młodzieży, która chce poznać historię początków państwa polskiego, należy uwzględnić:","o":{"A":"Sokółkę, Bohoniki, Kruszyniany.","B":"Szymbark, Kartuzy, Kościerzynę.","C":"Komańczę, Cisną, Ustrzyki Dolne.","D":"Ostrów Lednicki, Gniezno, Poznań."},"a":"D","img":[1080,197],"e":{"A":"Bohoniki, Kruszyniany – meczety Tatarów polskich (Podlasie).","B":"Szymbark, Kartuzy, Kościerzyna – Kaszuby.","C":"Komańcza, Cisna – Bieszczady.","D":"Poprawna. Ostrów Lednicki, Gniezno, Poznań – Szlak Piastowski, kolebka państwa polskiego (chrzest 966).","tip":"Początki państwa = Szlak Piastowski.","long":"Początki państwa polskiego to czasy Mieszka I i Bolesława Chrobrego. Ostrów Lednicki (gród, chrzest Polski), Gniezno (pierwsza stolica, katedra) i Poznań (Ostrów Tumski) to Szlak Piastowski. Inne trasy dotyczą Tatarów, Kaszub i Bieszczadów."}},{"n":12,"q":"Oblicz cenę jednostkową transportu autokarowego, jeżeli w wyjeździe uczestniczyło 48 osób, w tym pilot wycieczek i kierowca, a za usługę zapłacono 2 438,00 zł.","o":{"A":"50,79 zł","B":"51,87 zł","C":"53,00 zł","D":"54,00 zł"},"a":"C","img":[1277,73],"e":{"A":"50,79 zł = 2 438 : 48 – błąd: pilot i kierowca nie płacą.","B":"51,87 zł = 2 438 : 47 – błąd: odjęto tylko jedną osobę.","C":"Poprawna. Płacą tylko uczestnicy: 48 − 1 pilot − 1 kierowca = 46 osób. 2 438,00 : 46 = 53,00 zł.","D":"54,00 zł – zawyżony wynik.","tip":"Koszt dzielimy zawsze przez liczbę PŁACĄCYCH uczestników.","long":"Koszt autokaru dzielimy tylko na tych, którzy płacą. Pilot i kierowca nie płacą za autokar – jadą w pracy. Płacących jest więc 48 − 2 = 46 osób. Liczymy: 2438 : 46 = 53,00 zł. Gdybyśmy podzielili przez 48, wyszłoby 50,79 zł – to częsty błąd i zła odpowiedź."}},{"n":13,"q":"Oblicz koszt ubezpieczenia NNW dla 40-osobowej grupy uczniów, 4 opiekunów z których jeden zgodnie z posiadanymi uprawnieniami będzie również pełnił funkcję pilota oraz kierowcy na 2-dniowej wycieczce, jeżeli stawka ubezpieczenia wynosi 5,00 zł/dzień/os.","o":{"A":"400,00 zł","B":"440,00 zł","C":"450,00 zł","D":"460,00 zł"},"a":"B","img":[1350,249],"e":{"A":"400 zł – pominięto opiekunów.","B":"Poprawna. Ubezpieczamy 40 uczniów + 4 opiekunów (jeden z nich jest jednocześnie pilotem) = 44 osoby. Kierowca jest ubezpieczony przez przewoźnika. 44 × 5,00 × 2 dni = 440,00 zł.","C":"450 zł – błąd.","D":"460 zł – dodano kierowcę i drugą osobę.","tip":"NNW: osoby × stawka × dni; kierowcy nie wliczamy.","long":"Ubezpieczamy 40 uczniów i 4 opiekunów – razem 44 osoby (jeden opiekun jest też pilotem, ale to ta sama osoba, nie liczymy go dwa razy). Kierowcy biuro nie ubezpiecza – ma ubezpieczenie od przewoźnika. Liczymy: 44 osoby × 2 dni × 5 zł = 440 zł."}},{"n":14,"q":"Rezerwując usługi przewodnika turystycznego, pracownik biura podróży powinien pamiętać o przekazaniu informacji dotyczącej przede wszystkim","o":{"A":"kontaktu do kierowcy.","B":"miejsca spotkania z grupą.","C":"wykształcenia uczestników.","D":"znaków rozpoznawczych autokaru."},"a":"B","img":[1599,38],"e":{"A":"Kontakt do kierowcy nie jest kluczowy dla przewodnika.","B":"Poprawna. Przewodnik musi wiedzieć, gdzie i o której spotkać grupę.","C":"Wykształcenie uczestników nie jest wymagane.","D":"Znaki autokaru są pomocnicze.","tip":"Zamówienie przewodnika: data, godzina, miejsce spotkania, czas, trasa, liczba osób.","long":"Przewodnik musi wiedzieć, gdzie i o której ma spotkać grupę – inaczej się nie spotkają. Wykształcenie uczestników czy wygląd autokaru są mniej ważne, a kontakt do kierowcy nie jest przewodnikowi potrzebny."}},{"n":15,"q":"Który dokument, stosowany podczas przygotowania imprezy turystycznej, zawiera przedstawione informacje?","o":{"A":"Zamówienie noclegów.","B":"Rezerwacja sali konferencyjnej.","C":"Potwierdzenie zamówienia obiadów.","D":"Anulowanie zamówienia biletów do teatru."},"a":"B","ctx":"– wskazanie dat i godzin świadczenia – określenie teatralnego układu krzeseł – zapytanie o termin i warunki płatności","img":[1637,356],"e":{"A":"Zamówienie noclegów nie dotyczy układu krzeseł.","B":"Poprawna. Teatralny układ krzeseł (rzędy przodem do sceny) ustala się przy rezerwacji sali konferencyjnej.","C":"Potwierdzenie obiadów nie zawiera układu sali.","D":"Anulowanie biletów nie zawiera pytań o płatność.","tip":"Ustawienia sali: teatralne, szkolne, bankietowe, podkowa.","long":"Teatralny układ krzeseł to ustawienie krzeseł w rzędach, jak w teatrze – tak ustawia się salę na konferencję czy wykład. Do tego daty, godziny i warunki płatności – to typowa rezerwacja sali konferencyjnej. Noclegi i obiady nie potrzebują ustawienia krzeseł."}},{"n":16,"q":"Który instrument marketingu zastosował właściciel gospodarstwa agroturystycznego, umieszczając na billboardzie informację o ofercie wczasów?","o":{"A":"Dystrybucję.","B":"Promocję.","C":"Personel.","D":"Produkt."},"a":"B","img":[1993,194],"e":{"A":"Dystrybucja – sprzedaż.","B":"Poprawna. Billboard = reklama = promocja.","C":"Personel – pracownicy.","D":"Produkt – sama usługa.","tip":"Reklama = promocja.","long":"Billboard to reklama, a reklama należy do promocji – czyli informowania klientów o ofercie. Cena to zniżki i cennik, produkt to sama oferta (pokoje, atrakcje), a dystrybucja to sposób sprzedaży."}},{"n":17,"q":"W czasie remontu właściciel gospodarstwa agroturystycznego zmienił wystrój jadalni. Jest to działanie w ramach strategii","o":{"A":"ceny.","B":"produktu.","C":"personelu.","D":"dystrybucji."},"a":"B","img":[2187,73],"e":{"A":"Cena – zmiana wysokości opłat, rabaty.","B":"Poprawna. Zmiana wystroju jadalni to ulepszenie samej usługi, czyli strategia produktu.","C":"Personel – szkolenia, zatrudnianie, stroje pracowników.","D":"Dystrybucja – kanały sprzedaży (internet, biura).","tip":"Wygląd i wyposażenie obiektu = produkt.","long":"Wystrój jadalni to część tego, co gość dostaje i widzi – czyli produktu. Strategia produktu to ulepszanie oferty: remonty, nowe pokoje, nowe atrakcje, lepsze jedzenie. Cena to zniżki i cennik, dystrybucja to sposób sprzedaży (np. przez biuro, Internet), personel to pracownicy."}},{"n":18,"q":"Właściciel gospodarstwa agroturystycznego obniżając o 20% cenę za 5 noclegów dla 6-osobowej rodziny, którą gościł po raz pierwszy, zastosował rabat","o":{"A":"funkcjonalny.","B":"sezonowy.","C":"handlowy.","D":"ilościowy."},"a":"D","img":[2260,80],"e":{"A":"Rabat funkcjonalny (handlowy) – dla pośredników.","B":"Sezonowy – poza sezonem.","C":"Handlowy – dla pośredników.","D":"Poprawna. Duża liczba noclegów i osób (5 nocy × 6 osób) = rabat ilościowy; nie lojalnościowy, bo to pierwszy pobyt.","tip":"Duże zamówienie = ilościowy.","long":"Rodzina była pierwszy raz, więc to nie rabat lojalnościowy. Dostali 20% zniżki, bo kupili dużo: 5 noclegów dla 6 osób. Rabat za dużą ilość to rabat ilościowy. Sezonowy jest poza sezonem, handlowy – dla firm handlowych, funkcjonalny – dla pośredników."}},{"n":19,"q":"Którą kwotę należy wpisać w przedstawionej fakturze w kolumnie Wartość usługi netto?","o":{"A":"16,30 zł","B":"41,14 zł","C":"178,86 zł","D":"203,70 zł"},"a":"D","ctx":"Faktura (fragment) Wartość Stawka Kwota Wartość J.m. Ilość jednostkowa usługi podatku podatku usługi netto (zł) (%) (zł) brutto (zł) 2 101,85 x 8 x 220,00","pic":1,"img":[2340,219],"e":{"A":"16,30 zł – to VAT.","B":"41,14 zł – błąd.","C":"178,86 zł – błąd.","D":"Poprawna. Wartość netto = ilość × cena jednostkowa netto = 2 × 101,85 = 203,70 zł (brutto 220,00 = 203,70 + 8% VAT).","tip":"Wartość netto = ilość × cena netto.","long":"Wartość netto = cena netto × ilość. Cena jednostkowa netto to 101,85 zł, a usługa trwa 2 doby. Liczymy: 101,85 × 2 = 203,70 zł. Sprawdź: 203,70 + 8% VAT (16,30) = 220,00 zł brutto – zgadza się."}},{"n":20,"q":"W programie imprezy turystycznej na Kurpiach, organizowanej przez gospodarstwo agroturystyczne, powinno się uwzględnić zwiedzanie","o":{"A":"planetarium w Olsztynie.","B":"arboretum w Bydgoszczy.","C":"ośrodka sztuki ludowej we wsi Łyse.","D":"skansenu budownictwa ludowego w Olsztynku."},"a":"C","img":[2559,72],"e":{"A":"Planetarium w Olsztynie – Warmia, nie Kurpie.","B":"Arboretum w Bydgoszczy – Kujawy.","C":"Poprawna. Łyse to wieś na Kurpiach (Puszcza Zielona) słynąca ze sztuki ludowej, wycinanek i Niedzieli Palmowej.","D":"Skansen w Olsztynku – Warmia i Mazury.","tip":"Kurpie: Łyse, Kadzidło, Nowogród.","long":"Kurpie to region w okolicach Ostrołęki, znany z kultury ludowej: wycinanek, palm wielkanocnych, strojów. Wieś Łyse to słynny ośrodek sztuki ludowej Kurpiów. Olsztyn i Olsztynek to Warmia i Mazury, a Bydgoszcz – Kujawy."}},{"n":21,"q":"Biuro podróży podpisało z liniami lotniczymi umowę współpracy na zasadach czarteru, przewidującą przede wszystkim","o":{"A":"możliwość anulowania świadczeń","B":"możliwość czasowej zmiany ceny świadczeń.","C":"brak możliwości utrzymania terminu realizacji świadczeń.","D":"brak możliwości anulowania świadczeń w określonym terminie."},"a":"D","img":[2631,198],"e":{"A":"Przy czarterze anulowanie jest ograniczone, nie dowolne.","B":"Cena w czarterze jest ustalona w umowie.","C":"Terminy są gwarantowane umową.","D":"Poprawna. Czarter to wynajęcie całego samolotu; biuro nie może anulować świadczeń po określonym terminie i ponosi ryzyko niesprzedanych miejsc.","tip":"Czarter = cały samolot, ryzyko po stronie biura.","long":"Czarter to umowa, w której biuro wynajmuje cały samolot (albo stałą pulę miejsc) i nie może ich oddać ani anulować. Jeśli biuro nie sprzeda miejsc, i tak płaci. Dlatego mówimy: czarter = brak możliwości anulowania. Inaczej jest w allotmencie – tam można zwolnić miejsca w określonym terminie."}},{"n":22,"q":"Który dokument, oprócz egzemplarza podpisanej umowy, powinien otrzymać klient podczas sprzedaży imprezy turystycznej?","o":{"A":"Rezerwację pobytu.","B":"Warunki uczestnictwa.","C":"Umowę z usługodawcą.","D":"Potwierdzenie zamówienia."},"a":"B","img":[2829,220],"e":{"A":"Rezerwacja to etap przed umową.","B":"Poprawna. Warunki uczestnictwa (ogólne warunki umowy) są integralną częścią umowy i klient musi je otrzymać.","C":"Umowy biura z usługodawcami są wewnętrzne.","D":"Potwierdzenie zamówienia dotyczy usługodawców.","tip":"Klient dostaje: umowę + warunki uczestnictwa + program.","long":"Gdy klient kupuje wycieczkę, dostaje umowę i warunki uczestnictwa – czyli zasady: jak płacić, jak zrezygnować, co biuro zapewnia. Rezerwacje i umowy z hotelami to dokumenty biura, nie klienta."}},{"n":23,"q":"Na podstawie przedstawionej kalkulacji, oblicz cenę wczasów w gospodarstwie agroturystycznym.","o":{"A":"14 833,50 zł","B":"15 950,00 zł","C":"16 283,50 zł","D":"19 283,30 zł"},"a":"C","ctx":"Kalkulacja ceny wczasów w gospodarstwie agroturystycznym (fragment) Suma kosztów świadczeń 14 500,00 zł Zakładana marża bez podatku VAT 1 450,00 zł w wysokości 10% sumy kosztów świadczeń Zakładany podatek VAT 23% Cena całkowita wczasów w gospodarstwie agroturystycznym","pic":1,"img":[3049,368],"e":{"A":"14 833,50 zł – brak marży.","B":"15 950,00 zł – brak VAT.","C":"Poprawna. VAT 23% od marży: 1 450 × 0,23 = 333,50 zł. Cena = 14 500 + 1 450 + 333,50 = 16 283,50 zł.","D":"19 283,30 zł – błąd.","tip":"Cena = koszty + marża + VAT od marży.","long":"Cena = koszty + marża + VAT od marży. Koszty 14 500 zł, marża 1450 zł, VAT to 23% z marży: 1450 × 0,23 = 333,50 zł. Razem: 14 500 + 1450 + 333,50 = 16 283,50 zł."}},{"n":24,"q":"Którą informację pracownik biura podróży musi zapisać w umowie o udział w imprezie turystycznej?","o":{"A":"Miejsce zbiórki.","B":"Termin imprezy turystycznej.","C":"Dane adresowe przewoźnika.","D":"Imię i nazwisko pilota wycieczek."},"a":"B","img":[3417,170],"e":{"A":"Miejsce zbiórki zwykle jest w programie, ale nie jest obowiązkowym elementem z ustawy.","B":"Poprawna. Termin imprezy musi być w umowie.","C":"Dane przewoźnika nie są wymagane.","D":"Nazwisko pilota nie jest wymagane.","tip":"Umowa: kto, kiedy, gdzie, co, za ile.","long":"W umowie z klientem musi być termin imprezy – klient musi wiedzieć, od kiedy do kiedy jedzie. Imię pilota, adres przewoźnika czy godzina doby hotelowej nie są obowiązkowe (pilot może się jeszcze zmienić). Najważniejsze w umowie: kto organizuje, co jest w cenie, gdzie, kiedy i za ile."}},{"n":25,"q":"Integralną częścią umowy o organizację wycieczki jest","o":{"A":"ankieta satysfakcji klienta.","B":"program imprezy turystycznej.","C":"broszura reklamowa o biurze podróży.","D":"informator przewoźnika autokarowego."},"a":"B","img":[3587,43],"e":{"A":"Ankieta satysfakcji – po imprezie, nie część umowy.","B":"Poprawna. Program imprezy jest integralną częścią umowy.","C":"Broszura reklamowa – materiał promocyjny.","D":"Informator przewoźnika – nie jest częścią umowy.","tip":"Program = część umowy.","long":"Program imprezy jest częścią umowy – to w nim jest napisane, co dokładnie klient dostanie każdego dnia. Ankiety, broszury reklamowe i informatory przewoźnika nie są częścią umowy."}},{"n":26,"q":"Kto stanowi strony umowy agencyjnej, stosowanej w turystyce?","o":{"A":"Pilot wycieczek i klient.","B":"Klient i organizator turystyki.","C":"Organizator turystyki i agent turystyczny.","D":"Agent turystyczny i przewodnik turystyczny."},"a":"C","img":[3630,43],"e":{"A":"Pilot i klient nie zawierają umowy.","B":"Klient i organizator – umowa o udział w imprezie.","C":"Poprawna. Umowa agencyjna łączy organizatora turystyki z agentem, który sprzedaje jego imprezy za prowizję.","D":"Agent i przewodnik – brak takiej umowy.","tip":"Agencyjna = organizator + agent.","long":"Umowa agencyjna łączy organizatora turystyki (biuro, które tworzy wycieczki) z agentem (biurem, które je sprzedaje za prowizję). Agent sprzedaje „w imieniu” organizatora. Klient i pilot nie są stronami tej umowy."}},{"n":27,"q":"Który posiłek, jako pierwszy, przysługuje turystom korzystającym w pensjonacie z opcji pełnego wyżywienia, jeżeli kończą pobyt śniadaniem?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"A","img":[3673,73],"e":{"A":"Poprawna. Przy FB (pełne wyżywienie) liczba posiłków się równoważy: skoro pobyt kończy się śniadaniem, to zaczyna się od obiadu.","B":"Kolacja byłaby pierwszym posiłkiem przy HB kończącym się śniadaniem? Nie – w FB zaczyna się od obiadu.","C":"Śniadanie podaje się dopiero po pierwszym noclegu.","D":"Obiadokolacja dotyczy HB.","tip":"FB: start obiadem → koniec śniadaniem; HB: start obiadokolacją → koniec śniadaniem.","long":"Pobyt z pełnym wyżywieniem ma tyle samo posiłków każdego rodzaju. Jeśli ostatni posiłek to śniadanie (w dniu wyjazdu), to pierwszy musi być obiad w dniu przyjazdu – wtedy liczba obiadów, kolacji i śniadań się zgadza. To ważne przy liczeniu posiłków w kalkulacji."}},{"n":28,"q":"Który dokument może przesłać pracownik biura podróży do hotelu celem usprawnienia zakwaterowania grupy?","o":{"A":"Zapytanie ofertowe.","B":"Umowę allotmentu.","C":"Listę paszportową.","D":"Listę uczestników."},"a":"D","img":[3746,80],"e":{"A":"Zapytanie ofertowe wysyła się przed rezerwacją.","B":"Umowa allotmentu dotyczy puli miejsc na dłuższy okres.","C":"Lista paszportowa – do granicy/przewoźnika.","D":"Poprawna. Lista uczestników (z rozmieszczeniem – rooming list) usprawnia zakwaterowanie.","tip":"Do hotelu – lista uczestników / rooming list.","long":"Lista uczestników pozwala hotelowi przygotować pokoje i szybko zameldować grupę – ma imiona, nazwiska, często podział na pokoje. Zapytanie ofertowe wysyła się przed rezerwacją, umowa allotmentu to umowa o pulę pokoi, a lista paszportowa jest na granicę."}},{"n":29,"q":"Właściciele gospodarstw agroturystycznych zamierzają wymieniać się swoimi wyrobami metodą towar za towar. W związku z tym powinni podpisać umowę","o":{"A":"kupna.","B":"barteru.","C":"o pracę.","D":"o sponsoring."},"a":"B","img":[3826,80],"e":{"A":"Umowa kupna – za pieniądze.","B":"Poprawna. Barter – wymiana towar za towar bez pieniędzy.","C":"Umowa o pracę – zatrudnienie.","D":"Sponsoring – finansowanie w zamian za reklamę.","tip":"Barter = wymiana.","long":"Wymiana towar za towar bez pieniędzy to barter. Umowa kupna to płacenie pieniędzmi, umowa o pracę dotyczy zatrudnienia, a sponsoring to finansowanie w zamian za reklamę."}},{"n":30,"q":"O którym walorze turystycznym poinformuje właściciel gospodarstwa turystycznego swoich gości, wskazując im przedstawione oznakowanie turystyczne?","o":{"A":"O ostoi ptaków.","B":"O muzeum wirtualnym.","C":"O punkcie widokowym.","D":"O obiekcie historycznym."},"a":"C","pic":1,"img":[3906,414],"e":{"A":"Ostoja ptaków ma symbol ptaka.","B":"Muzeum – symbol budynku/kolumn.","C":"Poprawna. Pokazany znak (symbol lornetki/oka) oznacza punkt widokowy.","D":"Obiekt historyczny – symbol zamku/ruin.","tip":"Znaki turystyczne: warto znać podstawowe piktogramy.","long":"Na znaku turystycznym jest symbol punktu widokowego – miejsca, z którego widać piękną panoramę. Takie znaki są brązowo-białe. Inne symbole oznaczają ptaki, muzea czy zabytki – trzeba po prostu rozpoznać obrazek."}},{"n":31,"q":"Do której miejscowości w Beskidzie Śląskim zabierze pilot wycieczek grupę turystów, chcąc pokazać im regionalne wyroby koronkarskie?","o":{"A":"Do Wisły.","B":"Do Ustronia.","C":"Do Szczyrku.","D":"Do Koniakowa."},"a":"D","img":[4320,72],"e":{"A":"Wisła – skocznie, Zameczek Prezydenta.","B":"Ustroń – uzdrowisko.","C":"Szczyrk – narciarstwo.","D":"Poprawna. Koniaków słynie z koronek koniakowskich (szydełkowych).","tip":"Koronki = Koniaków.","long":"Koniaków w Beskidzie Śląskim słynie z koronek – ręcznie robionych serwetek i ozdób. To ich znak rozpoznawczy. Wisła, Ustroń i Szczyrk są znane z turystyki i narciarstwa, a nie z koronek."}},{"n":32,"q":"Folder promujący uzdrowiska Kotliny Kłodzkiej powinien zawierać informacje o sanatoriach zlokalizowanych","o":{"A":"w Szczawnicy i Polańczyku.","B":"w Ciechocinku i Inowrocławiu.","C":"w Solcu-Zdroju i Busku-Zdroju.","D":"w Lądku-Zdroju i Polanicy-Zdroju."},"a":"D","img":[4392,170],"e":{"A":"Szczawnica – Pieniny; Polańczyk – Bieszczady.","B":"Ciechocinek, Inowrocław – Kujawy.","C":"Solec, Busko – Ponidzie.","D":"Poprawna. Lądek-Zdrój i Polanica-Zdrój – Kotlina Kłodzka.","tip":"Kotlina Kłodzka: Polanica, Duszniki, Kudowa, Lądek.","long":"Kotlina Kłodzka leży w Sudetach i ma dużo uzdrowisk: Lądek-Zdrój, Polanica-Zdrój, Kudowa-Zdrój, Duszniki-Zdrój. Szczawnica i Muszyna są w Małopolsce, Ciechocinek i Inowrocław na Kujawach, a Solec i Busko w świętokrzyskim."}},{"n":33,"q":"Który dokument teczki pilota wycieczek potwierdza wykupienie usług w hotelu?","o":{"A":"Lista roomingowa.","B":"Faktura proforma.","C":"Eurolista.","D":"Voucher."},"a":"D","img":[4562,51],"e":{"A":"Rooming lista – podział na pokoje.","B":"Faktura proforma – oferta przed zapłatą.","C":"Eurolista – lista uczestników dla przewoźnika/granicy.","D":"Poprawna. Voucher potwierdza wykupienie usług i jest podstawą do ich realizacji.","tip":"Voucher = opłacona usługa.","long":"Voucher to dokument, który potwierdza, że usługi w hotelu są już opłacone. Pilot pokazuje go w hotelu. Lista roomingowa to podział gości na pokoje, faktura proforma to dokument przed zapłatą, a eurolista dotyczy przekraczania granicy."}},{"n":34,"q":"Oblicz całkowitą cenę krajowej imprezy turystycznej, jeżeli suma kosztów świadczeń wynosi 6 980,00 zł, a zakładana marża biura podróży bez podatku VAT wynosi 18% sumy kosztów świadczeń.","o":{"A":"7 268,97 zł","B":"8 236,40 zł","C":"8 525,37 zł","D":"8 585,40 zł"},"a":"C","img":[4613,202],"e":{"A":"7 268,97 zł – błąd.","B":"8 236,40 zł – brak VAT.","C":"Poprawna. Marża 18% = 1 256,40 zł; VAT 23% od marży = 288,97 zł; cena = 6 980 + 1 256,40 + 288,97 = 8 525,37 zł.","D":"8 585,40 zł – błąd.","tip":"Cena = koszty + marża + VAT od marży.","long":"Cena imprezy = koszty + marża + VAT (23% liczony tylko od marży). Marża: 6980 × 18% = 1256,40 zł. VAT: 1256,40 × 23% = 288,97 zł. Razem: 6980 + 1256,40 + 288,97 = 8525,37 zł."}},{"n":35,"q":"Kosztem zmiennym jest należność za usługę","o":{"A":"transportową zakupioną w czarterze.","B":"przewodnictwa turystycznego.","C":"wyżywienia uczestników.","D":"pilotażu wycieczek."},"a":"C","img":[4815,170],"e":{"A":"Czarter (wynajem całego środka transportu) – koszt stały.","B":"Przewodnik – stały.","C":"Poprawna. Wyżywienie liczy się od osoby – koszt zmienny.","D":"Pilot – stały.","tip":"Zmienny = od osoby.","long":"Koszt zmienny rośnie, gdy rośnie liczba osób. Jedzenie zamawia się dla każdego uczestnika, więc to koszt zmienny. Czarter, przewodnik i pilot kosztują tyle samo dla całej grupy – to koszty stałe."}},{"n":36,"q":"Dowód KP jest stosowany do potwierdzenia","o":{"A":"wpłaty przelewem.","B":"wpłaty gotówkowej.","C":"wypłaty gotówkowej.","D":"wypłaty wynagrodzenia."},"a":"B","img":[4985,220],"e":{"A":"Przelew potwierdza wyciąg bankowy.","B":"Poprawna. KP (Kasa Przyjmie) potwierdza wpłatę gotówki do kasy.","C":"Wypłata gotówki – KW (Kasa Wypłaci).","D":"Wypłata wynagrodzenia – lista płac/KW.","tip":"KP = przyjęcie, KW = wypłata.","long":"KP = „Kasa Przyjmie”. To dowód, że ktoś wpłacił gotówkę do kasy. Przelew przechodzi przez bank, a wypłaty gotówki dokumentuje KW („Kasa Wyda”)."}},{"n":37,"q":"Korzystając z danych z tabeli oblicz marżę z tytułu organizacji krajowej wycieczki dla grupy 30 osób, jeżeli cena jednostkowa za udział w wycieczce wynosi 150,00 zł.","o":{"A":"295,00 zł","B":"450,00 zł","C":"700,00 zł","D":"750,00 zł"},"a":"B","ctx":"Świadczenia Koszt świadczeń(zł) transport autokarowy 2 200,00 wyżywienie 800,00 pilotaż wycieczek 500,00 przewodnictwo turystyczne 250,00 bilety wstępów 300,00","pic":1,"img":[5205,242],"e":{"A":"295 zł – błąd.","B":"Poprawna. Przychód: 30 × 150 = 4 500 zł. Koszty: 2 200 + 800 + 500 + 250 + 300 = 4 050 zł. Marża = 4 500 − 4 050 = 450,00 zł.","C":"700 zł – błąd.","D":"750 zł – błąd.","tip":"Marża = sprzedaż − koszty.","long":"Biuro dostało od 30 osób po 150 zł, czyli 4500 zł. Koszty to: 2200 + 800 + 500 + 250 + 300 = 4050 zł. Marża to różnica między tym, co biuro dostało, a tym, co wydało: 4500 − 4050 = 450 zł."}},{"n":38,"q":"Który dokument sporządza pracownik biura podróży, ostatecznie dokonując rozliczenia imprezy turystycznej?","o":{"A":"Tabelę wpływów.","B":"Kartę rozliczeniową.","C":"Zestawienie kosztów.","D":"Rachunek zysków i strat."},"a":"B","img":[5447,191],"e":{"A":"Tabela wpływów to tylko część danych.","B":"Poprawna. Karta rozliczeniowa imprezy porównuje koszty i przychody po zakończeniu imprezy.","C":"Rachunek zysków i strat – dla całej firmy, za rok.","D":"Zestawienie wpływów i kosztów – pomocnicze.","tip":"Rozliczenie imprezy = karta rozliczeniowa.","long":"Po imprezie biuro robi kartę rozliczeniową – pokazuje w niej wszystkie wpływy (wpłaty klientów) i wszystkie wydatki, i sprawdza, czy zarobiło. To końcowe rozliczenie imprezy."}},{"n":39,"q":"Biuro podróży wynajęło w gospodarstwie agroturystycznym 20 pokojów dwuosobowych na jedną noc. Cena jednego pokoju za dobę wynosi 100,00 zł netto, a stawka VAT to 8%. Oblicz całkowitą wartość brutto tej usługi.","o":{"A":"2 000,00 zł","B":"2 008,00 zł","C":"2 148,00 zł","D":"2 160,00 zł"},"a":"D","img":[5638,106],"e":{"A":"2 000 zł – to netto.","B":"2 008 zł – błąd: VAT od jednego pokoju.","C":"2 148 zł – błąd.","D":"Poprawna. 20 × 100 = 2 000 zł netto; VAT 8% = 160 zł; brutto 2 160,00 zł.","tip":"Brutto = netto × 1,08 (noclegi).","long":"Cena 100 zł netto za pokój, pokoi jest 20, noc jedna. Netto: 20 × 100 = 2000 zł. Dodajemy VAT 8%: 2000 × 1,08 = 2160 zł brutto. Pułapka: 2008 zł to dodanie tylko 8 zł zamiast 8%."}},{"n":40,"q":"Który dokument sporządzi pracownik biura podróży, jeżeli na otrzymanej fakturze za usługę turystyczną stwierdził błędny zapis numeru NIP?","o":{"A":"Notę korygującą.","B":"Notę sprzedażową.","C":"Fakturę korygującą.","D":"Fakturę sprzedażową."},"a":"A","img":[5744,72],"e":{"A":"Poprawna. Błąd w danych (np. NIP) poprawia nabywca notą korygującą.","B":"Nota sprzedażowa nie istnieje jako dokument korygujący.","C":"Faktura korygująca – przy błędach w kwotach, wystawia sprzedawca.","D":"Faktura sprzedażowa – nowa sprzedaż.","tip":"Dane – nota korygująca; kwoty – faktura korygująca.","long":"Błędny NIP to błąd w danych, nie w kwotach. Wtedy nabywca (ten, kto dostał fakturę) może sam wystawić notę korygującą i poprawić pomyłkę. Fakturę korygującą wystawia sprzedawca, gdy źle są policzone pieniądze. Błąd w danych → nota korygująca; błąd w kwotach → faktura korygująca."}}],"2022-styczen":[{"n":1,"q":"Podróżowanie samochodem z przyczepą kempingową to","o":{"A":"trekking.","B":"tramping.","C":"snorkeling.","D":"karawaning."},"a":"D","img":[0,43],"e":{"A":"Trekking – piesze wędrówki po górach.","B":"Tramping – tanie podróżowanie z plecakiem lokalnym transportem.","C":"Snorkeling – pływanie z maską i rurką przy powierzchni wody.","D":"Poprawna. Karawaning to turystyka z przyczepą kempingową lub kamperem (caravan).","tip":"Caravan = przyczepa kempingowa → karawaning.","long":"Karawaning to podróżowanie z przyczepą kempingową albo kamperem – masz „dom na kółkach” i śpisz w nim na kempingach. Trekking to piesze wędrówki, tramping – tanie podróżowanie z plecakiem, a snorkeling – pływanie z maską i rurką. Przyczepa = karawaning."}},{"n":2,"q":"Wyjazdy związane z chęcią uczestnictwa w wydarzeniach sportowych to","o":{"A":"geoturystyka.","B":"enoturystyka.","C":"fanoturystyka.","D":"tanatoturystyka."},"a":"C","img":[43,44],"e":{"A":"Geoturystyka – poznawanie obiektów geologicznych.","B":"Enoturystyka – winnice i degustacja win.","C":"Poprawna. Fanoturystyka – wyjazdy kibiców na mecze, zawody, koncerty.","D":"Tanatoturystyka – miejsca związane ze śmiercią.","tip":"Fan = kibic.","long":"Fanoturystyka to wyjazdy kibiców (fanów) na mecze, zawody i turnieje. Geoturystyka to oglądanie ciekawych skał i form terenu, enoturystyka – wino i winnice, tanatoturystyka – miejsca związane ze śmiercią. Fan sportu = fanoturystyka."}},{"n":3,"q":"Turystom zainteresowanym bartnictwem należy podczas wycieczki zorganizować spotkanie z","o":{"A":"garncarzem.","B":"pszczelarzem.","C":"hodowcą owiec.","D":"producentem serów."},"a":"B","img":[87,43],"e":{"A":"Garncarz – wyroby z gliny.","B":"Poprawna. Bartnictwo to dawna forma pszczelarstwa (pozyskiwanie miodu z barci – dziupli w drzewach), więc spotkanie z pszczelarzem.","C":"Hodowca owiec – wełna, oscypki.","D":"Producent serów – serowarstwo.","tip":"Barć = ul w pniu drzewa.","long":"Bartnictwo to dawne pszczelarstwo – zbieranie miodu od dzikich pszczół z barci, czyli dziupli w drzewach. Dlatego turystów zainteresowanych bartnictwem zabieramy do pszczelarza. Garncarz robi garnki z gliny, a hodowca owiec i producent serów nie mają związku z miodem."}},{"n":4,"q":"Organizując wczasy w Tatrach z dojazdem własnym, organizator turystyki powinien zapewnić przede wszystkim usługi","o":{"A":"informacyjne i pilotażu.","B":"transportowe i informacyjne.","C":"noclegowe i przewodnictwa.","D":"żywieniowe i ubezpieczeniowe."},"a":"C","img":[130,198],"e":{"A":"Pilotaż jest zbędny, gdy turyści dojeżdżają sami.","B":"Transport nie jest potrzebny – dojazd własny.","C":"Poprawna. Wczasy w Tatrach z dojazdem własnym: najważniejsze są noclegi oraz przewodnik tatrzański na szlaki.","D":"Wyżywienie i ubezpieczenie są ważne, ale podstawą są noclegi i przewodnictwo.","tip":"Dojazd własny = bez transportu i pilota.","long":"Klienci dojeżdżają sami, więc transport nie jest potrzebny. W Tatrach trzeba zapewnić noclegi (gdzie śpią) i przewodnika (bezpieczne wędrowanie po górach z kimś, kto zna szlaki). Pilot jest potrzebny w podróży autokarem, a nie przy wczasach z dojazdem własnym."}},{"n":5,"q":"Oblicz odległość w centymetrach między dwoma punktami na mapie w skali 1:300 000, jeżeli w rzeczywistości wynosi ona 24 kilometry.","o":{"A":"1,8 cm","B":"8,0 cm","C":"8,8 cm","D":"74,0 cm"},"a":"B","img":[328,72],"e":{"A":"1,8 cm – błąd o rząd wielkości.","B":"Poprawna. 24 km = 2 400 000 cm. Skala 1:300 000 oznacza, że 1 cm na mapie = 300 000 cm w terenie. 2 400 000 : 300 000 = 8 cm.","C":"8,8 cm – błędne przeliczenie.","D":"18 cm – błędne przeliczenie.","tip":"Zamień km na cm (×100 000) i podziel przez mianownik skali.","long":"Skala 1 : 300 000 znaczy, że 1 cm na mapie to 300 000 cm w terenie. 300 000 cm to 3 km (bo 100 000 cm = 1 km). Czyli 1 cm na mapie = 3 km. Mamy 24 km, więc dzielimy: 24 : 3 = 8 cm. Prosty sposób: z mianownika skali skreśl 5 zer – wyjdzie, ile km jest w 1 cm."}},{"n":6,"q":"Przedstawiony na rysunku znak drogowy jest informacją o znajdującym się na trasie","o":{"A":"hotelu.","B":"obozowisku.","C":"polu biwakowym.","D":"schronisku młodzieżowym."},"a":"D","pic":1,"img":[400,308],"e":{"A":"Hotel ma znak z łóżkiem.","B":"Obozowisko – znak namiotu.","C":"Pole biwakowe – znak namiotu i przyczepy.","D":"Poprawna. Znak przedstawia symbol schroniska młodzieżowego (domek z drzewkiem – symbol PTSM).","tip":"Znaki informacyjne turystyczne warto przejrzeć w taryfikatorze.","long":"Na znaku jest symbol schroniska młodzieżowego (domek z choinką albo trójkąt PTSM). Takie znaki pokazują kierowcom, że w pobliżu jest tani nocleg dla młodzieży. Hotel ma symbol łóżka, a pole biwakowe – namiot."}},{"n":7,"q":"Rozwojowi agroturystyki na Mazurach sprzyja","o":{"A":"sieć górskich szlaków turystycznych.","B":"nierozwinięta infrastruktura drogowa.","C":"rygorystyczne przepisy ochrony środowiska.","D":"położenie w obszarze Zielonych Płuc Polski."},"a":"D","img":[708,170],"e":{"A":"Mazury nie mają gór.","B":"Słaba infrastruktura drogowa utrudnia, a nie sprzyja rozwojowi.","C":"Rygorystyczne przepisy ograniczają zabudowę.","D":"Poprawna. Mazury należą do obszaru Zielonych Płuc Polski – czyste środowisko przyciąga turystów i sprzyja agroturystyce.","tip":"Zielone Płuca Polski = północno-wschodnia Polska.","long":"Mazury leżą w regionie nazywanym „Zielone Płuca Polski” – dużo lasów, jezior, czyste powietrze i mało przemysłu. To bardzo przyciąga turystów, którzy chcą odpocząć na wsi. Mazury nie mają gór, a słabe drogi i surowe przepisy raczej utrudniają turystykę."}},{"n":8,"q":"Który polski zabytek wpisany na listę UNESCO został przedstawiony na rysunku?","o":{"A":"Cerkiew w Smolniku.","B":"Kościół Pokoju w Świdnicy.","C":"Drewniany kościół w Binarowej.","D":"Świątynia Opatrzności Bożej w Warszawie."},"a":"B","pic":1,"img":[878,319],"e":{"A":"Cerkiew w Smolniku – UNESCO, ale drewniana cerkiew w Bieszczadach.","B":"Poprawna. Na rysunku Kościół Pokoju w Świdnicy – największa drewniana świątynia ryglowa w Europie, wpisana na listę UNESCO (razem z kościołem w Jaworze).","C":"Kościół w Binarowej – drewniany, gotycki, Małopolska.","D":"Świątynia Opatrzności Bożej – nowoczesna, nie jest w UNESCO.","tip":"Kościoły Pokoju: Świdnica i Jawor.","long":"Na rysunku jest Kościół Pokoju w Świdnicy – ogromny kościół z drewna i gliny (szachulec), zbudowany w XVII wieku. Jest na liście UNESCO razem z Kościołem Pokoju w Jaworze. Cerkiew w Smolniku i kościół w Binarowej też są drewniane, ale wyglądają inaczej (mniejsze, z wieżami)."}},{"n":9,"q":"Podczas wędrówki po Łemkowszczyźnie w Karpatach można obejrzeć","o":{"A":"romańskie kościoły wykonane z wapienia.","B":"wiatraki czerpakowe z kanałami nawadniającymi.","C":"wioski z zachowaną formą okolnicy i drewniane młyny.","D":"drewniane cerkwie i opuszczone długie domy, zwane chyżami."},"a":"D","img":[1197,169],"e":{"A":"Romańskie kościoły z wapienia – Małopolska, Ponidzie.","B":"Wiatraki czerpakowe – Żuławy.","C":"Okolnica (wieś wokół placu) – Niziny.","D":"Poprawna. Łemkowszczyzna (Beskid Niski) – drewniane cerkwie i chyże, czyli długie domy łemkowskie pod jednym dachem.","tip":"Łemkowie: cerkwie + chyże.","long":"Łemkowszczyzna to tereny Łemków w Beskidzie Niskim i Bieszczadach. Typowe są tam drewniane cerkwie i chyże – długie drewniane domy, w których pod jednym dachem mieszkali ludzie i zwierzęta. Romańskie kościoły z kamienia, wiatraki i okolnice to inne regiony Polski."}},{"n":10,"q":"Ile czasu należy zaplanować w programie wycieczki autokarowej na przejazd z Torunia do Wrocławia, jeżeli trasa liczy 300 km, a średnia prędkość jazdy autokaru wynosi 60 km/godz.?","o":{"A":"5 godzin 00 minut.","B":"5 godzin 15 minut.","C":"5 godzin 30 minut.","D":"5 godzin 45 minut."},"a":"D","img":[1366,73],"e":{"A":"5 h – sam czas jazdy bez przerw.","B":"5 h 15 min – za krótka przerwa.","C":"5 h 30 min – za krótka przerwa.","D":"Poprawna. 300 km : 60 km/h = 5 h jazdy. Kierowca po 4,5 h jazdy musi mieć 45 min przerwy, więc 5 h + 45 min = 5 h 45 min.","tip":"Kierowca: po 4,5 h jazdy – 45 min przerwy.","long":"Czas jazdy: 300 km : 60 km/h = 5 godzin. Ale kierowca po 4,5 godziny jazdy musi zrobić przerwę 45 minut – tak mówią przepisy. Więc: 5 h + 45 min = 5 h 45 min. Ta pułapka często wraca na egzaminie!"}},{"n":11,"q":"Która z proponowanych ofert gospodarstw agroturystycznych może zaspokoić oczekiwania turysty w zakresie uprawiania hippiki?","o":{"A":"Oferta 1.","B":"Oferta 2.","C":"Oferta 3.","D":"Oferta 4."},"a":"C","ctx":"komfortowe pokoje  pokoje standard  pokoje w stylu  luksusowe quady  przejażdżki łodzią po Bonanza apartamenty samochody terenowe jeziorze  nauka jazdy konnej  wędkowanie w stawie wiejska kuźnia  własna ujeżdżalnia  spływy kajakowe Oferta2. Oferta3. Oferta 4.","pic":1,"img":[1439,214],"e":{"A":"Oferta 1 – brak koni.","B":"Oferta 2 – brak koni.","C":"Poprawna. Hippika to jeździectwo – Oferta 3 ma naukę jazdy konnej i własną ujeżdżalnię.","D":"Oferta 4 – inne atrakcje (wodne/quady).","tip":"Hippika = jazda konna.","long":"Hippika to jeździectwo, czyli jazda konna. Oferta 3 ma naukę jazdy konnej i własną ujeżdżalnię (miejsce do ćwiczeń z końmi). Pozostałe oferty mają quady, łodzie, wędkowanie czy kajaki – to nie hippika. Hippos po grecku to koń."}},{"n":12,"q":"Oblicz koszt noclegu 6 osób w pokojach dwuosobowych w terminie od 14 do 17 maja, jeżeli cena za pokój wynosi 100,00 zł/doba.","o":{"A":"600,00 zł","B":"900,00 zł","C":"1 200,00 zł","D":"2 400,00 zł"},"a":"B","img":[1653,73],"e":{"A":"600 zł – za 2 noce.","B":"Poprawna. 14–17 maja = 3 noce. 6 osób = 3 pokoje 2-os. 3 × 100,00 × 3 = 900,00 zł.","C":"1 200 zł – policzono 4 noce.","D":"2 400 zł – błąd.","tip":"Liczba nocy = data wyjazdu − data przyjazdu.","long":"Najpierw liczba nocy: od 14 do 17 maja to 3 noce (17 − 14 = 3). Sześć osób w pokojach 2-osobowych to 3 pokoje. Cena jest za pokój: 3 pokoje × 100 zł × 3 noce = 900 zł."}},{"n":13,"q":"Oblicz koszt przejazdu 10 uczniów i opiekuna pociągiem z Warszawy Centralnej do Krakowa Głównego, jeżeli bilet normalny kosztuje 66,00 zł, ulga ustawowa dla uczniów wynosi 37%, a opiekunowi przysługuje darmowy bilet.","o":{"A":"310,20 zł","B":"415,80 zł","C":"481,80 zł","D":"660,00 zł"},"a":"B","img":[1726,101],"e":{"A":"310,20 zł – błąd.","B":"Poprawna. Bilet z ulgą 37%: 66 × 0,63 = 41,58 zł × 10 uczniów = 415,80 zł; opiekun bezpłatnie.","C":"481,80 zł – doliczono opiekuna.","D":"660 zł – bez ulgi.","tip":"Ulga x% → płacimy (100 − x)%.","long":"Opiekun jedzie za darmo, więc płaci tylko 10 uczniów. Uczeń ma 37% zniżki, czyli płaci 63% ceny: 66 × 0,63 = 41,58 zł. Za 10 uczniów: 41,58 × 10 = 415,80 zł."}},{"n":14,"q":"Zamawiając usługi przewodnika turystycznego, pracownik biura podróży powinien podać informacje dotyczące przede wszystkim","o":{"A":"kontaktu do kierowcy.","B":"miejsca spotkania z grupą.","C":"wykształcenia uczestników.","D":"znaków rozpoznawczych autokaru."},"a":"B","img":[1827,73],"e":{"A":"Kontakt do kierowcy nie jest kluczowy dla przewodnika.","B":"Poprawna. Przewodnik musi wiedzieć, gdzie i o której spotkać grupę.","C":"Wykształcenie uczestników nie jest wymagane.","D":"Znaki autokaru są pomocnicze.","tip":"Zamówienie przewodnika: data, godzina, miejsce spotkania, czas, trasa, liczba osób.","long":"Przewodnik musi wiedzieć, gdzie i o której ma spotkać grupę – inaczej się nie spotkają. Wykształcenie uczestników czy wygląd autokaru są mniej ważne, a kontakt do kierowcy nie jest przewodnikowi potrzebny."}},{"n":15,"q":"Który dokument stosowany podczas przygotowania imprezy turystycznej zawiera zamieszczone w ramce informacje?","o":{"A":"Rezerwacja noclegów.","B":"Zamówienie sali konferencyjnej.","C":"Potwierdzenie zamówienia obiadów.","D":"Anulowanie zamówienia biletów do teatru."},"a":"B","ctx":" określenie godziny przerwy kawowej  określenie teatralnego układu krzeseł  zapytanie o termin i warunki płatności","img":[1900,254],"e":{"A":"Zamówienie noclegów nie dotyczy układu krzeseł.","B":"Poprawna. Teatralny układ krzeseł (rzędy przodem do sceny) ustala się przy rezerwacji sali konferencyjnej.","C":"Potwierdzenie obiadów nie zawiera układu sali.","D":"Anulowanie biletów nie zawiera pytań o płatność.","tip":"Ustawienia sali: teatralne, szkolne, bankietowe, podkowa.","long":"Przerwa kawowa i teatralny układ krzeseł (krzesła w rzędach) to typowe sprawy przy sali konferencyjnej – na spotkanie, szkolenie czy wykład. Do tego pytanie o termin i płatność. To zamówienie sali konferencyjnej."}},{"n":16,"q":"Który instrument marketingu mix zastosowało gospodarstwo agroturystyczne, umieszczając w popularnej gazecie reklamę swojego obiektu?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[2154,73],"e":{"A":"Cena – rabaty.","B":"Produkt – sama usługa.","C":"Poprawna. Reklama w gazecie to promocja.","D":"Dystrybucja – sprzedaż.","tip":"Reklama = promocja.","long":"Reklama w gazecie to promocja – informujemy ludzi o naszej ofercie. Cena to zniżki i cennik, produkt to sama oferta, a dystrybucja to sposób, w jaki sprzedajemy (przez biuro, Internet)."}},{"n":17,"q":"Które z działań gospodarstwa agroturystycznego podejmowane jest w ramach strategii ceny?","o":{"A":"Modernizacja pokoi gościnnych.","B":"Udzielanie zniżek stałym klientom.","C":"Zorganizowanie przyjęcia dla turystów.","D":"Umieszczenie informacji o obiekcie w katalogu."},"a":"B","img":[2227,170],"e":{"A":"Modernizacja pokoi – strategia produktu.","B":"Poprawna. Zniżki dla stałych gości zmieniają cenę – to narzędzie strategii ceny (marketing mix 4P: produkt, cena, dystrybucja, promocja).","C":"Przyjęcie dla turystów – element produktu lub promocji.","D":"Informacja w katalogu – promocja/dystrybucja.","tip":"Wszystko o rabatach i zniżkach = cena.","long":"Strategia ceny to wszystko, co dotyczy pieniędzy: cennik, zniżki, rabaty, promocje cenowe. Zniżki dla stałych gości to decyzja o cenie. Modernizacja pokoi i przyjęcie dla turystów to „produkt” (co oferujemy), a katalog to promocja (reklama). Pytaj siebie: czy to zmienia cenę? Jeśli tak – strategia ceny."}},{"n":18,"q":"W czasie remontu właściciel gospodarstwa agroturystycznego zmienił wystrój jadalni. Jest to działanie w ramach strategii","o":{"A":"dystrybucji.","B":"produktu.","C":"rynku.","D":"ceny."},"a":"B","img":[2397,72],"e":{"A":"Dystrybucja – kanały sprzedaży.","B":"Poprawna. Wystrój jadalni to część produktu.","C":"Strategia rynku – wybór rynków docelowych.","D":"Cena – opłaty i rabaty.","tip":"Wygląd obiektu = produkt.","long":"Wystrój jadalni to część tego, co gość dostaje i widzi – czyli produktu. Strategia produktu to ulepszanie oferty: remonty, nowe pokoje, nowe atrakcje, lepsze jedzenie. Cena to zniżki i cennik, dystrybucja to sposób sprzedaży (np. przez biuro, Internet), personel to pracownicy."}},{"n":19,"q":"W celu realizacji wycieczki szlakiem zamków gotyckich Warmii, Mazur i Kaszub organizator biura podróży powinien wynająć przewoźnika","o":{"A":"lotniczego.","B":"kolejowego.","C":"promowego.","D":"autokarowego."},"a":"D","img":[2469,73],"e":{"A":"Samolot – zamki leżą blisko siebie, w głębi lądu.","B":"Kolej nie dojeżdża do wszystkich zamków.","C":"Prom – brak przepraw.","D":"Poprawna. Objazd wielu zamków (Malbork, Lidzbark Warmiński, Reszel, Gniew…) najlepiej zrealizować autokarem.","tip":"Objazdówka po regionie = autokar.","long":"Zamki gotyckie Warmii, Mazur i Kaszub (Malbork, Lidzbark, Olsztyn, Gniew…) leżą w różnych miejscach, często z dala od kolei. Najwygodniej przejechać trasę wynajętym autokarem, który zawiezie grupę od zamku do zamku. Samolot i prom tu nie pasują."}},{"n":20,"q":"Biuro podróży podpisało z liniami lotniczymi umowę współpracy na zasadach czarteru, która przewiduje przede wszystkim","o":{"A":"możliwość czasowej zmiany ceny świadczeń.","B":"brak możliwości czasowej zmiany ceny świadczeń.","C":"możliwość anulowania świadczeń w określonym terminie.","D":"brak możliwości anulowania świadczeń w określonym terminie."},"a":"D","img":[2542,198],"e":{"A":"Przy czarterze anulowanie jest ograniczone, nie dowolne.","B":"Cena w czarterze jest ustalona w umowie.","C":"Terminy są gwarantowane umową.","D":"Poprawna. Czarter to wynajęcie całego samolotu; biuro nie może anulować świadczeń po określonym terminie i ponosi ryzyko niesprzedanych miejsc.","tip":"Czarter = cały samolot, ryzyko po stronie biura.","long":"Czarter to umowa, w której biuro wynajmuje cały samolot (albo stałą pulę miejsc) i nie może ich oddać ani anulować. Jeśli biuro nie sprzeda miejsc, i tak płaci. Dlatego mówimy: czarter = brak możliwości anulowania. Inaczej jest w allotmencie – tam można zwolnić miejsca w określonym terminie."}},{"n":21,"q":"Którą kwotę należy wpisać na przedstawionym fragmencie faktury w pozycji Wartość usługi brutto?","o":{"A":"203,00 zł","B":"205,00 zł","C":"210,00 zł","D":"220,00 zł"},"a":"D","ctx":"Faktura (fragment) Kwota Wartość Wartość podatku J.m. Ilość jednostkowa usługi usługi VAT netto (zł) brutto (zł) (zł) 2 101,85 203,70 8 x x","pic":1,"img":[2740,234],"e":{"A":"203 zł – błąd.","B":"205 zł – błąd.","C":"210 zł – błąd.","D":"Poprawna. Brutto = netto + 8% VAT: 203,70 × 1,08 = 220,00 zł.","tip":"Usługi gastronomiczne i noclegowe – VAT 8%.","long":"Wartość netto to 203,70 zł, a VAT wynosi 8%. Brutto = netto + VAT: 203,70 × 1,08 = 220,00 zł (VAT to 16,30 zł). Netto to cena bez podatku, brutto – z podatkiem."}},{"n":22,"q":"Właściciel gospodarstwa agroturystycznego wystawi klientowi, który wpłacił zaliczkę gotówką za pobyt w gospodarstwie,","o":{"A":"dowód KP.","B":"dowód KW.","C":"raport kasowy.","D":"voucher hotelowy."},"a":"A","img":[2974,72],"e":{"A":"Poprawna. KP – Kasa Przyjmie: dowód przyjęcia gotówki do kasy, wystawiany przy wpłacie zaliczki gotówką.","B":"KW – Kasa Wypłaci: dowód wypłaty gotówki z kasy.","C":"Raport kasowy zestawia wszystkie operacje kasowe za okres – nie wydaje się go klientowi.","D":"Voucher to skierowanie na usługę, nie potwierdzenie wpłaty.","tip":"KP = przyjęcie gotówki, KW = wypłata.","long":"KP znaczy „Kasa Przyjmie” – to dowód, że do kasy wpłynęły pieniądze w gotówce (np. zaliczka od gościa). KW („Kasa Wyda”) wystawia się, gdy pieniądze wychodzą z kasy. Raport kasowy to podsumowanie wielu wpłat i wypłat, a voucher to bon na usługi. Gość płaci gotówką = KP."}},{"n":23,"q":"W umowie organizatora turystyki zawartej z pilotem wycieczek, stosuje się odpowiednio przepisy umowy","o":{"A":"najmu.","B":"zlecenia.","C":"agencyjnej.","D":"allotmentu."},"a":"B","img":[3046,44],"e":{"A":"Najem – oddanie rzeczy do używania.","B":"Poprawna. Z pilotem zawiera się umowę zlecenia (wykonanie czynności za wynagrodzenie).","C":"Agencyjna – organizator i agent.","D":"Allotment – pula miejsc w hotelu.","tip":"Pilot = umowa zlecenia.","long":"Pilot robi dla biura konkretną pracę (opiekuje się grupą), za którą dostaje wynagrodzenie – to typowa umowa zlecenia. Umowa najmu dotyczy wynajmu rzeczy, agencyjna – sprzedaży imprez przez agenta, a allotment – rezerwacji pokoi."}},{"n":24,"q":"Którą informację pracownik biura podróży musi zapisać w druku umowy o udział w imprezie turystycznej?","o":{"A":"Miejsce zbiórki.","B":"Dane adresowe przewoźnika.","C":"Termin imprezy turystycznej.","D":"Imię i nazwisko pilota wycieczek."},"a":"C","img":[3090,170],"e":{"A":"Miejsce zbiórki nie jest obowiązkowe.","B":"Dane przewoźnika nie są obowiązkowe.","C":"Poprawna. Termin imprezy musi być w umowie.","D":"Nazwisko pilota nie jest obowiązkowe.","tip":"Umowa: kto, kiedy, gdzie, co, za ile.","long":"W umowie z klientem musi być termin imprezy – klient musi wiedzieć, od kiedy do kiedy jedzie. Imię pilota, adres przewoźnika czy godzina doby hotelowej nie są obowiązkowe (pilot może się jeszcze zmienić). Najważniejsze w umowie: kto organizuje, co jest w cenie, gdzie, kiedy i za ile."}},{"n":25,"q":"Turystom wędrującym po górach w okolicy Karpacza i Szklarskiej Poręby należy zaproponować usługi przewodnika","o":{"A":"sudeckiego.","B":"terenowego.","C":"beskidzkiego.","D":"tatrzańskiego."},"a":"A","img":[3260,72],"e":{"A":"Poprawna. Karpacz i Szklarska Poręba – Karkonosze (Sudety), więc przewodnik sudecki.","B":"Przewodnik terenowy – po obszarach nizinnych, nie górach.","C":"Beskidzki – Beskidy.","D":"Tatrzań
