epy) nie są rezerwowane przez touroperatora.","C":"Usługi handlowe nie wchodzą w zakres rezerwacji.","D":"Poprawna. Wycieczka 3-dniowa autokarowa wymaga autokaru (transport) i noclegów (2 noce).","tip":"Wycieczka wielodniowa = co najmniej transport + noclegi."}},{"n":3,"q":"Oczekiwania gości gospodarstwa agroturystycznego wobec usług gastronomicznych dotyczą przede wszystkim:","o":{"A":"różnorodności potraw, smaku potraw, czystości i higieny, ceny.","B":"kategorii obiektu, profesjonalizmu obsługi, znajomości języków obcych.","C":"wiarygodności, rzetelności, uczciwości, kategorii obiektu, szybkości obsługi.","D":"kompleksowości usług, różnorodności oferty systemów rezerwacyjnych."},"a":"A","img":[185,93],"e":{"A":"Poprawna. Gość ocenia jedzenie: różnorodność, smak, czystość i higienę oraz cenę.","B":"Kategoria i języki obce dotyczą raczej obsługi hotelowej, nie gastronomii.","C":"To ogólne cechy usługodawcy, nie oczekiwania wobec posiłków.","D":"Systemy rezerwacyjne nie dotyczą usług gastronomicznych.","tip":"Gastronomia = jakość, smak, higiena, cena."}},{"n":4,"q":"Funkcję poznawczą i wychowawczą, przede wszystkim, pełni turystyka","o":{"A":"tranzytowa.","B":"motywacyjna.","C":"kwalifikowana.","D":"krajoznawcza."},"a":"D","img":[278,62],"e":{"A":"Turystyka tranzytowa to przejazd przez dany obszar.","B":"Motywacyjna to nagroda dla pracowników.","C":"Kwalifikowana pełni głównie funkcję zdrowotną i sportową.","D":"Poprawna. Krajoznawstwo to poznawanie kraju – funkcja poznawcza i wychowawcza (patriotyczna).","tip":"Krajoznawcza = poznawcza + wychowawcza."}},{"n":5,"q":"Na mapie batymetrycznej przedstawiono jezioro Mosąg o powierzchni 53 ha i głębokości do 12 m. Wskaż, w której części akwenu znajduje się największa głębia.","o":{"A":"Północnej.","B":"Południowej.","C":"Północno-wschodniej.","D":"Południowo-zachodniej."},"a":"B","pic":1,"img":[340,636],"e":{"A":"Północ wskazuje strzałka N w lewo – tam głębokości są małe (1–5,5 m).","B":"Poprawna. Strzałka N wskazuje w lewo, więc prawa strona mapy to południe – tam jest izobata 12,0 m.","C":"Północno-wschodnia część jest płytka.","D":"Południowo-zachodnia część to okolice ujścia Łyny – nie najgłębsza.","tip":"Na mapie zawsze najpierw sprawdź, gdzie jest północ (strzałka N)."}},{"n":6,"q":"Gdzie znajduje się rezerwat „Błędne Skały”?","o":{"A":"W Kotlinie Kłodzkiej.","B":"Na obszarze Roztocza.","C":"W Teplickim Skalnym Mieście.","D":"W Tatrzańskim Parku Narodowym."},"a":"A","img":[976,62],"e":{"A":"Poprawna. Rezerwat Błędne Skały leży w Górach Stołowych (Park Narodowy Gór Stołowych) w regionie Kotliny Kłodzkiej.","B":"Roztocze to wyżyna na wschodzie Polski.","C":"Teplickie Skalne Miasto jest w Czechach – podobny krajobraz, ale to inne miejsce.","D":"W Tatrach nie ma rezerwatu o tej nazwie.","tip":"Błędne Skały = labirynt skalny w Górach Stołowych."}},{"n":7,"q":"Najlepsze w Polsce trasy do narciarstwa biegowego na których organizowany jest Bieg Piastów, znajdują się w górach","o":{"A":"Izerskich.","B":"Bystrzyckich.","C":"Wałbrzyskich.","D":"Kaczawskich."},"a":"A","img":[1038,93],"e":{"A":"Poprawna. Bieg Piastów odbywa się w Jakuszycach w Górach Izerskich.","B":"Góry Bystrzyckie leżą w Sudetach, ale nie tam jest Bieg Piastów.","C":"Góry Wałbrzyskie nie słyną z tras biegowych.","D":"Góry Kaczawskie nie słyną z narciarstwa biegowego.","tip":"Jakuszyce = Bieg Piastów = Góry Izerskie."}},{"n":8,"q":"Źródła wód mineralnych: Słotwinka, Jan, Józef, Mieczysław, Tadeusz, Zuber znajdują się","o":{"A":"w Solcu Zdroju.","B":"w Busku Zdroju.","C":"w Krynicy Zdroju.","D":"w Połczynie Zdroju."},"a":"C","img":[1131,62],"e":{"A":"Solec-Zdrój słynie z wód siarczkowych.","B":"Busko-Zdrój – wody siarczkowe i solanki.","C":"Poprawna. Krynica-Zdrój: źródła Jan, Józef, Słotwinka, Mieczysław, Tadeusz, Zuber.","D":"Połczyn-Zdrój – borowiny i solanki.","tip":"Zuber = Krynica."}},{"n":9,"q":"W trakcie wycieczki pieszej z grupą kolonistów na początku kolumny powinien iść","o":{"A":"najsprawniejszy uczestnik.","B":"najstarszy uczestnik.","C":"opiekun grupy.","D":"grupowy."},"a":"C","img":[1193,62],"e":{"A":"Najsprawniejszy uczestnik mógłby narzucić za szybkie tempo.","B":"Wiek nie decyduje o miejscu w kolumnie.","C":"Poprawna. Na czele kolumny idzie opiekun (wychowawca) – nadaje tempo i kieruje grupą; drugi opiekun idzie na końcu.","D":"Grupowy pomaga, ale odpowiedzialność za prowadzenie ma opiekun.","tip":"Opiekun na początku, drugi na końcu."}},{"n":10,"q":"Opracowując program wycieczki po Polsce dla młodzieży szkolnej z Izraela, należy uwzględnić zwiedzanie","o":{"A":"Gdańska, Warszawy, Opola, Wrocławia, Ełku.","B":"Leska, Tykocina, Łodzi, Krakowa, Warszawy.","C":"Szypliszek, Puńska, Sejn, Szczecina, Wrocławia.","D":"Bohoników, Kruszynian, Gdańska, Poznania, Warszawy."},"a":"B","img":[1255,92],"e":{"A":"Ełk i Opole nie są typowe dla programu dziedzictwa żydowskiego.","B":"Poprawna. Lesko i Tykocin (synagogi), Łódź (getto), Kraków (Kazimierz, Auschwitz), Warszawa (getto, POLIN) – miejsca dziedzictwa Żydów.","C":"Szypliszki, Puńsk, Sejny to miejsca związane z mniejszością litewską.","D":"Bohoniki i Kruszyniany to meczety Tatarów polskich.","tip":"Młodzież z Izraela = miejsca dziedzictwa żydowskiego."}},{"n":11,"q":"Ilość dóbr i usług, które mogą zaoferować właściciele gospodarstw agroturystycznych w określonym czasie i za określoną cenę nazywa się","o":{"A":"pakietem usług.","B":"ofertą handlową.","C":"podażą turystyczną.","D":"rynkiem agroturystycznym."},"a":"C","img":[1347,93],"e":{"A":"Pakiet usług to zestaw usług sprzedawany razem.","B":"Oferta handlowa to propozycja dla konkretnego klienta.","C":"Poprawna. Podaż turystyczna to ilość usług oferowanych w danym czasie i po danej cenie.","D":"Rynek to spotkanie podaży z popytem.","tip":"Podaż – sprzedający; popyt – kupujący."}},{"n":12,"q":"Gospodarstwo agroturystyczne przygotowuje produkt turystyczny „Tradycyjne rzemiosło ludowe związane z obróbką drewna”. Właściciel gospodarstwa powinien nawiązać współpracę","o":{"A":"z ludwisarzami i grawerami.","B":"z kuśnierzami i spinkarzami.","C":"z kaletnikami i garncarzami.","D":"z kołodziejami i snycerzami."},"a":"D","img":[1440,93],"e":{"A":"Ludwisarze odlewają dzwony, graweri ryją w metalu.","B":"Kuśnierze obrabiają futra.","C":"Kaletnicy – skóra, garncarze – glina.","D":"Poprawna. Kołodziej robi drewniane koła, snycerz – rzeźbione ozdoby w drewnie.","tip":"Drewno: kołodziej, snycerz, bednarz, cieśla."}},{"n":13,"q":"Zabezpieczeniem przed ryzykiem czarteru jest założenie w kalkulacji imprezy, że","o":{"A":"nastąpi zmiana kursu walut.","B":"nastąpi przedłużenie pobytu.","C":"wystąpi długotrwały wzrost cen paliw.","D":"nie wszystkie miejsca zostaną sprzedane."},"a":"D","img":[1533,61],"e":{"A":"Kurs walut to ryzyko kursowe, nie czarteru.","B":"Przedłużenie pobytu to inny rodzaj ryzyka.","C":"Wzrost cen paliw to ryzyko kosztowe.","D":"Poprawna. Ryzyko czarteru = niewykupione miejsca w samolocie/hotelu. Kalkuluje się cenę przy założeniu, że nie wszystkie zostaną sprzedane.","tip":"Czarter płaci się za całość, nawet gdy miejsca są puste."}},{"n":14,"q":"Od usługi noclegowej o wartości brutto 100,00 zł należy uiścić do urzędu skarbowego podatek VAT w kwocie","o":{"A":"7,41 zł.","B":"8,00 zł.","C":"18,70 zł.","D":"23,00 zł."},"a":"A","img":[1594,93],"e":{"A":"Poprawna. Nocleg ma VAT 8%: 100 × 8/108 = 7,41 zł.","B":"8 zł to 8% od 100 – ale 100 zł to już kwota brutto.","C":"18,70 zł to 23/123 – złą stawka.","D":"23 zł to 23% od brutto – błędna stawka i metoda.","tip":"Z brutto: VAT = brutto × stawka/(100+stawka)."}},{"n":15,"q":"Rezerwując miejsce w pociągu Express Intercity Premium dla 4-osobowej rodziny, która chce siedzieć obok siebie przy stoliku jak najbliżej toalety, należy wybrać miejsca:","o":{"A":"44, 41, 43, 44","B":"12, 14, 16, 15","C":"45, 43, 36, 34","D":"46, 44, 45, 43"},"a":"D","pic":1,"img":[1687,293],"e":{"A":"Miejsce 44 powtórzone, a 41 jest po drugiej stronie korytarza.","B":"12–16 są blisko WC, ale bez stolika.","C":"36, 34 nie są przy tym samym stoliku co 45 i 43.","D":"Poprawna. Miejsca 46, 45, 44, 43 są przy jednym stoliku (oznaczonym na planie) – najbliższym toalecie.","tip":"Na planie szukaj symbolu stolika między fotelami."}},{"n":16,"q":"Większość spraw dotyczących turystyki w Polsce podlega obecnie","o":{"A":"Urzędowi Turystyki.","B":"Ministerstwu Administracji.","C":"Ministerstwu Sportu i Turystyki.","D":"Ministerstwu Dziedzictwa Narodowego."},"a":"C","img":[1980,62],"e":{"A":"Urząd Kultury Fizycznej i Turystyki zlikwidowano wcześniej.","B":"Ministerstwo Administracji nie zajmuje się turystyką.","C":"Poprawna. W 2015 r. sprawy turystyki należały do Ministerstwa Sportu i Turystyki.","D":"Ministerstwo Dziedzictwa Narodowego zajmuje się kulturą.","tip":"Uwaga: w kolejnych latach turystyka przechodziła do innych ministerstw (np. rozwoju)."}},{"n":17,"q":"Termin „turystyka krajowa” zaproponowany przez Światową Organizację Turystyki (UNWTO) odnosi się do","o":{"A":"podróży wszystkich turystów po terenie jednego kraju.","B":"podróży turystycznych mieszkańców po własnym kraju.","C":"wyjazdów turystycznych mieszkańców jednego kraju.","D":"przyjazdów turystów do jednego kraju."},"a":"B","img":[2042,93],"e":{"A":"Podróże wszystkich turystów po kraju to turystyka wewnętrzna.","B":"Poprawna. Turystyka krajowa (domestic) = mieszkańcy podróżujący po własnym kraju.","C":"Wyjazdy za granicę to turystyka wyjazdowa (outbound).","D":"Przyjazdy cudzoziemców to turystyka przyjazdowa (inbound).","tip":"Krajowa = swoi u siebie."}},{"n":18,"q":"ROTWŁ to","o":{"A":"Regionalny Organ Turyzmu Województwa Łódzkiego.","B":"Regionalny Ośrodek Turystyczny Województwa Łódzkiego.","C":"Regionalna Organizacja Turystyczna Województwa Łódzkiego.","D":"Rejonowa Organizacja Turystyczna Województwa Łódzkiego."},"a":"C","img":[2135,62],"e":{"A":"„Organ” to błędne słowo.","B":"„Ośrodek” to błędne słowo.","C":"Poprawna. ROT = Regionalna Organizacja Turystyczna; ROTWŁ – Województwa Łódzkiego.","D":"„Rejonowa” to błędne słowo.","tip":"POT – Polska, ROT – regionalna, LOT – lokalna organizacja turystyczna."}},{"n":19,"q":"Miejscem spotkań uczestników rynku turystycznego są targi turystyczne. Największa impreza branży turystycznej w Europie to","o":{"A":"ITB w Berlinie.","B":"TT w Warszawie.","C":"FITUR w Madrycie.","D":"Holiday World w Pradze."},"a":"A","img":[2197,93],"e":{"A":"Poprawna. ITB Berlin to największe targi turystyczne na świecie.","B":"TT Warsaw to największe targi w Polsce.","C":"FITUR w Madrycie jest duży, ale mniejszy niż ITB.","D":"Holiday World w Pradze to targi regionalne.","tip":"ITB = Internationale Tourismus-Börse."}},{"n":20,"q":"Polska Federacja Turystyki Wiejskiej „Gospodarstwa Gościnne” powstała w roku 1996 roku. Jest organizacją o zasięgu ogólnopolskim. Jednym z głównych zadań Federacji jest","o":{"A":"budowa hoteli na terenach wiejskich.","B":"kategoryzacja wiejskiej bazy noclegowej.","C":"sprzedaż bezpośrednia produktów rolnych.","D":"umożliwienie dostępu do Internetu na terenach wiejskich."},"a":"B","img":[2290,93],"e":{"A":"Federacja nie buduje hoteli.","B":"Poprawna. PFTW „Gospodarstwa Gościnne” prowadzi kategoryzację wiejskiej bazy noclegowej (słoneczka).","C":"Sprzedaż produktów rolnych nie jest głównym zadaniem Federacji.","D":"Dostęp do Internetu nie jest zadaniem Federacji.","tip":"Słoneczka = kategoryzacja PFTW."}},{"n":21,"q":"Po 4,5 godzinnym nieprzerwanym czasie prowadzenia pojazdu, kierowca autokaru powinien wykorzystać przerwę, która powinna trwać co najmniej","o":{"A":"60 minut + czas na toaletę i kawę.","B":"60 minut.","C":"50 minut.","D":"45 minut."},"a":"D","img":[2383,93],"e":{"A":"60 minut to dłużej niż wymagane minimum.","B":"60 minut to dłużej niż minimum.","C":"50 minut to więcej niż wymagane minimum (45 minut).","D":"Poprawna. Po 4,5 h jazdy kierowca musi zrobić przerwę co najmniej 45 minut (można podzielić 15 + 30).","tip":"4,5 h jazdy → 45 min przerwy."}},{"n":22,"q":"Umowa-zgłoszenie udziału w imprezie turystycznej wystawiona przez biuro podróży powinna zawierać imię i nazwisko klienta oraz","o":{"A":"termin pobytu.","B":"numer dowodu osobistego klienta.","C":"termin pobytu i numer karty kredytowej klienta.","D":"nr pokoju w miejscu zakwaterowania i nr PESEL klienta."},"a":"A","img":[2476,93],"e":{"A":"Poprawna. Umowa musi zawierać dane klienta i termin imprezy.","B":"Numer dowodu nie jest obowiązkowy.","C":"Numer karty kredytowej nie jest elementem umowy.","D":"Numer pokoju nie jest znany w dniu zawarcia umowy.","tip":"Umowa: kto, co, kiedy, za ile."}},{"n":23,"q":"Na koloniach, aby zapewnić bezpieczeństwo, prawidłowo realizować program wypoczynku i udzielać młodzieży wsparcia w każdej sytuacji pod nadzorem jednej osoby może być nie więcej niż 20 uczestników. W przypadku dzieci do 10 lat jeden wychowawca może się opiekować maksymalnie","o":{"A":"5 uczestnikami.","B":"10 uczestnikami.","C":"15 uczestnikami.","D":"18 uczestnikami."},"a":"C","img":[2569,124],"e":{"A":"5 uczestników to zbyt mała grupa.","B":"10 to nie jest limit z przepisów.","C":"Poprawna. Dla dzieci do 10 lat – maksymalnie 15 uczestników na jednego wychowawcę.","D":"18 jest za dużo dla dzieci do 10 lat.","tip":"Starsi: do 20; do 10 lat: do 15."}},{"n":24,"q":"Integralną częścią umowy o wycieczkę zawieraną przez organizatora z turystą jest","o":{"A":"program imprezy.","B":"broszura reklamowa biura.","C":"polisa ubezpieczenia od ryzyka.","D":"informator o walorach miejsca docelowego."},"a":"A","img":[2693,62],"e":{"A":"Poprawna. Program imprezy jest integralną częścią umowy.","B":"Broszura reklamowa nie jest częścią umowy.","C":"Polisa to osobny dokument.","D":"Informator nie jest częścią umowy.","tip":"Umowa + program + warunki uczestnictwa."}},{"n":25,"q":"Rodzinne gospodarstwo agroturystyczne umiejscowione w Bieszczadach prowadzi hodowlę kóz oraz przetwórstwo mleka koziego. Położone w pobliżu inne gospodarstwo agroturystyczne zajmuje się produkcją miodu. Właściciele gospodarstw zamierzają wymieniać się towarem za towar o tej samej wartości. W związku z tym powinni podpisać umowę","o":{"A":"kupna.","B":"barterową.","C":"o współpracy.","D":"o sponsoringu."},"a":"B","img":[2755,154],"e":{"A":"Umowa kupna dotyczy zapłaty pieniędzmi.","B":"Poprawna. Barter to wymiana towaru za towar bez pieniędzy.","C":"Umowa o współpracy jest ogólna, nie dotyczy wymiany towarów.","D":"Sponsoring to finansowanie w zamian za promocję.","tip":"Barter = wymiana."}},{"n":26,"q":"Podczas podróży i pobytu opiekę nad turystami sprawują w imieniu organizatora turystyki","o":{"A":"piloci wycieczek.","B":"kierowcy autokarów.","C":"przewodnicy turystyczni.","D":"pracownicy działu obsługi klienta."},"a":"A","img":[2909,62],"e":{"A":"Poprawna. Piloci sprawują opiekę nad turystami w imieniu organizatora.","B":"Kierowcy prowadzą pojazd.","C":"Przewodnicy oprowadzają po obiektach.","D":"Pracownicy działu obsługi klienta pracują w biurze.","tip":"Pilot = przedstawiciel organizatora w trasie."}},{"n":27,"q":"Mieszkaniec Amsterdamu poszukujący informacji turystycznych dotyczących oferty gospodarstw agroturystycznych w Polsce, powinien udać się do","o":{"A":"Ambasady Rzeczypospolitej Polskiej.","B":"Polskiego Ośrodka Informacji Turystycznej.","C":"Oddziału Polskiej Agencji Rozwoju Turystyki.","D":"Niderlandzko-Polskiego Ośrodka Rozwoju Turystyki."},"a":"B","img":[2971,93],"e":{"A":"Ambasada zajmuje się sprawami konsularnymi, nie ofertą turystyczną.","B":"Poprawna. Polski Ośrodek Informacji Turystycznej (zagraniczny ośrodek POT) promuje Polskę za granicą.","C":"PART zajmowała się analizami, nie informacją dla turystów.","D":"Taka instytucja nie istnieje.","tip":"Zagraniczne Ośrodki POT = informacja o Polsce."}},{"n":28,"q":"Czas marszu ze Zwardonia przez Rycerkę Kolonię do Schroniska PTTK na Wielkiej Raczy wynosi","o":{"A":"6 godzin.","B":"3 godziny.","C":"6 godzin 20 minut.","D":"2 godziny 40 minut."},"a":"A","pic":1,"img":[3064,642],"e":{"A":"Poprawna. Zwardoń → Rycerka Kolonia 240 min + Rycerka Kolonia → Wielka Racza 120 min = 360 min = 6 godzin.","B":"3 godziny to za mało.","C":"6 h 20 min doliczono błędnie odcinek.","D":"2 h 40 min to czas innej trasy.","tip":"Licz czasy w kierunku strzałek na mapie."}},{"n":29,"q":"Produkt turystyczny uwzględniający specyfikę regionu, realizowany na terenie Magurskiego Parku Narodowego powinien obejmować","o":{"A":"spływy kajakowe i rejsy żeglarskie.","B":"zwiedzanie kompleksu sztolni i płukanie złota.","C":"wędrówkę do ruchomych wydm i nadmorskich torfowisk.","D":"zwiedzanie drewnianych cerkwi i cmentarzy z I wojny światowej."},"a":"D","img":[3706,92],"e":{"A":"Spływy kajakowe i rejsy żeglarskie nie są typowe dla Beskidu Niskiego.","B":"Sztolnie i płukanie złota to Sudety (Złoty Stok).","C":"Wydmy i torfowiska to wybrzeże (Słowiński PN).","D":"Poprawna. Magurski PN (Beskid Niski): łemkowskie drewniane cerkwie i cmentarze z I wojny światowej.","tip":"Beskid Niski = cerkwie + cmentarze wojenne."}},{"n":30,"q":"Święta Góra Grabarka to ośrodek pielgrzymkowy dla","o":{"A":"buddystów.","B":"muzułmanów.","C":"prawosławnych.","D":"katolików."},"a":"C","img":[3798,61],"e":{"A":"Buddyści nie mają takiego ośrodka.","B":"Muzułmanie: Kruszyniany, Bohoniki.","C":"Poprawna. Grabarka – najważniejsze sanktuarium prawosławne w Polsce (Góra Krzyży).","D":"Katolicy: Jasna Góra, Licheń, Kalwaria.","tip":"Grabarka = prawosławie."}},{"n":31,"q":"Skrót BB oznacza świadczenia w formie","o":{"A":"tylko noclegu.","B":"tylko śniadania.","C":"noclegu z 2 posiłkami.","D":"noclegu ze śniadaniem."},"a":"D","img":[3859,62],"e":{"A":"Sam nocleg to RO/OV.","B":"BB nie oznacza samego śniadania.","C":"Nocleg z 2 posiłkami to HB.","D":"Poprawna. BB = bed & breakfast – nocleg ze śniadaniem.","tip":"RO, BB, HB, FB, AI."}},{"n":32,"q":"Dowodem zapisu czasu pracy kierowcy autokaru jest","o":{"A":"zapis video.","B":"tarcza tachografu.","C":"oświadczenie kierowcy.","D":"wydruk z lokalizatora GPS."},"a":"B","img":[3921,62],"e":{"A":"Zapis video nie jest dokumentem czasu pracy.","B":"Poprawna. Tachograf (tarcza lub karta) rejestruje czas pracy kierowcy.","C":"Oświadczenie nie jest dowodem.","D":"GPS nie jest prawnym dowodem czasu pracy.","tip":"Tachograf = czas jazdy i przerw."}},{"n":33,"q":"Potwierdzeniem odbycia wycieczki przez turystę zdobywającego Górską Odznakę Turystyczną PTTK są","o":{"A":"zdjęcia z wycieczki.","B":"szczegółowe opisy wycieczki.","C":"pieczątki i podpisy potwierdzające przejście tras w książeczce.","D":"oświadczenia osób spotkanych na szlaku potwierdzające obecność turysty."},"a":"C","img":[3983,62],"e":{"A":"Zdjęcia nie są oficjalnym potwierdzeniem.","B":"Opisy nie wystarczą.","C":"Poprawna. GOT potwierdzają pieczątki i podpisy w książeczce GOT.","D":"Oświadczenia przypadkowych osób nie są uznawane.","tip":"Książeczka GOT + pieczątki."}},{"n":34,"q":"Najgorzej wspominam pana X. Niestety, nic na temat hotelu nie wiedział i nie chciał się dowiedzieć. Nie można było liczyć na jego pomoc. Jak się zna angielski albo hiszpański to można samemu pójść do lekarza, złożyć reklamację dotyczącą pokoju, uszkodzonego wyposażenia itp., ale jak się języka nie zna, to trzeba liczyć na pomoc innych gości. Skarga dotyczy pracy","o":{"A":"recepcjonisty.","B":"przewodnika.","C":"rezydenta biura podróży.","D":"animatora czasu wolnego."},"a":"C","img":[4045,183],"e":{"A":"Recepcjonista nie wspiera klientów w kontaktach z lekarzem.","B":"Przewodnik oprowadza po zabytkach.","C":"Poprawna. Rezydent biura w miejscu pobytu pomaga gościom: reklamacje, lekarz, informacje o hotelu.","D":"Animator organizuje zabawy.","tip":"Rezydent = opiekun biura na miejscu."}},{"n":35,"q":"Dokumentem niezbędnym do rozliczenia imprezy turystycznej jest","o":{"A":"voucher.","B":"lista kontrolna.","C":"wstępny kosztorys.","D":"faktura za zakupione usługi."},"a":"D","img":[4228,61],"e":{"A":"Voucher uprawnia do skorzystania z usług.","B":"Lista kontrolna jest pomocnicza.","C":"Wstępny kosztorys to plan, nie rozliczenie.","D":"Poprawna. Rozliczenie imprezy opiera się na fakturach za zakupione usługi.","tip":"Rozliczenie = rzeczywiste koszty z faktur."}},{"n":36,"q":"Podmiot, który świadczy usługi turystyczne opodatkowane według procedury VAT marża powinien stosować faktury z napisem","o":{"A":"„faktura marża”.","B":"„procedura marży VAT”.","C":"„procedura marży dla biur podróży”.","D":"„faktura marża — usługi turystyczne”."},"a":"C","img":[4289,93],"e":{"A":"To nie jest ustawowa formuła.","B":"To nie jest ustawowa formuła.","C":"Poprawna. Ustawa o VAT wymaga dopisku „procedura marży dla biur podróży”.","D":"To nie jest ustawowa formuła.","tip":"Zapamiętaj formułę dosłownie."}},{"n":37,"q":"Biuro podróży sprzedaje wycieczki do Prowansji. Cena wycieczki to 2 000 zł. Zaliczka na poczet wycieczki wynosi 600 zł. Koszt z tytułu nabycia towarów i usług od innych podmiotów dla bezpośredniej korzyści klienta to 1 500 zł. Skalkulowana marża brutto wynosi","o":{"A":"500 zł.","B":"600 zł.","C":"900 zł.","D":"1400 zł."},"a":"A","img":[4382,124],"e":{"A":"Poprawna. Marża brutto = cena 2000 zł – koszty dla klienta 1500 zł = 500 zł. Zaliczka nie ma znaczenia.","B":"600 zł to zaliczka.","C":"900 zł to błędny wynik.","D":"1400 zł = 2000 – 600 – błąd.","tip":"Zaliczka to forma płatności, nie koszt."}},{"n":38,"q":"Jak nazywa się największa międzynarodowa organizacja turystyczna?","o":{"A":"Światowy Związek Turystyki (WTA).","B":"Światowa Organizacja Turystyki (UNWTO).","C":"Światowa Organizacja Agencji Podróży (WOTA).","D":"Międzynarodowe Stowarzyszenie Turystyki (AIDT)."},"a":"B","img":[4506,61],"e":{"A":"WTA nie jest największą organizacją.","B":"Poprawna. UNWTO – Światowa Organizacja Turystyki, agenda ONZ z siedzibą w Madrycie.","C":"WOTA nie jest największą organizacją.","D":"AIDT nie jest największą organizacją.","tip":"UNWTO – Madryt."}},{"n":39,"q":"Przedstawiony dokument (tabela: Lp., data, numer dowodu KP/KW, wpłacający/wypłacający, treść operacji, przychód, rozchód, saldo; obroty, stan poprzedni, stan obecny) to","o":{"A":"dowód wpłaty KP.","B":"dowód wypłaty KW.","C":"raport kasowy.","D":"raport VAT."},"a":"C","ctx":1,"img":[4567,520],"e":{"A":"KP to pojedynczy dowód wpłaty.","B":"KW to pojedynczy dowód wypłaty.","C":"Poprawna. Zestawienie wielu wpłat (KP) i wypłat (KW) z saldem i stanem kasy to raport kasowy.","D":"Raport VAT zawiera kwoty podatku, nie saldo kasy.","tip":"Raport kasowy = KP + KW + saldo."}},{"n":40,"q":"Ulgowy bilet wstępu do Muzeum Etnograficznego w Ochli zalicza się do kosztów świadczeń","o":{"A":"stałych.","B":"zmiennych.","C":"rabatowych.","D":"akwizycyjnych."},"a":"B","img":[5087,62],"e":{"A":"Koszty stałe nie zależą od liczby uczestników (np. autokar).","B":"Poprawna. Bilet wstępu płaci się za każdego uczestnika – to koszt zmienny.","C":"Nie istnieje kategoria kosztów rabatowych.","D":"Koszty akwizycji dotyczą pozyskania klienta.","tip":"Stały – na grupę; zmienny – na osobę."}}],"2015-czerwiec":[{"n":1,"q":"Impreza fakultatywna jest imprezą","o":{"A":"cykliczną.","B":"komplementarną.","C":"przeznaczoną dla chętnych za dodatkową odpłatnością.","D":"przeznaczoną dla osób z wykształceniem co najmniej średnim."},"a":"C","img":[0,61],"e":{"A":"Impreza cykliczna powtarza się regularnie – to nie definicja fakultatywnej.","B":"Komplementarna = uzupełniająca, ale nie oznacza fakultatywnej.","C":"Poprawna. Fakultatywna = nieobowiązkowa, dla chętnych, za dodatkową opłatą.","D":"Wykształcenie uczestników nie ma związku z fakultatywnością.","tip":"Fakultet = dodatkowo, z wyboru."}},{"n":2,"q":"Pięć osobonoclegów w hotelarstwie oznacza, że","o":{"A":"pięć osób skorzystało z pięciu noclegów.","B":"pięć osób skorzystało z noclegu w hotelu.","C":"pięciu osobom zapewniono po pięć noclegów.","D":"pięć osób skorzystało z noclegu w pięciu hotelach."},"a":"B","img":[61,62],"e":{"A":"Pięć osób × pięć noclegów = 25 osobonoclegów.","B":"Poprawna. Osobonocleg = 1 osoba × 1 nocleg; 5 osób po 1 noclegu = 5 osobonoclegów.","C":"5 × 5 = 25 osobonoclegów.","D":"Liczba hoteli nie ma znaczenia.","tip":"Osobonoclegi = liczba osób × liczba nocy."}},{"n":3,"q":"Określenie incentive tourism oznacza turystykę","o":{"A":"biznesową.","B":"alternatywną.","C":"motywacyjną.","D":"kwalifikowaną."},"a":"C","img":[123,61],"e":{"A":"Turystyka biznesowa to podróże służbowe.","B":"Alternatywna to turystyka poza głównym nurtem.","C":"Poprawna. Incentive tourism = turystyka motywacyjna (wyjazdy w nagrodę).","D":"Kwalifikowana wymaga umiejętności i sprzętu.","tip":"Incentive = zachęta, nagroda."}},{"n":4,"q":"Potrzeba sławy oraz poczucia własnej wartości i prestiżu w oczach innych według hierarchii Maslowa to potrzeby","o":{"A":"szacunku i uznania.","B":"samorealizacji.","C":"przynależności.","D":"bezpieczeństwa."},"a":"A","img":[184,93],"e":{"A":"Poprawna. W piramidzie Maslowa potrzeby szacunku i uznania to prestiż, sława, poczucie własnej wartości.","B":"Samorealizacja to rozwój i spełnienie własnych możliwości (szczyt piramidy).","C":"Przynależność to potrzeba miłości, przyjaźni, bycia w grupie.","D":"Bezpieczeństwo to ochrona, stabilność.","tip":"Maslow: fizjologiczne → bezpieczeństwo → przynależność → szacunek → samorealizacja."}},{"n":5,"q":"Dla turystów interesujących się speleologią należy przygotować ofertę obejmującą","o":{"A":"zwiedzanie jaskiń.","B":"nurkowanie z akwalungiem.","C":"wspinanie się na strome ściany.","D":"poszukiwanie złota w potokach górskich."},"a":"A","img":[277,61],"e":{"A":"Poprawna. Speleologia to nauka o jaskiniach i ich eksploracja.","B":"Nurkowanie z akwalungiem to płetwonurkowanie.","C":"Wspinaczka po ścianach to alpinizm/wspinaczka skałkowa.","D":"Płukanie złota to atrakcja górnicza.","tip":"Speleo = jaskinia."}},{"n":6,"q":"Na jakiej wysokości bezwzględnej jest położony spichlerz z XVIII wieku?","o":{"A":"Ok. 600 m n.p.m.","B":"Ok. 650 m n.p.m.","C":"Ok. 700 m n.p.m.","D":"Ok. 750 m n.p.m."},"a":"A","pic":1,"img":[338,505],"e":{"A":"Poprawna. Spichlerz z XVIII w. stoi przy punkcie wysokościowym 604 m – ok. 600 m n.p.m.","B":"650 m to wartość zbyt wysoka dla tej okolicy.","C":"Ok. 700 m to wysokości szczytów po drugiej stronie jeziora (Piekiełko 678, Czubatka 674).","D":"750 m nie występuje w tej okolicy mapy.","tip":"Szukaj najbliższego punktu wysokościowego (kropka z liczbą)."}},{"n":7,"q":"Na fotografii przedstawiono najważniejsze turystycznie wzgórze Aten — Akropol, na którym w centralnym miejscu widać","o":{"A":"Panteon.","B":"Pompeje.","C":"Partenon.","D":"Propyleje."},"a":"C","pic":1,"img":[843,492],"e":{"A":"Panteon to świątynia w Rzymie.","B":"Pompeje to miasto zasypane przez Wezuwiusz (Włochy).","C":"Poprawna. W centrum Akropolu stoi Partenon – świątynia Ateny Partenos.","D":"Propyleje to monumentalna brama wejściowa na Akropol, nie centralny budynek.","tip":"Partenon (Ateny) ≠ Panteon (Rzym)."}},{"n":8,"q":"Przedstawione na fotografii Muzeum Papiernictwa znajduje się","o":{"A":"w Kłodzku.","B":"w Wambierzycach.","C":"w Dusznikach-Zdroju.","D":"w Ludwikowicach Kłodzkich."},"a":"C","pic":1,"img":[1335,424],"e":{"A":"W Kłodzku jest twierdza i podziemna trasa.","B":"Wambierzyce to sanktuarium maryjne („Śląska Jerozolima”).","C":"Poprawna. Muzeum Papiernictwa mieści się w zabytkowym młynie papierniczym w Dusznikach-Zdroju.","D":"Ludwikowice Kłodzkie słyną z kompleksu Riese.","tip":"Duszniki = papiernia + festiwal chopinowski."}},{"n":9,"q":"Które zdjęcie przedstawia fragment Biebrzańskiego Parku Narodowego?","o":{"A":"Zdjęcie A (jezioro wśród zalesionych wzgórz).","B":"Zdjęcie B (meandrująca rzeka wśród bagien i turzycowisk).","C":"Zdjęcie C (półwysep na dużym jeziorze).","D":"Zdjęcie D (żubry na leśnej polanie)."},"a":"B","pic":1,"img":[1759,710],"e":{"A":"Jezioro wśród zalesionych wzgórz przypomina Pojezierze lub Bieszczady (Solina).","B":"Poprawna. Meandrująca rzeka wśród bagien – to Biebrza i jej rozlewiska.","C":"Półwysep na jeziorze to krajobraz pojezierny (np. Mazury).","D":"Żubry na polanie kojarzą się z Puszczą Białowieską.","tip":"Biebrza = bagna, torfowiska, meandry."}},{"n":10,"q":"W którym mieście znajduje się Muzeum Kinematografii?","o":{"A":"W Łodzi.","B":"W Łowiczu.","C":"W Lesku.","D":"W Warszawie."},"a":"A","img":[2469,62],"e":{"A":"Poprawna. Muzeum Kinematografii znajduje się w Łodzi (pałac Scheiblera) – Łódź to miasto filmu.","B":"Łowicz słynie z folkloru i wycinanek.","C":"Lesko to Bieszczady.","D":"W Warszawie nie ma Muzeum Kinematografii.","tip":"Łódź – Szkoła Filmowa, Muzeum Kinematografii."}},{"n":11,"q":"Coroczna impreza plenerowa u stóp Łysej Góry o nazwie „Dymarki Świętokrzyskie” polega na prezentacji starożytnego zwyczaju","o":{"A":"wyrobu szkła.","B":"wytopu żelaza.","C":"wypieku chleba.","D":"wypalania garnków."},"a":"B","img":[2531,93],"e":{"A":"Szkło nie jest tematem Dymarek.","B":"Poprawna. Dymarki to piece do wytopu żelaza – impreza w Nowej Słupi pokazuje starożytne hutnictwo.","C":"Wypiek chleba nie jest tematem Dymarek.","D":"Wypalanie garnków to garncarstwo.","tip":"Dymarka = piec hutniczy."}},{"n":12,"q":"Dla kuracjuszy w Ciechocinku, cierpiących na niedobór sodu i jodu w organizmie, należy zaplanować przede wszystkim","o":{"A":"saunę parową.","B":"kąpiele perełkowe.","C":"spacer wokół tężni.","D":"kąpiele borowinowe."},"a":"C","img":[2624,93],"e":{"A":"Sauna nie dostarcza jodu i sodu.","B":"Kąpiele perełkowe to masaż pęcherzykami powietrza.","C":"Poprawna. Tężnie w Ciechocinku wytwarzają aerozol solankowy bogaty w jod i sód.","D":"Borowina to torf leczniczy.","tip":"Ciechocinek = tężnie solankowe."}},{"n":13,"q":"Forma podróży grupowej o charakterze poznawczym, realizowana za możliwie małe pieniądze, to","o":{"A":"trekking.","B":"bumping.","C":"tramping.","D":"karawaning."},"a":"C","img":[2717,62],"e":{"A":"Trekking to wędrówki piesze w górach.","B":"Bumping nie oznacza takiej podróży.","C":"Poprawna. Tramping to tani, samodzielny, poznawczy wyjazd z lokalnym transportem.","D":"Karawaning to podróże z przyczepą kempingową.","tip":"Tramping = małe pieniądze, dużo poznawania."}},{"n":14,"q":"W tabeli przedstawiono charakterystykę czterech miejscowości. Która z nich posiada najodpowiedniejsze warunki dla turystyki etnicznej?","o":{"A":"Cenne walory przyrodnicze, zwarty kompleks leśny, aktywny wypoczynek; baza noclegowa – głównie luksusowe kurorty z usługami SPA.","B":"Dużo oryginalnych chałup z końca XIX wieku, niektóre wciąż zamieszkałe; mieszkańcy oferują pobyty z nauką pieczenia chleba i bednarstwa.","C":"Raj dla miłośników przyrody: tokowiska ptaków, sejmiki bocianów, zwierzyna płowa; trasy do biegania i nordic walking.","D":"Urokliwe miejsce wysoko w górach: liczne trasy, dobre zakwaterowanie, strome stoki do wspinaczki ze sprzętem alpinistycznym."},"a":"B","img":[2779,678],"e":{"A":"Kurorty SPA to turystyka wypoczynkowa i zdrowotna.","B":"Poprawna. Stare chałupy, tradycyjne rzemiosło (chleb, bednarstwo) – idealne dla turystyki etnicznej (kultura ludowa).","C":"Ptaki i nordic walking to turystyka przyrodnicza i aktywna.","D":"Wspinaczka to turystyka kwalifikowana.","tip":"Etniczna = kultura ludowa, tradycje, rękodzieło."}},{"n":15,"q":"Która oferta jest najtańsza dla 3-osobowej rodziny (dziecko w wieku 8 lat) zamierzającej spędzić 3 dni (2 noclegi) w Disneylandzie pod Paryżem? (karnet wstępu 3-dniowy rodzinny 2+1 / nocleg w hotelu / zniżka na każdą dobę za nocleg dziecka do 11 lat)","o":{"A":"karnet 18 EUR; nocleg 30 EUR/os./doba; zniżka dla dziecka 10%","B":"karnet 10 EUR; nocleg 50 EUR/os./doba; zniżka 30%","C":"karnet 12 EUR; nocleg 80 EUR/os./doba; zniżka 50%","D":"karnet 15 EUR; nocleg 100 EUR/os./doba; nocleg dziecka gratis"},"a":"A","ctx":1,"img":[3457,351],"e":{"A":"Poprawna. A: 18 + 2 × 30 × 2 + 2 × 27 = 192 EUR – najtaniej.","B":"B: 10 + 200 + 70 = 280 EUR.","C":"C: 12 + 320 + 80 = 412 EUR.","D":"D: 15 + 400 + 0 = 415 EUR.","tip":"Licz łącznie: karnet + noclegi dorosłych + noclegi dziecka ze zniżką."}},{"n":16,"q":"Kosztem stałym w kalkulowaniu ceny imprezy turystycznej jest koszt","o":{"A":"wyżywienia.","B":"ubezpieczenia.","C":"biletów do muzeów.","D":"przewodnika turystycznego."},"a":"D","img":[3808,62],"e":{"A":"Wyżywienie liczy się na osobę – koszt zmienny.","B":"Ubezpieczenie zależy od liczby osób – koszt zmienny.","C":"Bilety są na osobę – koszt zmienny.","D":"Poprawna. Przewodnik kosztuje tyle samo bez względu na liczbę uczestników – koszt stały.","tip":"Stały – na grupę; zmienny – na osobę."}},{"n":17,"q":"Pracownik biura podróży wysłał do hotelu potwierdzenie zamówienia na noclegi grupy turystycznej wraz z przedpłatą. Będzie to rezerwacja","o":{"A":"bieżąca.","B":"wstępna.","C":"potwierdzona.","D":"gwarantowana."},"a":"D","img":[3870,93],"e":{"A":"Rezerwacja bieżąca nie jest terminem z tego zakresu.","B":"Wstępna rezerwacja nie jest potwierdzona.","C":"Potwierdzona – ale bez przedpłaty.","D":"Poprawna. Potwierdzenie z przedpłatą = rezerwacja gwarantowana (hotel trzyma pokój).","tip":"Przedpłata = gwarancja."}},{"n":18,"q":"Warunkiem wejścia na pokład samolotu po dokonaniu odprawy on-line w Internecie lub na lotnisku jest posiadanie","o":{"A":"rezerwacji.","B":"karty pokładowej.","C":"elektronicznego biletu.","D":"potwierdzenia zapłaty za bilet."},"a":"B","img":[3963,93],"e":{"A":"Rezerwacja to dopiero zamówienie miejsca.","B":"Poprawna. Na pokład wpuszcza karta pokładowa (boarding pass) wydana po odprawie.","C":"E-bilet jest potrzebny do odprawy, ale na pokład wchodzi się z kartą pokładową.","D":"Potwierdzenie zapłaty nie jest dokumentem podróży.","tip":"Odprawa → karta pokładowa → bramka."}},{"n":19,"q":"Najczęściej stosowaną formą umowy między biurem podróży a hotelem, polegającą na wynajęciu pokoi do jego wyłącznej dyspozycji bez możliwości anulowania, jest","o":{"A":"charter.","B":"franchising.","C":"timesharing.","D":"freesale arrangement."},"a":"A","img":[4056,93],"e":{"A":"Poprawna. Czarter (charter) – wynajęcie całości lub puli pokoi na wyłączność, bez prawa anulowania.","B":"Franchising to korzystanie z marki innej firmy.","C":"Timesharing to prawo do apartamentu przez kilka tygodni rocznie.","D":"Free sale – hotel potwierdza miejsca na bieżąco; nie jest na wyłączność.","tip":"Czarter = wyłączność + ryzyko pustych miejsc."}},{"n":20,"q":"Wybierz prawidłową treść rezerwacji dokonanej przez pracownika biura podróży drogą elektroniczną dla 2 osób w terminie od 11 do 13.05. w pokoju 2-osobowym w hotelu w systemie HB.","o":{"A":"„Proszę o zarezerwowanie w Waszym hotelu pokoju 2-osobowego z pełnym wyżywieniem dla 2 osób. Pozdrawiam, Jan Nowak”","B":"„Proszę o zarezerwowanie w Waszym hotelu jednego pokoju 2-osobowego dla 2 osób ze śniadaniami i obiadokolacjami w terminie od 11 do 13.05. na 2 doby. Pozdrawiam, Jan Nowak”","C":"„Proszę o zarezerwowanie w Waszym hotelu jednego pokoju 2-osobowego dla 2 osób w terminie od 11 do 13.05 na 2 doby ze śniadaniami. Pozdrawiam, Jan Nowak”","D":"„Proszę o zarezerwowanie w Waszym hotelu pokoju 2-osobowego z pełnym wyżywieniem w terminie od 11 do 13.05 dla 2 osób. Pozdrawiam, Jan Nowak”"},"a":"B","img":[4149,655],"e":{"A":"Brak terminu; „pełne wyżywienie” to FB, nie HB.","B":"Poprawna. HB = śniadania i obiadokolacje; podano termin 11–13.05, 2 doby, pokój 2-os. dla 2 osób.","C":"Same śniadania to BB.","D":"Pełne wyżywienie to FB, nie HB.","tip":"HB = half board = 2 posiłki."}},{"n":21,"q":"Podstawowym aktem prawnym dotyczącym spraw turystyki w Polsce jest","o":{"A":"zarządzenie wojewody dotyczące prowadzenia grup turystów z 21.03.2004 r.","B":"rozporządzenie Ministra Kultury dotyczące spraw turystyki z 21.09.1959 r.","C":"uchwała Polskiej Organizacji Turystycznej z 13.11.1999 r.","D":"ustawa z 29 sierpnia 1997 r. o usługach turystycznych."},"a":"D","img":[4804,62],"e":{"A":"Zarządzenie wojewody nie jest podstawowym aktem.","B":"Rozporządzenie z 1959 r. jest historyczne.","C":"POT nie stanowi prawa w formie ustaw.","D":"Poprawna. Podstawowym aktem była ustawa z 29.08.1997 r. o usługach turystycznych (od 2018 r. zastąpiona ustawą o imprezach turystycznych).","tip":"Ustawa 1997 → ustawa 2017 (od 1.07.2018)."}},{"n":22,"q":"W ramach budowania trwałej więzi z klientami Biuro Podróży Turysta zastosuje","o":{"A":"dwukrotnie obniżkę ceny imprezy o 10%.","B":"jednorazowo obniżkę ceny imprezy o 25%.","C":"program lojalnościowy dla stałych klientów.","D":"obniżkę ceny imprezy dla dzieci do 12 roku życia."},"a":"C","img":[4866,62],"e":{"A":"Dwie obniżki to promocja, nie trwała więź.","B":"Jednorazowa obniżka to promocja.","C":"Poprawna. Program lojalnościowy nagradza stałych klientów – buduje trwałą więź.","D":"Zniżka dla dzieci to strategia cenowa.","tip":"Lojalność = długotrwała relacja."}},{"n":23,"q":"Piątym, istotnym instrumentem marketingu mix, występującym w działalności usługowej, jest","o":{"A":"produkt lub asortyment produktów.","B":"promocja, czyli informacja o firmie i jej produktach.","C":"cena, bo klient zadowolony z produktu, szybko o niej zapomina.","D":"personel, ponieważ ma znaczący wpływ na jakość świadczonych usług."},"a":"D","img":[4928,61],"e":{"A":"Produkt to jeden z 4P.","B":"Promocja to jeden z 4P.","C":"Cena to jeden z 4P.","D":"Poprawna. W usługach dodaje się 5. P – personel (people), który wpływa na jakość usług.","tip":"4P + people = 5P (dalej: process, physical evidence)."}},{"n":24,"q":"Oferta promocyjna biura podróży first minute dotyczy imprez sprzedawanych","o":{"A":"wyłącznie jako podróż poślubna.","B":"tuż przed rozpoczęciem imprezy.","C":"w pierwszym roku jego działalności.","D":"tuż po wprowadzeniu oferty na rynek."},"a":"D","img":[4989,62],"e":{"A":"First minute nie dotyczy podróży poślubnych.","B":"Tuż przed imprezą to last minute.","C":"Rok działalności biura nie ma znaczenia.","D":"Poprawna. First minute = sprzedaż zaraz po wprowadzeniu oferty, z rabatem za wczesny zakup.","tip":"First = pierwsze; last = ostatnie."}},{"n":25,"q":"Biuro podróży z Krakowa organizujące obóz wędrowny dla młodzieży na Mazurach i Podlasiu powinno zgłosić tę formę wypoczynku do Kuratorium Oświaty","o":{"A":"w Krakowie.","B":"w Białymstoku.","C":"w Krakowie i Olsztynie.","D":"w Olsztynie i Białymstoku."},"a":"A","img":[5051,93],"e":{"A":"Poprawna. Wypoczynek zgłasza się do kuratorium właściwego dla siedziby organizatora – biuro z Krakowa zgłasza w Krakowie.","B":"Białystok byłby właściwy dla organizatora z Podlasia.","C":"Olsztyn nie jest siedzibą organizatora.","D":"Miejsce obozu nie decyduje o kuratorium.","tip":"Kuratorium wg siedziby organizatora."}},{"n":26,"q":"Organizując zwiedzanie krajoznawcze Krakowa touroperator powinien wynająć","o":{"A":"pilota wycieczek.","B":"instruktora kultury.","C":"przewodnika miejskiego.","D":"animatora krajoznawstwa."},"a":"C","img":[5144,62],"e":{"A":"Pilot opiekuje się grupą w podróży, nie oprowadza po mieście.","B":"Instruktor kultury to inny zawód.","C":"Poprawna. Zwiedzanie miasta prowadzi przewodnik miejski z uprawnieniami.","D":"Takiej funkcji nie ma.","tip":"Miasto = przewodnik miejski."}},{"n":27,"q":"Szkoła podstawowa wynajęła od firmy transportowej autokar. Strony przyjęły założenia: cena za 1 km to 4 zł, przebieg dzienny wynosi 400 km, czas wynajęcia autokaru 2 dni. Oblicz koszt wynajmu autokaru.","o":{"A":"3060 zł","B":"3200 zł","C":"3460 zł","D":"3600 zł"},"a":"B","img":[5206,92],"e":{"A":"3060 zł – błąd w obliczeniach.","B":"Poprawna. 400 km × 2 dni = 800 km × 4 zł = 3200 zł.","C":"3460 zł – błąd.","D":"3600 zł – błąd.","tip":"Kilometry łącznie × stawka."}},{"n":28,"q":"Jaką wysokość zaliczki zobowiązany jest zapłacić klient za 3 doby w pensjonacie, jeśli cena jednostkowa pobytu wynosi 200 zł/dobę, a gospodarz w potwierdzeniu rezerwacji prosi o przelanie 50% tej kwoty?","o":{"A":"100 zł","B":"200 zł","C":"250 zł","D":"300 zł"},"a":"D","img":[5298,93],"e":{"A":"100 zł to połowa ceny jednej doby.","B":"200 zł to cena jednej doby.","C":"250 zł – błąd.","D":"Poprawna. 3 doby × 200 zł = 600 zł; 50% = 300 zł.","tip":"Zaliczka liczona od całości pobytu."}},{"n":29,"q":"Integralną częścią umowy o wycieczkę zawieraną przez organizatora z turystą jest","o":{"A":"program imprezy.","B":"broszura reklamowa biura.","C":"polisa ubezpieczenia od ryzyka.","D":"informator o walorach miejsca docelowego."},"a":"A","img":[5391,62],"e":{"A":"Poprawna. Program imprezy jest integralną częścią umowy z turystą.","B":"Broszura reklamowa nie jest częścią umowy.","C":"Polisa to osobny dokument.","D":"Informator nie jest częścią umowy.","tip":"Umowa + program + warunki."}},{"n":30,"q":"Zgodnie z obowiązującymi przepisami w turystyce, zapewnienie awaryjnego powrotu turystów z wakacji po bankructwie biura organizującego wyjazd spoczywa na","o":{"A":"urzędzie wojewódzkim.","B":"firmie ubezpieczeniowej.","C":"urzędzie marszałkowskim.","D":"Ministerstwie Spraw Zagranicznych."},"a":"C","img":[5453,93],"e":{"A":"Urząd wojewódzki nie organizuje powrotów.","B":"Ubezpieczyciel wypłaca gwarancję, ale organizacją powrotu zajmuje się marszałek.","C":"Poprawna. Marszałek województwa organizuje sprowadzenie turystów z gwarancji ubezpieczeniowej biura (dziś także TFG).","D":"MSZ pomaga konsularnie, ale nie organizuje powrotu.","tip":"Bankructwo biura → marszałek województwa."}},{"n":31,"q":"Po okresie prowadzenia autokaru turystycznego trwającym cztery i pół godziny, kierowca powinien zrobić ciągłą przerwę (odpoczynek) trwającą co najmniej","o":{"A":"10 minut.","B":"20 minut.","C":"35 minut.","D":"45 minut."},"a":"D","img":[5546,93],"e":{"A":"10 minut to za krótko.","B":"20 minut to za krótko.","C":"35 minut to za krótko.","D":"Poprawna. Po 4,5 h jazdy – przerwa co najmniej 45 minut.","tip":"4,5 h → 45 min."}},{"n":32,"q":"Świadczenie usług gastronomicznych w miejscu wskazanym przez zamawiającego to","o":{"A":"cabotage.","B":"catering.","C":"cooking.","D":"carteling."},"a":"B","img":[5639,62],"e":{"A":"Kabotaż to przewóz wewnątrz innego kraju przez obcego przewoźnika.","B":"Poprawna. Catering to przygotowanie i podanie posiłków w miejscu wskazanym przez klienta.","C":"Cooking to po prostu gotowanie.","D":"Kartel to nielegalna zmowa firm.","tip":"Catering = jedzenie z dowozem."}},{"n":33,"q":"Z powodu zmiany kursu walut biuro podróży k ywienie to FB.","D":"Poprawna. 4.06–15.06 = 11 nocy × 2 osoby = 22 osobonoclegi, HB = śniadania i obiad(okolacja).","tip":"Noce: data wyjazdu – data przyjazdu."}},{"n":36,"q":"Który dokument ułatwia i znosi kontrole graniczne między państwami Unii Europejskiej objętymi tym porozumieniem?","o":{"A":"Tabela Frankfurcka.","B":"Umowa z Schengen.","C":"Kodeks Etyki Turystycznej.","D":"Dyrektywa Rady 90/314/EWG."},"a":"B","img":[7315,92],"e":{"A":"Tabela frankfurcka służy do wyliczania obniżek za wady imprezy.","B":"Poprawna. Układ z Schengen znosi kontrole na granicach wewnętrznych.","C":"Kodeks Etyki Turystycznej to zasady etyczne.","D":"Dyrektywa 90/314 dotyczyła imprez turystycznych.","tip":"Schengen = brak kontroli granicznych."}},{"n":37,"q":"Największą atrakcyjność do prowadzenia turystyki żeglarskiej przez gospodarstwa agroturystyczne ma gmina (udział wód w powierzchni / liczba stanic wodnych / liczba jezior / liczba jezior pow. 1 ha / długość linii brzegowej)","o":{"A":"20% / 8 stanic / 38 jezior / 14 / 354 km","B":"17% / 2 / 40 / 12 / 274 km","C":"35% / 5 / 30 / 10 / 348 km","D":"24% / 2 / 23 / 6 / 259 km"},"a":"A","ctx":1,"img":[7407,307],"e":{"A":"Poprawna. Najwięcej stanic wodnych (8), najwięcej jezior > 1 ha (14) i najdłuższa linia brzegowa (354 km).","B":"Tylko 2 stanice i krótsza linia brzegowa.","C":"Duży udział wód, ale mniej stanic, jezior i krótszy brzeg.","D":"Najsłabsze parametry.","tip":"Dla żeglarzy liczą się stanice wodne i linia brzegowa."}},{"n":38,"q":"W którym mieście odbywają się Międzynarodowe Targi Turystyczne „Tour Salon”?","o":{"A":"W Warszawie.","B":"W Krakowie.","C":"W Poznaniu.","D":"W Berlinie."},"a":"C","img":[7714,61],"e":{"A":"W Warszawie są targi TT Warsaw.","B":"W Krakowie są Międzynarodowe Targi Turystyki.","C":"Poprawna. Tour Salon to targi w Poznaniu (MTP).","D":"W Berlinie są targi ITB.","tip":"Tour Salon = Poznań."}},{"n":39,"q":"Tabela przedstawia fragment niedokończonej kalkulacji imprezy turystycznej: bilety wstępu – 10 o
