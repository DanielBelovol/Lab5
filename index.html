ski – Tatry.","tip":"Karkonosze = Sudety.","long":"Karpacz i Szklarska Poręba leżą w Karkonoszach, a Karkonosze są częścią Sudetów. Dlatego potrzebny jest przewodnik sudecki. W Beskidach – beskidzki, w Tatrach – tatrzański."}},{"n":26,"q":"W czasie trwania imprezy turystycznej obowiązkiem pilota wycieczek jest przede wszystkim","o":{"A":"udział w spotkaniach towarzyskich z klientami.","B":"dobór zwiedzanych atrakcji turystycznych.","C":"organizowanie czasu wolnego turystom.","D":"sprawowanie opieki nad uczestnikami."},"a":"D","img":[3332,44],"e":{"A":"Spotkania towarzyskie nie są obowiązkiem.","B":"Dobór atrakcji to rola organizatora (program).","C":"Czas wolny nie musi być organizowany.","D":"Poprawna. Pilot sprawuje opiekę nad uczestnikami i dba o realizację programu.","tip":"Pilot = opieka + realizacja programu.","long":"Najważniejszy obowiązek pilota to opieka nad uczestnikami: pilnuje, żeby wszyscy byli bezpieczni, żeby program się odbywał, żeby hotel i jedzenie były takie, jak obiecano. Atrakcje wybiera biuro, a czas wolny to czas turystów."}},{"n":27,"q":"Który posiłek, jako pierwszy, przysługuje turystom korzystającym w hotelu z pełnego wyżywienia, jeżeli kończą pobyt śniadaniem?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"A","img":[3376,72],"e":{"A":"Poprawna. Przy FB (pełne wyżywienie) liczba posiłków się równoważy: skoro pobyt kończy się śniadaniem, to zaczyna się od obiadu.","B":"Kolacja byłaby pierwszym posiłkiem przy HB kończącym się śniadaniem? Nie – w FB zaczyna się od obiadu.","C":"Śniadanie podaje się dopiero po pierwszym noclegu.","D":"Obiadokolacja dotyczy HB.","tip":"FB: start obiadem → koniec śniadaniem; HB: start obiadokolacją → koniec śniadaniem.","long":"Pobyt z pełnym wyżywieniem ma tyle samo posiłków każdego rodzaju. Jeśli ostatni posiłek to śniadanie (w dniu wyjazdu), to pierwszy musi być obiad w dniu przyjazdu – wtedy liczba obiadów, kolacji i śniadań się zgadza. To ważne przy liczeniu posiłków w kalkulacji."}},{"n":28,"q":"Który dokument może przesłać pracownik biura podróży do pensjonatu celem usprawnienia zakwaterowania grupy?","o":{"A":"Listę paszportową.","B":"Listę uczestników.","C":"Umowę allotmentu.","D":"Potwierdzenie zamówienia."},"a":"B","img":[3448,72],"e":{"A":"Zapytanie ofertowe wysyła się przed rezerwacją.","B":"Umowa allotmentu dotyczy puli miejsc na dłuższy okres.","C":"Lista paszportowa – do granicy/przewoźnika.","D":"Poprawna. Lista uczestników (z rozmieszczeniem – rooming list) usprawnia zakwaterowanie.","tip":"Do hotelu – lista uczestników / rooming list.","long":"Lista uczestników pozwala hotelowi przygotować pokoje i szybko zameldować grupę – ma imiona, nazwiska, często podział na pokoje. Zapytanie ofertowe wysyła się przed rezerwacją, umowa allotmentu to umowa o pulę pokoi, a lista paszportowa jest na granicę."}},{"n":29,"q":"Która atrakcja turystyczna znajduje się w Zakopanem?","o":{"A":"Wały Chrobrego.","B":"Ogród Saski.","C":"Łazienki Królewskie.","D":"Krupówki."},"a":"D","img":[3520,43],"e":{"A":"Wały Chrobrego – Szczecin.","B":"Ogród Saski – Warszawa.","C":"Łazienki Królewskie – Warszawa.","D":"Poprawna. Krupówki – główny deptak Zakopanego.","tip":"Krupówki = Zakopane.","long":"Krupówki to najbardziej znana ulica w Zakopanem – deptak ze sklepami i restauracjami. Wały Chrobrego są w Szczecinie, a Ogród Saski i Łazienki Królewskie w Warszawie."}},{"n":30,"q":"Przedstawiony na rysunku późnobarokowy zespół pałacowo-parkowy Branickich, zwany Wersalem Podlasia, to atrakcja turystyczna, którą można zaproponować turystom podczas wycieczki do","o":{"A":"Białegostoku.","B":"Zamościa.","C":"Olsztyna.","D":"Ostródy."},"a":"A","pic":1,"img":[3563,341],"e":{"A":"Poprawna. Pałac Branickich – „Wersal Podlasia” – w Białymstoku.","B":"Zamość – renesans, Zamoyscy.","C":"Olsztyn – zamek kapituły warmińskiej.","D":"Ostróda – zamek krzyżacki.","tip":"Wersal Podlasia = Białystok.","long":"Pałac Branickich, nazywany „Wersalem Podlasia”, jest w Białymstoku. Wersal to słynny pałac francuskich królów, a białostocki pałac jest do niego podobny. Podlasie = Białystok."}},{"n":31,"q":"Folder promujący uzdrowiska Kotliny Kłodzkiej powinien zawierać informacje o sanatoriach zlokalizowanych","o":{"A":"w Szczawnicy i Muszynie.","B":"w Ciechocinku i Inowrocławiu.","C":"w Solcu-Zdroju i Busku-Zdroju.","D":"w Lądku-Zdroju i Polanicy-Zdroju."},"a":"D","img":[3904,43],"e":{"A":"Szczawnica i Muszyna – Pieniny i Beskid Sądecki (Małopolska).","B":"Ciechocinek i Inowrocław – Kujawy (tężnie).","C":"Solec-Zdrój i Busko-Zdrój – Ponidzie (świętokrzyskie).","D":"Poprawna. Lądek-Zdrój i Polanica-Zdrój leżą w Kotlinie Kłodzkiej (Sudety), tak jak Kudowa i Duszniki-Zdrój.","tip":"Kotlina Kłodzka: Polanica, Duszniki, Kudowa, Lądek.","long":"Kotlina Kłodzka leży w Sudetach i ma dużo uzdrowisk: Lądek-Zdrój, Polanica-Zdrój, Kudowa-Zdrój, Duszniki-Zdrój. Szczawnica i Muszyna są w Małopolsce, Ciechocinek i Inowrocław na Kujawach, a Solec i Busko w świętokrzyskim."}},{"n":32,"q":"Do której miejscowości w Beskidzie Śląskim zabierze pilot wycieczek grupę turystów, chcąc pokazać im wytwarzanie regionalnych wyrobów koronkarskich?","o":{"A":"Do Wisły.","B":"Do Ustronia.","C":"Do Szczyrku.","D":"Do Koniakowa."},"a":"D","img":[3947,73],"e":{"A":"Wisła – skocznie, Zameczek Prezydenta.","B":"Ustroń – uzdrowisko.","C":"Szczyrk – narciarstwo.","D":"Poprawna. Koniaków słynie z koronek koniakowskich (szydełkowych).","tip":"Koronki = Koniaków.","long":"Koniaków w Beskidzie Śląskim słynie z koronek – ręcznie robionych serwetek i ozdób. To ich znak rozpoznawczy. Wisła, Ustroń i Szczyrk są znane z turystyki i narciarstwa, a nie z koronek."}},{"n":33,"q":"Który dokument teczki pilota wycieczek potwierdza wykupienie przez organizatora turystyki usług w hotelu dla grupy?","o":{"A":"Voucher.","B":"Eurolista.","C":"Rooming list.","D":"Potwierdzenie zamówienia."},"a":"A","img":[4020,72],"e":{"A":"Poprawna. Voucher potwierdza wykupienie usług u usługodawcy.","B":"Eurolista – lista uczestników dla przewoźnika/granicy.","C":"Rooming list – rozmieszczenie w pokojach.","D":"Potwierdzenie zamówienia nie oznacza wykupienia.","tip":"Voucher = opłacona usługa.","long":"Voucher to dokument potwierdzający, że organizator zapłacił za usługi w hotelu. Pilot daje go w recepcji. Rooming list to lista, kto z kim śpi w pokoju, eurolista dotyczy granicy, a potwierdzenie zamówienia to jeszcze nie dowód zapłaty."}},{"n":34,"q":"Który dokument powinien sporządzić pracownik biura podróży w celu obliczenia ceny jednostkowej organizowanej imprezy turystycznej?","o":{"A":"Kartę rozliczenia.","B":"Kalkulację ceny.","C":"Zestawienie faktur.","D":"Sprawozdanie finansowe."},"a":"B","img":[4092,199],"e":{"A":"Karta rozliczenia – po imprezie.","B":"Poprawna. Kalkulacja ceny służy do wyznaczenia ceny przed imprezą.","C":"Zestawienie faktur – rozliczenie.","D":"Sprawozdanie finansowe – całej firmy.","tip":"Przed – kalkulacja; po – rozliczenie.","long":"Kalkulacja ceny to tabelka, w której biuro dodaje wszystkie koszty (noclegi, jedzenie, autokar, bilety), potem marżę i VAT, a na końcu dzieli przez liczbę uczestników. Tak wychodzi cena jednostkowa – na jedną osobę. Faktury, sprawozdanie i karta rozliczenia robi się dopiero po imprezie, żeby ją rozliczyć."}},{"n":35,"q":"Który z wymienionych dokumentów nie jest potwierdzeniem poniesienia kosztów usług turystycznych?","o":{"A":"Polisa ubezpieczeniowa.","B":"Faktura za transport autokarowy.","C":"Bilety wstępów do zwiedzanych obiektów.","D":"Cennik noclegów schroniska młodzieżowego."},"a":"D","img":[4291,43],"e":{"A":"Polisa potwierdza zapłatę za ubezpieczenie.","B":"Faktura za autokar potwierdza poniesiony koszt.","C":"Bilety wstępu potwierdzają wydatek.","D":"Poprawna. Cennik to tylko oferta z cenami – nie dowodzi, że jakikolwiek koszt został poniesiony.","tip":"Dowody kosztów: faktury, rachunki, bilety, polisy.","long":"Potwierdzenie poniesienia kosztów to dokument, który pokazuje, że naprawdę zapłacono: faktura, bilety, polisa. Cennik pokazuje tylko, ile coś kosztuje, ale nie udowadnia, że ktoś zapłacił. Dlatego cennik nie jest potwierdzeniem kosztów."}},{"n":36,"q":"Który dokument jest potwierdzeniem sprzedaży usługi turystycznej osobie fizycznej, nie prowadzącej działalności gospodarczej?","o":{"A":"Faktura marża.","B":"Raport kasowy.","C":"Polecenie przelewu.","D":"Paragon z kasy fiskalnej."},"a":"D","img":[4334,199],"e":{"A":"Faktura VAT marża jest dla klientów, którzy jej żądają (np. firm).","B":"Raport kasowy – dokument wewnętrzny.","C":"Polecenie przelewu to dyspozycja bankowa, nie dowód sprzedaży.","D":"Poprawna. Sprzedaż osobie fizycznej nieprowadzącej działalności rejestruje się na kasie fiskalnej i wydaje paragon.","tip":"Osoba prywatna = paragon fiskalny.","long":"Osoba prywatna, która nie ma firmy, zwykle dostaje paragon z kasy fiskalnej. Faktura jest głównie dla firm (lub na prośbę klienta). Raport kasowy to dokument wewnętrzny kasy, a polecenie przelewu to sposób płacenia przez bank."}},{"n":37,"q":"Na podstawie danych z tabeli oblicz różnicę pomiędzy wpływami i kosztami dotyczącymi organizacji krajowej wycieczki dla grupy 30 osób płacących, jeżeli cena jednostkowa wynosi 150,00 zł.","o":{"A":"295,00 zł","B":"450,00 zł","C":"700,00 zł","D":"750,00 zł"},"a":"B","ctx":"Rodzaj usługi Koszt (zł) transport 2 200,00 wyżywienie 800,00 pilot wycieczek 500,00 przewodnictwo 250,00 turystyczne bilety wstępów 300,00","pic":1,"img":[4533,266],"e":{"A":"295 zł – błąd.","B":"Poprawna. Przychód: 30 × 150 = 4 500 zł. Koszty: 2 200 + 800 + 500 + 250 + 300 = 4 050 zł. Marża = 4 500 − 4 050 = 450,00 zł.","C":"700 zł – błąd.","D":"750 zł – błąd.","tip":"Marża = sprzedaż − koszty.","long":"Biuro dostało od 30 osób po 150 zł, czyli 4500 zł. Koszty to: 2200 + 800 + 500 + 250 + 300 = 4050 zł. Marża to różnica między tym, co biuro dostało, a tym, co wydało: 4500 − 4050 = 450 zł."}},{"n":38,"q":"Który dokument powinien sporządzić pracownik biura podróży w celu końcowego rozliczenia imprezy turystycznej?","o":{"A":"Tabelę wpływów.","B":"Kartę rozliczeniową.","C":"Zestawienie kosztów.","D":"Kalkulację ceny."},"a":"B","img":[4799,199],"e":{"A":"Tabela wpływów – część danych.","B":"Poprawna. Karta rozliczeniowa = końcowe rozliczenie imprezy.","C":"Zestawienie kosztów – część danych.","D":"Kalkulacja ceny – przed imprezą.","tip":"Rozliczenie = karta rozliczeniowa.","long":"Po imprezie biuro robi kartę rozliczeniową – pokazuje w niej wszystkie wpływy (wpłaty klientów) i wszystkie wydatki, i sprawdza, czy zarobiło. To końcowe rozliczenie imprezy."}},{"n":39,"q":"Biuro podróży w kalkulacji ceny krajowej imprezy turystycznej założyło marżę bez podatku VAT w wysokości 203,25 zł. Oblicz zakładany podatek VAT.","o":{"A":"45,08 zł","B":"46,75 zł","C":"55,23 zł","D":"57,50 zł"},"a":"B","img":[4998,73],"e":{"A":"45,08 zł – błędne obliczenie.","B":"Poprawna. VAT od marży w Polsce = 23% marży netto: 203,25 × 0,23 = 46,75 zł.","C":"55,23 zł – błędne obliczenie.","D":"57,50 zł – błędne obliczenie.","tip":"W biurach podróży VAT liczymy tylko od marży (procedura VAT marża), stawka 23%.","long":"Biuro podróży płaci VAT tylko od swojej marży (zarobku), a stawka wynosi 23%. Liczymy 23% z 203,25 zł: 203,25 × 0,23 = 46,75 zł. Marża już jest „bez VAT”, więc po prostu mnożymy przez 0,23."}},{"n":40,"q":"Który z wymienionych dokumentów jest niezbędny do rozliczenia finansowego imprezy turystycznej?","o":{"A":"Raport kasowy.","B":"Umowa hotelowa.","C":"Faktura usługodawcy.","D":"Umowa z kontrahentem."},"a":"C","img":[5071,43],"e":{"A":"Raport kasowy – operacje kasowe firmy.","B":"Umowa hotelowa nie dowodzi poniesienia kosztu.","C":"Poprawna. Faktury od usługodawców dokumentują poniesione koszty.","D":"Umowa z kontrahentem nie dowodzi kosztu.","tip":"Rozliczenie = faktury kosztowe.","long":"Rozliczenie imprezy polega na porównaniu, ile biuro dostało od klientów i ile naprawdę wydało. To, ile wydało, udowadniają faktury od usługodawców (hotelu, przewoźnika, restauracji). Bez faktur nie da się rozliczyć imprezy."}}],"2021-czerwiec":[{"n":1,"q":"Udostępnienie sprzętu nagłaśniającego i multimedialnego w sali wielofunkcyjnej hotelu jest charakterystyczne dla turystyki","o":{"A":"miejskiej.","B":"alternatywnej.","C":"konferencyjnej.","D":"kwalifikowanej."},"a":"C","img":[0,78],"e":{"A":"Turystyka miejska – zwiedzanie miast.","B":"Turystyka alternatywna – niszowa, poza masowym ruchem.","C":"Poprawna. Sprzęt nagłaśniający i multimedialny w sali hotelowej służy konferencjom i szkoleniom – turystyka konferencyjna (biznesowa, MICE).","D":"Kwalifikowana – wymaga umiejętności i sprzętu sportowego.","tip":"MICE: Meetings, Incentives, Conferences, Exhibitions."}},{"n":2,"q":"Turystom interesującym się produkcją wina należy zaoferować imprezę","o":{"A":"geoturystyki.","B":"enoturystyki.","C":"ekoturystyki.","D":"fanoturystyki."},"a":"B","img":[78,49],"e":{"A":"Geoturystyka – obiekty geologiczne.","B":"Poprawna. Enoturystyka (gr. oinos – wino) – zwiedzanie winnic, degustacje.","C":"Ekoturystyka – przyroda.","D":"Fanoturystyka – kibice.","tip":"Eno = wino."}},{"n":3,"q":"Dla grupy osób zainteresowanych podróżą do miejsca pochodzenia należy zorganizować wyjazd na turystyczną imprezę o charakterze","o":{"A":"zdrowotnym.","B":"motywacyjnym.","C":"sentymentalnym.","D":"pielgrzymkowym."},"a":"C","img":[127,78],"e":{"A":"Zdrowotna – uzdrowiska, leczenie.","B":"Motywacyjna – nagroda dla pracowników.","C":"Poprawna. Turystyka sentymentalna (nostalgiczna) – podróże do miejsc pochodzenia, korzeni rodziny.","D":"Pielgrzymkowa – miejsca kultu religijnego.","tip":"Korzenie, miejsce urodzenia = sentymentalna."}},{"n":4,"q":"W którym europejskim mieście turyści mogą podziwiać Centrum Pompidou – awangardowy budynek z największą na świecie kolekcją sztuki współczesnej i nowoczesnej?","o":{"A":"W Paryżu.","B":"W Rzymie.","C":"W Wiedniu.","D":"W Madrycie."},"a":"A","img":[205,78],"e":{"A":"Poprawna. Centrum Pompidou (Centre Georges Pompidou) – Paryż, sztuka nowoczesna, architektura z rurami na zewnątrz.","B":"Rzym – Koloseum, Watykan.","C":"Wiedeń – Albertina, Belweder.","D":"Madryt – Prado, Reina Sofía.","tip":"Pompidou = Paryż."}},{"n":5,"q":"Oblicz rzeczywistą długość trasy Tomaszów Mazowiecki – Piotrków Trybunalski, jeżeli 11 cm to odległość między miastami odczytana na mapie sporządzonej w skali 1:250 000.","o":{"A":"25,0 km","B":"27,5 km","C":"30,0 km","D":"32,5 km"},"a":"B","img":[283,78],"e":{"A":"25 km = 10 cm – błąd.","B":"Poprawna. Skala 1:250 000 → 1 cm = 2,5 km. 11 × 2,5 = 27,5 km.","C":"30 km = 12 cm.","D":"32,5 km = 13 cm.","tip":"Mianownik : 100 000 = km w 1 cm."}},{"n":6,"q":"W którym regionie Polski znajduje się przedstawiona na zdjęciu, wpisana na listę Światowego Dziedzictwa UNESCO, cerkiew w Kwiatoniu?","o":{"A":"Na Warmii.","B":"Na Podlasiu.","C":"W Małopolsce.","D":"W Wielkopolsce."},"a":"C","pic":1,"img":[361,255],"e":{"A":"Warmia – gotyk ceglany.","B":"Podlasie – cerkwie prawosławne, ale nie Kwiatoń.","C":"Poprawna. Kwiatoń leży w Beskidzie Niskim (województwo małopolskie) – drewniana cerkiew łemkowska, UNESCO.","D":"Wielkopolska – Szlak Piastowski.","tip":"Drewniane cerkwie UNESCO: Kwiatoń, Owczary, Powroźnik, Brunary (Małopolska), Smolnik, Turzańsk (Podkarpacie)."}},{"n":7,"q":"Które parki narodowe znajdują się na południu Polski?","o":{"A":"Słowiński i Poleski.","B":"Pieniński i Gorczański.","C":"Woliński i Kampinoski.","D":"Drawieński i Biebrzański."},"a":"B","img":[616,171],"e":{"A":"Słowiński – Pomorze; Poleski – Lubelszczyzna.","B":"Poprawna. Pieniński i Gorczański PN leżą w Karpatach (Małopolska) – na południu Polski.","C":"Woliński – wybrzeże; Kampinoski – Mazowsze.","D":"Drawieński – Pomorze Zachodnie; Biebrzański – Podlasie.","tip":"Południe = góry: Tatry, Pieniny, Gorce, Babia Góra, Bieszczady, Magura, Karkonosze, Góry Stołowe."}},{"n":8,"q":"Na podstawie zdjęcia określ, który obiekt polecił właściciel pensjonatu na Kaszubach gościom wybierającym się na wycieczkę po okolicy.","o":{"A":"Dom w Szymbarku.","B":"Zagroda w Guciowie.","C":"Malowana chata w Zalipiu.","D":"Dom przysłupowy w Bogatyni."},"a":"A","pic":1,"img":[787,313],"e":{"A":"Poprawna. Na zdjęciu dom do góry nogami w Szymbarku – Kaszuby (Centrum Edukacji i Promocji Regionu).","B":"Zagroda w Guciowie – Roztocze.","C":"Malowana chata w Zalipiu – Małopolska (Powiśle Dąbrowskie).","D":"Domy przysłupowe – Bogatynia, Łużyce (Dolny Śląsk).","tip":"Szymbark = Kaszuby."}},{"n":9,"q":"Które zdjęcie przedstawia Bazylikę Mariacką w Krakowie?","o":{"A":"Zdjęcie A","B":"Zdjęcie B","C":"Zdjęcie C","D":"Zdjęcie D"},"a":"A","pic":1,"img":[1100,465],"e":{"A":"Poprawna. Zdjęcie A przedstawia Bazylikę Mariacką w Krakowie – gotycki kościół z dwiema nierównymi wieżami przy Rynku Głównym (hejnał).","B":"Inna świątynia.","C":"Inna świątynia.","D":"Inna świątynia.","tip":"Mariacki: dwie wieże różnej wysokości, Rynek Główny w Krakowie."}},{"n":10,"q":"Przygotowując program letniej kolonii dla małych dzieci nad jeziorem należy uwzględnić","o":{"A":"naukę raftingu.","B":"zabawy plenerowe nad wodą.","C":"udział w zawodach wioślarskich.","D":"przejazdy quadami wzdłuż brzegu."},"a":"B","img":[1565,176],"e":{"A":"Rafting jest niebezpieczny dla małych dzieci.","B":"Poprawna. Zabawy plenerowe nad wodą są bezpieczne i dostosowane do wieku małych dzieci.","C":"Zawody wioślarskie – dla starszej młodzieży.","D":"Quady – niebezpieczne i niedozwolone dla dzieci.","tip":"Program dopasowujemy do wieku uczestników."}},{"n":11,"q":"W programie wycieczki do województwa kujawsko-pomorskiego można uwzględnić zwiedzanie","o":{"A":"Żywego Muzeum Piernika w Toruniu.","B":"Zamku Krzyżackiego w Malborku.","C":"Twierdzy Boyen w Giżycku.","D":"Złotej Bramy w Gdańsku."},"a":"A","img":[1741,176],"e":{"A":"Poprawna. Toruń leży w województwie kujawsko-pomorskim – Żywe Muzeum Piernika.","B":"Malbork – pomorskie.","C":"Twierdza Boyen w Giżycku – warmińsko-mazurskie.","D":"Złota Brama – Gdańsk, pomorskie.","tip":"Kujawsko-pomorskie: Toruń, Bydgoszcz, Ciechocinek, Biskupin."}},{"n":12,"q":"Organizując obóz narciarski w Zwardoniu należy podczas zajęć zapewnić przede wszystkim opiekę","o":{"A":"ratownika górskiego.","B":"animatora narciarstwa.","C":"instruktora narciarstwa.","D":"przewodnika górskiego."},"a":"C","img":[1917,176],"e":{"A":"Ratownik górski interweniuje w razie wypadku.","B":"Animator prowadzi zabawy, nie naukę jazdy.","C":"Poprawna. Na obozie narciarskim zajęcia prowadzi instruktor narciarstwa.","D":"Przewodnik górski prowadzi wędrówki, nie zajęcia na stoku.","tip":"Nauka jazdy na nartach = instruktor."}},{"n":13,"q":"Przygotowując dla młodzieży rajd pieszy w Pieninach należy zamówić usługi przewodnika","o":{"A":"miejskiego.","B":"terenowego.","C":"górskiego sudeckiego.","D":"górskiego beskidzkiego."},"a":"D","img":[2093,49],"e":{"A":"Miejski – po mieście.","B":"Terenowy – po nizinach.","C":"Górski sudecki – Sudety.","D":"Poprawna. Pieniny należą do Karpat; tam prowadzi przewodnik górski beskidzki (uprawnienia na Beskidy i Pieniny).","tip":"Pieniny, Gorce, Bieszczady = przewodnik beskidzki."}},{"n":14,"q":"Oblicz koszt wynajmu autokaru, jeśli długość trasy wyniosła 125 km, a cena wynosi 4,20 zł/km.","o":{"A":"500,00 zł","B":"525,00 zł","C":"550,00 zł","D":"575,00 zł"},"a":"B","img":[2142,49],"e":{"A":"500 zł – błąd.","B":"Poprawna. 125 km × 4,20 zł = 525,00 zł.","C":"550 zł – błąd.","D":"575 zł – błąd.","tip":"km × stawka."}},{"n":15,"q":"Oblicz koszt pobytu 1 gościa korzystającego w hotelu z taryfy cenowej FB od kolacji 4 maja do śniadania 7 maja (nocleg w pokoju 1-os. 110 zł, śniadanie 20 zł, obiad 40 zł, kolacja 30 zł).","o":{"A":"450,00 zł","B":"470,00 zł","C":"560,00 zł","D":"600,00 zł"},"a":"C","ctx":"Liczba Cena jednostkowa Wartość (w zł) świadczeń (w zł) 110,00 20,00 40,00 30,00 Razem koszt pobytu","pic":1,"img":[2191,287],"e":{"A":"450 zł – błąd.","B":"470 zł – błąd.","C":"Poprawna. Od kolacji 4.05 do śniadania 7.05: 3 noclegi × 110 = 330; 3 śniadania × 20 = 60; 2 obiady (5 i 6.05) × 40 = 80; 3 kolacje (4, 5, 6.05) × 30 = 90. Razem 560,00 zł.","D":"600 zł – błąd.","tip":"Wypisz każdy dzień i posiłek."}},{"n":16,"q":"Oblicz cenę całkowitą wycieczki po ziemi lubuskiej, przy założeniu, że suma kosztów świadczeń wynosi 12 000,00 zł, a marża bez podatku VAT stanowi 10% kosztów świadczeń.","o":{"A":"13 200,00 zł","B":"13 476,00 zł","C":"14 760,00 zł","D":"19 600,00 zł"},"a":"B","img":[2478,78],"e":{"A":"13 200 zł – brak VAT.","B":"Poprawna. Marża 10% = 1 200 zł; VAT 23% = 276 zł; cena = 12 000 + 1 200 + 276 = 13 476,00 zł.","C":"14 760 zł – VAT od całości.","D":"19 600 zł – błąd.","tip":"VAT tylko od marży."}},{"n":17,"q":"Właściciel gospodarstwa agroturystycznego wprowadzając rabat lojalnościowy","o":{"A":"obniżył cenę usług noclegowych.","B":"zmienił aranżację pokoi gościnnych.","C":"zastosował opust na usługi dla stałych gości.","D":"przygotował dla wszystkich gości małe podarunki."},"a":"C","img":[2556,176],"e":{"A":"Obniżka cen dla wszystkich to nie rabat lojalnościowy.","B":"Zmiana aranżacji – produkt.","C":"Poprawna. Rabat lojalnościowy to opust dla stałych gości.","D":"Podarunki – promocja sprzedaży.","tip":"Lojalnościowy = stali klienci."}},{"n":18,"q":"Które dokumenty dotyczące współpracy z usługodawcami stosuje biuro podróży w zakresie zamawiania usług turystycznych?","o":{"A":"Zapytanie ofertowe i umowa-zlecenie.","B":"Umowa o współpracę i zamówienie świadczeń.","C":"Potwierdzenie zamówienia i umowa agencyjna.","D":"Umowa o dzieło i umowa o organizację imprezy turystycznej."},"a":"B","img":[2732,78],"e":{"A":"Umowa-zlecenie zawiera się z pilotem/przewodnikiem, nie z usługodawcą (hotelem).","B":"Poprawna. Z usługodawcami (hotele, przewoźnicy) biuro podpisuje umowy o współpracę i składa zamówienia świadczeń.","C":"Umowa agencyjna – z agentem.","D":"Umowa o organizację imprezy – z klientem.","tip":"Usługodawca: umowa o współpracę + zamówienie."}},{"n":19,"q":"Który obiekt hotelarski należy zaproponować turystom poszukującym noclegu z całodziennym wyżywieniem?","o":{"A":"Hostel.","B":"Pensjonat.","C":"Dom wycieczkowy.","D":"Schronisko młodzieżowe."},"a":"B","img":[2810,48],"e":{"A":"Hostel – zwykle bez wyżywienia.","B":"Poprawna. Pensjonat – obiekt z noclegami i całodziennym wyżywieniem.","C":"Dom wycieczkowy – samoobsługa, minimum usług.","D":"Schronisko młodzieżowe – samoobsługa.","tip":"Pensjonat = nocleg + pełne wyżywienie."}},{"n":20,"q":"Ofertę noclegu z dwoma posiłkami dziennie należy w katalogu biura podróży oznaczyć symbolem","o":{"A":"BB","B":"CB","C":"FB","D":"HB"},"a":"D","img":[2858,49],"e":{"A":"BB – tylko śniadanie.","B":"CB (Continental Breakfast) – śniadanie kontynentalne.","C":"FB – trzy posiłki.","D":"Poprawna. HB (Half Board) – dwa posiłki: śniadanie i obiadokolacja.","tip":"HB = 2 posiłki."}},{"n":21,"q":"Który dokument otrzyma klient w biurze podróży jako potwierdzenie zapłaty za organizację imprezy turystycznej?","o":{"A":"Polecenie przelewu.","B":"Kartę rozliczeniową.","C":"Arkusz kalkulacyjny kosztów.","D":"Fakturę – procedura marży dla biur podróży."},"a":"D","img":[2907,78],"e":{"A":"Polecenie przelewu – dokument bankowy klienta.","B":"Karta rozliczeniowa – wewnętrzny dokument biura.","C":"Arkusz kalkulacyjny – wewnętrzny.","D":"Poprawna. Organizator imprezy wystawia klientowi fakturę VAT marża (procedura marży dla biur podróży).","tip":"Klient biura = faktura marża (lub paragon)."}},{"n":22,"q":"Organizator turystyki ma prawo podwyższyć cenę imprezy na skutek","o":{"A":"spadku kursu walut.","B":"spadku podaży ofert biur podróży.","C":"wzrostu popytu na imprezy turystyczne.","D":"wzrostu kosztów paliw w transporcie pasażerów."},"a":"D","img":[2985,49],"e":{"A":"Spadek kursu walut obniża koszty – nie uzasadnia podwyżki.","B":"Podaż ofert nie jest podstawą prawną.","C":"Popyt nie jest podstawą prawną.","D":"Poprawna. Ustawa pozwala podnieść cenę tylko z powodu wzrostu kosztów transportu (paliwa), podatków/opłat lub kursów walut – i najpóźniej 20 dni przed imprezą.","tip":"Podwyżka: paliwo, podatki/opłaty, kurs walut."}},{"n":23,"q":"Potwierdzeniem rejestracji sprzedaży produktu turystycznego za pomocą kasy fiskalnej jest","o":{"A":"voucher.","B":"rachunek.","C":"paragon fiskalny.","D":"faktura zaliczkowa."},"a":"C","img":[3034,49],"e":{"A":"Voucher – skierowanie na usługę.","B":"Rachunek – wystawiają podmioty zwolnione z VAT.","C":"Poprawna. Kasa fiskalna drukuje paragon fiskalny.","D":"Faktura zaliczkowa – dokumentuje zaliczkę.","tip":"Kasa fiskalna = paragon."}},{"n":24,"q":"Dokumentem potwierdzającym sprzedaż usługi turystycznej jest","o":{"A":"e-faktura.","B":"e-zlecenie.","C":"e-deklaracja.","D":"e-zamówienie."},"a":"A","img":[3083,49],"e":{"A":"Poprawna. E-faktura (faktura elektroniczna) potwierdza sprzedaż.","B":"E-zlecenie – dyspozycja.","C":"E-deklaracja – podatkowa do urzędu.","D":"E-zamówienie – zamówienie, nie sprzedaż.","tip":"Sprzedaż = faktura/paragon."}},{"n":25,"q":"Obowiązkiem organizatora turystyki wobec klienta w przypadku organizacji imprezy dla dzieci obejmującej zakwaterowanie jest","o":{"A":"podanie rodzicowi lub opiekunowi prawnemu dziecka po rozpoczęciu imprezy turystycznej informacji o możliwości kontaktu z dzieckiem.","B":"podanie rodzicowi lub opiekunowi prawnemu dziecka przed rozpoczęciem imprezy turystycznej nazwiska lub nazwy lokalnego przedstawiciela biura.","C":"umożliwienie rodzicowi lub opiekunowi prawnemu dziecka po rozpoczęciu imprezy turystycznej codziennego bezpośredniego kontaktu z osobą odpowiedzialną za dziecko.","D":"przekazanie rodzicowi lub opiekunowi prawnemu dziecka przed rozpoczęciem imprezy turystycznej informacji o możliwości bezpośredniego kontaktu z dzieckiem lub osobą odpowiedzialną w miejscu pobytu dziecka."},"a":"D","img":[3132,358],"e":{"A":"Informacja musi być przekazana PRZED imprezą, nie po jej rozpoczęciu.","B":"Dane lokalnego przedstawiciela to inna informacja – nie dotyczy kontaktu z dzieckiem.","C":"Ustawa nie nakazuje codziennego kontaktu.","D":"Poprawna. Przy imprezach dla dzieci z zakwaterowaniem organizator przed imprezą podaje rodzicom informacje, jak bezpośrednio skontaktować się z dzieckiem lub osobą za nie odpowiedzialną.","tip":"Dziecko bez rodzica: kontakt podany PRZED wyjazdem."}},{"n":26,"q":"W celu zapewnienia 30-osobowej grupie noclegu oraz minimalnego zakresu usług z możliwością samoobsługi gości biuro podróży zapewni zakwaterowanie","o":{"A":"w pensjonacie.","B":"na kempingu.","C":"w domu wycieczkowym.","D":"w gospodarstwie agroturystycznym."},"a":"C","img":[3490,78],"e":{"A":"Motel – przy drogach, z parkingiem; min. 10 pokoi.","B":"Kemping – teren z miejscami na namioty i przyczepy.","C":"Poprawna. Dom wycieczkowy – min. 30 miejsc noclegowych, przystosowany do samoobsługi, minimalny zakres usług (definicja z ustawy).","D":"Schronisko młodzieżowe – dla młodzieży, nadzorowane przez organy oświaty.","tip":"30 miejsc + samoobsługa = dom wycieczkowy."}},{"n":27,"q":"Biuro podróży, w celu realizacji imprez turystycznych, podpisze z pilotem wycieczek umowę","o":{"A":"zlecenia.","B":"agencyjną.","C":"o świadczenie usług eksperckich.","D":"o organizację imprezy turystycznej."},"a":"A","img":[3568,49],"e":{"A":"Najem – oddanie rzeczy do używania.","B":"Poprawna. Z pilotem zawiera się umowę zlecenia (wykonanie czynności za wynagrodzenie).","C":"Agencyjna – organizator i agent.","D":"Allotment – pula miejsc w hotelu.","tip":"Pilot = umowa zlecenia."}},{"n":28,"q":"Właściciel gospodarstwa agroturystycznego, promując walory turystyczne Tykocina, Supraśla, Szlaku Tatarskiego oraz Szlaku Bocianiego, zaproponuje gościom wycieczkę objazdową po okolicach","o":{"A":"Bytomia.","B":"Bolesławca.","C":"Bydgoszczy.","D":"Białegostoku."},"a":"D","img":[3617,78],"e":{"A":"Bytom – Śląsk.","B":"Bolesławiec – ceramika, Dolny Śląsk.","C":"Bydgoszcz – Kujawy.","D":"Poprawna. Tykocin, Supraśl, Szlak Tatarski (Kruszyniany, Bohoniki) i bociany – okolice Białegostoku (Podlasie).","tip":"Tatarzy i Tykocin = Podlasie."}},{"n":29,"q":"Udzielając informacji turystycznej o atrakcjach województwa opolskiego należy wspomnieć o","o":{"A":"zamku w Brzegu, Jeziorze Otmuchowskim i Górze św. Anny.","B":"zamku w Golubiu-Dobrzyniu, uzdrowisku Ciechocinek i Toruniu.","C":"Poleskim Parku Narodowym, pałacu w Kozłówce i Szczebrzeszynie.","D":"Skansenie we Wdzydzach Kiszewskich, Jeziorze Raduńskim i Pelplinie."},"a":"A","img":[3695,176],"e":{"A":"Poprawna. Zamek w Brzegu, Jezioro Otmuchowskie i Góra św. Anny – województwo opolskie.","B":"Golub-Dobrzyń, Ciechocinek, Toruń – kujawsko-pomorskie.","C":"Poleski PN, Kozłówka, Szczebrzeszyn – lubelskie.","D":"Wdzydze, Jezioro Raduńskie, Pelplin – pomorskie.","tip":"Opolskie: Brzeg, Góra św. Anny, Moszna."}},{"n":30,"q":"Informacja o walorach Poznania udzielona przez przewodnika turystycznego uwzględni","o":{"A":"gotycki ratusz, Panoramę Racławicką i Halę Stulecia.","B":"Muzeum Włókiennictwa, secesyjne kamienice i Manufakturę.","C":"dzielnicę Kazimierz, Muzeum Książąt Czartoryskich i Barbakan.","D":"renesansowy ratusz, Muzeum Instrumentów Muzycznych i Stary Browar."},"a":"D","img":[3871,176],"e":{"A":"Panorama Racławicka i Hala Stulecia – Wrocław.","B":"Muzeum Włókiennictwa, Manufaktura – Łódź.","C":"Kazimierz, Czartoryscy, Barbakan – Kraków.","D":"Poprawna. Poznań: renesansowy ratusz (koziołki), Muzeum Instrumentów Muzycznych, Stary Browar.","tip":"Poznań = koziołki na ratuszu."}},{"n":31,"q":"Przykładem dziedzictwa kulturowego Warmii są gotyckie kościoły wzniesione","o":{"A":"z cegły.","B":"z granitu.","C":"z drewna.","D":"z piaskowca."},"a":"A","img":[4047,49],"e":{"A":"Poprawna. Warmia (i Pomorze) słynie z gotyku ceglanego – kościoły i zamki z cegły (Frombork, Lidzbark).","B":"Granit – rzadko, głównie fundamenty.","C":"Drewno – Małopolska, Podkarpacie.","D":"Piaskowiec – Śląsk, Małopolska.","tip":"Północ Polski = gotyk ceglany."}},{"n":32,"q":"Grupa młodzieży szkolnej, która podczas wędrówki odwiedziła Ojców, Pieskową Skałę i Ogrodzieniec, uczestniczyła w rajdzie Szlakiem","o":{"A":"Orlich Gniazd.","B":"Latarni Morskich.","C":"Zamków Piastowskich.","D":"Architektury Drewnianej."},"a":"A","img":[4096,77],"e":{"A":"Poprawna. Ojców, Pieskowa Skała, Ogrodzieniec – Szlak Orlich Gniazd (Jura Krakowsko-Częstochowska).","B":"Szlak Latarni – wybrzeże.","C":"Zamki Piastowskie – Śląsk.","D":"Architektura drewniana – Małopolska, Podkarpacie.","tip":"Orle Gniazda = zamki na skałach Jury."}},{"n":33,"q":"Młodzieży zwiedzającej skansen łowicki, zainteresowanej rękodziełem ludowym, należy zorganizować warsztaty z","o":{"A":"pieczenia chleba.","B":"tańca regionalnego.","C":"wycinanki ludowej.","D":"zielarstwa leczniczego."},"a":"C","img":[4173,78],"e":{"A":"Pieczenie chleba – kuchnia, nie rękodzieło łowickie.","B":"Taniec – nie rękodzieło.","C":"Poprawna. Łowicz słynie z wycinanki ludowej (kolorowe, wielowarstwowe) i pasiaków.","D":"Zielarstwo – nie rękodzieło łowickie.","tip":"Łowicz = wycinanki."}},{"n":34,"q":"Klient gospodarstwa agroturystycznego, kupując wczasy w cenie 3 680,00 zł skorzystał z 25% rabatu. Udzielony rabat wynosił","o":{"A":"276,00 zł","B":"920,00 zł","C":"2 760,00 zł","D":"3 680,00 zł"},"a":"B","img":[4251,77],"e":{"A":"276 zł = 7,5% – błąd.","B":"Poprawna. 25% z 3 680 = 920,00 zł.","C":"2 760 zł = cena po rabacie.","D":"3 680 zł = cena przed rabatem.","tip":"Rabat = cena × %."}},{"n":35,"q":"Zgłoszenie przez klienta wadliwego wykonania świadczenia podczas imprezy turystycznej, zobowiązuje pilota wycieczek do","o":{"A":"rozpoczęcia negocjacji z usługodawcą.","B":"potwierdzenia klientowi przyjęcia reklamacji.","C":"zapewnienia klientowi rekompensaty podczas kolejnego wyjazdu.","D":"zaproponowania klientowi zwrotu 10% ceny imprezy turystycznej."},"a":"B","img":[4328,205],"e":{"A":"Negocjacje to zadanie organizatora.","B":"Poprawna. Pilot przyjmuje reklamację i potwierdza jej przyjęcie, starając się usunąć wadę na miejscu.","C":"Pilot nie decyduje o rekompensatach.","D":"Pilot nie decyduje o zwrotach.","tip":"Pilot: przyjmuje reklamację, organizator ją rozpatruje."}},{"n":36,"q":"Notę korygującą należy sporządzić w przypadku wystąpienia błędu na fakturze w zapisie","o":{"A":"stawki podatku VAT.","B":"kwoty należności ogółem.","C":"danych adresowych nabywcy.","D":"ceny jednostkowej towaru lub usługi."},"a":"C","img":[4533,49],"e":{"A":"Stawka VAT – faktura korygująca.","B":"Kwota należności – faktura korygująca.","C":"Poprawna. Nota korygująca (wystawia nabywca) poprawia pomyłki w danych, np. adresie, nazwie, NIP.","D":"Cena jednostkowa – faktura korygująca.","tip":"Dane – nota; kwoty/stawki – faktura korygująca."}},{"n":37,"q":"Którą stawkę podatku VAT należy uwzględnić na fakturze za usługi przewodnika górskiego?","o":{"A":"0%","B":"7%","C":"8%","D":"23%"},"a":"D","img":[4582,49],"e":{"A":"0% – eksport, usługi międzynarodowe.","B":"7% – stawka nie istnieje obecnie.","C":"8% – noclegi, gastronomia, transport osób.","D":"Poprawna. Usługi przewodnickie i pilotażowe opodatkowane są stawką podstawową 23%.","tip":"8%: nocleg, gastronomia, przewóz; 23%: reszta."}},{"n":38,"q":"Które z wymienionych działań nie jest uwzględniane przy rozliczaniu imprezy turystycznej?","o":{"A":"Obliczenie marży i podatku VAT.","B":"Zestawienie wpływów uzyskanych ze sprzedaży.","C":"Wykazanie różnicy pomiędzy kosztami zmiennymi i stałymi.","D":"Podsumowanie wydatków na usługi składające się na imprezę."},"a":"C","img":[4631,176],"e":{"A":"Marża i VAT są w rozliczeniu.","B":"Wpływy są w rozliczeniu.","C":"Poprawna. Podział na koszty stałe i zmienne służy kalkulacji, nie rozliczeniu imprezy.","D":"Podsumowanie wydatków jest w rozliczeniu.","tip":"Rozliczenie: wpływy − koszty = marża; VAT = marża × 23/123."}},{"n":39,"q":"Oblicz marżę (z podatkiem VAT) biura podróży, jeżeli wpływy z tytułu organizacji wczasów wyniosły 43 000,00 zł, a koszty 36 000,00 zł.","o":{"A":"3 000,00 zł","B":"6 000,00 zł","C":"7 000,00 zł","D":"9 000,00 zł"},"a":"C","img":[4807,78],"e":{"A":"3 000 zł – błąd.","B":"6 000 zł – błąd.","C":"Poprawna. Marża brutto = wpływy − koszty = 43 000 − 3 . . . . . . . . . . . . . . . . . 2. Strony ustalają, że Centrum Turystyczne Podróżnik będzie zawierało umowy wyłącznie z klientami mającymi miejsce zamieszkania lub siedzibę na terenie . . . . . . . . . . . . . . . . . §2 Centrum Turystyczne Podróżnik jest upoważnione do zawierania umów opisanych w § 1 w imieniu i na rzecz Zleceniodawcy. Centrum Turystyczne Podróżnik jest upoważniony do odbierania oświadczeń woli od osób trzecich ze skutkiem dla Zleceniodawcy. Centrum Turystyczne Podróżnik jest upoważniony do przyjmowania dla Zleceniodawcy zapłaty za świadczenie, które spełnia za Zleceniodawcę.","pic":1,"img":[3750,52],"e":{"A":"Najem – oddanie rzeczy do używania.","B":"Czarter – wynajem środka transportu.","C":"Dzierżawa – używanie i pobieranie pożytków.","D":"Poprawna. Zawieranie umów w imieniu i na rzecz zleceniodawcy oraz przyjmowanie zapłaty – to umowa agencyjna (agent turystyczny).","tip":"„W imieniu i na rzecz” = agent."}},{"n":24,"q":"Którą informację pracownik biura podróży musi zapisać w druku umowy o udział w imprezie turystycznej?","o":{"A":"Miejsce zbiórki.","B":"Dane adresowe przewoźnika.","C":"Termin imprezy turystycznej.","D":"Imię i nazwisko pilota wycieczek."},"a":"C","img":[3802,169],"e":{"A":"Miejsce zbiórki nie jest obowiązkowe.","B":"Dane przewoźnika nie są obowiązkowe.","C":"Poprawna. Termin imprezy musi być w umowie.","D":"Nazwisko pilota nie jest obowiązkowe.","tip":"Umowa: kto, kiedy, gdzie, co, za ile."}},{"n":25,"q":"Który z przewodników turystycznych na obszarze Polski musi odbyć szkolenie i praktykę oraz zdać egzamin, chcąc uzyskać uprawnienia zgodne z ustawą o usługach hotelarskich oraz usługach pilotów wycieczek i przewodników turystycznych?","o":{"A":"Górski.","B":"Miejski.","C":"Muzealny.","D":"Terenowy."},"a":"A","img":[3971,101],"e":{"A":"Poprawna. Po deregulacji (2014) uprawnienia państwowe są wymagane tylko dla przewodnika górskiego – musi odbyć szkolenie, praktykę i zdać egzamin.","B":"Przewodnik miejski – zawód zderegulowany.","C":"Muzealny – zatrudnia muzeum.","D":"Terenowy – zderegulowany.","tip":"Obecnie licencja tylko: przewodnik górski."}},{"n":26,"q":"W czasie trwania imprezy turystycznej obowiązkiem pilota wycieczek jest przede wszystkim","o":{"A":"udział w spotkaniach towarzyskich z klientami.","B":"dobór zwiedzanych atrakcji turystycznych.","C":"organizowanie czasu wolnego turystom.","D":"sprawowanie opieki nad uczestnikami."},"a":"D","img":[4072,169],"e":{"A":"Spotkania towarzyskie nie są obowiązkiem.","B":"Dobór atrakcji to rola organizatora (program).","C":"Czas wolny nie musi być organizowany.","D":"Poprawna. Pilot sprawuje opiekę nad uczestnikami i dba o realizację programu.","tip":"Pilot = opieka + realizacja programu."}},{"n":27,"q":"Który posiłek, jako pierwszy, przysługuje turystom korzystającym w pensjonacie z opcji pełnego wyżywienia, jeżeli kończą pobyt śniadaniem?","o":{"A":"Obiad.","B":"Kolacja.","C":"Śniadanie.","D":"Obiadokolacja."},"a":"A","img":[4241,72],"e":{"A":"Poprawna. Przy FB (pełne wyżywienie) liczba posiłków się równoważy: skoro pobyt kończy się śniadaniem, to zaczyna się od obiadu.","B":"Kolacja byłaby pierwszym posiłkiem przy HB kończącym się śniadaniem? Nie – w FB zaczyna się od obiadu.","C":"Śniadanie podaje się dopiero po pierwszym noclegu.","D":"Obiadokolacja dotyczy HB.","tip":"FB: start obiadem → koniec śniadaniem; HB: start obiadokolacją → koniec śniadaniem."}},{"n":28,"q":"Który dokument może przesłać pracownik biura podróży do hotelu celem usprawnienia zakwaterowania grupy?","o":{"A":"Listę paszportową.","B":"Listę uczestników.","C":"Umowę allotmentu.","D":"Potwierdzenie zamówienia."},"a":"B","img":[4313,195],"e":{"A":"Zapytanie ofertowe wysyła się przed rezerwacją.","B":"Umowa allotmentu dotyczy puli miejsc na dłuższy okres.","C":"Lista paszportowa – do granicy/przewoźnika.","D":"Poprawna. Lista uczestników (z rozmieszczeniem – rooming list) usprawnia zakwaterowanie.","tip":"Do hotelu – lista uczestników / rooming list."}},{"n":29,"q":"Pasażer na lotnisku otrzymuje boarding card podczas odprawy","o":{"A":"celnej.","B":"biletowej.","C":"paszportowej.","D":"bezpieczeństwa."},"a":"B","img":[4508,43],"e":{"A":"Odprawa celna – kontrola towarów.","B":"Poprawna. Kartę pokładową (boarding card/pass) otrzymuje się podczas odprawy biletowo-bagażowej (check-in).","C":"Odprawa paszportowa – kontrola dokumentów.","D":"Kontrola bezpieczeństwa – prześwietlenie bagażu.","tip":"Check-in = boarding pass."}},{"n":30,"q":"O którym walorze turystycznym poinformuje właściciel gospodarstwa turystycznego swoich gości, wskazując im przedstawione oznakowanie turystyczne?","o":{"A":"O ostoi ptaków.","B":"O muzeum badawczym.","C":"O punkcie widokowym.","D":"O miejscu obserwacji ptaków."},"a":"C","pic":1,"img":[4551,199],"e":{"A":"Ostoja ptaków – inny symbol.","B":"Muzeum – inny symbol.","C":"Poprawna. Przedstawiony znak oznacza punkt widokowy.","D":"Miejsce obserwacji ptaków – symbol ptaka/lornetki z ptakiem.","tip":"Znaki turystyczne – piktogramy."}},{"n":31,"q":"Do której miejscowości w Beskidzie Śląskim zabierze pilot wycieczek grupę turystów, chcąc pokazać im regionalne wyroby koronkarskie?","o":{"A":"Do Wisły.","B":"Do Ustronia.","C":"Do Szczyrku.","D":"Do Koniakowa."},"a":"D","img":[4750,195],"e":{"A":"Wisła – skocznie, Zameczek Prezydenta.","B":"Ustroń – uzdrowisko.","C":"Szczyrk – narciarstwo.","D":"Poprawna. Koniaków słynie z koronek koniakowskich (szydełkowych).","tip":"Koronki = Koniaków."}},{"n":32,"q":"Folder promujący uzdrowiska Kotliny Kłodzkiej powinien zawierać informacje o sanatoriach zlokalizowanych","o":{"A":"w Szczawnicy i Muszynie.","B":"w Ciechocinku i Inowrocławiu.","C":"w Solcu-Zdroju i Busku-Zdroju.","D":"w Lądku-Zdroju i Polanicy-Zdroju."},"a":"D","img":[4945,43],"e":{"A":"Szczawnica i Muszyna – Pieniny i Beskid Sądecki (Małopolska).","B":"Ciechocinek i Inowrocław – Kujawy (tężnie).","C":"Solec-Zdrój i Busko-Zdrój – Ponidzie (świętokrzyskie).","D":"Poprawna. Lądek-Zdrój i Polanica-Zdrój leżą w Kotlinie niem KP.","B":"Poprawna. KP – Kasa Przyjmie: wpłaty gotówki do kasy.","C":"Wypłaty wynagrodzeń – KW/lista płac.","D":"Wypłaty gotówki – KW.","tip":"KP = przyjęcie gotówki."}},{"n":37,"q":"Na podstawie danych z tabeli oblicz marżę brutto z tytułu organizacji krajowej wycieczki dla grupy 30 osób, jeżeli koszt jednostkowy wynosi 150,00 zł.","o":{"A":"295,00 zł","B":"450,00 zł","C":"700,00 zł","D":"750,00 zł"},"a":"B","ctx":"Rodzaj usługi Koszt w zł transport 2200,00 wyżywienie 800,00 pilot 500,00 przewodnik 250,00 bilety wstępów 300,00","pic":1,"img":[5635,257],"e":{"A":"295 zł – błąd.","B":"Poprawna. Przychód: 30 × 150 = 4 500 zł. Koszty: 2 200 + 800 + 500 + 250 + 300 = 4 050 zł. Marża = 4 500 − 4 050 = 450,00 zł.","C":"700 zł – błąd.","D":"750 zł – błąd.","tip":"Marża = sprzedaż − koszty."}},{"n":38,"q":"Który dokument sporządza pracownik biura podróży, dokonując rozliczenia imprezy turystycznej?","o":{"A":"Tabelę wpływów.","B":"Kartę rozliczeniową.","C":"Zestawienie kosztów.","D":"Rachunek zysków i strat."},"a":"B","img":[5892,170],"e":{"A":"Tabela wpływów to tylko część danych.","B":"Poprawna. Karta rozliczeniowa imprezy porównuje koszty i przychody po zakończeniu imprezy.","C":"Rachunek zysków i strat – dla całej firmy, za rok.","D":"Zestawienie wpływów i kosztów – pomocnicze.","tip":"Rozliczenie imprezy = karta rozliczeniowa."}},{"n":39,"q":"Która stawka podatku VAT, dotycząca usługi gastronomicznej powinna być wpisana na fakturze z hotelu?","o":{"A":"0%","B":"3%","C":"5%","D":"8%"},"a":"D","img":[6062,43],"e":{"A":"0% – eksport.","B":"3% – nie istnieje.","C":"5% – niektóre towary (żywność, książki).","D":"Poprawna. Usługi gastronomiczne – VAT 8%.","tip":"Gastronomia i noclegi – 8%."}},{"n":40,"q":"Który dokument wystawi pracownik biura podróży do otrzymanej od kontrahenta faktury za usługę turystyczną z błędnym numerem NIP?","o":{"A":"Notę korygującą.","B":"Notę sprzedażową.","C":"Fakturę korygującą.","D":"Fakturę sprzedażową."},"a":"A","img":[6105,73],"e":{"A":"Poprawna. Błąd w danych (np. NIP) poprawia nabywca notą korygującą.","B":"Nota sprzedażowa nie istnieje jako dokument korygujący.","C":"Faktura korygująca – przy błędach w kwotach, wystawia sprzedawca.","D":"Faktura sprzedażowa – nowa sprzedaż.","tip":"Dane – nota korygująca; kwoty – faktura korygująca."}}],"2020-czerwiec":[{"n":1,"q":"Zwiedzanie jaskiń jest głównym celem wycieczki","o":{"A":"etnicznej.","B":"speleologicznej.","C":"enoturystycznej.","D":"archeoturystycznej."},"a":"B","img":[0,43],"e":{"A":"Turystyka etniczna – poznawanie kultur grup etnicznych.","B":"Poprawna. Speleologia (speleoturystyka) to zwiedzanie i eksploracja jaskiń.","C":"Enoturystyka – wino.","D":"Archeoturystyka – stanowiska archeologiczne.","tip":"Spelaion = jaskinia."}},{"n":2,"q":"Klientowi chcącemu uprawiać rafting należy zapewnić","o":{"A":"balon.","B":"ponton.","C":"żaglówkę.","D":"motorówkę."},"a":"B","img":[43,44],"e":{"A":"Balon – baloniarstwo.","B":"Poprawna. Rafting to spływ pontonem po rwącej rzece górskiej.","C":"Żaglówka – żeglarstwo.","D":"Motorówka – narty wodne, przejażdżki.","tip":"Rafting = ponton."}},{"n":3,"q":"Turyście zainteresowanemu ornitologią należy zaproponować pobyt w gospodarstwie agroturystycznym w pobliżu przede wszystkim","o":{"A":"Jaskini Raj.","B":"Błędnych Skał.","C":"Jeziora Łuknajno.","D":"Doliny Kościeliskiej."},"a":"C","img":[87,73],"e":{"A":"Jaskinia Raj – Góry Świętokrzyskie, nacieki.","B":"Błędne Skały – Góry Stołowe, labirynt skalny.","C":"Poprawna. Ornitologia to nauka o ptakach. Jezioro Łuknajno (Mazury) to rezerwat biosfery UNESCO – ostoja łabędzia niemego.","D":"Dolina Kościeliska – Tatry.","tip":"Ornitologia = ptaki; Łuknajno = łabędzie."}},{"n":4,"q":"W programie wycieczki po Mazurach organizowanej dla klientów uprawiających turystykę kwalifikowaną, należy uwzględnić","o":{"A":"trekking Orlą Percią.","B":"surfing po Zatoce Puckiej.","C":"spływ kajakiem rzeką Krutynią.","D":"wspinaczkę skałkową na Górze Zborów."},"a":"C","img":[160,72],"e":{"A":"Orla Perć – Tatry, nie Mazury.","B":"Zatoka Pucka – Pomorze.","C":"Poprawna. Krutynia to jeden z najpiękniejszych szlaków kajakowych w Polsce (Mazury) – turystyka kwalifikowana.","D":"Góra Zborów – Jura Krakowsko-Częstochowska.","tip":"Mazury + kajaki = Krutynia."}},{"n":5,"q":"Której grupie klientów nie należy proponować zwiedzania miejsc martyrologii, takich jak Muzeum Stutthof w Sztutowie?","o":{"A":"Studentom.","B":"Osobom starszym.","C":"Młodzieży szkół średnich.","D":"Uczniom klas I-IV szkoły podstawowej."},"a":"D","img":[232,67],"e":{"A":"Studenci mogą zwiedzać miejsca martyrologii.","B":"Osoby starsze – tak.","C":"Młodzież szkół średnich – tak, to element edukacji historycznej.","D":"Poprawna. Miejsca martyrologii (obozy, np. Stutthof) nie są odpowiednie dla małych dzieci z klas I–IV.","tip":"Program dopasowujemy do wieku i wrażliwości."}},{"n":6,"q":"Oblicz rzeczywistą długość szlaku turystycznego w Gorcach, jeżeli na przedstawionej na rysunku mapie wynosi ona 6 centymetrów.","o":{"A":"2,1 km","B":"21 km","C":"210 km","D":"2 100 km"},"a":"A","pic":1,"img":[299,388],"e":{"A":"Poprawna. Mapa Gorców ma skalę 1:35 000 → 1 cm = 350 m = 0,35 km. 6 × 0,35 = 2,1 km.","B":"21 km – błąd o rząd wielkości.","C":"210 km – błąd.","D":"2 100 km – błąd (to metry).","tip":"35 000 cm = 350 m."}},{"n":7,"q":"Miłośnik turystyki górskiej, korzystając ze strony mapa-turystyczna.pl odczyta, że najbardziej łagodne podejście na górę Nosal znajduje się od strony","o":{"A":"północnej.","B":"zachodniej.","C":"wschodniej.","D":"południowej."},"a":"D","pic":1,"img":[687,455],"e":{"A":"Od północy poziomice są gęsto – stromo.","B":"Od zachodu stromo.","C":"Od wschodu stromo.","D":"Poprawna. Im rzadsze poziomice, tym łagodniejszy stok – od południa (Nosalowa Przełęcz) poziomice są najrzadsze.","tip":"Gęste poziomice = stromo, rzadkie = łagodnie."}},{"n":8,"q":"Na podstawie odległości przedstawionych w tabelach oblicz długość trasy z Nowej Słupi do Szczekocin przez Kielce.","o":{"A":"120 km","B":"145 km","C":"160 km","D":"185 km"},"a":"A","pic":1,"img":[1142,448],"e":{"A":"Poprawna. Nowa Słupia – Kielce 40 km + Kielce – Szczekociny 80 km = 120 km.","B":"145 km – błąd.","C":"160 km – błąd.","D":"185 km – błąd.","tip":"Dodaj odcinki z tabel przez wskazane miasto."}},{"n":9,"q":"Zapoznając turystów z najważniejszymi atrakcjami Wenecji, pilot powinien zaproponować wizytę","o":{"A":"w Domu Julii.","B":"w Pałacu Dożów.","C":"w Krzywej Wieży.","D":"w Bazylice św. Piotra."},"a":"B","img":[1590,43],"e":{"A":"Dom Julii – Werona.","B":"Poprawna. Pałac Dożów przy Placu św. Marka – symbol Wenecji.","C":"Krzywa Wieża – Piza.","D":"Bazylika św. Piotra – Watykan/Rzym.","tip":"Wenecja: Plac św. Marka, Pałac Dożów, Most Westchnień."}},{"n":10,"q":"Turystom planującym wypoczynek na Wyżynie Krakowsko-Częstochowskiej należy zaproponować zwiedzanie","o":{"A":"Ojcowskiego Parku Narodowego.","B":"Magurskiego Parku Narodowego.","C":"Biebrzańskiego Parku Narodowego.","D":"Roztoczańskiego Parku Narodowego."},"a":"A","img":[1633,67],"e":{"A":"Poprawna. Ojcowski PN leży na Wyżynie Krakowsko-Częstochowskiej (Maczuga Herkulesa, zamek w Pieskowej Skale).","B":"Magurski PN – Beskid Niski.","C":"Biebrzański PN – bagna nad Biebrzą (Podlasie).","D":"Roztoczański PN – Roztocze (lubelskie).","tip":"Jura = Ojcowski PN."}},{"n":11,"q":"Popularne wśród zwolenników turystyki kwalifikowanej Góry Izerskie znajdują się na granicy","o":{"A":"Czech i Polski.","B":"Austrii i Włoch.","C":"Grecji i Bułgarii.","D":"Austrii i Szwajcarii."},"a":"A","img":[1700,43],"e":{"A":"Poprawna. Góry Izerskie (Sudety Zachodnie) leżą na granicy Polski i Czech.","B":"Austria–Włochy – Alpy.","C":"Grecja–Bułgaria – Rodopy.","D":"Austria–Szwajcaria – Alpy.","tip":"Sudety = granica PL–CZ."}},{"n":12,"q":"W którym mieście turyści mogą zwiedzić Bazylikę Świętego Stefana, Basztę Rybacką oraz muzeum Aquincum?","o":{"A":"W Pradze.","B":"W Wiedniu.","C":"W Bratysławie.","D":"W Budapeszcie."},"a":"D","img":[1743,73],"e":{"A":"Praga – Hradczany, Most Karola.","B":"Wiedeń – Schönbrunn, katedra św. Szczepana (Stephansdom!).","C":"Bratysława – zamek.","D":"Poprawna. Budapeszt: Bazylika św. Stefana, Baszta Rybacka, ruiny rzymskiego Aquincum.","tip":"Baszta Rybacka = Budapeszt."}},{"n":13,"q":"Słynąca z lawendy Prowansja leży na terytorium","o":{"A":"Włoch.","B":"Francji.","C":"Hiszpanii.","D":"Chorwacji."},"a":"B","img":[1816,43],"e":{"A":"Włochy – Toskania.","B":"Poprawna. Prowansja to region na południu Francji, słynny z pól lawendy.","C":"Hiszpania – Andaluzja.","D":"Chorwacja – Istria, Dalmacja.","tip":"Lawenda = Prowansja (Francja)."}},{"n":14,"q":"Uczestnikom wycieczki Szlakiem Orlich Gniazd należy zaproponować zwiedzanie zamku","o":{"A":"Książ.","B":"Chojnik.","C":"Krzyżtopór.","D":"Ogrodzieniec."},"a":"D","img":[1859,43],"e":{"A":"Książ – Wałbrzych, Dolny Śląsk.","B":"Chojnik – Karkonosze.","C":"Krzyżtopór – Ujazd, świętokrzyskie.","D":"Poprawna. Ogrodzieniec – ruiny zamku na Szlaku Orlich Gniazd.","tip":"Orle Gniazda: Ogrodzieniec, Olsztyn, Mirów, Bobolice, Pieskowa Skała."}},{"n":15,"q":"Cechami charakteryzującymi budowle romańskie są:","o":{"A":"rozety, witraże, wertykalizm.","B":"kasetony, attyki, prostokątne okna.","C":"grube mury, małe okna, surowość formy.","D":"przepych, malarstwo iluzjonistyczne, ekspresja."},"a":"C","img":[1902,44],"e":{"A":"Rozety, witraże, strzelistość – gotyk.","B":"Kasetony, attyki – renesans.","C":"Poprawna. Romanizm: grube mury, małe okna, półkoliste łuki, surowa, masywna forma.","D":"Przepych, iluzjonizm – barok.","tip":"Romański = masywny; gotyk = strzelisty."}},{"n":16,"q":"Klientowi zamawiającemu wycieczkę Śladami Fryderyka Chopina należy zaproponować zwiedzanie miejscowości","o":{"A":"Kudowa-Zdrój.","B":"Żelazowa Wola.","C":"Sucha Beskidzka.","D":"Szklarska Poręba."},"a":"B","img":[1946,72],"e":{"A":"Kudowa – uzdrowisko (Chopin leczył się w Dusznikach).","B":"Poprawna. Żelazowa Wola – miejsce urodzenia Fryderyka Chopina.","C":"Sucha Beskidzka – „mały Wawel”.","D":"Szklarska Poręba – Karkonosze.","tip":"Chopin: Żelazowa Wola, Warszawa, Duszniki."}},{"n":17,"q":"Łemkowszczyzna, czyli obszar zamieszkiwany przez Łemków, obejmuje w Polsce","o":{"A":"Mazury.","B":"Podlasie.","C":"Beskid Niski.","D":"Polesie Lubelskie."},"a":"C","img":[2018,43],"e":{"A":"Mazury – nie Łemkowie.","B":"Podlasie – Białorusini, Tatarzy.","C":"Poprawna. Łemkowie zamieszkiwali Beskid Niski (i zachodnie Bieszczady).","D":"Polesie – inna grupa.","tip":"Łemkowszczyzna = Beskid Niski."}},{"n":18,"q":"O której godzinie najpóźniej grupa musi wyjechać z hotelu, aby rozpocząć zwiedzanie skansenu w Wasilkowie o godzinie 10:30, przy założeniu, że do pokonania autokarem jest 90 km ze średnią prędkością 60 km/godz.?","o":{"A":"O godzinie 7:30","B":"O godzinie 8:00","C":"O godzinie 9:00","D":"O godzinie 9:30"},"a":"C","img":[2061,102],"e":{"A":"7:30 – za wcześnie.","B":"8:00 – za wcześnie.","C":"Poprawna. 90 km : 60 km/h = 1,5 godz. 10:30 − 1:30 = 9:00.","D":"9:30 – za późno.","tip":"Czas = droga : prędkość."}},{"n":19,"q":"Który z wymienionych kosztów imprezy turystycznej zaliczany jest do kosztów stałych?","o":{"A":"Opłata klimatyczna.","B":"Ubezpieczenie NNW.","C":"Bilety wstępu do muzeum.","D":"Wynagrodzenie pilota wycieczek."},"a":"D","img":[2163,43],"e":{"A":"Opłata klimatyczna – od osoby, więc zmienna.","B":"NNW – od osoby, zmienny.","C":"Bilety wstępu – od osoby, zmienne.","D":"Poprawna. Wynagrodzenie pilota jest takie samo bez względu na liczbę uczestników – koszt stały.","tip":"Stały = za grupę; zmienny = za osobę."}},{"n":20,"q":"Oblicz wartość brutto usługi cateringowej dla 120 osób w cenie brutto 30,00 zł/posiłek/os. po uwzględnieniu opustu o wartości pięciu bezpłatnych posiłków.","o":{"A":"3 000,00 zł","B":"3 450,00 zł","C":"3 540,00 zł","D":"3 600,00 zł"},"a":"B","img":[2206,72],"e":{"A":"3 000 zł – błąd.","B":"Poprawna. Płacimy za 120 − 5 = 115 posiłków × 30,00 = 3 450,00 zł.","C":"3 540 zł – błąd.","D":"3 600 zł – bez opustu.","tip":"Opust = bezpłatne sztuki."}},{"n":21,"q":"Na podstawie przedstawionego cennika usług przewodnickich oblicz koszt 5,5-godzinnej usługi przewodnika turystycznego po Toruniu w języku angielskim (w języku obcym +20%).","o":{"A":"380,00 zł","B":"392,00 zł","C":"444,00 zł","D":"456,00 zł"},"a":"D","pic":1,"img":[2278,311],"e":{"A":"380 zł – cena w języku polskim, bez dodatku 20%.","B":"392 zł – błąd.","C":"444 zł – błąd.","D":"Poprawna. 5,5 godz.: ryczałt do 4 godz. 320 zł + 2 rozpoczęte godziny × 30 = 380 zł (po polsku); +20% za angielski: 380 × 1,2 = 456,00 zł.","tip":"Rozpoczęta godzina liczy się jak pełna."}},{"n":22,"q":"Na podstawie danych w tabeli stanowiącej fragment umowy, wskaż karę umowną, którą zapłaci biuro podróży do hotelu, jeżeli zarezerwowało miejsca noclegowe w terminie 12-15.09.2020 r. i musiało z nich zrezygnować w dniu 01.09.2020 r.","o":{"A":"30% wartości usługi.","B":"50% wartości usługi.","C":"80% wartości usługi.","D":"90% wartości usługi."},"a":"C","pic":1,"img":[2589,265],"e":{"A":"30% – rezygnacja 60–30 dni.","B":"50% – 29–15 dni.","C":"Poprawna. Od 01.09 do 12.09 jest 11 dni → przedział 14–7 dni → kara 80%.","D":"90% – poniżej 6 dni.","tip":"Liczymy dni do rozpoczęcia usługi."}},{"n":23,"q":"Na podstawie przedstawionego fragmentu grafiku rezerwacji ustal, który termin pobytu wpisze w umowie kwatery wiejskiej właściciel gospodarstwa agroturystycznego Panu Kowalskiemu.","o":{"A":"Od 1.06 do 5.06","B":"Od 2.06 do 5.06","C":"Od 1.06 do 6.06","D":"Od 2.06 do 6.06"},"a":"D","pic":1,"img":[2854,175],"e":{"A":"1.06–5.06 – błąd.","B":"2.06–5.06 – gość wyjeżdża rano po ostatniej nocy, czyli 6.06.","C":"1.06–6.06 – 1.06 nie jest zarezerwowany.","D":"Poprawna. Noclegi zarezerwowane 2, 3, 4 i 5.06 (4 noce) → pobyt od 2.06 do 6.06 (wyjazd po nocy z 5 na 6).","tip":"R w grafiku = noc; wyjazd dzień po ostatniej nocy."}},{"n":24,"q":"Ile osób maksymalnie można łącznie zakwaterować w trzech pokojach typu double i dwóch pokojach typu twin?","o":{"A":"5 osób.","B":"7 osób.","C":"8 osób.","D":"10 osób."},"a":"D","img":[3029,72],"e":{"A":"5 osób – to liczba pokoi, nie łóżek.","B":"7 osób – błąd.","C":"8 osób – błąd.","D":"Poprawna. Double = pokój 2-os. z łóżkiem małżeńskim, twin = 2-os. z dwoma łóżkami. 3×2 + 2×2 = 10 osób.","tip":"SGL=1, DBL=2, TWN=2, TPL=3."}},{"n":25,"q":"Który z wymienionych instrumentów marketingu zastosowało biuro turystyczne, umieszczając przy drodze billboard informujący o ofercie pobytu?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[3101,72],"e":{"A":"Cena – rabaty, cenniki.","B":"Produkt – sama usługa i jej jakość.","C":"Poprawna. Billboard to reklama, czyli narzędzie promocji.","D":"Dystrybucja – kanały sprzedaży.","tip":"Reklama = promocja."}},{"n":26,"q":"Które z działań gospodarstwa agroturystycznego podejmowane jest w ramach strategii ceny?","o":{"A":"Udzielanie zniżek stałym klientom.","B":"Modernizacja pokojów gościnnych.","C":"Zorganizowanie przyjęcia dla turystów.","D":"Umieszczenie informacji o obiekcie w katalogu."},"a":"A","img":[3173,44],"e":{"A":"Modernizacja pokoi – strategia produktu.","B":"Poprawna. Zniżki dla stałych gości zmieniają cenę – to narzędzie strategii ceny (marketing mix 4P: produkt, cena, dystrybucja, promocja).","C":"Przyjęcie dla turystów – element produktu lub promocji.","D":"Informacja w katalogu – promocja/dystrybucja.","tip":"Wszystko o rabatach i zniżkach = cena."}},{"n":27,"q":"Do organizacji rozrywek dla gości podczas ich pobytu na terenie hotelu należy uwzględnić usługi","o":{"A":"pilota wycieczek.","B":"pracownika concierge.","C":"animatora czasu wolnego.","D":"rezydenta biura turystycznego."},"a":"C","img":[3217,44],"e":{"A":"Pilot opiekuje się grupą w trasie.","B":"Concierge udziela informacji i załatwia sprawy gości.","C":"Poprawna. Animator czasu wolnego organizuje rozrywki dla gości na terenie hotelu.","D":"Rezydent reprezentuje biuro w miejscu pobytu.","tip":"Rozrywki w hotelu = animator."}},{"n":28,"q":"Korzystając z przedstawionego fragmentu faktury, oblicz cenę jednostkową netto usługi noclegowej.","o":{"A":"115,50 zł","B":"121,95 zł","C":"138,00 zł","D":"138,89 zł"},"a":"D","ctx":"Faktura (fragm ent)","pic":1,"img":[3261,252],"e":{"A":"115,50 zł – błąd.","B":"121,95 zł – podzielono przez 1,23 (zła stawka).","C":"138,00 zł – błąd.","D":"Poprawna. Brutto 300 zł za 2 doby; netto = 300 : 1,08 = 277,78 zł; za dobę 277,78 : 2 = 138,89 zł.","tip":"Netto = brutto : 1,08 (noclegi)."}},{"n":29,"q":"Uczestnika zorganizowanej wycieczki krajowej, który podczas wyjazdu złamał nogę należy poinformować, że może ubiegać się o wypłatę odszkodowania z tytułu ubezpieczenia","o":{"A":"assistance.","B":"kosztów leczenia.","C":"od następstw chorób przewlekłych.","D":"od następstw nieszczęśliwych wypadków."},"a":"D","img":[3513,72],"e":{"A":"Assistance – pomoc organizacyjna (np. transport), nie odszkodowanie za uraz.","B":"Koszty leczenia (KL) – zwrot kosztów leczenia za granicą.","C":"Choroby przewlekłe – zwykle wyłączone.","D":"Poprawna. Złamanie nogi to nieszczęśliwy wypadek – świadczenie z NNW.","tip":"Uraz = NNW."}},{"n":30,"q":"Ile czasu zajmie zgodnie z rozkładem jazdy podróż pociągiem z Łodzi do Krakowa?","o":{"A":"5 godz. 30 min","B":"5 godz. 40 min","C":"5 godz. 45 min","D":"5 godz. 55 min"},"a":"A","pic":1,"img":[3585,297],"e":{"A":"Poprawna. Odjazd z Łodzi 10:00, przyjazd do Krakowa 15:30 → 5 godz. 30 min.","B":"5 h 40 – błąd.","C":"5 h 45 – liczone do odjazdu z Krakowa.","D":"5 h 55 – błąd.","tip":"Odjazd ze stacji początkowej → przyjazd do docelowej."}},{"n":31,"q":"Podczas udzielania informacji miłośnikom przyrody o Dolnym Śląsku należy uwzględnić","o":{"A":"Gorczański Park Narodowy i Pieniński Park Narodowy.","B":"Białowieski Park Narodowy i Biebrzański Park Narodowy.","C":"Park Narodowy Gór Stołowych i Karkonoski Park Narodowy.","D":"Park Narodowy Borów Tucholskich i Słowiński Park Narodowy."},"a":"C","img":[3882,44],"e":{"A":"Gorczański i Pieniński – Małopolska.","B":"Białowieski i Biebrzański – Podlasie.","C":"Poprawna. PN Gór Stołowych i Karkonoski PN leżą na Dolnym Śląsku.","D":"Bory Tucholskie i Słowiński – Pomorze.","tip":"Dolny Śląsk = Sudety."}},{"n":32,"q":"W którym województwie Polski turysta może zobaczyć najwięcej obiektów wpisanych na Listę Światowego Dziedzictwa UNESCO?","o":{"A":"Podlaskim.","B":"Małopolskim.","C":"Mazowieckim.","D":"Wielkopolskim."},"a":"B","img":[3926,68],"e":{"A":"Podlaskie – Puszcza Białowieska.","B":"Poprawna. Małopolskie ma najwięcej obiektów UNESCO: Stare Miasto w Krakowie, Wieliczka i Bochnia, Auschwitz, Kalwaria Zebrzydowska, drewniane kościoły i cerkwie.","C":"Mazowieckie – Stare Miasto w Warszawie.","D":"Wielkopolskie – brak wielu.","tip":"Małopolska = rekordzista UNESCO."}},{"n":33,"q":"Wskaż dokument, o który powinna zostać uzupełniona Teczka imprezy po zakończeniu imprezy turystycznej.","o":{"A":"Sprawozdanie pilota wycieczek.","B":"Wniosek o zaliczkę dla pilota wycieczek.","C":"Deklaracja dla podatku od towarów i usług.","D":"Umowa o usługę pilotażu imprezy turystycznej."},"a":"A","img":[3994,43],"e":{"A":"Poprawna. Po imprezie do teczki dołącza się sprawozdanie pilota (przebieg, uwagi, reklamacje).","B":"Wniosek o zaliczkę – przed imprezą.","C":"Deklaracja VAT – składana do urzędu, nie do teczki imprezy.","D":"Umowa z pilotem – przed imprezą.","tip":"Po imprezie: sprawozdanie i rozliczenie pilota."}},{"n":34,"q":"Oblicz kwotę podatku VAT, którą należy wpisać do karty rozliczenia krajowej imprezy turystycznej.","o":{"A":"373,98 zł","B":"460,00 zł","C":"1 626,02 zł","D":"2 460,00 zł"},"a":"A","pic":1,"img":[4037,266],"e":{"A":"Poprawna. VAT = marża brutto × 23/123 = 2 000 × 23/123 = 373,98 zł.","B":"460 zł = 23% z 2 000 – błąd, marża już zawiera VAT.","C":"1 626,02 zł – to marża netto.","D":"2 460 zł – błąd.","tip":"Marża z VAT → VAT = × 23/123."}},{"n":35,"q":"Którą kwotę podatku VAT należy wpisać na fakturę wystawioną za 3 godziny pracy przewodnika turystycznego, jeżeli cena jednostkowa brutto tej usługi wynosi 123,00 zł/godz.?","o":{"A":"23,00 zł","B":"27,33 zł","C":"69,00 zł","D":"81,99 zł"},"a":"C","img":[4303,72],"e":{"A":"23 zł – VAT od 1 godziny liczony od netto 100 zł… ale to 1 godzina.","B":"27,33 zł – błąd.","C":"Poprawna. 3 × 123 = 369 zł brutto; VAT = 369 × 23/123 = 69,00 zł (netto 300 zł).","D":"81,99 zł – 23% od brutto.","tip":"VAT z brutto = brutto × 23/123."}},{"n":36,"q":"Na podstawie fragmentu umowy agencyjnej oblicz wysokość prowizji agencyjnej za sprzedaż dwóch miejsc na imprezie turystycznej, jeżeli całkowita cena jednego miejsca wynosi 500,00 zł.","o":{"A":"50,00 zł","B":"100,00 zł","C":"150,00 zł","D":"300,00 zł"},"a":"B","pic":1,"img":[4375,286],"e":{"A":"50 zł – prowizja za jedno miejsce.","B":"Poprawna. Prowizja 10% całkowitej ceny: 2 × 500 = 1 000 zł × 10% = 100,00 zł.","C":"150 zł – 30% (zaliczka), błąd.","D":"300 zł – błąd.","tip":"Prowizja agenta = % od ceny sprzedanych miejsc."}},{"n":37,"q":"Którą wartość wyszczególnioną na fakturze za usługę gastronomiczną należy uwzględnić w kompleksowym rozliczeniu kosztów imprezy turystycznej organizowanej przez biuro podróży?","o":{"A":"28,00 zł","B":"67,20 zł","C":"840,00 zł","D":"907,20 zł"},"a":"D","pic":1,"img":[4661,266],"e":{"A":"28 zł – cena jednostkowa netto.","B":"67,20 zł – tylko VAT.","C":"840 zł – wartość netto.","D":"Poprawna. Biuro w procedurze VAT marża nie odlicza VAT, więc w kosztach ujmuje wartość brutto: 907,20 zł.","tip":"Koszty imprezy liczymy brutto."}},{"n":38,"q":"W terminie od 10 do 12 maja w pensjonacie przebywały 2 osoby, które korzystały z opcji wyżywienia HB od obiadokolacji dnia pierwszego do śniadania dnia ostatniego. Oblicz koszt wyżywienia obu osób zgodnie z danymi w tabeli.","o":{"A":"70,00 zł","B":"90,00 zł","C":"120,00 zł","D":"140,00 zł"},"a":"D","pic":1,"img":[4927,257],"e":{"A":"70 zł – dla jednej osoby.","B":"90 zł – błąd.","C":"120 zł – błąd.","D":"Poprawna. 10–12 maja: 2 obiadokolacje (10, 11) × 25 = 50 + 2 śniadania (11, 12) × 10 = 20 → 70 zł/os. × 2 = 140,00 zł.","tip":"HB: obiadokolacja → śniadanie."}},{"n":39,"q":"Na podstawie zestawienia wydatków oraz wysokości pobranej zaliczki oblicz kwotę do zwrotu, dokonując rozliczenia zaliczki pobranej przez pilota wycieczek.","o":{"A":"Do wypłaty 320,00 zł","B":"Do zwrotu 320,00 zł","C":"Do wypłaty 1 180,00 zł","D":"Do zwrotu 1 180,00 zł"},"a":"B","pic":1,"img":[5184,481],"e":{"A":"Wypłata – pilot wydał mniej niż pobrał.","B":"Poprawna. Wydatki: 80 + 750 + 350 = 1 180 zł; zaliczka 1 500 zł → do zwrotu 320,00 zł.","C":"1 180 zł – to suma wydatków.","D":"1 180 zł – to suma wydatków.","tip":"Zaliczka > wydatki → zwrot różnicy."}},{"n":40,"q":"Oblicz całkowity koszt krajowej imprezy turystycznej, jeżeli suma kosztów bezpośrednich wynosi 5 500,00 zł, a marża 12%.","o":{"A":"6 160,00 zł","B":"6 206,00 zł","C":"6 311,80 zł","D":"6 916,80 zł"},"a":"C","img":[5665,71],"e":{"A":"6 160 zł – bez VAT.","B":"6 206 zł – błąd.","C":"Poprawna. Marża 12% = 660 zł; VAT 23% od marży = 151,80 zł; razem 5 500 + 660 + 151,80 = 6 311,80 zł.","D":"6 916,80 zł – błąd.","tip":"Koszty + marża + 23% marży."}}],"2020-styczen":[{"n":1,"q":"Korzystanie z walorów przyrodniczych i poznawanie codziennego życia w gospodarstwie agroturystycznym jest charakterystyczne dla imprez turystyki","o":{"A":"wiejskiej.","B":"zdrowotnej.","C":"edukacyjnej.","D":"industrialnej."},"a":"A","img":[0,72],"e":{"A":"Poprawna. Turystyka wiejska – wypoczynek na wsi, korzystanie z przyrody i poznawanie życia w gospodarstwie (agroturystyka).","B":"Zdrowotna – uzdrowiska, leczenie.","C":"Edukacyjna – nauka, szkolenia.","D":"Industrialna – zabytki przemysłu.","tip":"Gospodarstwo + przyroda = turystyka wiejska."}},{"n":2,"q":"Organizując kilkudniowy rajd pieszy w Bieszczadach dla młodzieży ze Szczecina, należy przede wszystkim zapewnić","o":{"A":"ubezpieczenie, usługi informacyjne i żywieniowe.","B":"ubezpieczenie, usługi noclegowe i rekreacyjno-sportowe.","C":"usługi przewodnika beskidzkiego, usługi noclegowe i transportowe.","D":"usługi transportowe, kulturalno-rozrywkowe i przewodnika sudeckiego."},"a":"C","img":[72,72],"e":{"A":"Brak przewodnika i noclegów – podstaw rajdu.","B":"Brak przewodnika górskiego.","C":"Poprawna. Bieszczady to Karpaty → przewodnik beskidzki; do tego noclegi i transport ze Szczecina.","D":"Przewodnik sudecki – Sudety, nie Bieszczady.","tip":"Bieszczady = przewodnik beskidzki."}},{"n":3,"q":"Imprezy kulinarne szlakiem niemieckich winnic nad Renem organizowane są w ramach","o":{"A":"trekkingu.","B":"trampingu.","C":"enoturystyki.","D":"fanoturystyki."},"a":"C","img":[144,44],"e":{"A":"Trekking – wędrówki górskie.","B":"Tramping – tanie podróże z plecakiem.","C":"Poprawna. Enoturystyka – winnice, degustacje wina (np. nad Renem).","D":"Fanoturystyka – kibice.","tip":"Eno = wino."}},{"n":4,"q":"Który rodzaj infrastruktury turystycznej należy zaproponować uczestnikom obozu narciarskiego?","o":{"A":"Pensjonat.","B":"Schronisko.","C":"Stanicę wodną.","D":"Pole biwakowe."},"a":"A","img":[188,43],"e":{"A":"Poprawna. Pensjonat zapewnia noclegi i wyżywienie przez cały pobyt – dobra baza obozu narciarskiego.","B":"Schronisko – górskie, dla turystów pieszych.","C":"Stanica wodna – dla kajakarzy, żeglarzy.","D":"Pole biwakowe – namioty, latem.","tip":"Obóz zimowy = baza z noclegiem i wyżywieniem."}},{"n":5,"q":"Podróżnym poszukującym oferty pieszej pielgrzymki do miejsca kultu religijnego wyznawców prawosławia należy zaoferować wyjazd","o":{"A":"na Jasną Górę.","B":"na górę Grabarkę.","C":"do Piekar Śląskich.","D":"do Kalwarii Zebrzydowskiej."},"a":"B","img":[231,72],"e":{"A":"Jasna Góra – katolickie sanktuarium w Częstochowie.","B":"Poprawna. Święta Góra Grabarka (Podlasie) – najważniejsze miejsce pielgrzymkowe prawosławnych w Polsce (góra krzyży).","C":"Piekary Śląskie – sanktuarium katolickie.","D":"Kalwaria Zebrzydowska – katolicka, UNESCO.","tip":"Prawosławie = Grabarka."}},{"n":6,"q":"Pani Maria, podczas pobytu w Szczyrku na zorganizowanych wczasach narciarskich, chce poznać rzemiosło ludowe Koniakowa. Którą imprezę należy jej w tym celu zaproponować?","o":{"A":"Zagraniczną.","B":"Przyjazdową.","C":"Fakultatywną.","D":"Obligatoryjną."},"a":"C","img":[303,73],"e":{"A":"Impreza zagraniczna – wyjazd za granicę.","B":"Przyjazdowa – dla cudzoziemców w Polsce.","C":"Poprawna. Fakultatywna – dodatkowa, nieobowiązkowa, za dodatkową opłatą wycieczka w trakcie pobytu.","D":"Obligatoryjna – obowiązkowa część programu.","tip":"Fakultatywna = dodatkowa, z wyboru."}},{"n":7,"q":"Zamieszczoną ilustrację, przedstawiającą katedrę, w której pochowani są królowie Polski, wpisaną na Listę Światowego Dziedzictwa UNESCO, można zobaczyć w katalogu","o":{"A":"o Gdańsku.","B":"o Krakowie.","C":"o Szczecinie.","D":"o Warszawie."},"a":"B","pic":1,"img":[376,277],"e":{"A":"Gdańsk – Bazylika Mariacka, ale nie groby królów.","B":"Poprawna. Katedra na Wawelu w Krakowie – miejsce koronacji i pochówku królów Polski (Stare Miasto w Krakowie – UNESCO).","C":"Szczecin – katedra św. Jakuba.","D":"Warszawa – archikatedra św. Jana.","tip":"Groby królów = Wawel."}},{"n":8,"q":"Jaką odległość musi przejść turysta, który idzie z gospodarstwa agroturystycznego do zamku, jeżeli na mapie sporządzonej w skali 1: 150 000 wynosi ona 5 cm?","o":{"A":"2,5 km","B":"4,5 km","C":"7,5 km","D":"9,5 km"},"a":"C","img":[653,73],"e":{"A":"2,5 km – błąd.","B":"4,5 km – błąd.","C":"Poprawna. 1:150 000 → 1 cm = 1,5 km; 5 × 1,5 = 7,5 km.","D":"9,5 km – błąd.","tip":"Mianownik : 100 000 = km w 1 cm."}},{"n":9,"q":"Z przedstawionych znaków mogą skorzystać przemieszczający się szlakiem","o":{"A":"konnym.","B":"pieszym.","C":"kajakowym.","D":"rowerowym."},"a":"A","pic":1,"img":[726,215],"e":{"A":"Poprawna. Przedstawione znaki (z podkową/koniem) oznaczają szlak konny.","B":"Szlak pieszy – kolorowe paski na białym tle.","C":"Szlak kajakowy – symbol kajaka.","D":"Szlak rowerowy – symbol roweru.","tip":"Szlaki: pieszy (paski), rowerowy (rower), konny (podkowa/koń)."}},{"n":10,"q":"Właściciele gospodarstwa agroturystycznego zlokalizowanego na Podhalu mogą wykorzystać swoją wiedzę o walorach turystycznych Podhala podczas planowania wycieczek do","o":{"A":"Olsztyna, Fromborka i Braniewa.","B":"Poznania, Biskupina i Inowrocławia.","C":"Nowego Targu, Zakopanego i Poronina.","D":"Szczecina, Świnoujścia i Międzyzdrojów."},"a":"C","img":[941,72],"e":{"A":"Olsztyn, Frombork – Warmia.","B":"Poznań, Biskupin – Wielkopolska/Kujawy.","C":"Poprawna. Nowy Targ, Zakopane i Poronin leżą na Podhalu.","D":"Szczecin, Świnoujście – Pomorze Zachodnie.","tip":"Podhale: Zakopane, Nowy Targ, Poronin, Bukowina."}},{"n":11,"q":"W którym mieście turyści mogą zobaczyć Panoramę Racławicką?","o":{"A":"W Łodzi.","B":"W Poznaniu.","C":"We Fromborku.","D":"We Wrocławiu."},"a":"D","img":[1013,44],"e":{"A":"Łódź – Manufaktura.","B":"Poznań – koziołki.","C":"Frombork – Kopernik.","D":"Poprawna. Panorama Racławicka (obraz Styki i Kossaka) – Wrocław.","tip":"Panorama = Wrocław."}},{"n":12,"q":"Brama Brandenburska, Muzeum Pergamońskie i Checkpoint Charlie to walory turystyczne, które mogą zobaczyć uczestnicy wycieczki do","o":{"A":"Berlina.","B":"Wiednia.","C":"Londynu.","D":"Kopenhagi."},"a":"A","img":[1057,72],"e":{"A":"Poprawna. Brama Brandenburska, Muzeum Pergamońskie, Checkpoint Charlie – Berlin.","B":"Wiedeń – Schönbrunn.","C":"Londyn – Big Ben, Tower.","D":"Kopenhaga – Mała Syrenka.","tip":"Checkpoint Charlie = Berlin."}},{"n":13,"q":"Który rodzaj turystyki należy zaproponować firmie, jeżeli złożyła ona zamówienie na organizację imprezy turystycznej dla swoich pracowników w celu wyróżnienia ich dotychczasowej pracy?","o":{"A":"Turystykę socjalną.","B":"Turystykę alternatywną.","C":"Turystykę motywacyjną.","D":"Turystykę krajoznawczą."},"a":"C","img":[1129,72],"e":{"A":"Turystyka socjalna – dofinansowane wyjazdy dla osób o niższych dochodach (np. z ZFŚS).","B":"Alternatywna – niszowe formy poza masową turystyką.","C":"Poprawna. Turystyka motywacyjna (incentive) to wyjazdy-nagrody dla pracowników za wyniki.","D":"Krajoznawcza – poznawanie kraju.","tip":"Nagroda dla pracowników = incentive = motywacyjna."}},{"n":14,"q":"Pieszy obóz wędrowny, w którego programie uwzględniono wędrówkę po Połoninach Wetlińskiej i Caryńskiej, zorganizowany został na terenie","o":{"A":"Beskidu Żywieckiego.","B":"Beskidu Śląskiego.","C":"Bieszczad.","D":"Tatr."},"a":"C","img":[1201,73],"e":{"A":"Beskid Żywiecki – Babia Góra.","B":"Beskid Śląski – Skrzyczne, Wisła.","C":"Poprawna. Połonina Wetlińska i Caryńska – Bieszczady.","D":"Tatry – Giewont.","tip":"Połoniny = Bieszczady."}},{"n":15,"q":"Którą średnią prędkość należy uwzględnić, obliczając czas przejazdu autokaru podczas wycieczki?","o":{"A":"ok. 35 km/godz.","B":"ok. 50 km/godz.","C":"ok. 65 km/godz.","D":"ok. 70 km/godz."},"a":"B","img":[1274,43],"e":{"A":"35 km/h – za wolno, realne w mieście.","B":"Poprawna. Do programów wycieczek przyjmuje się średnią prędkość autokaru ok. 50 km/h (postoje, miasta, ograniczenia).","C":"65 km/h – zbyt optymistycznie.","D":"70 km/h – zbyt optymistycznie.","tip":"Planowanie: ok. 50 km/h."}},{"n":16,"q":"Obserwacja zwierząt gospodarskich, nauka rękodzieła i wypoczynek to charakterystyczne elementy programu imprezy pobytowej typu","o":{"A":"kolonia letnia.","B":"obóz żeglarski.","C":"wycieczka edukacyjna.","D":"wczasy agroturystyczne."},"a":"D","img":[1317,73],"e":{"A":"Kolonia letnia to wypoczynek dzieci i młodzieży, zwykle bez profilu gospodarstwa wiejskiego.","B":"Obóz żeglarski – nauka żeglowania.","C":"Wycieczka edukacyjna jest krótka i objazdowa, a pytanie dotyczy imprezy pobytowej.","D":"Poprawna. Wczasy agroturystyczne to pobyt w gospodarstwie rolnym: kontakt ze zwierzętami, rękodzieło ludowe, wypoczynek na wsi.","tip":"Zwierzęta gospodarskie + rękodzieło = agroturystyka."}},{"n":17,"q":"Podczas kilkudniowej wycieczki do Katowic i Górnośląskiego Okręgu Przemysłowego należy zapewnić uczestnikom przede wszystkim usługi przewodnika","o":{"A":"muzealnego oraz usługi żywieniowe.","B":"miejskiego oraz usługi noclegowe.","C":"tatrzańskiego oraz usługi transportowe.","D":"sudeckiego oraz usługi ubezpieczeniowe."},"a":"B","img":[1390,72],"e":{"A":"Przewodnik muzealny oprowadza tylko po muzeum.","B":"Poprawna. Kilkudniowa wycieczka po mieście i GOP: przewodnik miejski oraz noclegi.","C":"Tatrzański – Tatry.","D":"Sudecki – Sudety.","tip":"Miasto = przewodnik miejski."}},{"n":18,"q":"Którą kwotę należy wpisać w przedstawionej tabeli, w miejscu oznaczonym X? (Całkowity koszt wycieczki: 5 784,59 zł; całkowity koszt zaokrąglony w górę do pełnych zł: X)","o":{"A":"5 784,00","B":"5 784,60","C":"5 785,00","D":"5 785,60"},"a":"C","ctx":"5 784,59 X","pic":1,"img":[1462,138],"e":{"A":"5 784,00 – zaokrąglono w dół.","B":"5 784,60 – zaokrąglenie do groszy.","C":"Poprawna. Zaokrąglenie w górę do pełnych złotych: 5 784,59 → 5 785,00 zł.","D":"5 785,60 – błąd.","tip":"„W górę do pełnych złotych” – zawsze następny pełny złoty."}},{"n":19,"q":"Oblicz kwotę podatku VAT, jeżeli do kosztów świadczeń wynoszących 1 700,00 zł, organizator wczasów w Wejherowie doliczył 12% marży?","o":{"A":"46,92 zł","B":"89,93 zł","C":"204,00 zł","D":"391,00 zł"},"a":"A","img":[1600,72],"e":{"A":"Poprawna. Marża 12% z 1 700 = 204 zł; VAT 23% od marży = 46,92 zł.","B":"89,93 zł – błąd.","C":"204 zł – to marża.","D":"391 zł – 23% od kosztów, błąd.","tip":"VAT = 23% × marża."}},{"n":20,"q":"Na podstawie danych zamieszczonych w tabeli oblicz całkowity koszt krajowej imprezy integracyjnej.","o":{"A":"23 480,66 zł","B":"26 222,66 zł","C":"26 592,00 zł","D":"28 105,50 zł"},"a":"B","ctx":"Suma kosztów świadczeń w zł 22 850,00 Marża organizatora turystyki 12% w zł Podatek VAT w zł Całkowity koszt krajowej imprezy integracyjnej w zł","pic":1,"img":[1672,208],"e":{"A":"23 480,66 zł – błąd.","B":"Poprawna. Marża 12% = 2 742 zł; VAT 23% = 630,66 zł; razem 22 850 + 2 742 + 630,66 = 26 222,66 zł.","C":"26 592 zł – VAT od kosztów.","D":"28 105,50 zł – błąd.","tip":"Koszty + marża + VAT od marży."}},{"n":21,"q":"Oblicz cenę jednostkową wycieczki organizowanej dla 27 osób, w tym 1 pilota wycieczek i 1 kierowcy autokaru, przy założeniu, że całkowita jej cena dla grupy wynosi 13 625,00 zł.","o":{"A":"504,63 zł","B":"524,04 zł","C":"530,55 zł","D":"545,00 zł"},"a":"D","img":[1880,73],"e":{"A":"504,63 zł = : 27 – błąd.","B":"524,04 zł = : 26 – błąd.","C":"530,55 zł – błąd.","D":"Poprawna. Płaci 27 − 2 = 25 osób: 13 625 : 25 = 545,00 zł.","tip":"Pilot i kierowca nie płacą."}},{"n":22,"q":"Które informacje należy wpisać w rezerwacji pobytu do gospodarstwa agroturystycznego?","o":{"A":"Opis obiektu i termin przyjazdu.","B":"Trasę przejazdu i liczbę pokojów.","C":"Nazwiska klientów i termin pobytu.","D":"Ofertę obiektu i wyposażenie pokojów."},"a":"C","img":[1953,44],"e":{"A":"Opis obiektu – to oferta.","B":"Trasa przejazdu – zamówienie transportu.","C":"Poprawna. Rezerwacja musi zawierać dane klientów (nazwiska) i termin pobytu.","D":"Wyposażenie – oferta obiektu.","tip":"Rezerwacja: kto, kiedy, ile pokoi."}},{"n":23,"q":"Którą strukturę pokojów należy uwzględnić w rezerwacji pobytu w pensjonacie dla 2 rodzin 3-osobowych, 1 rodziny 4-osobowej i 1 małżeństwa?","o":{"A":"1 pokój 4-osobowy, 2 pokoje 3-osobowe, 1 pokój 2-osobowy","B":"1 pokój 2-osobowy, 2 pokoje 4-osobowe, 1 pokój 3-osobowy","C":"1 pokój 3-osobowy, 2 pokoje 4-osobowe, 2 pokoje 2-osobowe","D":"1 pokój 1-osobowy, 2 pokoje 3-osobowe, 2 pokoje 4-osobowe"},"a":"A","pic":1,"img":[1997,317],"e":{"A":"Poprawna. 1 pokój 4-os. (rodzina 4-os.), 2 pokoje 3-os. (dwie rodziny 3-os.), 1 pokój 2-os. (małżeństwo).","B":"Zbyt wiele miejsc 4-osobowych.","C":"Struktura nie pasuje do rodzin.","D":"Pokój 1-osobowy jest zbędny.","tip":"Każda rodzina – osobny pokój o jej wielkości."}},{"n":24,"q":"Który instrument marketingu zastosowano rozszerzając zakres oferowanych usług na wczasach w gospodarstwie agroturystycznym?","o":{"A":"Cenę.","B":"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"B","img":[2314,73],"e":{"A":"Cena –
