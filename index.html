<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T.07 – egzaminy z turystyki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#1d2a24; --muted:#6a746e; --line:#e3ddd0;
  --green:#2f6b4f; --green-soft:#e3efe7; --red:#a5473b; --red-soft:#f6e4e0; --gold:#b9852f; --gold-soft:#f7ecd6;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:var(--green)}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 80px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header.top h1{font:700 24px/1.1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em;cursor:pointer}
header.top .sub{color:var(--muted);font-size:13px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff;font:700 15px Fraunces,serif;flex:none}
nav.tabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;font:500 14px Inter;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
h2{font:600 20px/1.2 Fraunces,Georgia,serif;margin:4px 0 12px}
h3{font:600 15px Inter;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.year{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.year b{font:700 22px Fraunces,serif;display:block;margin-bottom:6px}
.sess{display:block;width:100%;text-align:left;border:0;background:var(--bg);border-radius:9px;padding:7px 10px;margin-top:5px;cursor:pointer;font:500 14px Inter;color:var(--ink)}
.sess:hover{background:var(--green-soft)}
.sess .dot{float:right;font-size:11px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font:500 14px Inter;color:var(--ink);text-decoration:none;margin:4px 6px 4px 0}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:#7a5513}
.pill.g{background:var(--green-soft);color:var(--green)}
.q{font-weight:600;margin:0 0 10px;font-size:16px}
.ctx{background:var(--bg);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;margin:7px 0;cursor:pointer;font:15px Inter;color:var(--ink)}
.opt b{display:inline-block;width:22px}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.why{font-size:13.5px;margin:2px 0 10px 34px;color:#38443e}
.why.ok{color:var(--green)}
.tip{background:var(--gold-soft);border-radius:9px;padding:8px 11px;font-size:13.5px;margin-top:8px}
.spr{width:100%;max-width:700px;border:1px solid var(--line);border-radius:8px;background-color:#fff;background-repeat:no-repeat}
.solp{display:block;width:100%;max-width:820px;margin:0 auto 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.long{background:#eef4f0;border-left:4px solid var(--green);border-radius:9px;padding:10px 12px;font-size:14.5px;line-height:1.6;margin-top:10px}
.trap{background:#fbeaea;color:#7a2a2a;border-radius:8px;padding:6px 9px;font-size:13.5px}
.kb .ex{margin:6px 0;line-height:1.6}
.kq{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:15px Inter;margin:6px 0 10px;box-sizing:border-box}
.toc{display:flex;flex-wrap:wrap;gap:6px}.toc a{font-size:13px;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px;text-decoration:none}
.kt{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}.kt td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}.kt td:first-child{width:24%;min-width:70px;color:var(--green)}
.kb{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.55}.kb h4{margin:0 0 4px;font:600 15px Inter}.kb p{margin:4px 0}
.ex{color:#5b4a1e;background:var(--gold-soft);border-radius:8px;padding:6px 9px;display:block}.kl{font-size:14px;line-height:1.6;padding-left:20px}.kl li{margin-bottom:6px}
details summary{cursor:pointer;color:var(--green);font-size:13px;margin:6px 0}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--green)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div b{font:700 26px Fraunces,serif;display:block}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
select,input[type=number]{font:14px Inter;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#fff}
.grid40{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.grid40 span{text-align:center;font-size:12px;padding:4px 0;border-radius:6px;background:var(--bg)}
.grid40 span.ok{background:var(--green-soft);color:var(--green)} .grid40 span.bad{background:var(--red-soft);color:var(--red)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){.grid40{grid-template-columns:repeat(8,1fr)} header.top h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">T7</div>
    <div><h1 onclick="go('home')">Egzamin T.07</h1><div class="sub">Prowadzenie działalności turystycznej na obszarach wiejskich</div></div>
  </header>
  <nav class="tabs">
    <button data-v="home" onclick="go('home')">Sesje</button>
    <button data-v="trainer" onclick="go('trainer')">🎲 Losowe pytania</button>
    <button data-v="mistakes" onclick="go('mistakes')">Moje błędy</button>
    <button data-v="konspekt" onclick="go('konspekt')">📘 Skróty i wzory</button>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const KONSPEKT = "<div class=\"card\">\n<h2>Skróty i konspekt – wszystko w jednym miejscu</h2>\n<p class=\"muted small\">Zebrane ze wszystkich 25 sesji T.07 (2013–2024). Wpisz słowo w wyszukiwarkę, żeby szybko znaleźć skrót albo wzór.</p>\n<input id=\"kq\" class=\"kq\" placeholder=\"Szukaj: np. HB, VAT, marża, NNW, doby…\" oninput=\"kFilter(this.value)\">\n<div class=\"toc\">\n<a href=\"javascript:void 0\" onclick=\"document.getElementById('k-wyz').scrollIntoView({behavior:'smooth'})\">Wyżywienie i pokoje</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-ubez').scrollIntoView({behavior:'smooth'})\">Ubezpieczenia</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-org').scrollIntoView({behavior:'smooth'})\">Organizacje i targi</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-dok').scrollIntoView({behavior:'smooth'})\">Dokumenty i finanse</a>\n<a href=\"javascript:void 0\" onclick=\"document.getElementById('k-trans').scrollIntoView({behavior:'smooth'})\">Transport</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-wal').scrollIntoView({behavior:'smooth'})\">Waluty</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-ang').scrollIntoView({behavior:'smooth'})\">Pojęcia branżowe</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-mat').scrollIntoView({behavior:'smooth'})\">Matematyka – prosto, z przykładami</a><a href=\"javascript:void 0\" onclick=\"document.getElementById('k-prak').scrollIntoView({behavior:'smooth'})\">Część praktyczna krok po kroku</a>\n</div>\n</div>\n\n<div class=\"card ks\" id=\"k-wyz\"><h3>🍽️ Wyżywienie (taryfy hotelowe)</h3>\n<table class=\"kt\">\n<tr><td><b>RO / OB</b></td><td>Room Only / Only Bed – sam nocleg, bez posiłków</td></tr>\n<tr><td><b>BB</b></td><td>Bed &amp; Breakfast – nocleg + <b>śniadanie</b></td></tr>\n<tr><td><b>CB</b></td><td>Continental Breakfast – śniadanie kontynentalne (lekkie: pieczywo, dżem, kawa). To rodzaj śniadania, nie taryfa noclegowa</td></tr>\n<tr><td><b>HB</b></td><td>Half Board – <b>2 posiłki</b>: śniadanie + obiadokolacja (półpensjonat)</td></tr>\n<tr><td><b>FB</b></td><td>Full Board – <b>3 posiłki</b>: śniadanie, obiad, kolacja (pełne wyżywienie)</td></tr>\n<tr><td><b>AI</b></td><td>All Inclusive – wszystkie posiłki + przekąski i napoje w cenie</td></tr>\n</table>\n<p class=\"small\">Zapamiętaj kolejność: <b>RO → BB → HB → FB → AI</b> (od najmniej do najwięcej jedzenia).</p>\n<h3>🛏️ Pokoje</h3>\n<table class=\"kt\">\n<tr><td><b>SGL</b></td><td>single – pokój 1-osobowy</td></tr>\n<tr><td><b>DBL</b></td><td>double – pokój 2-osobowy (zwykle łóżko małżeńskie)</td></tr>\n<tr><td><b>TWN</b></td><td>twin – pokój 2-osobowy z dwoma pojedynczymi łóżkami</td></tr>\n<tr><td><b>TPL / TRPL</b></td><td>triple – pokój 3-osobowy</td></tr>\n<tr><td><b>QDR / QUAD</b></td><td>pokój 4-osobowy</td></tr>\n<tr><td><b>APT</b></td><td>apartament</td></tr>\n<tr><td><b>EB</b></td><td>extra bed – dostawka</td></tr>\n<tr><td><b>Doba hotelowa</b></td><td>czas od zameldowania do wymeldowania (np. 14:00–12:00). Liczba dób = data wyjazdu − data przyjazdu</td></tr>\n<tr><td><b>Osobonocleg</b></td><td>1 osoba × 1 noc. 5 osób × 2 noce = 10 osobonoclegów</td></tr>\n<tr><td><b>Rooming list</b></td><td>lista gości z przydziałem do pokoi – biuro wysyła ją do hotelu</td></tr>\n<tr><td><b>Grafik pokoi</b></td><td>tabela obłożenia – w niej właściciel kwatery zaznacza zajętość pokoi</td></tr>\n</table>\n<h3>🏠 Rodzaje obiektów (ustawa o usługach turystycznych)</h3>\n<table class=\"kt\">\n<tr><td><b>Hotel</b></td><td>min. 10 pokoi, szeroki zakres usług (gwiazdki *–*****)</td></tr>\n<tr><td><b>Motel</b></td><td>przy drodze, parking, obsługa zmotoryzowanych</td></tr>\n<tr><td><b>Pensjonat</b></td><td>min. 7 pokoi, <b>całodzienne wyżywienie</b></td></tr>\n<tr><td><b>Dom wycieczkowy</b></td><td>min. 30 miejsc, <b>minimalny zakres usług, samoobsługa</b></td></tr>\n<tr><td><b>Schronisko młodzieżowe</b></td><td>dla turystyki młodzieżowej, <b>samoobsługa</b></td></tr>\n<tr><td><b>Schronisko</b></td><td>przy szlakach (np. PTTK w górach)</td></tr>\n<tr><td><b>Kemping / pole biwakowe</b></td><td>teren z namiotami, przyczepami (kemping – także domki)</td></tr>\n<tr><td><b>Inne obiekty</b></td><td>np. <b>pokoje gościnne</b> na wsi (agroturystyka), kwatery prywatne</td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-ubez\"><h3>🛡️ Ubezpieczenia</h3>\n<table class=\"kt\">\n<tr><td><b>KL</b></td><td>Koszty Leczenia – leczenie za granicą/poza domem (np. konsultacje lekarskie). <b>Obowiązkowe za granicą</b></td></tr>\n<tr><td><b>NNW</b></td><td>Następstwa Nieszczęśliwych Wypadków – odszkodowanie za uraz. <b>Obowiązkowe</b> przy imprezie organizowanej przez biuro</td></tr>\n<tr><td><b>OC</b></td><td>Odpowiedzialność Cywilna – za szkody wyrządzone <b>innym</b> (np. przez przewodnika, pilota)</td></tr>\n<tr><td><b>AC</b></td><td>Autocasco – ubezpieczenie własnego pojazdu</td></tr>\n<tr><td><b>KR</b></td><td>Koszty Rezygnacji – <b>dobrowolne</b>, zwrot gdy klient zrezygnuje z wyjazdu</td></tr>\n<tr><td><b>Sporty wysokiego ryzyka</b></td><td>dodatkowa klauzula (np. skialpinizm, nurkowanie)</td></tr>\n<tr><td><b>Wyłączenia</b></td><td>szkody po alkoholu, samobójstwo i próba, choroby psychiczne – polisa ich nie pokrywa</td></tr>\n<tr><td><b>Gwarancja / TFG</b></td><td>zabezpieczenie finansowe biura (gwarancja bankowa lub ubezpieczeniowa, rachunek powierniczy, Turystyczny Fundusz Gwarancyjny). Przy bankructwie biura powrót klientów organizuje <b>marszałek województwa</b></td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-org\"><h3>🏛️ Organizacje i instytucje</h3>\n<table class=\"kt\">\n<tr><td><b>UNWTO</b></td><td>Światowa Organizacja Turystyki (ONZ), siedziba w <b>Madrycie</b>. Turystyka = wyjazd poza miejsce zamieszkania na &lt; 1 rok, nie w celu zarobkowym</td></tr>\n<tr><td><b>WTTC</b></td><td>Światowa Rada Podróży i Turystyki (biznes)</td></tr>\n<tr><td><b>POT</b></td><td>Polska Organizacja Turystyczna – promuje Polskę (logo „Polska”), ma <b>Zagraniczne Ośrodki POT</b></td></tr>\n<tr><td><b>ROT / LOT</b></td><td>Regionalna / Lokalna Organizacja Turystyczna (np. ROTWŁ – woj. łódzkiego)</td></tr>\n<tr><td><b>PTTK</b></td><td>Polskie Towarzystwo Turystyczno-Krajoznawcze – schroniska, szlaki, odznaki (GOT – Górska Odznaka Turystyczna: pieczątki w książeczce)</td></tr>\n<tr><td><b>PTSM</b></td><td>Polskie Towarzystwo Schronisk Młodzieżowych</td></tr>\n<tr><td><b>PFTW</b></td><td>Polska Federacja Turystyki Wiejskiej „Gospodarstwa Gościnne” – kategoryzacja kwater wiejskich (słoneczka)</td></tr>\n<tr><td><b>IT / PIT</b></td><td>(Punkt) Informacji Turystycznej – znak: białe „i” na zielonym tle</td></tr>\n<tr><td><b>GOPR / TOPR / WOPR</b></td><td>ratownictwo górskie / tatrzańskie / wodne</td></tr>\n<tr><td><b>UNESCO</b></td><td>Lista Światowego Dziedzictwa (np. Kraków, Wieliczka, Toruń, Zamość, Malbork, Hala Stulecia, Park Mużakowski, Kalwaria Zebrzydowska)</td></tr>\n<tr><td><b>Pomnik Historii</b></td><td>nadaje Prezydent RP; logo – gotyckie okno</td></tr>\n<tr><td><b>Kuratorium Oświaty</b></td><td>tu zgłasza się kolonie/obozy – <b>według siedziby organizatora</b></td></tr>\n<tr><td><b>Marszałek województwa</b></td><td>rejestr organizatorów turystyki; nadaje uprawnienia pilota/przewodnika (wg <b>miejsca zamieszkania</b>)</td></tr>\n<tr><td><b>Targi</b></td><td><b>ITB</b> – Berlin (największe na świecie), <b>TT Warsaw</b> – Warszawa, <b>Tour Salon</b> – Poznań, <b>FITUR</b> – Madryt, Holiday World – Praga</td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-dok\"><h3>📄 Dokumenty i finanse</h3>\n<table class=\"kt\">\n<tr><td><b>VAT</b></td><td>podatek od towarów i usług. <b>8%</b> – nocleg, gastronomia, przewóz osób. <b>23%</b> – usługi pilota, przewodnika, SPA, marża biura</td></tr>\n<tr><td><b>Procedura marży</b></td><td>biura podróży płacą VAT tylko od marży. Na fakturze dopisek: „<b>procedura marży dla biur podróży</b>”</td></tr>\n<tr><td><b>NIP / REGON / PESEL</b></td><td>numer podatkowy firmy / numer statystyczny firmy / numer osoby fizycznej</td></tr>\n<tr><td><b>KP / KW</b></td><td>Kasa Przyjmie (dowód wpłaty gotówki) / Kasa Wyda (dowód wypłaty)</td></tr>\n<tr><td><b>Raport kasowy</b></td><td>zestawienie wszystkich KP i KW z saldem kasy</td></tr>\n<tr><td><b>FV / FVS</b></td><td>faktura VAT (sprzedaży)</td></tr>\n<tr><td><b>Faktura proforma</b></td><td>dokument przed sprzedażą (oferta do zapłaty), nie jest księgowy</td></tr>\n<tr><td><b>Faktura korygująca</b></td><td>gdy po wystawieniu faktury jest rabat albo błąd</td></tr>\n<tr><td><b>Faktura zaliczkowa</b></td><td>gdy klient wpłaca zaliczkę przed usługą</td></tr>\n<tr><td><b>Faktura RR</b></td><td>zakup od rolnika ryczałtowego</td></tr>\n<tr><td><b>Rachunek (uproszczony)</b></td><td>wystawia gospodarstwo agroturystyczne zwolnione z VAT. Musi mieć m.in. <b>datę wystawienia</b></td></tr>\n<tr><td><b>Voucher</b></td><td>dokument uprawniający do skorzystania z opłaconych świadczeń (nocleg, wyżywienie). Nie zawiera świadczeń fakultatywnych</td></tr>\n<tr><td><b>Teczka imprezy</b></td><td>program, kalkulacja, lista uczestników, umowy, potwierdzenia, polisa, notatki pilota. <b>Nie</b>: ksero paszportów, bilety kupione przez klientów</td></tr>\n<tr><td><b>Umowa agencyjna</b></td><td>organizator ↔ agent (sprzedaje w imieniu organizatora za prowizję)</td></tr>\n<tr><td><b>Agent / pośrednik</b></td><td>agent – działa dla organizatora; pośrednik – na zlecenie klienta</td></tr>\n<tr><td><b>Tabela frankfurcka</b></td><td>procentowe obniżki ceny za wady imprezy (reklamacje)</td></tr>\n<tr><td><b>Umowa hotelowa</b></td><td>zawiera gość z obiektem przy zameldowaniu</td></tr>\n<tr><td><b>Barter</b></td><td>wymiana towar za towar bez pieniędzy</td></tr>\n<tr><td><b>Marketing-mix 4P (5P)</b></td><td>Produkt, Cena (Price), Dystrybucja (Place), Promocja + w usługach Personel (People). Rabat/zniżka = cena, modernizacja = produkt, billboard/reklama = promocja, Internet/sprzedaż przez biura = dystrybucja</td></tr>\n<tr><td><b>PR / publicity</b></td><td>public relations – budowanie wizerunku (np. zaproszenie dziennikarzy, władz); publicity – darmowe wzmianki w mediach</td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-trans\"><h3>🚌 Transport i drogi</h3>\n<table class=\"kt\">\n<tr><td><b>A1, A2, A4</b></td><td>autostrady (litera A)</td></tr>\n<tr><td><b>S7, S3</b></td><td>drogi ekspresowe (litera S)</td></tr>\n<tr><td><b>53, 7</b></td><td>drogi krajowe (sama liczba)</td></tr>\n<tr><td><b>E77, E40</b></td><td>trasy europejskie (litera E)</td></tr>\n<tr><td><b>EIC / IC / TLK / REGIO / KM</b></td><td>Express InterCity, InterCity, Twoje Linie Kolejowe, pociąg regionalny, Koleje Mazowieckie</td></tr>\n<tr><td><b>TGV</b></td><td>francuski szybki pociąg</td></tr>\n<tr><td><b>PLL LOT</b></td><td>Polskie Linie Lotnicze LOT</td></tr>\n<tr><td><b>MTB</b></td><td>Mountain Bike – rower górski</td></tr>\n<tr><td><b>AETR</b></td><td>umowa o czasie pracy kierowców w transporcie międzynarodowym; czas jazdy zapisuje <b>tachograf</b></td></tr>\n<tr><td><b>Transfer</b></td><td>przewóz lotnisko/port/dworzec ↔ hotel</td></tr>\n<tr><td><b>Tranzyt</b></td><td>przejazd przez kraj/obszar bez zatrzymania</td></tr>\n<tr><td><b>Odprawa</b></td><td>biletowo-bagażowa (check-in → <b>karta pokładowa</b>), bezpieczeństwa, paszportowa, celna</td></tr>\n<tr><td><b>Kabotaż</b></td><td>przewóz wewnątrz kraju przez przewoźnika z innego kraju</td></tr>\n<tr><td><b>Znaki</b></td><td>brązowo-białe – turystyczne (atrakcje, sylwetki obiektów); szachownica – zagrożenie lawinowe</td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-wal\"><h3>💱 Waluty</h3>\n<table class=\"kt\">\n<tr><td><b>EUR</b></td><td>euro (strefa euro)</td></tr><tr><td><b>GBP</b></td><td>funt – Wielka Brytania</td></tr>\n<tr><td><b>CZK</b></td><td>korona – Czechy</td></tr><tr><td><b>HUF</b></td><td>forint – Węgry (w tabelach często za 100 HUF)</td></tr>\n<tr><td><b>UAH</b></td><td>hrywna – Ukraina</td></tr><tr><td><b>RON</b></td><td>lej – Rumunia</td></tr>\n<tr><td><b>RUB</b></td><td>rubel – Rosja</td></tr><tr><td><b>USD / CHF</b></td><td>dolar amerykański / frank szwajcarski</td></tr>\n<tr><td><b>Kupno / sprzedaż</b></td><td>kurs <b>kupna</b> – po tyle bank kupuje od ciebie walutę; kurs <b>sprzedaży</b> – po tyle ci sprzedaje. Gdy biuro płaci za granicą i kupuje walutę → licz po kursie <b>sprzedaży</b></td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-ang\"><h3>🌍 Pojęcia branżowe (słowniczek)</h3>\n<table class=\"kt\">\n<tr><td><b>First minute</b></td><td>sprzedaż zaraz po wprowadzeniu oferty, z rabatem za wczesną rezerwację</td></tr>\n<tr><td><b>Last minute</b></td><td>sprzedaż tuż przed wyjazdem po obniżonej cenie</td></tr>\n<tr><td><b>Czarter</b></td><td>wynajęcie całości / puli miejsc na wyłączność <b>bez możliwości anulowania</b> – ryzyko pustych miejsc ma biuro</td></tr>\n<tr><td><b>Allotment</b></td><td>pula miejsc z możliwością <b>zwolnienia w określonym terminie</b> (release)</td></tr>\n<tr><td><b>Free sale</b></td><td>sprzedaż bez stałej puli, hotel potwierdza miejsca na bieżąco</td></tr>\n<tr><td><b>Overbooking</b></td><td>przyjęcie więcej rezerwacji niż jest miejsc</td></tr>\n<tr><td><b>Rezerwacja</b></td><td>wstępna (bez zaliczki) → potwierdzona → <b>gwarantowana</b> (z przedpłatą)</td></tr>\n<tr><td><b>Timesharing</b></td><td>prawo do apartamentu na kilka tygodni każdego roku</td></tr>\n<tr><td><b>Franchising</b></td><td>prowadzenie firmy pod cudzą marką</td></tr>\n<tr><td><b>Dumping</b></td><td>sprzedaż poniżej kosztów</td></tr>\n<tr><td><b>Catering</b></td><td>posiłki dostarczane w miejsce wskazane przez klienta</td></tr>\n<tr><td><b>Incentive</b></td><td>turystyka <b>motywacyjna</b> – wyjazd w nagrodę dla pracowników, integracja</td></tr>\n<tr><td><b>Incoming / outgoing</b></td><td>przyjazdowa (cudzoziemcy do nas) / wyjazdowa (my za granicę)</td></tr>\n<tr><td><b>Krajowa / międzynarodowa</b></td><td>po własnym kraju / z przekroczeniem granicy</td></tr>\n<tr><td><b>Odwiedzający / turysta</b></td><td>bez noclegu (jednodniowy) / z co najmniej jednym noclegiem</td></tr>\n<tr><td><b>Impreza turystyczna</b></td><td>min. <b>2 usługi</b> + wspólny program i cena (z noclegiem lub &gt; 24 h albo ze zmianą miejsca)</td></tr>\n<tr><td><b>Fakultatywna</b></td><td>dodatkowa, płatna, dla chętnych (np. wycieczka kupiona u rezydenta)</td></tr>\n<tr><td><b>Kwalifikowana</b></td><td>wymaga umiejętności i sprzętu: rafting, nurkowanie, żeglarstwo, wspinaczka, kajaki górskie</td></tr>\n<tr><td><b>Tramping</b></td><td>tanie, samodzielne podróżowanie lokalnym transporciem</td></tr>\n<tr><td><b>Trekking</b></td><td>wielodniowe piesze wędrówki (zwykle w górach)</td></tr>\n<tr><td><b>Rafting / canyoning</b></td><td>spływ pontonem po rwącej rzece / schodzenie korytem potoku w kanionie</td></tr>\n<tr><td><b>Cruise</b></td><td>rejs wycieczkowy statkiem</td></tr>\n<tr><td><b>Nordic walking</b></td><td>marsz z kijami</td></tr>\n<tr><td><b>Etniczna / sentymentalna</b></td><td>do miejsc pochodzenia przodków; etniczna też = kultura ludowa</td></tr>\n<tr><td><b>Pątnicza (pielgrzymkowa)</b></td><td>do sanktuariów (Częstochowa, Kalwaria, Łagiewniki, Licheń, Święta Lipka; Grabarka – prawosławie)</td></tr>\n<tr><td><b>Fanoturystyka / enoturystyka / tanatoturystyka</b></td><td>wydarzenia sportowe / wino / miejsca śmierci i tragedii</td></tr>\n<tr><td><b>Balneologia</b></td><td>lecznictwo wodami mineralnymi i borowinami (uzdrowiska)</td></tr>\n<tr><td><b>Hippika / hipoterapia</b></td><td>jeździectwo / rehabilitacja z udziałem konia</td></tr>\n<tr><td><b>Speleologia</b></td><td>jaskinie</td></tr>\n<tr><td><b>Pilot / przewodnik / rezydent</b></td><td>pilot – opiekuje się grupą w podróży w imieniu organizatora; przewodnik – oprowadza po obiektach (miejski, górski: tatrzański, beskidzki, sudecki); rezydent – przedstawiciel biura w miejscu pobytu</td></tr>\n<tr><td><b>Maslow</b></td><td>fizjologiczne (sen, jedzenie) → bezpieczeństwo → przynależność → szacunek i uznanie → samorealizacja</td></tr>\n<tr><td><b>Efekt Veblena</b></td><td>przy luksusie wyższa cena = większy popyt (prestiż)</td></tr>\n</table>\n</div>\n\n<div class=\"card ks\" id=\"k-mat\"><h3>🧮 Matematyka – prosto i na przykładach</h3>\n<p class=\"small muted\">Każdy temat ma trzy części: <b>o co chodzi</b> (prostymi słowami), <b>jak liczyć</b> (krok po kroku) i <b>przykład</b> (rozwiązany od początku do końca). Na dole każdego tematu – <b>pułapka</b>, na którą trzeba uważać.</p>\n\n<div class=\"kb\"><h4>1. Procenty – podstawa wszystkiego</h4>\n<p><b>O co chodzi:</b> procent to „ile części ze stu”. 10% to 10 ze 100, czyli jedna dziesiąta. 50% to połowa. 100% to całość.</p>\n<p><b>Jak liczyć:</b> zamień procent na liczbę z przecinkiem i pomnóż:<br>\n10% = 0,10 &nbsp;·&nbsp; 8% = 0,08 &nbsp;·&nbsp; 23% = 0,23 &nbsp;·&nbsp; 30% = 0,30 &nbsp;·&nbsp; 5% = 0,05</p>\n<div class=\"ex\"><b>Przykład 1:</b> Ile to 30% z 16 200 zł?<br>\n16 200 × 0,30 = <b>4 860 zł</b><br>\n<b>Przykład 2 (sposób „w głowie”):</b> Ile to 12% z 2 000 zł?<br>\n10% z 2 000 = 200 zł (przesuwamy przecinek o jedno miejsce)<br>\n1% z 2 000 = 20 zł (przesuwamy o dwa miejsca)<br>\n12% = 10% + 2 × 1% = 200 + 40 = <b>240 zł</b></div>\n<p><b>Dodać procent</b> (np. cena + podatek): pomnóż przez 1,…<br>\n+8% → × 1,08 &nbsp;·&nbsp; +23% → × 1,23 &nbsp;·&nbsp; +10% → × 1,10</p>\n<p><b>Odjąć procent</b> (rabat, zniżka): pomnóż przez to, co zostaje<br>\n−5% → × 0,95 &nbsp;·&nbsp; −10% → × 0,90 &nbsp;·&nbsp; −50% → × 0,50</p>\n<div class=\"ex\"><b>Przykład 3:</b> Wycieczka kosztuje 2 550 zł, rabat 5%. Ile zapłaci klient?<br>\nSposób 1: 5% z 2 550 = 127,50 zł → 2 550 − 127,50 = <b>2 422,50 zł</b><br>\nSposób 2: 2 550 × 0,95 = <b>2 422,50 zł</b> (ten sam wynik, szybciej)</div>\n<p class=\"trap\">⚠️ Pułapka: najpierw przeczytaj, czy pytają o <b>sam procent</b> (np. „ile wynosi rabat?”), czy o <b>cenę po rabacie</b>.</p></div>\n\n<div class=\"kb\"><h4>2. VAT – netto i brutto</h4>\n<p><b>O co chodzi:</b> VAT to podatek doliczany do ceny.<br>\n<b>Netto</b> = cena BEZ podatku. <b>Brutto</b> = cena Z podatkiem (to płaci klient).<br>\nBrutto = netto + VAT.</p>\n<p><b>Ile procent?</b> <b>8%</b> – nocleg, jedzenie, przejazd autokarem/pociągiem. <b>23%</b> – pilot, przewodnik, SPA, marża biura podróży.</p>\n<p><b>Jak liczyć – z netto na brutto:</b> netto × 1,08 (albo × 1,23)</p>\n<div class=\"ex\"><b>Przykład 1:</b> 20 pokoi po 100 zł netto, VAT 8%. Ile brutto?<br>\nKrok 1: netto razem = 20 × 100 = 2 000 zł<br>\nKrok 2: brutto = 2 000 × 1,08 = <b>2 160 zł</b><br>\n(sam VAT to 2 000 × 0,08 = 160 zł)</div>\n<p><b>Jak liczyć – z brutto na netto:</b> brutto <b>podzielić</b> przez 1,08 (albo 1,23)</p>\n<div class=\"ex\"><b>Przykład 2:</b> Faktura na 7 400 zł brutto, VAT 8%. Ile netto?<br>\n7 400 : 1,08 = <b>6 851,85 zł</b> netto<br>\nVAT = 7 400 − 6 851,85 = 548,15 zł<br>\nSprawdzenie: 6 851,85 × 1,08 = 7 400 ✔</div>\n<p><b>Ile VAT jest w kwocie brutto?</b> brutto × 8 : 108 (albo × 23 : 123)</p>\n<div class=\"ex\"><b>Przykład 3:</b> Nocleg kosztuje 100 zł brutto. Ile w tym VAT (8%)?<br>\n100 × 8 : 108 = <b>7,41 zł</b></div>\n<p class=\"trap\">⚠️ Pułapka: z kwoty brutto NIE liczy się „8% od całości”. 8% ze 100 zł to 8 zł – źle! W 100 zł brutto podatku jest tylko 7,41 zł.</p></div>\n\n<div class=\"kb\"><h4>3. Cena imprezy – marża i VAT (najważniejsze na egzaminie!)</h4>\n<p><b>O co chodzi:</b> biuro podróży kupuje usługi (hotel, autokar, bilety) – to są <b>koszty</b>. Do tego dolicza swój zarobek – to <b>marża</b>. Od marży (i TYLKO od marży) płaci podatek VAT 23%.</p>\n<p><b>Jak liczyć – zawsze w tej kolejności:</b><br>\n① dodaj wszystkie koszty → <b>suma kosztów</b><br>\n② policz marżę: suma kosztów × procent marży<br>\n③ policz VAT: marża × 0,23<br>\n④ cena imprezy = suma kosztów + marża + VAT<br>\n⑤ cena na osobę = cena imprezy : liczba osób płacących</p>\n<div class=\"ex\"><b>Przykład:</b> Koszty 6 980 zł, marża 18%. Ile kosztuje impreza?<br>\n① koszty = 6 980 zł<br>\n② marża = 6 980 × 0,18 = 1 256,40 zł<br>\n③ VAT = 1 256,40 × 0,23 = 288,97 zł<br>\n④ cena = 6 980 + 1 256,40 + 288,97 = <b>8 525,37 zł</b></div>\n<div class=\"ex\"><b>Przykład na osobę:</b> Koszty 1 000 zł, marża 10%, grupa 30 osób.<br>\nmarża = 100 zł, VAT = 100 × 0,23 = 23 zł, cena = 1 123 zł<br>\nna osobę: 1 123 : 30 = <b>37,43 zł</b></div>\n<p><b>Gdy pytają, ile biuro zarobiło</b> (cena sprzedaży znana): marża = to, co zapłacili klienci − koszty.</p>\n<div class=\"ex\"><b>Przykład:</b> 30 osób × 150 zł = 4 500 zł wpłat. Koszty: 4 050 zł.<br>\nmarża = 4 500 − 4 050 = <b>450 zł</b></div>\n<p class=\"trap\">⚠️ Pułapka: VAT NIGDY nie liczymy od całej ceny ani od kosztów – tylko od marży. I najpierw marża, potem VAT.</p></div>\n\n<div class=\"kb\"><h4>4. Kto płaci, a kto jedzie za darmo</h4>\n<p><b>O co chodzi:</b> pilot i kierowca jadą w pracy – nie płacą. Często za darmo jedzie też opiekun grupy. Ich koszt rozkładamy na tych, którzy płacą.</p>\n<p><b>Jak liczyć:</b> koszt całkowity : liczba osób <b>płacących</b>.</p>\n<div class=\"ex\"><b>Przykład 1:</b> Autokar kosztuje 2 438 zł. Jedzie 48 osób, w tym pilot i kierowca.<br>\npłacących: 48 − 2 = 46 osób<br>\n2 438 : 46 = <b>53 zł</b> na osobę</div>\n<div class=\"ex\"><b>Przykład 2:</b> Cena 320 zł/os., jedzie 20 uczestników i pilot.<br>\npłaci 20 osób: 20 × 320 = <b>6 400 zł</b></div>\n<div class=\"ex\"><b>Przykład 3 (odwrotnie):</b> Impreza kosztuje 3 600 zł, jedna osoba płaci 180 zł. Ilu było uczestników?<br>\n3 600 : 180 = <b>20 osób</b></div>\n<p><b>Zaokrąglanie:</b> cenę na osobę zwykle zaokrąglamy <b>w górę</b> do pełnych złotych (358,28 zł → 359 zł), żeby biuro nie straciło.</p>\n<p class=\"trap\">⚠️ Pułapka: dzielenie przez wszystkich (razem z pilotem i kierowcą) daje za małą cenę – to zawsze jedna ze złych odpowiedzi.</p></div>\n\n<div class=\"kb\"><h4>5. Koszt stały i koszt zmienny</h4>\n<p><b>O co chodzi:</b><br>\n<b>Stały</b> – płacimy tyle samo, czy jedzie 10, czy 50 osób: autokar, pilot, przewodnik, czarter samolotu.<br>\n<b>Zmienny</b> – płacimy za każdą osobę: jedzenie, bilety wstępu, nocleg za osobę, ubezpieczenie.</p>\n<div class=\"ex\"><b>Test w głowie:</b> „Jeśli przyjedzie jedna osoba więcej – czy zapłacę więcej?”<br>\nTak → <b>zmienny</b> (bilet do muzeum). Nie → <b>stały</b> (pilot).</div></div>\n\n<div class=\"kb\"><h4>6. Noclegi</h4>\n<p><b>O co chodzi:</b> płacimy za noce, a nie za dni. Wyjazd 3-dniowy ma zwykle 2 noce.</p>\n<p><b>Jak liczyć:</b><br>\n① liczba nocy = dzień wyjazdu − dzień przyjazdu<br>\n② sprawdź, czy cena jest <b>za osobę</b>, czy <b>za pokój</b><br>\n③ koszt = cena × (liczba osób albo pokoi) × liczba nocy</p>\n<div class=\"ex\"><b>Przykład 1 (cena za pokój):</b> 6 osób w pokojach 2-osobowych, 14–17 maja, 100 zł/pokój.<br>\nnoce: 17 − 14 = 3<br>\npokoje: 6 : 2 = 3<br>\nkoszt: 3 pokoje × 100 zł × 3 noce = <b>900 zł</b></div>\n<div class=\"ex\"><b>Przykład 2 (pokój + dostawka):</b> Małżeństwo z dzieckiem, 3 doby, pokój 500 zł, dostawka 150 zł.<br>\n1 doba: 500 + 150 = 650 zł<br>\n3 doby: 650 × 3 = <b>1 950 zł</b></div>\n<div class=\"ex\"><b>Przykład 3 (osobonoclegi):</b> 2 osoby od 4.06 do 15.06.<br>\nnoce: 15 − 4 = 11 → 11 × 2 = <b>22 osobonoclegi</b></div>\n<p class=\"trap\">⚠️ Pułapka: „10.08–14.08” to 4 noce, a nie 5. I uważaj, czy cena jest za osobę, czy za cały pokój!</p></div>\n\n<div class=\"kb\"><h4>7. Posiłki</h4>\n<p><b>Jak liczyć:</b> rozpisz dzień po dzień, co ludzie jedzą. Potem policz osobno śniadania, obiady i kolacje.</p>\n<div class=\"ex\"><b>Przykład:</b> 4 osoby, pobyt 1–3 lipca, pełne wyżywienie od obiadu 1.07 do śniadania 3.07.<br>\n1.07: obiad, kolacja<br>\n2.07: śniadanie, obiad, kolacja<br>\n3.07: śniadanie<br>\nRazem: 2 śniadania, 2 obiady, 2 kolacje (każde × 4 osoby)<br>\nŚniadanie 10 zł: 2 × 4 × 10 = 80 zł · obiad 30 zł: 2 × 4 × 30 = 240 zł · kolacja 15 zł: 2 × 4 × 15 = 120 zł<br>\nRazem: <b>440 zł</b></div>\n<p class=\"trap\">⚠️ Pułapka: jeśli klient rezygnuje z obiadu w dniu wycieczki – odejmij go. Suchy prowiant liczy się jak posiłek, który zastępuje.</p></div>\n\n<div class=\"kb\"><h4>8. Zniżki dla dzieci, zaliczka i dopłata</h4>\n<p><b>O co chodzi:</b> dziecko często płaci mniej (np. 50% = połowa). Zaliczka to część pieniędzy wpłacona wcześniej, a dopłata to reszta.</p>\n<div class=\"ex\"><b>Przykład 1:</b> Pobyt 250 zł/os., dziecko 50%. Rodzice + 2 dzieci.<br>\ndorośli: 2 × 250 = 500 zł<br>\ndzieci: 2 × 125 = 250 zł<br>\nrazem: <b>750 zł</b></div>\n<div class=\"ex\"><b>Przykład 2:</b> Wczasy: 2 000 zł dorosły, dziecko 50%. Małżeństwo + 2 dzieci, zaliczka 30%. Ile dopłacić?<br>\ncałość: 2 × 2 000 + 2 × 1 000 = 6 000 zł<br>\nzaliczka: 6 000 × 0,30 = 1 800 zł<br>\ndopłata: 6 000 − 1 800 = <b>4 200 zł</b></div>\n<p class=\"trap\">⚠️ Pułapka: zawsze sprawdź, czy pytają o zaliczkę, czy o dopłatę. I czy jest bilet rodzinny – czasem jest tańszy niż bilety osobno.</p></div>\n\n<div class=\"kb\"><h4>9. Transport (autokar, bus)</h4>\n<p><b>Jak liczyć:</b><br>\n① dodaj wszystkie odcinki trasy (z tabeli albo grafu odległości) – razem z powrotem<br>\n② kilometry × cena za 1 km<br>\n③ sprawdź, czy jest minimum (ryczałt), dopłata za weekend albo prowizja</p>\n<div class=\"ex\"><b>Przykład 1:</b> Autokar 2 dni: 250 km + 350 km, 5 zł/km, prowizja biura 10%.<br>\nkm: 250 + 350 = 600 km<br>\nkoszt: 600 × 5 = 3 000 zł<br>\nprowizja: 3 000 × 0,10 = 300 zł<br>\nrazem: <b>3 300 zł</b></div>\n<div class=\"ex\"><b>Przykład 2 (ryczałt):</b> Minimum 180 km dziennie = 720 zł. W dniu wycieczki autokar przejedzie tylko 24 km.<br>\n24 km × 4 zł = 96 zł, ale to mniej niż minimum → płacimy <b>720 zł</b></div>\n<p><b>Ile miejsc?</b> Policz uczestników + pilota/przewodnika. Kierowca ma swoje miejsce („7+1” = 7 pasażerów + kierowca).</p></div>\n\n<div class=\"kb\"><h4>10. Czas jazdy i przerwy kierowcy</h4>\n<p><b>O co chodzi:</b> czas = droga : prędkość. Autokar jedzie średnio 50–60 km/h.<br>\nKierowca po <b>4,5 godziny</b> jazdy musi mieć <b>45 minut przerwy</b>. Dziennie może jechać <b>9 godzin</b> (2 razy w tygodniu – 10 godzin).</p>\n<div class=\"ex\"><b>Przykład:</b> Trasa 300 km, prędkość 60 km/h. Ile czasu zaplanować?<br>\njazda: 300 : 60 = 5 godzin<br>\n5 godzin to więcej niż 4,5 → trzeba dodać przerwę 45 min<br>\nrazem: <b>5 h 45 min</b></div>\n<div class=\"ex\"><b>Przykład (rozkład jazdy):</b> Pociąg odjeżdża 7:54, przyjeżdża 10:30. Ile jedzie?<br>\nod 7:54 do 8:00 = 6 min, od 8:00 do 10:30 = 2 h 30 min → razem <b>2 h 36 min</b></div>\n<p><b>„Każda rozpoczęta godzina”:</b> jeśli przewodnik pracuje 5,5 h, a cena jest do 4 h + dopłata za każdą rozpoczętą godzinę – liczymy 2 godziny dopłaty (5. i rozpoczętą 6.).</p>\n<div class=\"ex\">450 zł (do 4 h) + 2 × 90 zł = <b>630 zł</b></div></div>\n\n<div class=\"kb\"><h4>11. Skala mapy</h4>\n<p><b>O co chodzi:</b> skala mówi, ile razy mapa jest mniejsza niż teren. 1 : 100 000 znaczy, że 1 cm na mapie = 100 000 cm w terenie = <b>1 km</b>.</p>\n<p><b>Najprostszy sposób:</b> z liczby po dwukropku skreśl 5 zer – wyjdzie, ile km jest w 1 cm.<br>\n1 : 300 000 → 1 cm = 3 km &nbsp;·&nbsp; 1 : 5 000 000 → 1 cm = 50 km &nbsp;·&nbsp; 1 : 50 000 → 1 cm = 0,5 km</p>\n<div class=\"ex\"><b>Przykład 1 (z mapy na teren):</b> Skala 1 : 5 000 000, na mapie 5 cm.<br>\n1 cm = 50 km → 5 × 50 = <b>250 km</b></div>\n<div class=\"ex\"><b>Przykład 2 (z terenu na mapę):</b> Skala 1 : 300 000, w terenie 24 km. Ile cm na mapie?<br>\n1 cm = 3 km → 24 : 3 = <b>8 cm</b></div>\n<div class=\"ex\"><b>Przykład 3 (małe odległości):</b> Plan 1 : 30 000, na planie 4 cm.<br>\n4 × 30 000 = 120 000 cm = 1 200 m = <b>1,2 km</b></div></div>\n\n<div class=\"kb\"><h4>12. Ubezpieczenie i prowizja</h4>\n<p><b>Ubezpieczenie:</b> liczba osób × liczba dni × stawka. Kierowcy zwykle nie liczymy (ubezpiecza go przewoźnik).</p>\n<div class=\"ex\"><b>Przykład:</b> 40 uczniów + 4 opiekunów, 2 dni, 5 zł/os./dzień.<br>\n44 × 2 × 5 = <b>440 zł</b></div>\n<p><b>Prowizja agenta:</b> procent od ceny sprzedanych miejsc.</p>\n<div class=\"ex\"><b>Przykład:</b> 2 miejsca po 500 zł, prowizja 10%.<br>\n2 × 500 = 1 000 zł → 1 000 × 0,10 = <b>100 zł</b></div></div>\n\n<div class=\"kb\"><h4>13. Waluty</h4>\n<p><b>O co chodzi:</b> kurs mówi, ile złotych kosztuje 1 euro (albo 100 forintów).<br>\nZłotówki → waluta: <b>dziel</b> przez kurs. Waluta → złotówki: <b>mnóż</b> przez kurs.</p>\n<div class=\"ex\"><b>Przykład:</b> Kurs euro 4,40 zł. Hotel kosztuje 200 EUR. Ile to złotych?<br>\n200 × 4,40 = <b>880 zł</b></div>\n<p class=\"trap\">⚠️ Pułapka: forinty (HUF) podaje się często za 100 sztuk. Kurs 1,49 zł za 100 HUF → 10 000 HUF = 100 × 1,49 = 149 zł.</p></div>\n\n<div class=\"kb\"><h4>14. Ile osób zmieści się w pokojach</h4>\n<p><b>O co chodzi:</b> SGL = 1 osoba, DBL i TWIN = 2 osoby, TPL = 3 osoby, QUAD = 4 osoby.</p>\n<div class=\"ex\"><b>Przykład 1:</b> 3 pokoje DBL + 2 pokoje TWIN = 5 pokoi po 2 osoby = <b>10 osób</b></div>\n<div class=\"ex\"><b>Przykład 2:</b> Grupa 49 osób: 20 kobiet, 27 mężczyzn, pilot i kierowca.<br>\npilot + kierowca → 2 pokoje SGL<br>\n20 kobiet → 10 pokoi DBL<br>\n27 mężczyzn → 9 pokoi TPL<br>\nSzukamy hotelu, który ma co najmniej 2 SGL, 10 DBL i 9 TPL.</div>\n<div class=\"ex\"><b>Przykład 3 (koszt):</b> 15 osób w pokojach TPL, 3 noce, 150 zł za pokój.<br>\npokoje: 15 : 3 = 5 → 5 × 150 × 3 = <b>2 250 zł</b></div></div>\n\n<div class=\"kb\"><h4>15. Ściąga – jak rozwiązać każde zadanie z liczeniem</h4>\n<p>① Przeczytaj dwa razy i podkreśl liczby.<br>\n② Zapisz, <b>o co pytają</b> (sam VAT? cena na osobę? dopłata?).<br>\n③ Sprawdź: kto płaci, a kto nie (pilot, kierowca, opiekun)?<br>\n④ Liczy się za osobę czy za pokój/grupę? Ile nocy, ile dni?<br>\n⑤ Policz krok po kroku i zapisuj wyniki pośrednie.<br>\n⑥ Sprawdź wynik „na odwrót” (np. netto × 1,08 = brutto?).<br>\n⑦ Poszukaj swojego wyniku w odpowiedziach. Złe odpowiedzi to zwykle wyniki typowych pomyłek – dlatego dokładnie sprawdzaj kroki ③ i ④.</p></div>\n</div>\n\n\n<div class=\"card ks\" id=\"k-prak\"><h3>📝 Część praktyczna – jak to robić krok po kroku</h3>\n<ol class=\"kl\">\n<li><b>Przeczytaj zamówienie klienta</b> i wypisz: termin (dni tygodnia!), liczba osób (dorośli, dzieci + wiek, opiekunowie, pilot, kierowca), godziny przyjazdu i wyjazdu, posiłki, wymagane atrakcje, forma płatności.</li>\n<li><b>Wybierz obiekt</b> spełniający WSZYSTKIE warunki: liczba miejsc, rodzaj pokoi (łazienki!), odległość, sezon, dostępność dla niepełnosprawnych, cennik. W uzasadnieniu napisz, czemu odrzucasz inne.</li>\n<li><b>Sprawdź godziny otwarcia</b> każdej atrakcji w danym dniu tygodnia i miesiącu (poniedziałki często zamknięte, sezon/po sezonie). Uwzględnij czas zwiedzania i dojazdu.</li>\n<li><b>Program</b>: każdy dzień osobno, godziny „od–do”, posiłki (śniadanie min. 30–40 min, obiad/kolacja min. 45–60 min), przejazdy z km, zwiedzanie, nocleg, sprawy organizacyjne (zbiórka, zakwaterowanie, wykwaterowanie).</li>\n<li><b>Kalkulacja</b>: pozycja po pozycji (nazwa, liczba świadczeń, liczba osób, cena, wartość) → suma → marża → VAT od marży → razem → na osobę. Pilnuj, kto jest gratis.</li>\n<li><b>Zamówienie</b> (biuro → obiekt/przewodnik/przewoźnik): nadawca, odbiorca, miejscowość i data (po dacie zapytania, przed imprezą), termin, liczba osób, pokoje, posiłki z datami i godzinami, usługi dodatkowe, płatność, prośba o potwierdzenie, podpis.</li>\n<li><b>Potwierdzenie</b> (do klienta): to samo + cena łączna (cyframi i słownie), forma płatności, zwrot grzecznościowy, podpis.</li>\n<li><b>Przelew / faktura</b>: odbiorca + nr rachunku, zleceniodawca + nr rachunku, kwota, tytuł (co, za jaki termin). Biuro podróży – dopisek „procedura marży dla biur podróży”.</li>\n<li><b>Sprawdź na końcu</b>: daty i dni tygodnia, czy wszystkie życzenia klienta są w programie, czy suma się zgadza, podpis osoby wskazanej w treści zadania.</li>\n</ol>\n</div>\n";

3,"solPages":5,"ansPdf":true},{"id":"2015-wrzesien","year":2015,"month":"wrzesień","expl":true,"sol":true,"ansPages":10,"solPages":5,"ansPdf":true},{"id":"2015-czerwiec","year":2015,"month":"czerwiec","expl":true,"sol":true,"ansPages":13,"solPages":4,"ansPdf":true},{"id":"2015-styczen","year":2015,"month":"styczeń","expl":true,"sol":true,"ansPages":10,"solPages":5,"ansPdf":true},{"id":"2014-wrzesien","year":2014,"month":"wrzesień","expl":true,"sol":true,"ansPages":9,"solPages":4,"ansPdf":true},{"id":"2014-czerwiec","year":2014,"month":"czerwiec","expl":true,"sol":true,"ansPages":9,"solPages":3,"ansPdf":true},{"id":"2014-styczen","year":2014,"month":"styczeń","expl":true,"sol":true,"ansPages":8,"solPages":6,"ansPdf":true},{"id":"2013-pazdziernik","year":2013,"month":"październik","expl":true,"sol":true,"ansPages":11,"solPages":4,"ansPdf":true},{"id":"2013-czerwiec","year":2013,"month":"czerwiec","expl":true,"sol":true,"ansPages":8,"solPages":4,"ansPdf":true}],"q":{"2024-styczen":[{"n":1,"q":"Eksploracja jaskiń jest przede wszystkim elementem turystyki","o":{"A":"wiejskiej.","B":"kulturowej.","C":"kwalifikowanej.","D":"wypoczynkowej."},"a":"C","img":[0,37],"e":{"A":"Turystyka wiejska to pobyt na wsi (agroturystyka, poznawanie życia wiejskiego) – jaskinie nie są jej wyróżnikiem.","B":"Turystyka kulturowa skupia się na zabytkach, muzeach, tradycjach – nie na eksploracji przyrody podziemnej.","C":"Poprawna. Turystyka kwalifikowana wymaga specjalnych umiejętności, sprzętu i często uprawnień (np. speleologia, wspinaczka, nurkowanie). Eksploracja jaskiń = speleologia, czyli typowa turystyka kwalifikowana.","D":"Turystyka wypoczynkowa to regeneracja sił (plaża, uzdrowisko) – bez wysiłku i specjalistycznego sprzętu.","tip":"Speleologia (gr. spelaion – jaskinia) = turystyka kwalifikowana.","long":"Turystyka kwalifikowana to taka, do której potrzebujesz specjalnych umiejętności i sprzętu – nie każdy może po prostu pojechać i to zrobić. Zwiedzanie jaskiń (speleologia) wymaga kasku, latarki, liny, często kursu i dobrej kondycji. Dlatego to turystyka kwalifikowana. Wiejska to odpoczynek na wsi, kulturowa – zwiedzanie zabytków i muzeów, a wypoczynkowa – leżenie na plaży i relaks. Prosty test: jeśli potrzebny jest sprzęt i trening – to kwalifikowana."}},{"n":2,"q":"Rafting to rodzaj turystyki aktywnej, w ramach której biuro podróży powinno zorganizować","o":{"A":"lot balonem nad morzem.","B":"rejs żaglówką po jeziorze.","C":"spływ kajakiem po górskiej rzece.","D":"ślizg na nartach wodnych po zatoce."},"a":"C","img":[37,37],"e":{"A":"Lot balonem to baloniarstwo (turystyka lotnicza), nie rafting.","B":"Rejs żaglówką po jeziorze to żeglarstwo.","C":"Poprawna. Rafting to spływ pontonem lub kajakiem po rwącej, górskiej rzece (np. Dunajec, Białka).","D":"Ślizg na nartach wodnych za motorówką to narciarstwo wodne.","tip":"Rafting – raft (ang. tratwa, ponton) + rwąca rzeka.","long":"Rafting to spływ po rwącej, górskiej rzece – najczęściej pontonem, czasem kajakiem. Płynie się po bystrzach, jest dużo wody i adrenaliny. Lot balonem, rejs żaglówką czy narty wodne to zupełnie inne sporty. W pytaniach słowo „rafting” zawsze kojarz z rzeką górską i spływem."}},{"n":3,"q":"Jedną z cech trampingu jest","o":{"A":"wyżywienie w formie all inclusive.","B":"korzystanie z lokalnego transportu.","C":"nocowanie w luksusowych hotelach.","D":"ścisłe przestrzeganie programu imprezy."},"a":"B","img":[74,183],"e":{"A":"All inclusive (wszystko w cenie) jest typowe dla wczasów zorganizowanych, a nie trampingu.","B":"Poprawna. Tramping to samodzielne, tanie podróżowanie: lokalny transport (autostop, autobusy), tanie noclegi, brak sztywnego programu.","C":"Luksusowe hotele są przeciwieństwem trampingu, który jest turystyką niskobudżetową.","D":"Tramping charakteryzuje swoboda i spontaniczność, nie sztywny program.","tip":"Tramping ≈ backpacking – plecak, mały budżet, lokalnie.","long":"Tramping to podróżowanie na własną rękę i jak najtaniej – z plecakiem, bez biura podróży. Turysta jeździ tym, czym jeżdżą miejscowi: lokalnymi autobusami, pociągami, czasem autostopem, i śpi w tanich miejscach. Dlatego all inclusive, luksusowe hotele i sztywny program to przeciwieństwo trampingu. Zapamiętaj: tramping = tanio, swobodnie, lokalnie."}},{"n":4,"q":"W programie wycieczki trekkingowej powinna zostać uwzględniona aktywność typu","o":{"A":"jazda na rowerach.","B":"bieganie na nartach.","C":"wędrówka po górach.","D":"pływanie po jeziorach."},"a":"C","img":[257,37],"e":{"A":"Jazda na rowerach to turystyka rowerowa (kolarska).","B":"Bieganie na nartach to narciarstwo biegowe.","C":"Poprawna. Trekking to wielodniowa piesza wędrówka po górach lub trudnym terenie, często z dala od cywilizacji.","D":"Pływanie po jeziorach to turystyka wodna (kajakowa, żeglarska).","tip":"Trekking = piesza wędrówka po górach.","long":"Trekking to kilkudniowe piesze wędrówki, zwykle po górach i bezdrożach, z plecakiem. Rower, narty i pływanie to inne formy aktywności. Jeśli w pytaniu pojawia się słowo „trekking” – szukaj odpowiedzi o chodzeniu pieszo po górach."}},{"n":5,"q":"Oblicz odległość w centymetrach między dwoma punktami na mapie w skali 1: 300 000, jeżeli w rzeczywistości wynosi ona 24 kilometry.","o":{"A":"1,8 cm","B":"8,0 cm","C":"8,8 cm","D":"18,0 cm"},"a":"B","img":[294,66],"e":{"A":"1,8 cm – błąd o rząd wielkości.","B":"Poprawna. 24 km = 2 400 000 cm. Skala 1:300 000 oznacza, że 1 cm na mapie = 300 000 cm w terenie. 2 400 000 : 300 000 = 8 cm.","C":"8,8 cm – błędne przeliczenie.","D":"18 cm – błędne przeliczenie.","tip":"Zamień km na cm (×100 000) i podziel przez mianownik skali.","long":"Skala 1 : 300 000 znaczy, że 1 cm na mapie to 300 000 cm w terenie. 300 000 cm to 3 km (bo 100 000 cm = 1 km). Czyli 1 cm na mapie = 3 km. Mamy 24 km, więc dzielimy: 24 : 3 = 8 cm. Prosty sposób: z mianownika skali skreśl 5 zer – wyjdzie, ile km jest w 1 cm."}},{"n":6,"q":"Przedstawione w opisie walory turystyczne znajdują się w województwie","o":{"A":"opolskim.","B":"pomorskim.","C":"małopolskim.","D":"świętokrzyskim."},"a":"A","ctx":"… Jednym z najcenniejszych walorów kulturowych tego regionu jest piastowski zamek w Brzegu, zwany „śląskim Wawelem”. Miejscem aktywnego wypoczynku i rekreacji są jeziora Nyskie i Otmuchowskie…","img":[360,191],"e":{"A":"Poprawna. Brzeg (zamek Piastów Śląskich – „śląski Wawel”) oraz jeziora Nyskie i Otmuchowskie leżą w województwie opolskim.","B":"Pomorskie – Gdańsk, Malbork, Hel; brak tam Brzegu.","C":"Małopolskie – Kraków, Tatry; „prawdziwy” Wawel jest w Krakowie, ale tu chodzi o śląski Wawel.","D":"Świętokrzyskie – Góry Świętokrzyskie, Kielce, Sandomierz.","tip":"„Śląski Wawel” = zamek w Brzegu (opolskie).","long":"W opisie są trzy wskazówki: zamek w Brzegu („śląski Wawel”), Jezioro Nyskie i Jezioro Otmuchowskie. Brzeg, Nysa i Otmuchów leżą w województwie opolskim, na Śląsku Opolskim. Pozostałe województwa nie mają tych miejsc. Gdy w opisie są nazwy miast – pomyśl, w jakim województwie leżą."}},{"n":7,"q":"Walorami przyrodniczymi Warmii i Mazur są","o":{"A":"skały wapienne.","B":"jeziora rynnowe.","C":"ruchome wydmy.","D":"wąwozy lessowe."},"a":"B","img":[551,183],"e":{"A":"Skały wapienne są typowe dla Jury Krakowsko-Częstochowskiej i Pienin.","B":"Poprawna. Warmia i Mazury to Kraina Wielkich Jezior – wiele z nich to długie, wąskie jeziora rynnowe utworzone przez wody lodowcowe (np. Jezioro Nidzkie).","C":"Ruchome wydmy są w Słowińskim Parku Narodowym (Łeba).","D":"Wąwozy lessowe – Kazimierz Dolny, Wyżyna Lubelska.","tip":"Mazury = jeziora rynnowe i morenowe.","long":"Warmia i Mazury to „Kraina Tysiąca Jezior”. Jeziora rynnowe są długie i wąskie – powstały, gdy lodowiec wyżłobił w ziemi rynny. Skały wapienne są na Jurze, ruchome wydmy nad morzem (Łeba), a wąwozy lessowe w okolicach Kazimierza Dolnego. Mazury = jeziora."}},{"n":8,"q":"Walory przyrodnicze charakterystyczne dla Świętokrzyskiego Parku Narodowego to","o":{"A":"klify.","B":"jeziora.","C":"połoniny.","D":"gołoborza."},"a":"D","img":[734,37],"e":{"A":"Klify są nad morzem (Wolin, Rozewie, Orłowo).","B":"Jezior brak w Górach Świętokrzyskich jako walor dominujący.","C":"Połoniny to bezleśne łąki w Bieszczadach.","D":"Poprawna. Gołoborza to rumowiska kwarcytowych głazów na stokach Łysicy i Łysej Góry – symbol Świętokrzyskiego PN.","tip":"Gołoborze = Góry Świętokrzyskie.","long":"Gołoborza to „morza kamieni” – zbocza pokryte rumowiskiem kamieni, na których nie rosną drzewa. Najbardziej znane są na Łysicy i Łysej Górze w Górach Świętokrzyskich. Klify są nad morzem, połoniny w Bieszczadach, a jeziora na Mazurach. Świętokrzyskie = gołoborza."}},{"n":9,"q":"Obserwacja zwierząt gospodarskich, nauka rękodzieła i wypoczynek to charakterystyczne elementy programu imprezy pobytowej typu","o":{"A":"kolonia letnia.","B":"obóz żeglarski.","C":"wycieczka edukacyjna.","D":"wczasy agroturystyczne."},"a":"D","img":[771,211],"e":{"A":"Kolonia letnia to wypoczynek dzieci i młodzieży, zwykle bez profilu gospodarstwa wiejskiego.","B":"Obóz żeglarski – nauka żeglowania.","C":"Wycieczka edukacyjna jest krótka i objazdowa, a pytanie dotyczy imprezy pobytowej.","D":"Poprawna. Wczasy agroturystyczne to pobyt w gospodarstwie rolnym: kontakt ze zwierzętami, rękodzieło ludowe, wypoczynek na wsi.","tip":"Zwierzęta gospodarskie + rękodzieło = agroturystyka.","long":"Zwierzęta gospodarskie, nauka rękodzieła (np. wyplatanie, lepienie z gliny) i odpoczynek na wsi to typowy program wczasów agroturystycznych – czyli pobytu w gospodarstwie na wsi. Kolonia to wyjazd dla dzieci, obóz żeglarski to nauka żeglowania, a wycieczka edukacyjna to głównie zwiedzanie i nauka. Wieś + zwierzęta = agroturystyka."}},{"n":10,"q":"Rezerwat Błędne Skały znajduje się","o":{"A":"w Parku Narodowym Ujście Warty.","B":"w Karkonoskim Parku Narodowym.","C":"w Parku Narodowym Gór Stołowych.","D":"w Roztoczańskim Parku Narodowym."},"a":"C","img":[982,183],"e":{"A":"PN Ujście Warty – ptactwo wodne, rozlewiska.","B":"Karkonoski PN – Śnieżka, kotły polodowcowe.","C":"Poprawna. Błędne Skały (labirynt skalny) oraz Szczeliniec Wielki leżą w Parku Narodowym Gór Stołowych.","D":"Roztoczański PN – Zwierzyniec, konik polski.","tip":"Błędne Skały i Szczeliniec = Góry Stołowe.","long":"Błędne Skały to labirynt skalny – wąskie przejścia między wielkimi głazami. Leży w Górach Stołowych, czyli w Parku Narodowym Gór Stołowych (Sudety, okolice Kudowy-Zdroju). Karkonosze to Śnieżka, Roztocze – lasy i rzeki na wschodzie Polski, a Ujście Warty – rozlewiska i ptaki. Zapamiętaj parę: Błędne Skały – Góry Stołowe."}},{"n":11,"q":"Wycieczka realizowana na terenie Magurskiego Parku Narodowego, może obejmować","o":{"A":"spływy kajakowe i rejsy żeglarskie.","B":"zwiedzanie kompleksu sztolni i płukanie złota.","C":"wędrówkę po ruchomych wydmach i nadmorskich torfowiskach.","D":"zwiedzanie drewnianych cerkwi i cmentarzy z okresu I wojny światowej."},"a":"D","img":[1165,37],"e":{"A":"Magurski PN (Beskid Niski) nie ma dużych jezior do żeglowania.","B":"Sztolnie i płukanie złota – Złoty Stok, Sudety.","C":"Ruchome wydmy i torfowiska nadmorskie – Słowiński PN.","D":"Poprawna. Beskid Niski to dawne tereny Łemków: drewniane cerkwie oraz liczne cmentarze wojenne z I wojny światowej (operacja gorlicka 1915).","tip":"Magurski PN = Beskid Niski = cerkwie łemkowskie i cmentarze z I wojny.","long":"Magurski Park Narodowy leży w Beskidzie Niskim. To dawne tereny Łemków – stoją tam stare drewniane cerkwie i cmentarze żołnierzy z I wojny światowej. Kajaki i żagle pasują do jezior, sztolnie i złoto do Złotego Stoku, a wydmy do Słowińskiego Parku. Beskid Niski = cerkwie + cmentarze wojenne."}},{"n":12,"q":"Oblicz koszt wynajmu autokaru na jednego uczestnika na wycieczce dla 48 osób, w tym 1 pilota wycieczek i 1 kierowcy, jeżeli koszt całkowity usługi wynosi 2 438,00 zł.","o":{"A":"50,79 zł","B":"51,87 zł","C":"53,00 zł","D":"54,00 zł"},"a":"C","img":[1202,66],"e":{"A":"50,79 zł = 2 438 : 48 – błąd: pilot i kierowca nie płacą.","B":"51,87 zł = 2 438 : 47 – błąd: odjęto tylko jedną osobę.","C":"Poprawna. Płacą tylko uczestnicy: 48 − 1 pilot − 1 kierowca = 46 osób. 2 438,00 : 46 = 53,00 zł.","D":"54,00 zł – zawyżony wynik.","tip":"Koszt dzielimy zawsze przez liczbę PŁACĄCYCH uczestników.","long":"Koszt autokaru dzielimy tylko na tych, którzy płacą. Pilot i kierowca nie płacą za autokar – jadą w pracy. Płacących jest więc 48 − 2 = 46 osób. Liczymy: 2438 : 46 = 53,00 zł. Gdybyśmy podzielili przez 48, wyszłoby 50,79 zł – to częsty błąd i zła odpowiedź."}},{"n":13,"q":"Oblicz całkowitą cenę imprezy turystycznej dla 20 uczestników oraz pilota wycieczek przy założeniu, że cena jednostkowa wynosi 320,00 zł.","o":{"A":"6 080,00 zł","B":"6 400,00 zł","C":"6 720,00 zł","D":"7 040,00 zł"},"a":"B","img":[1268,66],"e":{"A":"6 080 zł = 19 × 320 – błąd.","B":"Poprawna. Pilot nie płaci (jego koszty są wliczone w cenę uczestników). Cena całkowita = 20 × 320,00 = 6 400,00 zł.","C":"6 720 zł = 21 × 320 – błąd: pilot nie kupuje imprezy.","D":"7 040 zł = 22 × 320 – błąd.","tip":"Cena całkowita = cena jednostkowa × liczba płacących uczestników.","long":"Cena jednostkowa to cena dla jednej osoby. Pilot jedzie za darmo (to on pracuje), więc płaci tylko 20 uczestników. Liczymy 20 × 320 zł = 6400 zł. Pułapka: jeśli policzysz też pilota (21 × 320), wyjdzie 6720 zł – to źle."}},{"n":14,"q":"Oblicz kwotę zaliczki za nocleg, jeżeli jej wysokość wynosi 30%, a cała należność za świadczenie to 16 200,00 zł.","o":{"A":"4 860,00 zł","B":"5 720,00 zł","C":"8 460,00 zł","D":"9 360,00 zł"},"a":"A","img":[1334,65],"e":{"A":"Poprawna. Zaliczka 30%: 16 200,00 × 0,30 = 4 860,00 zł.","B":"5 720 zł – błędne obliczenie.","C":"8 460 zł – błędne obliczenie.","D":"9 360 zł – błędne obliczenie.","tip":"Procent z liczby: kwota × (procent/100).","long":"Zaliczka to część pieniędzy wpłacana z góry, a resztę płaci się później. 30% z kwoty liczymy tak: kwota × 0,30. Czyli 16 200 × 0,3 = 4860 zł. Możesz też policzyć: 10% to 1620 zł, a 30% to trzy razy tyle, czyli 4860 zł."}},{"n":15,"q":"Właściciele gospodarstw agroturystycznych zamierzają wymieniać się swoimi wyrobami metodą towar za towar. W związku z tym powinni podpisać umowę","o":{"A":"o dzieło.","B":"zlecenia.","C":"barterową.","D":"o sponsoringu."},"a":"C","img":[1399,66],"e":{"A":"Umowa o dzieło – wykonanie konkretnego dzieła za wynagrodzenie.","B":"Umowa zlecenia – wykonanie czynności (np. usługa pilota) za wynagrodzenie.","C":"Poprawna. Barter to wymiana towar za towar (usługa za usługę) bez użycia pieniędzy – zawiera się umowę barterową (zamiany).","D":"Sponsoring – finansowanie w zamian za promocję sponsora.","tip":"Barter = wymiana bez pieniędzy.","long":"Umowa barterowa to wymiana „towar za towar”, bez płacenia pieniędzmi – na przykład miód za kozi ser. Umowa o dzieło i zlecenia dotyczą pracy dla kogoś, a sponsoring to dawanie pieniędzy w zamian za reklamę. Wymiana bez pieniędzy = barter."}},{"n":16,"q":"Właściciel gospodarstwa agroturystycznego po raz pierwszy gościł 6-osobową rodzinę. Udzielając jej 20-procentowej zniżki na usługi noclegowe, zastosował rabat","o":{"A":"handlowy.","B":"ilościowy.","C":"sezonowy.","D":"lojalnościowy."},"a":"B","img":[1465,66],"e":{"A":"Rabat handlowy przysługuje pośrednikom (np. biurom podróży) sprzedającym usługi dalej.","B":"Poprawna. Rabat ilościowy (od wielkości zakupu) – dla 6-osobowej rodziny, czyli większej liczby osób/noclegów.","C":"Rabat sezonowy – za skorzystanie poza sezonem.","D":"Rabat lojalnościowy – dla stałych klientów; tu rodzina była pierwszy raz.","tip":"Pierwszy pobyt wyklucza rabat lojalnościowy; duża grupa = ilościowy.","long":"Rodzina była pierwszy raz, więc to nie jest rabat dla stałych klientów (lojalnościowy). Zniżkę dostali, bo przyjechało dużo osób naraz – 6 osób. Rabat za dużą liczbę osób lub kupienie dużej ilości to rabat ilościowy. Sezonowy daje się poza sezonem, a handlowy – firmom handlowym."}},{"n":17,"q":"Które z działań gospodarstwa agroturystycznego podejmowane jest w ramach strategii ceny?","o":{"A":"Modernizacja pokoi gościnnych.","B":"Udzielanie zniżek stałym gościom.","C":"Zorganizowanie przyjęcia dla turystów.","D":"Umieszczenie w katalogu informacji o obiekcie."},"a":"B","img":[1531,182],"e":{"A":"Modernizacja pokoi – strategia produktu.","B":"Poprawna. Zniżki dla stałych gości zmieniają cenę – to narzędzie strategii ceny (marketing mix 4P: produkt, cena, dystrybucja, promocja).","C":"Przyjęcie dla turystów – element produktu lub promocji.","D":"Informacja w katalogu – promocja/dystrybucja.","tip":"Wszystko o rabatach i zniżkach = cena.","long":"Strategia ceny to wszystko, co dotyczy pieniędzy: cennik, zniżki, rabaty, promocje cenowe. Zniżki dla stałych gości to decyzja o cenie. Modernizacja pokoi i przyjęcie dla turystów to „produkt” (co oferujemy), a katalog to promocja (reklama). Pytaj siebie: czy to zmienia cenę? Jeśli tak – strategia ceny."}},{"n":18,"q":"W czasie remontu właściciel gospodarstwa agroturystycznego zmienił wystrój jadalni. Jest to działanie w ramach strategii","o":{"A":"ceny.","B":"produktu.","C":"personelu.","D":"dystrybucji."},"a":"B","img":[1713,66],"e":{"A":"Cena – zmiana wysokości opłat, rabaty.","B":"Poprawna. Zmiana wystroju jadalni to ulepszenie samej usługi, czyli strategia produktu.","C":"Personel – szkolenia, zatrudnianie, stroje pracowników.","D":"Dystrybucja – kanały sprzedaży (internet, biura).","tip":"Wygląd i wyposażenie obiektu = produkt.","long":"Wystrój jadalni to część tego, co gość dostaje i widzi – czyli produktu. Strategia produktu to ulepszanie oferty: remonty, nowe pokoje, nowe atrakcje, lepsze jedzenie. Cena to zniżki i cennik, dystrybucja to sposób sprzedaży (np. przez biuro, Internet), personel to pracownicy."}},{"n":19,"q":"Który dokument sporządza pracownik biura podróży w celu obliczenia ceny jednostkowej organizowanej imprezy turystycznej?","o":{"A":"Zestawienie faktur z cenami za usługi kontrahentów.","B":"Sprawozdanie finansowe z imprezy turystycznej.","C":"Kartę rozliczenia imprezy turystycznej.","D":"Kalkulację ceny imprezy turystycznej."},"a":"D","img":[1779,211],"e":{"A":"Zestawienie faktur służy rozliczeniu, nie wyznaczaniu ceny.","B":"Sprawozdanie finansowe sporządza się po zakończeniu imprezy.","C":"Karta rozliczenia imprezy – po imprezie, porównuje koszty planowane z rzeczywistymi.","D":"Poprawna. Kalkulację ceny imprezy sporządza się PRZED sprzedażą: koszty + marża + VAT = cena, a potem dzieli przez liczbę uczestników.","tip":"Przed imprezą – kalkulacja; po imprezie – rozliczenie.","long":"Kalkulacja ceny to tabelka, w której biuro dodaje wszystkie koszty (noclegi, jedzenie, autokar, bilety), potem marżę i VAT, a na końcu dzieli przez liczbę uczestników. Tak wychodzi cena jednostkowa – na jedną osobę. Faktury, sprawozdanie i karta rozliczenia robi się dopiero po imprezie, żeby ją rozliczyć."}},{"n":20,"q":"Organizator krajowego wyjazdu grupowego zobowiązany jest zapewnić uczestnikom imprezy ubezpieczenie","o":{"A":"KL","B":"AC","C":"OC","D":"NNW"},"a":"D","img":[1990,37],"e":{"A":"KL (koszty leczenia) jest obowiązkowe przy wyjazdach ZAGRANICZNYCH.","B":"AC (autocasco) to ubezpieczenie pojazdu.","C":"OC (odpowiedzialność cywilna) – ubezpiecza się organizator/przewoźnik, nie uczestnik.","D":"Poprawna. Przy imprezie krajowej organizator musi zapewnić uczestnikom ubezpieczenie NNW – od następstw nieszczęśliwych wypadków.","tip":"Kraj = NNW; zagranica = NNW + KL.","long":"Gdy biuro organizuje wyjazd w Polsce, musi ubezpieczyć uczestników od NNW – następstw nieszczęśliwych wypadków (np. złamana noga na wycieczce). KL (koszty leczenia) jest obowiązkowe przy wyjazdach za granicę. AC to ubezpieczenie samochodu, a OC – za szkody wyrządzone innym. W kraju: NNW; za granicą: KL + NNW."}},{"n":21,"q":"Którą kwotę należy wpisać na przedstawionej fakturze w kolumnie Wartość usługi netto?","o":{"A":"7 400,00 zł","B":"7 125,93 zł","C":"6 851,85 zł","D":"6 577,78 zł"},"a":"C","ctx":"Faktura (fragment) Wartość Stawka Kwota Wartość J.m. Ilość jednostkowa usługi netto podatku podatku usługi brutto (zł) (%) (zł) (zł) 25 274,07 8 548,15 7 400,00","pic":1,"img":[2027,234],"e":{"A":"7 400 zł to wartość brutto – z VAT.","B":"7 125,93 zł – błędne obliczenie.","C":"Poprawna. Netto = brutto − VAT = 7 400,00 − 548,15 = 6 851,85 zł (≈ 25 × 274,07).","D":"6 577,78 zł – błędne obliczenie.","tip":"Brutto = netto + VAT, więc netto = brutto − VAT.","long":"Na fakturze mamy wartość brutto 7400 zł i VAT 8%. Brutto to netto + podatek. Żeby z brutto policzyć netto, dzielimy przez 1,08: 7400 : 1,08 = 6851,85 zł. Sprawdź: podatek 548,15 zł + netto 6851,85 zł = 7400 zł – zgadza się. Nie odejmuj „8% od 7400” – to daje zły wynik."}},{"n":22,"q":"Właściciel gospodarstwa agroturystycznego za zaliczkę wpłaconą gotówką za pobyt w gospodarstwie, wystawi klientowi","o":{"A":"dowód KP.","B":"dowód KW.","C":"raport kasowy.","D":"voucher hotelowy."},"a":"A","img":[2261,66],"e":{"A":"Poprawna. KP – Kasa Przyjmie: dowód przyjęcia gotówki do kasy, wystawiany przy wpłacie zaliczki gotówką.","B":"KW – Kasa Wypłaci: dowód wypłaty gotówki z kasy.","C":"Raport kasowy zestawia wszystkie operacje kasowe za okres – nie wydaje się go klientowi.","D":"Voucher to skierowanie na usługę, nie potwierdzenie wpłaty.","tip":"KP = przyjęcie gotówki, KW = wypłata.","long":"KP znaczy „Kasa Przyjmie” – to dowód, że do kasy wpłynęły pieniądze w gotówce (np. zaliczka od gościa). KW („Kasa Wyda”) wystawia się, gdy pieniądze wychodzą z kasy. Raport kasowy to podsumowanie wielu wpłat i wypłat, a voucher to bon na usługi. Gość płaci gotówką = KP."}},{"n":23,"q":"Turystom w podeszłym wieku podczas imprezy turystycznej należy zaproponować","o":{"A":"zorbing.","B":"windsurfing.","C":"hydrospeed.","D":"nordic walking."},"a":"D","img":[2327,37],"e":{"A":"Zorbing – staczanie się w dużej kuli; ekstremalne.","B":"Windsurfing – wymaga sprawności i siły.","C":"Hydrospeed – spływ rwącą rzeką na specjalnej desce; ekstremalny.","D":"Poprawna. Nordic walking (marsz z kijkami) jest bezpieczny, umiarkowany i polecany seniorom.","tip":"Seniorzy = aktywność łagodna.","long":"Dla starszych osób wybieramy spokojną i bezpieczną aktywność. Nordic walking to marsz z kijkami – łagodny dla stawów i serca. Zorbing (toczenie się w wielkiej kuli), windsurfing i hydrospeed (spływ na specjalnej desce po rwącej rzece) są zbyt ryzykowne i męczące."}},{"n":24,"q":"Którą informację pracownik biura podróży musi zapisać w umowie o udział w imprezie turystycznej?","o":{"A":"Czas rozpoczęcia doby hotelowej.","B":"Imię i nazwisko pilota wycieczek.","C":"Dane adresowe przewoźnika.","D":"Termin imprezy turystycznej."},"a":"D","img":[2364,183],"e":{"A":"Doba hotelowa nie jest obowiązkowym elementem umowy o udział w imprezie.","B":"Nazwisko pilota nie musi być w umowie.","C":"Dane przewoźnika nie są wymagane – wymagany jest rodzaj i klasa transportu.","D":"Poprawna. Termin (data rozpoczęcia i zakończenia) imprezy jest obowiązkowym elementem umowy (ustawa o imprezach turystycznych).","tip":"Umowa: organizator, termin, miejsce, program, cena, świadczenia.","long":"W umowie z klientem musi być termin imprezy – klient musi wiedzieć, od kiedy do kiedy jedzie. Imię pilota, adres przewoźnika czy godzina doby hotelowej nie są obowiązkowe (pilot może się jeszcze zmienić). Najważniejsze w umowie: kto organizuje, co jest w cenie, gdzie, kiedy i za ile."}},{"n":25,"q":"Rodzinie planującej podczas wypoczynku nad morzem korzystanie ze śniadań, obiadów i kolacji, należy zaproponować wyżywienie typu","o":{"A":"BB","B":"FB","C":"HB","D":"OB"},"a":"B","img":[2547,66],"e":{"A":"BB (Bed & Breakfast) – nocleg ze śniadaniem.","B":"Poprawna. FB (Full Board) – pełne wyżywienie: śniadanie, obiad i kolacja.","C":"HB (Half Board) – dwa posiłki: śniadanie i obiadokolacja.","D":"OB (Only Bed / Room Only) – sam nocleg bez wyżywienia.","tip":"OB < BB < HB < FB < AI.","long":"Śniadania, obiady i kolacje to trzy posiłki dziennie – czyli pełne wyżywienie, po angielsku Full Board (FB). BB to tylko śniadanie, HB to dwa posiłki (śniadanie + obiadokolacja), a OB to sam nocleg bez jedzenia. 3 posiłki = FB."}},{"n":26,"q":"Organizując pieszą wycieczkę dla grupy czerwonym szlakiem ze Szklarskiej Poręby na Szrenicę, należy zaplanować usługi","o":{"A":"pilota wycieczek.","B":"ratownika GOPR.","C":"przewodnika sudeckiego.","D":"przewodnika wysokogórskiego."},"a":"C","img":[2613,211],"e":{"A":"Pilot opiekuje się grupą w trasie, ale nie może oprowadzać po szlakach górskich.","B":"Ratownik GOPR działa w razie wypadku, nie prowadzi wycieczek.","C":"Poprawna. Szklarska Poręba i Szrenica leżą w Karkonoszach (Sudety) – na szlakach parku narodowego grupę prowadzi przewodnik sudecki.","D":"Przewodnik wysokogórski – Tatry.","tip":"Karkonosze = Sudety = przewodnik sudecki.","long":"Szklarska Poręba i Szrenica leżą w Karkonoszach, a Karkonosze należą do Sudetów. Po górskich szlakach grupę prowadzi przewodnik górski z uprawnieniami na dane góry – tutaj przewodnik sudecki. Pilot nie prowadzi po szlakach, ratownik GOPR ratuje, a przewodnik wysokogórski jest potrzebny w Tatrach. Sudety → przewodnik sudecki, Beskidy → beskidzki, Tatry → tatrzański."}},{"n":27,"q":"Telefoniczna rezerwacja noclegu, która nie wymaga pisemnego potwierdzenia ani dokonania wpłaty, to rezerwacja","o":{"A":"dokonana.","B":"planowana.","C":"gwarantowana.","D":"niegwarantowana."},"a":"D","img":[2824,66],"e":{"A":"Rezerwacja dokonana – nie jest to termin używany jako typ rezerwacji.","B":"Rezerwacja planowana – nie jest to typ rezerwacji.","C":"Gwarantowana – potwierdzona przedpłatą/kartą; obiekt trzyma pokój do końca doby.","D":"Poprawna. Niegwarantowana – bez potwierdzenia i bez wpłaty; obiekt trzyma pokój tylko do ustalonej godziny (np. 18:00).","tip":"Bez wpłaty = niegwarantowana.","long":"Rezerwacja przez telefon, bez wpłaty i bez potwierdzenia na piśmie, to rezerwacja niegwarantowana. Hotel trzyma pokój tylko do określonej godziny, a jeśli gość nie przyjedzie – nic nie płaci. Gwarantowana to taka, za którą klient zapłacił zaliczkę lub podał kartę."}},{"n":28,"q":"Kosztem zmiennym, związanym z organizacją trzydniowej wycieczki z Torunia do Warszawy, jest koszt","o":{"A":"opieki pilota wycieczek.","B":"przewodnika po mieście.","C":"zakupu biletów do muzeum.","D":"transportu wynajętym autokarem."},"a":"C","img":[2890,182],"e":{"A":"Pilot – koszt stały (ta sama kwota niezależnie od liczby uczestników).","B":"Przewodnik – koszt stały dla grupy.","C":"Poprawna. Bilety wstępu kupuje się na każdą osobę – koszt rośnie wraz z liczbą uczestników, więc jest zmienny.","D":"Wynajem autokaru – koszt stały dla całej grupy.","tip":"Koszt zmienny = „od osoby”; stały = „od grupy”.","long":"Koszt zmienny zależy od liczby osób – im więcej ludzi, tym więcej płacimy. Bilety do muzeum kupuje się dla każdego, więc to koszt zmienny. Pilot, przewodnik i autokar kosztują tyle samo, czy jedzie 20, czy 40 osób – to koszty stałe."}},{"n":29,"q":"Obiekt, którego zwiedzanie można zaplanować podczas wycieczki do Trójmiasta, to","o":{"A":"Wały Chrobrego.","B":"Katedra Oliwska.","C":"Panorama Racławicka.","D":"Biblioteka Raczyńskich."},"a":"B","img":[3072,183],"e":{"A":"Wały Chrobrego – Szczecin.","B":"Poprawna. Katedra Oliwska (słynne organy) znajduje się w Gdańsku – jednym z miast Trójmiasta (Gdańsk, Sopot, Gdynia).","C":"Panorama Racławicka – Wrocław.","D":"Biblioteka Raczyńskich – Poznań.","tip":"Trójmiasto = Gdańsk + Sopot + Gdynia.","long":"Trójmiasto to Gdańsk, Sopot i Gdynia. Katedra Oliwska jest w Gdańsku-Oliwie (słynie z organów). Wały Chrobrego są w Szczecinie, Panorama Racławicka we Wrocławiu, a Biblioteka Raczyńskich w Poznaniu. Zawsze sprawdź, w którym mieście jest dany zabytek."}},{"n":30,"q":"Oblicz koszt trzygodzinnego pobytu 18-osobowej grupy w kręgielni, jeżeli cena gry wynosi 49,00 zł/godzina/tor, a na 1 torze będzie grać jednocześnie 6 osób.","o":{"A":"441,00 zł","B":"490,00 zł","C":"539,00 zł","D":"882,00 zł"},"a":"A","img":[3255,66],"e":{"A":"Poprawna. 18 osób : 6 osób na tor = 3 tory. 3 tory × 3 godziny × 49,00 zł = 441,00 zł.","B":"490 zł – błędne obliczenie.","C":"539 zł – błędne obliczenie.","D":"882 zł – policzono 6 torów.","tip":"Cena jest za TOR i GODZINĘ, nie za osobę.","long":"Płacimy za tor, a nie za osobę. Jest 18 osób, a na jednym torze gra 6 osób, więc potrzebne są 3 tory (18 : 6 = 3). Gra trwa 3 godziny. Liczymy: 3 tory × 3 godziny × 49 zł = 441 zł."}},{"n":31,"q":"Folder promujący uzdrowiska Kotliny Kłodzkiej powinien zawierać informacje o sanatoriach zlokalizowanych","o":{"A":"w Szczawnicy i Muszynie.","B":"w Ciechocinku i Inowrocławiu.","C":"w Solcu-Zdroju i Busku-Zdroju.","D":"w Lądku-Zdroju i Polanicy-Zdroju."},"a":"D","img":[3321,182],"e":{"A":"Szczawnica i Muszyna – Pieniny i Beskid Sądecki (Małopolska).","B":"Ciechocinek i Inowrocław – Kujawy (tężnie).","C":"Solec-Zdrój i Busko-Zdrój – Ponidzie (świętokrzyskie).","D":"Poprawna. Lądek-Zdrój i Polanica-Zdrój leżą w Kotlinie Kłodzkiej (Sudety), tak jak Kudowa i Duszniki-Zdrój.","tip":"Kotlina Kłodzka: Polanica, Duszniki, Kudowa, Lądek.","long":"Kotlina Kłodzka leży w Sudetach i ma dużo uzdrowisk: Lądek-Zdrój, Polanica-Zdrój, Kudowa-Zdrój, Duszniki-Zdrój. Szczawnica i Muszyna są w Małopolsce, Ciechocinek i Inowrocław na Kujawach, a Solec i Busko w świętokrzyskim."}},{"n":32,"q":"Zgodnie z ustawą o usługach hotelarskich i usługach pilotów wycieczek i przewodników turystycznych, obiekt hotelarski posiadający co najmniej 30 miejsc noclegowych, dostosowany do samoobsługi oraz świadczący minimalny zakres usług związanych z pobytem gości, to","o":{"A":"motel.","B":"kemping.","C":"dom wycieczkowy.","D":"schronisko młodzieżowe."},"a":"C","img":[3503,95],"e":{"A":"Motel – przy drogach, z parkingiem; min. 10 pokoi.","B":"Kemping – teren z miejscami na namioty i przyczepy.","C":"Poprawna. Dom wycieczkowy – min. 30 miejsc noclegowych, przystosowany do samoobsługi, minimalny zakres usług (definicja z ustawy).","D":"Schronisko młodzieżowe – dla młodzieży, nadzorowane przez organy oświaty.","tip":"30 miejsc + samoobsługa = dom wycieczkowy.","long":"Dom wycieczkowy to prosty i tani obiekt: ma co najmniej 30 miejsc, goście sami sobie radzą (samoobsługa), a usług jest mało. Motel jest przy drodze dla kierowców, kemping to miejsce na namioty i przyczepy, a schronisko młodzieżowe jest dla młodzieży. 30 miejsc + samoobsługa = dom wycieczkowy."}},{"n":33,"q":"Poprawnie sporządzone zamówienie usługi transportowej zawiera przede wszystkim informację","o":{"A":"o biletach wstępu.","B":"o dobie hotelowej.","C":"o trasie przejazdu.","D":"o strukturze grupy."},"a":"C","img":[3598,182],"e":{"A":"Bilety wstępu dotyczą zamówienia w obiektach zwiedzanych.","B":"Doba hotelowa – zamówienie noclegów.","C":"Poprawna. W zamówieniu transportu kluczowa jest trasa (skąd–dokąd), termin, godziny i liczba miejsc.","D":"Struktura grupy (wiek, płeć) jest istotna przy noclegach, nie przewozie.","tip":"Transport: trasa, data, godziny, liczba osób.","long":"Przewoźnik musi wiedzieć, skąd i dokąd jedzie, czyli znać trasę przejazdu. Do tego datę, godzinę podstawienia autokaru i liczbę osób. Bilety wstępu i doba hotelowa nie dotyczą kierowcy."}},{"n":34,"q":"Klient, który wykupił pobyt z wyżywieniem BB w hotelu w Zieleńcu, ma zapewnione","o":{"A":"noclegi i obiady.","B":"noclegi i śniadania.","C":"śniadania i obiadokolacje.","D":"śniadania, obiady i kolacje."},"a":"B","img":[3780,37],"e":{"A":"Noclegi i obiady – nie odpowiada żadnemu kodowi.","B":"Poprawna. BB (Bed & Breakfast) = nocleg ze śniadaniem.","C":"Śniadania i obiadokolacje = HB.","D":"Śniadania, obiady i kolacje = FB.","tip":"BB = łóżko + śniadanie.","long":"BB to Bed & Breakfast, czyli nocleg ze śniadaniem. Klient ma zapewnione noclegi i śniadania, a obiady i kolacje kupuje sam. Nie myl z HB (dwa posiłki) ani z FB (trzy posiłki)."}},{"n":35,"q":"Który z wymienionych dokumentów nie jest potwierdzeniem poniesienia kosztów usług turystycznych?","o":{"A":"Polisa ubezpieczeniowa.","B":"Faktura za transport autokarowy.","C":"Bilety wstępów do zwiedzanych obiektów.","D":"Cennik noclegów w schronisku młodzieżowym."},"a":"D","img":[3817,183],"e":{"A":"Polisa potwierdza zapłatę za ubezpieczenie.","B":"Faktura za autokar potwierdza poniesiony koszt.","C":"Bilety wstępu potwierdzają wydatek.","D":"Poprawna. Cennik to tylko oferta z cenami – nie dowodzi, że jakikolwiek koszt został poniesiony.","tip":"Dowody kosztów: faktury, rachunki, bilety, polisy.","long":"Potwierdzenie poniesienia kosztów to dokument, który pokazuje, że naprawdę zapłacono: faktura, bilety, polisa. Cennik pokazuje tylko, ile coś kosztuje, ale nie udowadnia, że ktoś zapłacił. Dlatego cennik nie jest potwierdzeniem kosztów."}},{"n":36,"q":"Dokumentem potwierdzającym sprzedaż usługi turystycznej osobie fizycznej, która nie prowadzi działalności gospodarczej jest","o":{"A":"faktura marża.","B":"raport kasowy.","C":"polecenie przelewu.","D":"paragon z kasy fiskalnej."},"a":"D","img":[4000,211],"e":{"A":"Faktura VAT marża jest dla klientów, którzy jej żądają (np. firm).","B":"Raport kasowy – dokument wewnętrzny.","C":"Polecenie przelewu to dyspozycja bankowa, nie dowód sprzedaży.","D":"Poprawna. Sprzedaż osobie fizycznej nieprowadzącej działalności rejestruje się na kasie fiskalnej i wydaje paragon.","tip":"Osoba prywatna = paragon fiskalny.","long":"Osoba prywatna, która nie ma firmy, zwykle dostaje paragon z kasy fiskalnej. Faktura jest głównie dla firm (lub na prośbę klienta). Raport kasowy to dokument wewnętrzny kasy, a polecenie przelewu to sposób płacenia przez bank."}},{"n":37,"q":"Którą kwotę zapłaci klient za wczasy w Grecji, jeżeli otrzymał 5% rabatu, a cena katalogowa imprezy wynosi 2 550,00 zł?","o":{"A":"2 167,50 zł","B":"2 295,00 zł","C":"2 350,50 zł","D":"2 422,50 zł"},"a":"D","img":[4211,65],"e":{"A":"2 167,50 zł = rabat 15%.","B":"2 295,00 zł = rabat 10%.","C":"2 350,50 zł – błędne obliczenie.","D":"Poprawna. 5% z 2 550 = 127,50 zł; 2 550,00 − 127,50 = 2 422,50 zł (lub 2 550 × 0,95).","tip":"Cena po rabacie x% = cena × (100 − x)/100.","long":"Rabat 5% to 5% mniej od ceny. Liczymy 5% z 2550 zł: 2550 × 0,05 = 127,50 zł. Odejmujemy: 2550 − 127,50 = 2422,50 zł. Szybciej: 2550 × 0,95 = 2422,50 zł."}},{"n":38,"q":"Realizację usług podczas imprezy turystycznej umożliwi","o":{"A":"faktura.","B":"voucher.","C":"umowa agencyjna.","D":"karta rozliczeniowa."},"a":"B","img":[4276,37],"e":{"A":"Faktura dokumentuje sprzedaż, nie uprawnia do usługi.","B":"Poprawna. Voucher to skierowanie – na jego podstawie hotel, restauracja czy przewoźnik realizuje usługę dla uczestnika.","C":"Umowa agencyjna reguluje współpracę agenta z organizatorem.","D":"Karta rozliczeniowa służy do rozliczenia po imprezie.","tip":"Voucher = „bilet” na usługę.","long":"Voucher to „bon” od biura podróży. Turysta pokazuje go w hotelu czy restauracji, a oni wiedzą, że usługa jest już opłacona i trzeba ją wykonać. Faktura to dokument płatności, umowa agencyjna łączy biuro z agentem, a karta rozliczeniowa służy do rozliczeń."}},{"n":39,"q":"Biuro podróży podczas kalkulacji ceny krajowej imprezy turystycznej wykazało marżę bez podatku VAT w kwocie 203,25 zł. Oblicz kwotę podatku VAT.","o":{"A":"45,08 zł","B":"46,75 zł","C":"55,23 zł","D":"57,50 zł"},"a":"B","img":[4313,66],"e":{"A":"45,08 zł – błędne obliczenie.","B":"Poprawna. VAT od marży w Polsce = 23% marży netto: 203,25 × 0,23 = 46,75 zł.","C":"55,23 zł – błędne obliczenie.","D":"57,50 zł – błędne obliczenie.","tip":"W biurach podróży VAT liczymy tylko od marży (procedura VAT marża), stawka 23%.","long":"Biuro podróży płaci VAT tylko od swojej marży (zarobku), a stawka wynosi 23%. Liczymy 23% z 203,25 zł: 203,25 × 0,23 = 46,75 zł. Marża już jest „bez VAT”, więc po prostu mnożymy przez 0,23."}},{"n":40,"q":"Który z wymienionych dokumentów jest niezbędny do rozliczenia finansowego imprezy turystycznej?","o":{"A":"Raport kasowy.","B":"Umowa hotelowa.","C":"Umowa z kontrahentem.","D":"Faktura od usługodawcy."},"a":"D","img":[4379,37],"e":{"A":"Raport kasowy – zestawienie operacji kasowych biura, nie rozliczenie imprezy.","B":"Umowa hotelowa określa warunki, nie dokumentuje poniesionych kosztów.","C":"Umowa z kontrahentem – jw.","D":"Poprawna. Rozliczenie imprezy wymaga dowodów rzeczywiście poniesionych kosztów – faktur od usługodawców (hotel, przewoźnik, restauracja).","tip":"Rozliczenie = faktury kosztowe.","long":"Rozliczenie imprezy polega na porównaniu, ile biuro dostało od klientów i ile naprawdę wydało. To, ile wydało, udowadniają faktury od usługodawców (hotelu, przewoźnika, restauracji). Bez faktur nie da się rozliczyć imprezy."}}],"2023-czerwiec":[{"n":1,"q":"Który rodzaj turystyki uprawiają osoby zainteresowane walorami przyrodniczymi?","o":{"A":"Ekoturystykę.","B":"Lipoturystykę.","C":"Fanoturystykę.","D":"Tanatoturystykę."},"a":"A","img":[0,37],"e":{"A":"Poprawna. Ekoturystyka to podróże do miejsc o cennej przyrodzie, z poszanowaniem środowiska (parki narodowe, obserwacja ptaków).","B":"Lipoturystyka (liposukcja) – wyjazdy na zabiegi chirurgii plastycznej; odmiana turystyki medycznej.","C":"Fanoturystyka – wyjazdy kibiców na wydarzenia sportowe lub koncerty idoli.","D":"Tanatoturystyka – odwiedzanie miejsc związanych ze śmiercią (cmentarze, obozy zagłady).","tip":"Eko = przyroda; tanato = śmierć; fano = kibice; lipo = zabiegi.","long":"Ekoturystyka to wyjazdy, żeby podziwiać przyrodę i jej nie niszczyć: parki narodowe, rezerwaty, obserwowanie ptaków i zwierząt. Lipoturystyka to wyjazdy np. na kuracje odchudzające, fanoturystyka – na mecze i koncerty (kibice), a tanatoturystyka – do miejsc związanych ze śmiercią (np. obozy, cmentarze). Przyroda = eko."}},{"n":2,"q":"Jedną z cech turystyki trampingowej jest","o":{"A":"wyżywienie w formie all inclusive.","B":"ścisłe przestrzeganie programu imprezy.","C":"korzystanie z lokalnych środków transportu.","D":"nocowanie w luksusowych hotelach."},"a":"C","img":[37,37],"e":{"A":"All inclusive jest typowe dla wczasów zorganizowanych, nie trampingu.","B":"Tramping to swoboda – brak sztywnego programu.","C":"Poprawna. Tramping to tanie, samodzielne podróżowanie lokalnymi środkami transportu (autobusy, pociągi, autostop).","D":"Luksusowe hotele są przeciwieństwem niskobudżetowego trampingu.","tip":"Tramping = plecak, mały budżet, lokalny transport.","long":"Tramping to podróżowanie na własną rękę i jak najtaniej – z plecakiem, bez biura podróży. Turysta jeździ tym, czym jeżdżą miejscowi: lokalnymi autobusami, pociągami, czasem autostopem, i śpi w tanich miejscach. Dlatego all inclusive, luksusowe hotele i sztywny program to przeciwieństwo trampingu. Zapamiętaj: tramping = tanio, swobodnie, lokalnie."}},{"n":3,"q":"Który obiekt dostosowany do samoobsługi gości powinno się zaproponować studentowi poszukującemu taniego noclegu?","o":{"A":"Hotel.","B":"Pensjonat.","C":"Dom wczasowy.","D":"Schronisko młodzieżowe."},"a":"D","img":[74,66],"e":{"A":"Hotel ma pełną obsługę i jest drogi.","B":"Pensjonat – obsługa i wyżywienie, droższy.","C":"Dom wczasowy – obiekt do wypoczynku zorganizowanego z wyżywieniem.","D":"Poprawna. Schronisko młodzieżowe – tani obiekt dla młodzieży i studentów, przystosowany do samoobsługi (wspólna kuchnia).","tip":"Tanio + samoobsługa + młodzież = schronisko młodzieżowe.","long":"Student szuka taniego noclegu, gdzie sam sobie wszystko zrobi (samoobsługa). Takie jest schronisko młodzieżowe – tanie, proste, dla młodych ludzi, często ze wspólną kuchnią. Hotel i pensjonat są droższe i mają obsługę, a dom wczasowy jest przeznaczony na dłuższy wypoczynek."}},{"n":4,"q":"Program wycieczki szlakiem etnograficznym po Kaszubach powinien uwzględniać","o":{"A":"arboretum w Kórniku.","B":"alpinarium w Rogowie.","C":"zamek krzyżacki w Gniewie.","D":"skansen we Wdzydzach Kiszewskich."},"a":"D","img":[140,37],"e":{"A":"Arboretum w Kórniku – Wielkopolska (kolekcja drzew).","B":"Alpinarium w Rogowie – arboretum w Łódzkiem.","C":"Zamek w Gniewie – Kociewie/Pomorze, zabytek krzyżacki, nie etnografia.","D":"Poprawna. Skansen we Wdzydzach Kiszewskich (Kaszubski Park Etnograficzny) – najstarszy skansen w Polsce, k
