t."},"a":"A","img":[1776,92],"e":{"A":"Poprawna. Czarter = wynajęcie pokoi na wyłączną dyspozycję biura.","B":"Franchising to korzystanie z marki.","C":"Timesharing to prawo do apartamentu przez część roku.","D":"Free sale – sprzedaż bez gwarancji puli.","tip":"Wyłączność = czarter."}},{"n":19,"q":"„Rooming list” to lista uczestników","o":{"A":"wycieczki według kolejności wpłat.","B":"po odprawie bagażowej na lotnisku.","C":"stanowiąca załącznik do polisy ubezpieczeniowej.","D":"przesłana przez biuro turystyczne do obiektu hotelowego."},"a":"D","img":[1868,62],"e":{"A":"Kolejność wpłat to lista płatności.","B":"Odprawa bagażowa to procedura lotniskowa.","C":"Załącznik do polisy to lista ubezpieczonych.","D":"Poprawna. Rooming list – lista gości z podziałem na pokoje, wysyłana przez biuro do hotelu.","tip":"Room = pokój."}},{"n":20,"q":"Turyście, który oprócz noclegu oczekuje tylko śniadania, należy zaproponować taryfę hotelową","o":{"A":"OB","B":"BB","C":"HB","D":"FB"},"a":"B","img":[1930,61],"e":{"A":"OB nie jest standardowym oznaczeniem.","B":"Poprawna. BB = bed & breakfast – nocleg ze śniadaniem.","C":"HB to 2 posiłki.","D":"FB to 3 posiłki.","tip":"BB = śniadanie."}},{"n":21,"q":"Jaką strategię powinien przyjąć właściciel kwatery wiejskiej w ramach strategii ceny?","o":{"A":"Modernizację pokoi.","B":"Sezonową obniżkę cen.","C":"Umieszczenie oferty w Internecie.","D":"Zmianę menu w gospodarstwie gościnnym."},"a":"B","img":[1991,62],"e":{"A":"Modernizacja dotyczy produktu.","B":"Poprawna. Sezonowa obniżka to strategia cenowa.","C":"Internet to dystrybucja/promocja.","D":"Menu dotyczy produktu.","tip":"Cena = obniżki, rabaty."}},{"n":22,"q":"W którym mieście odbywają się Międzynarodowe Targi Turystyczne „Tour Salon”?","o":{"A":"W Warszawie.","B":"W Poznaniu.","C":"W Krakowie.","D":"W Berlinie."},"a":"B","img":[2053,62],"e":{"A":"W Warszawie – TT Warsaw.","B":"Poprawna. Tour Salon odbywa się w Poznaniu.","C":"W Krakowie – Targi Turystyki.","D":"W Berlinie – ITB.","tip":"Tour Salon = Poznań."}},{"n":23,"q":"Zamieszczony fragment ustawy o usługach turystycznych („Organizator turystyki lub pośrednik turystyczny, który proponuje klientom imprezy turystyczne…, udostępniając im odpowiednie informacje pisemne, a w szczególności broszury, foldery, katalogi, jest obowiązany wskazać w tych materiałach w sposób dokładny i zrozumiały: cenę, miejsce pobytu lub trasę, środek transportu, obiekt zakwaterowania, posiłki, program, zaliczkę…”) dotyczy","o":{"A":"umów o świadczenie usług turystycznych.","B":"voucherów na pobyt w gospodarstwie gościnnym.","C":"katalogów ofertowanych przez biuro podróży.","D":"umów pomiędzy hotelem a biurem podróży."},"a":"C","ctx":1,"img":[2115,582],"e":{"A":"Umowy mają osobny przepis o zawartości umowy.","B":"Voucher nie jest tu wymieniony.","C":"Poprawna. Przepis mówi wprost o broszurach, folderach i katalogach – dotyczy katalogów biura.","D":"Umowy hotel–biuro nie są tu regulowane.","tip":"Szukaj słowa-klucza w tekście: „katalogi”."}},{"n":24,"q":"Najwyższym organem administracji państwowej właściwym dla turystyki jest","o":{"A":"Ministerstwo Sportu.","B":"Ministerstwo Gospodarki.","C":"Polska Organizacja Turystyczna.","D":"Ministerstwo Sportu i Turystyki."},"a":"D","img":[2697,62],"e":{"A":"Ministerstwo Sportu – w 2015 r. nazywało się Sportu i Turystyki.","B":"Gospodarka nie była właściwa dla turystyki w 2015 r.","C":"POT nie jest organem administracji – to państwowa osoba prawna.","D":"Poprawna. W 2015 r. właściwe było Ministerstwo Sportu i Turystyki.","tip":"Pamiętaj, że nazwy ministerstw się zmieniały."}},{"n":25,"q":"Zgodnie z klasyfikacją Światowej Organizacji Turystyki, podróże mieszkańców Polski do Turcji nazywa się turystyką","o":{"A":"krajową.","B":"wyjazdową.","C":"przyjazdową.","D":"międzynarodową."},"a":"D","img":[2759,93],"e":{"A":"Krajowa – podróże po własnym kraju.","B":"Z punktu widzenia Polski to wyjazd, ale klucz wskazuje szerszą kategorię.","C":"Przyjazdowa – cudzoziemcy przyjeżdżający do kraju.","D":"Poprawna. Wyjazd Polaków do Turcji przekracza granicę – to turystyka międzynarodowa (jej odmianą jest wyjazdowa).","tip":"Klucz CKE: przekroczenie granicy = międzynarodowa."}},{"n":26,"q":"Działania na rzecz popierania turystyki wiejskiej w Polsce to zadania statutowe","o":{"A":"Polskiej Rady Podróży.","B":"Polskiej Organizacji Turystyki.","C":"Polskiej Federacji Turystyki Wiejskiej.","D":"Polskiego Towarzystwa Turystyczno-Krajoznawczego."},"a":"C","img":[2852,62],"e":{"A":"Polska Rada Podróży nie jest organizacją od turystyki wiejskiej.","B":"POT promuje całą Polskę.","C":"Poprawna. PFTW „Gospodarstwa Gościnne” ma w statucie wspieranie turystyki wiejskiej.","D":"PTTK zajmuje się krajoznawstwem.","tip":"Turystyka wiejska = PFTW."}},{"n":27,"q":"Połoniny to","o":{"A":"śródleśne bagna na terenie Biebrzańskiego Parku Narodowego.","B":"porośnięte trawami, kopulaste bieszczadzkie szczyty.","C":"inna nazwa hal tatrzańskich.","D":"łąki nad Biebrzą."},"a":"B","img":[2914,62],"e":{"A":"Bagna nad Biebrzą to nie połoniny.","B":"Poprawna. Połoniny – trawiaste, kopulaste grzbiety Bieszczadów powyżej granicy lasu.","C":"Hale tatrzańskie to inne pojęcie.","D":"Łąki nad Biebrzą to nie połoniny.","tip":"Połoniny = Bieszczady."}},{"n":28,"q":"Na obszarze którego regionu przebiega w Polsce Szlak Tatarski?","o":{"A":"Pomorza Wielkopolskiego.","B":"Pobrzeża Bałtyckiego.","C":"Beskidu Niskiego.","D":"Białostocczyzny."},"a":"D","img":[2976,62],"e":{"A":"Pomorze nie jest związane z Tatarami.","B":"Pobrzeże Bałtyckie nie.","C":"Beskid Niski – Łemkowie.","D":"Poprawna. Szlak Tatarski (Kruszyniany, Bohoniki) leży na Białostocczyźnie.","tip":"Tatarzy = Podlasie."}},{"n":29,"q":"Nie więcej niż dwa razy w każdym tygodniu można wydłużyć maksymalny czas prowadzenia autokaru przez kierowcę","o":{"A":"do 8 godzin.","B":"do 9 godzin.","C":"do 10 godzin.","D":"do 14 godzin."},"a":"C","img":[3038,92],"e":{"A":"8 godzin – za mało.","B":"9 godzin to standardowy dzienny limit.","C":"Poprawna. Dzienny czas jazdy 9 h można 2 razy w tygodniu wydłużyć do 10 h.","D":"14 h to wymiar służby, nie jazdy.","tip":"9 h, wyjątkowo 10 h (2× w tygodniu)."}},{"n":30,"q":"Informacja Turystyczna dostarcza społeczeństwu dokładnej, zwięzłej i rzetelnej wiedzy dotyczącej wszystkich spraw związanych","o":{"A":"z rodzajami ubezpieczeń turystycznych.","B":"z podróżą liniami lotniczymi i sprawami z tym związanymi.","C":"z rodzajami umów, jakie można zawrzeć z organizatorem turystyki.","D":"z atrakcjami turystycznymi i bazą noclegową wybranej miejscowości, regionu."},"a":"D","img":[3130,92],"e":{"A":"Ubezpieczenia to nie główna rola IT.","B":"Linie lotnicze to nie główna rola.","C":"Umowy z organizatorem to nie główna rola.","D":"Poprawna. IT informuje o atrakcjach i bazie noclegowej miejscowości/regionu.","tip":"IT = atrakcje + noclegi."}},{"n":31,"q":"Która z proponowanych ofert gospodarstwa agroturystycznego w pełni zaspokoi oczekiwania turysty w zakresie uprawiania hippiki?","o":{"A":"Komfortowe pokoje; quady, samochody terenowe; park linowy.","B":"Pokoje standard; przejażdżki łodzią po jeziorze; wiejska kuźnia.","C":"Pokoje w stylu „Bonanza”; nauka jazdy konnej; własny hipodrom.","D":"Luksusowe apartamenty; wędkowanie w stawie; spływy kajakowe."},"a":"C","ctx":1,"img":[3222,218],"e":{"A":"Quady i park linowy to nie hippika.","B":"Łodzie i kuźnia to nie hippika.","C":"Poprawna. Hippika = jeździectwo: nauka jazdy konnej, własny hipodrom.","D":"Wędkowanie i kajaki to nie hippika.","tip":"Hippos = koń."}},{"n":32,"q":"W ofercie obiektu noclegowego położonego w regionie, gdzie występują podziemne wody mineralne i borowiny, powinny znaleźć się usługi","o":{"A":"hippiczne.","B":"alpinistyczne.","C":"balneologiczne.","D":"speleologiczne."},"a":"C","img":[3440,92],"e":{"A":"Hippika to jeździectwo.","B":"Alpinizm to wspinaczka.","C":"Poprawna. Wody mineralne i borowiny to usługi balneologiczne (lecznictwo uzdrowiskowe).","D":"Speleologia to jaskinie.","tip":"Balneo = kąpiel lecznicza."}},{"n":33,"q":"W programie pobytu zielonej szkoły dla dzieci w Kotlinie Kłodzkiej uwzględniono zwiedzanie","o":{"A":"Rabki-Zdroju.","B":"Solca-Zdroju.","C":"Kudowy-Zdroju.","D":"Wieńca-Zdroju."},"a":"C","img":[3532,62],"e":{"A":"Rabka-Zdrój leży w Beskidach (Gorce).","B":"Solec-Zdrój jest w świętokrzyskim.","C":"Poprawna. Kudowa-Zdrój leży w Kotlinie Kłodzkiej (Kaplica Czaszek, Góry Stołowe).","D":"Wieniec-Zdrój jest na Kujawach.","tip":"Kotlina Kłodzka: Kudowa, Polanica, Duszniki, Lądek."}},{"n":34,"q":"Święta Góra Grabarka to ośrodek pielgrzymkowy dla wyznawców","o":{"A":"starokatolicyzmu.","B":"protestantyzmu.","C":"prawosławia.","D":"judaizmu."},"a":"C","img":[3594,61],"e":{"A":"Starokatolicy – nie.","B":"Protestanci – nie.","C":"Poprawna. Grabarka to najważniejsze sanktuarium prawosławne w Polsce.","D":"Judaizm – nie.","tip":"Grabarka = prawosławie."}},{"n":35,"q":"Pilot w czasie odprawy otrzymuje","o":{"A":"teczkę imprezy.","B":"dokumenty potwierdzające świadczenia i kalkulację.","C":"listę telefonów awaryjnych na Policję, Straż Miejską i Pożarną.","D":"dokumenty potwierdzające świadczenia, listę uczestników, polisę."},"a":"D","img":[3655,61],"e":{"A":"Teczka to całość, ale klucz wymaga konkretów.","B":"Kalkulacji pilot zwykle nie otrzymuje.","C":"Telefony to tylko część.","D":"Poprawna. Pilot dostaje dokumenty potwierdzające świadczenia, listę uczestników i polisę.","tip":"Odprawa pilota = vouchery + lista + polisa."}},{"n":36,"q":"Ubezpieczeniem przewodnika turystycznego od szkód wyrządzonych wskutek nieprawidłowego wykonywania swoich obowiązków jest","o":{"A":"AC","B":"KL","C":"OC","D":"NNW"},"a":"C","img":[3716,93],"e":{"A":"AC to autocasco pojazdu.","B":"KL to koszty leczenia.","C":"Poprawna. OC – odpowiedzialność cywilna za szkody wyrządzone innym.","D":"NNW – następstwa nieszczęśliwych wypadków.","tip":"OC = za szkody wyrządzone."}},{"n":37,"q":"Teczka imprezy turystycznej nie zawiera","o":{"A":"programu imprezy turystycznej.","B":"kalkulacji imprezy przez osobę przygotowującą wyjazd.","C":"umowy pomiędzy biurem podróży a uczestnikami imprezy.","D":"biletów wstępu zakupionych indywidualnie przez klientów."},"a":"D","img":[3809,62],"e":{"A":"Program jest w teczce.","B":"Kalkulacja bywa w teczce.","C":"Umowa jest w teczce.","D":"Poprawna. Bilety kupione indywidualnie przez klientów nie są dokumentem imprezy.","tip":"Teczka = dokumenty biura."}},{"n":38,"q":"Zmiana wcześniej ustalonej ceny imprezy turystycznej jest możliwa do 20 dni przed datą wyjazdu w przypadku","o":{"A":"wzrostu ceny walut obcych.","B":"podwyższenia cen przez właściciela hotelu.","C":"wzrostu opłat za bilety wstępu do zwiedzanych obiektów.","D":"podwyższenia marży biura na skutek stwierdzenia niskiej zyskowności z imprezy."},"a":"A","img":[3871,93],"e":{"A":"Poprawna. Ustawa pozwalała podwyższyć cenę (nie później niż 20 dni przed wyjazdem) m.in. z powodu wzrostu kursów walut.","B":"Podwyżka hotelu nie jest ustawową przesłanką.","C":"Bilety wstępu nie są przesłanką.","D":"Niska zyskowność biura nie jest przesłanką.","tip":"Przesłanki: kurs walut, koszty transportu (paliwo), opłaty urzędowe."}},{"n":39,"q":"Na podstawie kalkulacji imprezy turystycznej (Stegna 2014: koszty razem 3 169,00 zł; marża 10%: 316,90 zł; VAT: 72,89 zł; całkowity koszt 3 558,79 zł; cena za 1 uczestnika 177,94 zł, po zaokrągleniu 180,00 zł; całkowity koszt po zaokrągleniu 3 600,00 zł) wskaż, ilu pełnopłatnych uczestników wzięło udział w wycieczce do Stegny.","o":{"A":"10","B":"15","C":"20","D":"30"},"a":"C","ctx":1,"img":[3964,578],"e":{"A":"10 × 180 = 1800 zł.","B":"15 × 180 = 2700 zł.","C":"Poprawna. 3600 zł : 180 zł = 20 uczestników.","D":"30 × 180 = 5400 zł.","tip":"Całkowity koszt : cena za osobę = liczba osób."}},{"n":40,"q":"Podstawą opodatkowania usług świadczonych przez biura podróży jest","o":{"A":"marża na imprezie.","B":"opłata akwizycyjna dla pracowników lotniska.","C":"kwota akwizycyjna, ustalana ryczałtowo, za przyjazdy turystów z Polski.","D":"kwota wliczana w cenę imprezy, przeznaczona dla agenta prowadzącego sprzedaż w imieniu touroperatora."},"a":"A","img":[4542,61],"e":{"A":"Poprawna. Biura podróży stosują procedurę marży – VAT liczy się od marży.","B":"Opłata dla pracowników lotniska – nie.","C":"Kwota akwizycyjna – nie.","D":"Prowizja agenta – nie jest podstawą opodatkowania biura.","tip":"Biuro podróży = VAT od marży."}}],"2014-wrzesien":[{"n":1,"q":"Do turystyki kwalifikowanej zalicza się","o":{"A":"wyjazd na rafting w austriackich Alpach.","B":"udział rodziny w tygodniowych wczasach w Ustce.","C":"uczestnictwo młodzieży w wycieczce krajoznawczej.","D":"wypoczynkowy wyjazd grupy znajomych nad Jezioro."},"a":"A","img":[0,62],"e":{"A":"Poprawna. Rafting wymaga umiejętności i sprzętu – to turystyka kwalifikowana.","B":"Wczasy nad morzem to turystyka wypoczynkowa.","C":"Wycieczka krajoznawcza to turystyka poznawcza.","D":"Wyjazd nad jezioro dla odpoczynku to wypoczynek.","tip":"Kwalifikowana = sprzęt + umiejętności (rafting, nurkowanie, wspinaczka)."}},{"n":2,"q":"Zgodnie z definicją zawartą w ustawie o usługach turystycznych impreza turystyczna to co najmniej dwie usługi turystyczne, tworzące jednolity program i objęte wspólną ceną, jeżeli","o":{"A":"usługi te trwają ponad 1 dzień.","B":"program przewiduje dwa miejsca pobytu.","C":"program przewiduje trzy zmiany miejsca pobytu.","D":"usługi te obejmują nocleg lub trwają ponad 24 godziny, albo jeżeli program przewiduje zmianę miejsca pobytu."},"a":"D","img":[62,92],"e":{"A":"Ustawa nie mówi o „ponad 1 dniu”.","B":"Dwa miejsca pobytu to za wąsko.","C":"Trzy zmiany miejsca to za wąsko.","D":"Poprawna. Impreza: min. 2 usługi, wspólny program i cena, jeśli obejmują nocleg lub trwają > 24 h albo zakładają zmianę miejsca pobytu.","tip":"Definicja z ustawy z 1997 r."}},{"n":3,"q":"Które usługi musi zarezerwować touroperator, przygotowując 2-dniową wycieczkę autokarową do Krakowa?","o":{"A":"Transportową, handlową.","B":"Żywieniową, rzemieślniczą.","C":"Noclegową, przewodnika górskiego.","D":"Transportową, noclegową."},"a":"D","img":[154,93],"e":{"A":"Usługi handlowe nie są rezerwowane.","B":"Rzemieślnicze nie są potrzebne.","C":"Przewodnik górski w Krakowie nie jest potrzebny.","D":"Poprawna. Wycieczka 2-dniowa autokarowa: autokar + nocleg.","tip":"Wielodniowa = transport + nocleg."}},{"n":4,"q":"Wypoczywając na wczasach z biura podróży w Hurghadzie, klientka postanowiła zwiedzić Luksor. W tym celu wykupiła u rezydenta dodatkową imprezę","o":{"A":"krajową.","B":"zagraniczną.","C":"fakultatywną.","D":"międzynarodową."},"a":"C","img":[247,93],"e":{"A":"Krajowa – po własnym kraju.","B":"Zagraniczną jest już cały pobyt w Egipcie.","C":"Poprawna. Fakultatywna – dodatkowa, płatna wycieczka kupiona u rezydenta podczas pobytu.","D":"Międzynarodowa to rodzaj ruchu turystycznego.","tip":"Fakultatywna = dla chętnych, za dopłatą."}},{"n":5,"q":"Rodzina z dwojgiem małych dzieci chce wyjechać na zimowy wypoczynek na południe Polski. Którą imprezę powinien zaproponować pracownik biura klientom zgodnie z ich oczekiwaniami?","o":{"A":"Rajd narciarski w Tatrach.","B":"Obóz narciarski w Zakopanem.","C":"Wczasy w Bukowinie Tatrzańskiej.","D":"Wycieczkę objazdową po Podhalu."},"a":"C","img":[340,93],"e":{"A":"Rajd narciarski jest zbyt wymagający dla małych dzieci.","B":"Obóz narciarski to forma dla młodzieży.","C":"Poprawna. Wczasy w Bukowinie Tatrzańskiej – wypoczynek rodzinny na południu Polski.","D":"Objazd jest męczący dla małych dzieci.","tip":"Małe dzieci = pobyt stacjonarny (wczasy)."}},{"n":6,"q":"Małe nachylenie terenu zaznacza się na mapie","o":{"A":"gęstą siecią izohalin.","B":"gęstą siecią izobar.","C":"rzadką siecią izobat.","D":"rzadką siecią poziomic."},"a":"D","img":[433,62],"e":{"A":"Izohaliny łączą punkty o równym zasoleniu.","B":"Izobary – równe ciśnienie.","C":"Izobaty – równe głębokości.","D":"Poprawna. Poziomice (warstwice) rzadko położone = łagodny stok.","tip":"Gęste poziomice = stromo; rzadkie = płasko."}},{"n":7,"q":"Długość odcinka Wrocław-Praga odczytana z mapy sporządzonej w skali 1:5 000 000 wynosi 5 cm. Oblicz ile kilometrów przejedzie autokar z Wrocławia do Pragi.","o":{"A":"125 km","B":"250 km","C":"375 km","D":"500 km"},"a":"B","img":[495,93],"e":{"A":"125 km – błąd skali.","B":"Poprawna. 1 cm = 5 000 000 cm = 50 km; 5 cm × 50 km = 250 km.","C":"375 km – błąd.","D":"500 km – błąd.","tip":"Skala 1:5 000 000 → 1 cm = 50 km."}},{"n":8,"q":"Którą nazwę narodowej waluty Ukrainy należy wpisać w pierwszej kolumnie tabeli? (tabela: …… – Ukraina – UAH; korona – Czechy – CZK; funt – Wielka Brytania – GBP; forint – Węgry – HUF)","o":{"A":"lej.","B":"lit.","C":"euro.","D":"hrywna."},"a":"D","ctx":1,"img":[588,196],"e":{"A":"Lej to waluta Rumunii i Mołdawii.","B":"Lit był walutą Litwy.","C":"Euro nie jest walutą Ukrainy.","D":"Poprawna. Walutą Ukrainy jest hrywna (UAH).","tip":"UAH = hrywna."}},{"n":9,"q":"Pracownik biura podróży, opracowując program imprezy dla studentów Uniwersytetu Przyrodniczego, uwzględnił w nim dwa walory naturalne, czyli","o":{"A":"Pieniny i Dunajec.","B":"Wieżycę i Sulęcin.","C":"Wybrzeże Bałtyckie i Sopot.","D":"Wodospad Szklarki i Szklarską Porębę."},"a":"A","img":[784,93],"e":{"A":"Poprawna. Pieniny (góry) i Dunajec (rzeka) to walory naturalne.","B":"Sulęcin to miasto – walor antropogeniczny.","C":"Sopot to miasto.","D":"Szklarska Poręba to miasto.","tip":"Naturalne = przyroda; miasta to walory antropogeniczne."}},{"n":10,"q":"W programie objazdowej wycieczki po zachodniej Polsce uwzględniono obiekt, który nie jest wpisany na Listę Światowego Dziedzictwa Kultury, czyli","o":{"A":"Park Mużakowski.","B":"Hala Stulecia we Wrocławiu.","C":"Zamek Krzyżacki w Malborku.","D":"Park Narodowy Ujście Warty."},"a":"D","img":[877,93],"e":{"A":"Park Mużakowski jest na liście UNESCO.","B":"Hala Stulecia jest na liście UNESCO.","C":"Zamek w Malborku jest na liście UNESCO.","D":"Poprawna. PN Ujście Warty nie jest wpisany na listę UNESCO (to obszar Ramsar).","tip":"UNESCO w zach. Polsce: Hala Stulecia, Park Mużakowski, Kościoły Pokoju."}},{"n":11,"q":"W którym stylu wybudowano ratusz w Zamościu?","o":{"A":"W gotyckim.","B":"W romańskim.","C":"W renesansowym.","D":"W klasycystycznym."},"a":"C","img":[970,267],"e":{"A":"Gotyk – np. ratusz w Toruniu.","B":"Romański – nie ma takich ratuszy.","C":"Poprawna. Zamość to „renesansowe miasto idealne” – ratusz renesansowy (z barokowymi schodami).","D":"Klasycyzm – np. Teatr Wielki w Warszawie.","tip":"Zamość = renesans, Padwa Północy."}},{"n":12,"q":"Większość spraw dotyczących turystyki w Polsce podlega obecnie","o":{"A":"Ministerstwu Sportu i Turystyki.","B":"Urzędowi Kultury Fizycznej i Turystyki.","C":"Ministerstwu Gospodarki.","D":"Ministerstwu Dziedzictwa Narodowego."},"a":"A","img":[1237,62],"e":{"A":"Poprawna. W 2014 r. turystyką zajmowało się Ministerstwo Sportu i Turystyki.","B":"UKFiT już nie istniał.","C":"Ministerstwo Gospodarki zajmowało się turystyką wcześniej.","D":"MKiDN zajmuje się kulturą.","tip":"Stan na 2014 r."}},{"n":13,"q":"Czas prowadzenia autokaru przez kierowcę w ciągu doby może zostać przedłużony 2 razy w tygodniu do","o":{"A":"9 godzin.","B":"10 godzin.","C":"11 godzin.","D":"12 godzin."},"a":"B","img":[1299,92],"e":{"A":"9 h to standardowy limit.","B":"Poprawna. Dzienny czas jazdy 9 h można 2 razy w tygodniu wydłużyć do 10 h.","C":"11 h – za dużo.","D":"12 h – za dużo.","tip":"9 h → 10 h (2×/tydz.)."}},{"n":14,"q":"Biuro turystyczne organizujące imprezę turystyczną z noclegiem w gospodarstwie agroturystycznym ubezpiecza uczestników od NNW","o":{"A":"obowiązkowo.","B":"jednorazowo na rok.","C":"na życzenie klientów.","D":"na wniosek właścicieli gospodarstwa agroturystycznego."},"a":"A","img":[1391,92],"e":{"A":"Poprawna. Organizator imprezy krajowej ma obowiązek ubezpieczyć uczestników od NNW.","B":"Ubezpieczenie dotyczy konkretnej imprezy.","C":"To obowiązek, nie opcja.","D":"Właściciel gospodarstwa nie decyduje.","tip":"NNW w kraju, KL+NNW za granicą – obowiązkowo."}},{"n":15,"q":"W którym wierszu tabeli przedstawiono poprawną kalkulację katalogowej ceny imprezy turystycznej?","o":{"A":"Suma kosztów świadczeń + marża biura podróży + podatek VAT = suma kosztów","B":"Suma kosztów świadczeń + podatek VAT + marża biura podróży = suma kosztów","C":"Suma kosztów świadczeń + marża biura podróży + podatek VAT = suma kosztów → cena na 1 uczestnika","D":"Suma kosztów świadczeń + podatek VAT + marża biura podróży = suma kosztów → cena na 1 uczestnika"},"a":"C","ctx":1,"img":[1483,547],"e":{"A":"Brakuje ceny na 1 uczestnika.","B":"Zła kolejność – VAT liczy się od marży, więc marża musi być pierwsza.","C":"Poprawna. Koszty + marża + VAT (od marży) = suma; następnie cena na 1 uczestnika.","D":"Zła kolejność – VAT przed marżą.","tip":"Najpierw marża, potem VAT od marży, na końcu cena/os."}},{"n":16,"q":"Kosztem stałym w kalkulowaniu ceny imprezy turystycznej jest koszt","o":{"A":"wyżywienia.","B":"ubezpieczenia.","C":"biletów do muzeów.","D":"przewodnika turystycznego."},"a":"D","img":[2030,62],"e":{"A":"Wyżywienie – na osobę (zmienny).","B":"Ubezpieczenie – na osobę (zmienny).","C":"Bilety – na osobę (zmienny).","D":"Poprawna. Przewodnik – jedna kwota dla grupy, niezależnie od liczby osób – koszt stały.","tip":"Stały = na grupę."}},{"n":17,"q":"Pracownik biura podróży nie wpisuje w zamówieniu usługi transportowej dla wycieczki autokarowej","o":{"A":"daty wycieczki.","B":"ilości uczestników.","C":"struktury wiekowej grupy.","D":"miejsca podstawienia autokaru."},"a":"C","img":[2092,61],"e":{"A":"Data musi być w zamówieniu.","B":"Liczba uczestników decyduje o wielkości autokaru.","C":"Poprawna. Struktura wiekowa nie jest potrzebna przewoźnikowi.","D":"Miejsce podstawienia jest niezbędne.","tip":"Przewoźnik: kiedy, ilu, skąd, dokąd."}},{"n":18,"q":"Pracownik biura podróży, przygotowując 3-dniową wycieczkę kolejową do Olsztyna, powinien koniecznie zarezerwować usługi","o":{"A":"transportowe i przewodnika miejskiego.","B":"żywieniowe i informacyjne.","C":"transportowe i żywieniowe.","D":"noclegowe i transportowe."},"a":"D","img":[2153,93],"e":{"A":"Przewodnik miejski jest opcjonalny.","B":"Usługi informacyjne nie są konieczne.","C":"Wyżywienie można zorganizować na miejscu.","D":"Poprawna. Wycieczka 3-dniowa: noclegi + transport (bilety kolejowe).","tip":"Wielodniowa = nocleg + transport."}},{"n":19,"q":"W ramach budowania trwałej więzi z klientami Biuro Podróży Turysta zastosuje","o":{"A":"dwukrotnie obniżkę ceny imprezy o 10%.","B":"jednorazowo obniżkę ceny imprezy o 25%.","C":"program lojalnościowy dla stałych klientów.","D":"obniżkę ceny imprezy dla dzieci do 12 roku życia."},"a":"C","img":[2246,62],"e":{"A":"Dwie obniżki to promocja.","B":"Jednorazowa obniżka to promocja.","C":"Poprawna. Program lojalnościowy buduje trwałą więź.","D":"Zniżka dla dzieci to polityka cenowa.","tip":"Lojalność = relacja."}},{"n":20,"q":"W celu aktywizacji sprzedaży ofert młodzieżowych obozów żeglarskich należy zamieścić","o":{"A":"reklamę w poradnikach domowych.","B":"plakaty z ofertą na terenie kilku szkół.","C":"logo klubu żeglarskiego na koszulkach.","D":"billboardy przy wjeździe do miejscowości górskiej."},"a":"B","img":[2308,62],"e":{"A":"Poradniki domowe nie trafiają do młodzieży.","B":"Poprawna. Plakaty w szkołach docierają do młodzieży – grupy docelowej.","C":"Logo na koszulkach nie jest aktywizacją sprzedaży.","D":"Billboard w górach nie dotyczy żeglarstwa.","tip":"Promocja tam, gdzie jest klient."}},{"n":21,"q":"Walorami Międzygórza i okolic zaczęli interesować się turyści z Czech. Które działania, w pierwszej kolejności, powinien podjąć rolnik, którego gospodarstwo agroturystyczne położone jest w tych okolicach, chcąc zwiększyć liczbę swoich gości z Czech?","o":{"A":"Zgłosić się na kurs języka czeskiego.","B":"Opłacić kurs języka czeskiego dla całej rodziny.","C":"Rozpocząć współpracę z biurem turystycznym z Czech.","D":"Nawiązać rozmowy z gospodarstwem agroturystycznym w Czechach."},"a":"C","img":[2370,123],"e":{"A":"Kurs językowy pomaga, ale nie przyciągnie gości od razu.","B":"Kurs dla całej rodziny – drogi i powolny.","C":"Poprawna. Współpraca z czeskim biurem podróży najszybciej przyniesie gości z Czech.","D":"Gospodarstwo w Czechach to konkurencja.","tip":"Najszybciej: pośrednik na rynku docelowym."}},{"n":22,"q":"Zgodnie z definicją czarter to umowa biura podróży z dostawcą usług, w której","o":{"A":"istnieje możliwość okresowej zmiany ceny świadczeń.","B":"istnieje możliwość zmniejszenia wielkości zarezerwowanych świadczeń.","C":"istnieje możliwość anulowania zarezerwowanych świadczeń.","D":"nie ma możliwości anulowania zarezerwowanych świadczeń."},"a":"D","img":[2493,62],"e":{"A":"Okresowa zmiana ceny nie jest cechą czarteru.","B":"Zmniejszenie puli to allotment/free sale.","C":"Anulowanie jest możliwe w allotmencie.","D":"Poprawna. Czarter – bez możliwości anulowania (biuro płaci za całość).","tip":"Czarter = pełne ryzyko biura."}},{"n":23,"q":"Zgodnie z definicją z ustawy o usługach turystycznych obiekt posiadający 30 miejsc noclegowych, świadczący minimalny zakres usług i dostosowany do samoobsługi klientów, to","o":{"A":"hotel.","B":"pensjonat.","C":"schronisko.","D":"dom wycieczkowy."},"a":"D","img":[2555,93],"e":{"A":"Hotel ma min. 10 pokoi i pełną obsługę.","B":"Pensjonat zapewnia całodzienne wyżywienie.","C":"Schronisko jest w górach/na szlaku.","D":"Poprawna. Dom wycieczkowy: min. 30 miejsc, minimalny zakres usług, samoobsługa.","tip":"Dom wycieczkowy = samoobsługa."}},{"n":24,"q":"Które z wymienionych zadań należą do agenta turystycznego?","o":{"A":"Organizowanie imprez turystycznych zgodnie z umową zawartą z klientem.","B":"Realizowanie zamówionych usług w ramach zakupionej imprezy turystycznej.","C":"Czuwanie nad sposobem wykonania zamówionych usług turystycznych na rzecz uczestników imprezy.","D":"Pośredniczenie w zawieraniu umów o świadczenie usług turystycznych na rzecz organizatorów turystyki."},"a":"D","img":[2648,59],"e":{"A":"To zadanie organizatora.","B":"Usługi realizują usługodawcy.","C":"To zadanie pilota.","D":"Poprawna. Agent pośredniczy w zawieraniu umów na rzecz organizatorów.","tip":"Agent = sprzedaż w imieniu organizatora."}},{"n":25,"q":"Voucher nie zawiera danych informujących","o":{"A":"o ilości świadczeń.","B":"o świadczeniach fakultatywnych.","C":"o terminie wystawienia voucheru.","D":"o pierwszym i ostatnim świadczeniu."},"a":"B","img":[2707,59],"e":{"A":"Liczba świadczeń jest na voucherze.","B":"Poprawna. Świadczeń fakultatywnych (dodatkowych, kupowanych na miejscu) nie ma na voucherze.","C":"Data wystawienia jest na voucherze.","D":"Pierwsze i ostatnie świadczenie są na voucherze.","tip":"Voucher = to, co opłacone."}},{"n":26,"q":"Pracownik biura podróży oczekuje w potwierdzeniu rezerwacji noclegu z hotelu danych dotyczących:","o":{"A":"imienia gościa, lokalizacji pokoju.","B":"wyposażenia pokoju, terminu wyjazdu.","C":"terminu przyjazdu gościa, aranżacji pokoju.","D":"nazwiska gościa, terminu przyjazdu i wyjazdu."},"a":"D","img":[2766,59],"e":{"A":"Lokalizacja pokoju nie jest potrzebna.","B":"Wyposażenie nie jest potrzebne.","C":"Aranżacja nie jest potrzebna.","D":"Poprawna. Potwierdzenie rezerwacji: nazwisko gościa, termin przyjazdu i wyjazdu.","tip":"Kto + od kiedy + do kiedy."}},{"n":27,"q":"Pracownik biura podróży Tramp z Białegostoku, na stałe zamieszkały w Warszawie, w połowie 2013 roku ukończył kurs pilota wycieczek i pozytywnie zdał egzamin państwowy. Uprawnienia pilota wycieczek nadał mu","o":{"A":"prezydent Warszawy.","B":"wojewoda mazowiecki.","C":"marszałek województwa podlaskiego.","D":"marszałek województwa mazowieckiego."},"a":"D","img":[2825,123],"e":{"A":"Prezydent miasta nie nadaje uprawnień.","B":"Wojewoda nie nadaje uprawnień pilota.","C":"Właściwy jest marszałek miejsca zamieszkania, nie siedziby biura.","D":"Poprawna. Uprawnienia nadaje marszałek województwa właściwego dla miejsca zamieszkania – mazowiecki.","tip":"Miejsce zamieszkania decyduje."}},{"n":28,"q":"Uprawnienia przewodnika górskiego zdobędzie osoba, która posiada stan zdrowia umożliwiający wykonywanie zadań, nie była karana oraz","o":{"A":"odbyła wyłącznie szkolenie teoretyczne oraz zdała egzamin na przewodnika górskiego.","B":"ukończyła 18 lat, odbyła szkolenie teoretyczne i praktyczne, zdała egzamin na przewodnika górskiego.","C":"ukończyła 18 lat, odbyła wyłącznie szkolenie praktyczne, zdała egzamin na przewodnika górskiego.","D":"ukończyła szkołę średnią, odbyła wyłącznie szkolenie praktyczne, zdała egzamin na przewodnika górskiego."},"a":"B","img":[2948,88],"e":{"A":"Potrzebne jest też szkolenie praktyczne.","B":"Poprawna. Przewodnik górski: 18 lat, szkolenie teoretyczne i praktyczne, egzamin.","C":"Potrzebne jest też szkolenie teoretyczne.","D":"Wymagane są oba szkolenia.","tip":"Teoria + praktyka + egzamin."}},{"n":29,"q":"Biwakowanie w parku narodowym dozwolone jest jedynie","o":{"A":"na obrzeżach parku.","B":"na terenie całego parku.","C":"w miejscach wskazanych przez dyrektora parku.","D":"w miejscach wskazanych przez ministra ochrony środowiska."},"a":"C","img":[3036,62],"e":{"A":"Obrzeża parku nie są automatycznie dozwolone.","B":"Całość parku – zakaz.","C":"Poprawna. Biwakowanie tylko w miejscach wyznaczonych przez dyrektora parku.","D":"Minister nie wyznacza miejsc.","tip":"Dyrektor parku decyduje."}},{"n":30,"q":"Zgodnie z ustawą o usługach turystycznych pilot wycieczek to osoba, która m.in.","o":{"A":"udzieli uczestnikom imprezy turystycznej wyczerpujących, szczegółowych informacji o odwiedzanych miejscach.","B":"zorganizuje świadczenia w odwiedzanych miejscowościach na rzecz uczestników imprezy turystycznej.","C":"zaopiekuje się uczestnikami imprezy turystycznej, czuwając nad sposobem świadczenia usług na ich rzecz.","D":"zaopiekuje się uczestnikami imprezy turystycznej, dbając o podstawowe świadczenia dla nich w odwiedzanych miejscowościach."},"a":"C","img":[3098,62],"e":{"A":"Szczegółowe informacje to zadanie przewodnika.","B":"Organizacja świadczeń to zadanie biura.","C":"Poprawna. Pilot: opieka nad uczestnikami i czuwanie nad sposobem realizacji usług.","D":"Pilot nie zapewnia „podstawowych świadczeń” – czuwa nad ich wykonaniem.","tip":"Pilot = opieka + nadzór."}},{"n":31,"q":"Udzielane przez pilota wycieczek informacje o atrakcyjności turystycznej Kaszub dotyczą","o":{"A":"zabytków Torunia.","B":"walorów przyrodniczych Giżycka.","C":"szlaków kajakowych w Borach Tucholskich.","D":"walorów przyrodniczych okolic Koszalina."},"a":"C","img":[3160,62],"e":{"A":"Toruń leży na Kujawach (Ziemia Chełmińska).","B":"Giżycko to Mazury.","C":"Poprawna. Bory Tucholskie graniczą z Kaszubami; szlaki kajakowe (Brda, Wda) to atrakcja regionu.","D":"Koszalin to Pomorze Środkowe.","tip":"Kaszuby: Kartuzy, Szymbark, Wdzydze, Bory Tucholskie."}},{"n":32,"q":"Który teren jest najbardziej przydatny do prowadzenia agroturystyki? (użytki rolne / tereny podmokłe / wody / lesistość, w %)","o":{"A":"1 / 22 / 17 / 60","B":"30 / 2 / 18 / 50","C":"0 / 30 / 42 / 28","D":"10 / 26 / 50 / 14"},"a":"B","ctx":1,"img":[3222,255],"e":{"A":"Prawie brak użytków rolnych.","B":"Poprawna. Dużo użytków rolnych (30%), mało bagien, wody i lasy – idealnie dla agroturystyki.","C":"Brak użytków rolnych i dużo bagien.","D":"Mało lasów, dużo bagien.","tip":"Agroturystyka wymaga rolnictwa."}},{"n":33,"q":"Wskaż formę wypoczynku typową dla wyjazdów agroturystycznych.","o":{"A":"pływanie jachtem.","B":"gra w golfa i paintball.","C":"rozgrywki w tenisa ziemnego.","D":"poznawanie przetwórstwa owoców i warzyw."},"a":"D","img":[3477,62],"e":{"A":"Jachting to turystyka kwalifikowana.","B":"Golf i paintball to rozrywka.","C":"Tenis to sport.","D":"Poprawna. Poznawanie przetwórstwa owoców i warzyw to typowa atrakcja wsi.","tip":"Agroturystyka = życie gospodarstwa."}},{"n":34,"q":"Dokumenty, które znajdują się w teczce imprezy motywacyjnej organizowanej w Białymstoku i okolicach, to:","o":{"A":"program imprezy motywacyjnej, kalkulacja kosztów.","B":"lista uczestników wycieczki, program wczasów w Hajnówce.","C":"zezwolenie na działalność biura, program imprezy motywacyjnej.","D":"umowa agencyjna, warunki uczestnictwa w wycieczce do Białegostoku i okolic."},"a":"A","img":[3539,92],"e":{"A":"Poprawna. Teczka imprezy zawiera m.in. program i kalkulację kosztów.","B":"Program wczasów w Hajnówce dotyczy innej imprezy.","C":"Zezwolenie biura nie jest w teczce imprezy.","D":"Umowa agencyjna nie jest dokumentem imprezy.","tip":"Teczka = program, kalkulacja, lista, umowy z usługodawcami."}},{"n":35,"q":"Które czynności wykonuje pilot wycieczek, wyjeżdżając z turystami podczas ich wypoczynku na wycieczkę fakultatywną?","o":{"A":"Wymeldowanie grupy, przywitanie grupy.","B":"Zaproszenie do autokaru, wymeldowanie grupy.","C":"Przywitanie grupy, sprawdzenie listy, przedstawienie programu.","D":"Przywitanie grupy, zaproszenie do autokaru, sprawdzenie listy, wymeldowanie grupy."},"a":"C","img":[3631,93],"e":{"A":"Wymeldowanie dotyczy końca pobytu.","B":"Wymeldowanie nie przy wycieczce fakultatywnej.","C":"Poprawna. Przed fakultetem: przywitanie, sprawdzenie listy, przedstawienie programu.","D":"Wymeldowanie nie jest potrzebne.","tip":"Fakultet = turyści dalej mieszkają w hotelu."}},{"n":36,"q":"Biuro podróży zamówiło dla grupy turystycznej w hotelu wyżywienie HB. Menu do jakiego rodzaju posiłków omówi pilot grupy z pracownikiem hotelu w imieniu biura?","o":{"A":"Tylko kolacje.","B":"Tylko śniadania.","C":"Śniadania, obiadokolacje.","D":"Śniadania, obiady, kolacje."},"a":"C","img":[3724,93],"e":{"A":"Nie tylko kolacje.","B":"Nie tylko śniadania.","C":"Poprawna. HB = śniadania i obiadokolacje.","D":"Trzy posiłki to FB.","tip":"HB = 2 posiłki."}},{"n":37,"q":"Co powinien niezwłocznie zrobić pilot, gdy podczas wycieczki na Ukrainie, jeden z polskich uczestników zgubił paszport?","o":{"A":"Wystawić zaświadczenie o zaistniałej sytuacji.","B":"Powiadomić rodzinę poszkodowanego w Polsce.","C":"Wytłumaczyć zaistniałą sytuację służbom granicznym.","D":"Skierować uczestnika do najbliższej polskiej placówki konsularnej."},"a":"D","img":[3817,92],"e":{"A":"Zaświadczenie pilota nie zastąpi paszportu.","B":"Rodzina nie wyda paszportu.","C":"Służby graniczne nie wydadzą dokumentu.","D":"Poprawna. Należy skierować uczestnika do polskiego konsulatu (paszport tymczasowy).","tip":"Zgubiony paszport → konsulat."}},{"n":38,"q":"Voucher jest","o":{"A":"dokumentem zastępującym zgłoszenie udziału w imprezie turystycznej.","B":"dokumentem finansowym w rozliczeniach z kontrahentami, potwierdzającym opłacenie świadczeń przez klienta.","C":"formą potwierdzenia świadczeń fakultatywnych przy wykupieniu imprezy turystycznej.","D":"formą umowy zawieraną między organizatorem imprezy a klientem."},"a":"B","img":[3909,62],"e":{"A":"Voucher nie zastępuje zgłoszenia.","B":"Poprawna. Voucher to dowód opłacenia świadczeń – usługodawca rozlicza się na jego podstawie z biurem.","C":"Voucher nie dotyczy świadczeń fakultatywnych.","D":"Umowa to osobny dokument.","tip":"Voucher = bon za opłacone usługi."}},{"n":39,"q":"W którym wierszu tabeli przedstawiono poprawne obliczenie podatku VAT przy stawce 23%?","o":{"A":"(cena brutto × 23) : 23 = wartość podatku","B":"cena brutto × (123 : 23) = wartość podatku","C":"(cena brutto × 23) : 123 = wartość podatku","D":"(cena brutto × 23) × 123 = wartość podatku"},"a":"C","img":[3971,196],"e":{"A":"(× 23) : 23 = cena brutto – bez sensu.","B":"× (123:23) daje kwotę większą od ceny.","C":"Poprawna. VAT z brutto = brutto × 23 / 123.","D":"Mnożenie przez 123 daje absurdalny wynik.","tip":"VAT z brutto: × stawka/(100+stawka)."}},{"n":40,"q":"W przypadku, gdy po wystawieniu faktury udzielono rabatów lub stwierdzono błąd rachunkowy, należy wystawić fakturę","o":{"A":"RR.","B":"proforma.","C":"zaliczkową.","D":"korygującą."},"a":"D","img":[4167,93],"e":{"A":"Faktura RR – zakup od rolnika ryczałtowego.","B":"Proforma to dokument przed sprzedażą.","C":"Zaliczkowa – przy przedpłacie.","D":"Poprawna. Rabat po wystawieniu lub błąd → faktura korygująca.","tip":"Korekta = faktura korygująca."}}],"2014-czerwiec":[{"n":1,"q":"Która, dodatkowo płatna, impreza turystyczna uzupełni i urozmaici podstawowy program wypoczynku?","o":{"A":"Własna.","B":"Incoming.","C":"Study tour.","D":"Fakultatywna."},"a":"D","img":[0,62],"e":{"A":"Impreza własna – organizowana przez biuro samodzielnie.","B":"Incoming – przyjazdy cudzoziemców do kraju.","C":"Study tour – wyjazd studyjny.","D":"Poprawna. Fakultatywna – dodatkowo płatna, uzupełnia program pobytu.","tip":"Fakultet = dla chętnych za dopłatą."}},{"n":2,"q":"Które usługi turystyczne musi koniecznie zarezerwować biuro podróży w celu organizacji 4-dniowej wycieczki krajoznawczej do Krakowa dla turystów z Wrocławia?","o":{"A":"Pilota wycieczek, informacyjną, noclegową, rozrywkową.","B":"Ubezpieczeniową, przewodnika miejskiego, noclegową, transportową.","C":"Informacyjną, żywieniową, ubezpieczeniową, kulturalno-rozrywkową.","D":"Transportową, kulturalno-rozrywkową, pilota wycieczek, żywieniową."},"a":"B","img":[62,92],"e":{"A":"Informacja i rozrywka nie są konieczne.","B":"Poprawna. 4-dniowa wycieczka do Krakowa: ubezpieczenie, przewodnik miejski, noclegi, transport.","C":"Brakuje noclegów i transportu.","D":"Brakuje noclegów.","tip":"Bez noclegu i transportu nie ma wycieczki wielodniowej."}},{"n":3,"q":"W celu integracji pracowników przedsiębiorstwa, należy zorganizować imprezę","o":{"A":"eventową.","B":"biznesową.","C":"motywacyjną.","D":"kwalifikowaną."},"a":"C","img":[154,62],"e":{"A":"Event to wydarzenie, ale cel integracyjny realizuje impreza motywacyjna.","B":"Biznesowa – podróże służbowe.","C":"Poprawna. Impreza motywacyjna (incentive) służy integracji i nagradzaniu pracowników.","D":"Kwalifikowana – wymaga umiejętności.","tip":"Integracja/nagroda pracowników = incentive."}},{"n":4,"q":"Wyznawcom religii rzymsko-katolickiej należy zaproponować wyjazdy do miejsc kultu","o":{"A":"w Łodzi, Świdnicy, Karpaczu.","B":"w Białymstoku, Hajnówce, Przemyślu.","C":"w Bohonikach, Kruszynianach, Gdańsku.","D":"w Krzeszowie, Świętej Lipce, Kalwarii Zebrzydowskiej."},"a":"D","img":[216,62],"e":{"A":"Łódź, Świdnica, Karpacz nie są głównymi sanktuariami katolickimi (Karpacz – świątynia Wang, luterańska).","B":"Hajnówka, Białystok – ośrodki prawosławne.","C":"Bohoniki i Kruszyniany – meczety Tatarów.","D":"Poprawna. Krzeszów, Święta Lipka, Kalwaria Zebrzydowska – sanktuaria katolickie.","tip":"Kalwaria Zebrzydowska – UNESCO."}},{"n":5,"q":"Turyście — miłośnikowi pieszych podróży po bezdrożach Ameryki Południowej, należy przedstawić ofertę","o":{"A":"imprezy raftingu.","B":"podróży incentiv.","C":"wyprawy canyoningu.","D":"wędrówki trekkingowej."},"a":"D","img":[278,93],"e":{"A":"Rafting to spływ pontonem.","B":"Incentive to wyjazd motywacyjny.","C":"Canyoning to schodzenie kanionami potoków.","D":"Poprawna. Trekking – wielodniowe piesze wędrówki po bezdrożach.","tip":"Pieszo po bezdrożach = trekking."}},{"n":6,"q":"Do ustalenia różnicy wzniesień na trasie wędrówki należy wykorzystać","o":{"A":"wykonane zdjęcia.","B":"mapę synoptyczną.","C":"mapę samochodową.","D":"profil hipsometryczny."},"a":"D","img":[371,179],"e":{"A":"Zdjęcia nie pokazują wysokości.","B":"Mapa synoptyczna pokazuje pogodę.","C":"Mapa samochodowa pokazuje drogi.","D":"Poprawna. Profil hipsometryczny pokazuje przekrój wysokości wzdłuż trasy.","tip":"Profil = wysokości na trasie."}},{"n":7,"q":"Długość odcinka między hotelem a ratuszem, odczytana z planu miasta sporządzonego w skali 1:30 000, wynosi 4 cm. Oblicz, jaką drogę muszą pokonać goście hotelowi chcąc dojść do ratusza.","o":{"A":"0,3 km","B":"1,2 km","C":"3,0 km","D":"3,4 km"},"a":"B","img":[550,93],"e":{"A":"0,3 km – błąd.","B":"Poprawna. 4 cm × 30 000 = 120 000 cm = 1,2 km.","C":"3,0 km – błąd.","D":"3,4 km – błąd.","tip":"1:30 000 → 1 cm = 300 m."}},{"n":8,"q":"Wskaż walutę, której kurs należy wykorzystać przy kalkulacji kosztów wycieczki na Węgry (tabela kursowa: nazwa, symbol, kupno, sprzedaż).","o":{"A":"Lej 2 / 10 / 9","D":"Dom Wczasowy Brylant: 2 / 5 / 4"},"a":"C","img":[1631,241],"e":{"A":"Adam: 2 + 20 + 15 = 37 miejsc – za mało.","B":"Magda: 1 + 26 + 18 = 45 – za mało.","C":"Poprawna. Mat: 2 SGL (pilot, kierowca) + 10 DBL (20 kobiet) + 9 TPL (27 mężczyzn) = 49.","D":"Brylant: 2 + 10 + 12 = 24 – za mało.","tip":"Policz miejsca i podział kobiety/mężczyźni."}},{"n":16,"q":"Który z przedstawionych schematów należy zastosować kalkulując imprezę turystyczną dla 30 uczestników przy 10% marży?","o":{"A":"1 000 (koszty) + 23 (VAT) + 100 (marża) = 1 123; 1 123 : 30 = 37,43","B":"1 000 (koszty) + 100 (marża) + 23 (VAT) = 1 123; 1 123 : 30 = 37,43","C":"1 000 (koszty) + 230 (VAT) + 23 (marża) = 1 253; 1 253 : 30 = 41,77","D":"1 000 (koszty) + 230 (VAT) + 100 (marża) = 1 330; 1 330 : 30 = 44,33"},"a":"B","ctx":1,"img":[1872,504],"e":{"A":"VAT przed marżą – zła kolejność.","B":"Poprawna. Koszty + marża 10% (100) + VAT 23% od marży (23) = 1123; 1123 : 30 = 37,43.","C":"VAT 230 to 23% od kosztów – błąd.","D":"VAT od całości kosztów – błąd.","tip":"Procedura marży: VAT tylko od marży."}},{"n":17,"q":"W kalkulacji imprezy turystycznej kosztami zmiennymi są koszty","o":{"A":"wyżywienia i biletów wstępu.","B":"usług pilota i noclegu w czarterze.","C":"usługi przewodnika i usługi pilota.","D":"noclegu w czarterze i biletów wstępu."},"a":"A","img":[2376,179],"e":{"A":"Poprawna. Wyżywienie i bilety płaci się za każdą osobę – koszty zmienne.","B":"Pilot i czarter to koszty stałe.","C":"Przewodnik i pilot – stałe.","D":"Czarter – stały.","tip":"Zmienny = na osobę."}},{"n":18,"q":"Którą informację pomija pracownik biura podróży, korzystający z systemu rezerwacyjnego, składając zamówienie na usługę noclegową dla grupy wycieczkowej?","o":{"A":"O strukturze zamawianych pokoi.","B":"O lokalizacji zamawianych pokoi.","C":"O miejscu zbiórki w dniu przyjazdu do obiektu.","D":"O terminie wyjazdu grupy z obiektu noclegowego."},"a":"C","img":[2555,93],"e":{"A":"Struktura pokoi jest potrzebna.","B":"Lo ernet nie jest głównym oczekiwaniem.","B":"Luksus to nie cecha wypoczynku na wsi.","C":"Poprawna. Na wsi goście szukają świeżego powietrza i kontaktu z naturą.","D":"Kontakt z mieszkańcami – dodatek, nie cel główny.","tip":"Wieś = natura, cisza."}},{"n":4,"q":"W miejscowości przedstawionej na zdjęciu rozwija się przede wszystkim turystyka","o":{"A":"wypoczynkowa.","B":"kwalifikowana.","C":"krajoznawcza.","D":"motywacyjna."},"a":"A","pic":1,"img":[166,261],"e":{"A":"Poprawna. Zdjęcie przedstawia zatłoczoną plażę – kurort turystyki wypoczynkowej.","B":"Kwalifikowana wymaga sprzętu i umiejętności.","C":"Krajoznawcza – zwiedzanie.","D":"Motywacyjna – nagrody dla pracowników.","tip":"Plaża = wypoczynek."}},{"n":5,"q":"Na przedstawionej mapie Polski zaznaczono województwo","o":{"A":"mazowieckie.","B":"dolnośląskie.","C":"lubelskie.","D":"opolskie."},"a":"B","pic":1,"img":[427,255],"e":{"A":"Mazowieckie leży w centrum.","B":"Poprawna. Zaznaczone województwo w południowo-zachodnim rogu Polski to dolnośląskie.","C":"Lubelskie – na wschodzie.","D":"Opolskie – mniejsze, na wschód od dolnośląskiego.","tip":"Dolny Śląsk – stolica Wrocław."}},{"n":6,"q":"Brama Brandenburska, to jedna z najbardziej rozpoznawalnych atrakcji turystycznych","o":{"A":"Paryża.","B":"Berlina.","C":"Rzymu.","D":"Wiednia."},"a":"B","img":[682,45],"e":{"A":"Paryż – wieża Eiffla.","B":"Poprawna. Brama Brandenburska to symbol Berlina.","C":"Rzym – Koloseum.","D":"Wiedeń – Schönbrunn, katedra św. Szczepana.","tip":"Berlin = Brama Brandenburska."}},{"n":7,"q":"Najwyższym szczytem Beskidu Żywieckiego jest","o":{"A":"Śnieżka.","B":"Turbacz.","C":"Śnieżnik.","D":"Babia Góra."},"a":"D","img":[727,44],"e":{"A":"Śnieżka – Karkonosze.","B":"Turbacz – Gorce.","C":"Śnieżnik – Masyw Śnieżnika.","D":"Poprawna. Babia Góra (1725 m) – najwyższy szczyt Beskidu Żywieckiego.","tip":"Babia Góra = Królowa Beskidów."}},{"n":8,"q":"Osoba, która chciałaby zobaczyć najgłębsze jezioro świata, powinna wybrać się na wycieczkę nad","o": ona Łąka”.","B":"„Wesoła Wieś”.","C":"„Zielona Szkoła”.","D":"„Wesoła Szkoła”."},"a":"C","img":[1017,77],"e":{"A":"„Zielona Łąka” to nie nazwa formy wypoczynku.","B":"„Wesoła Wieś” – nie.","C":"Poprawna. „Zielona szkoła” – zajęcia edukacyjne dla uczniów poza szkołą.","D":"„Wesoła Szkoła” – nie.","tip":"Zielona szkoła = edukacja w terenie."}},{"n":13,"q":"Zawarcie ubezpieczenia KL przez turystę w firmie ubezpieczeniowej obejmuje poniesienie kosztów","o":{"A":"opieki nad dziećmi w czasie pobytu poza swoim miejscem zamieszkania.","B":"leczenia turysty w czasie pobytu poza swoim miejscem zamieszkania.","C":"pełnego wyżywienia.","D":"opłaty lotniskowej."},"a":"B","img":[1094,45],"e":{"A":"Opieka nad dziećmi nie jest w KL.","B":"Poprawna. KL – koszty leczenia poza miejscem zamieszkania.","C":"Wyżywienie nie jest objęte.","D":"Opłaty lotniskowe nie są objęte.","tip":"KL = koszty leczenia."}},{"n":14,"q":"Kalkulacja imprezy turystycznej zawiera marżę dla","o":{"A":"hotelu.","B":"przewoźnika.","C":"biura podróży.","D":"linii lotniczych."},"a":"C","img":[1139,44],"e":{"A":"Hotel ma swoją cenę, marża w kalkulacji imprezy jest dla biura.","B":"Przewoźnik – nie.","C":"Poprawna. Marża w kalkulacji imprezy to zysk biura podróży.","D":"Linie lotnicze – nie.","tip":"Marża = zarobek organizatora."}},{"n":15,"q":"Jaki jest koszt uczestnictwa jednej osoby w ekowycieczce zorganizowanej przez biuro podróży przy założeniu, że całkowity koszt udziału w wycieczce 50 osób, z uwzględnieniem marży biura podróży, podatku VAT i wszystkich kosztów, wynosi 15 000 zł?","o":{"A":"3 000 zł","B":"2 500 zł","C":"300 zł","D":"250 zł"},"a":"C","img":[1183,109],"e":{"A":"3000 zł – podzielono przez 5.","B":"2500 zł – błąd.","C":"Poprawna. 15 000 zł : 50 osób = 300 zł.","D":"250 zł – błąd.","tip":"Koszt całkowity : liczba osób."}},{"n":16,"q":"Do kosztów stałych imprezy turystycznej nie zalicza się kosztów","o":{"A":"transportu.","B":"przewodnictwa.","C":"obsługi pilota wycieczki.","D":"biletów wstępu kupow :"Produkt.","C":"Promocję.","D":"Dystrybucję."},"a":"C","img":[1537,78],"e":{"A":"Cena – nie.","B":"Produkt – nie.","C":"Poprawna. Tablica informacyjna to reklama – promocja.","D":"Dystrybucja – kanały sprzedaży.","tip":"Reklama = promocja."}},{"n":21,"q":"Którą strategię powinien przyjąć właściciel kwatery wiejskiej w ramach strategii produktu?","o":{"A":"Modernizację pokoi.","B":"Sezonową obniżkę cen.","C":"Umieszczenie oferty w Internecie.","D":"Udzielenie zniżek stałym klientom."},"a":"A","img":[1615,42],"e":{"A":"Poprawna. Modernizacja pokoi ulepsza produkt.","B":"Obniżka cen – strategia cenowa.","C":"Internet – dystrybucja/promocja.","D":"Zniżki – strategia cenowa.","tip":"Produkt = to, co gość kupuje i z czego korzysta."}},{"n":22,"q":"Który dokument określa prawa i obowiązki gości w kwaterze wiejskiej?","o":{"A":"Regulamin bhp.","B":"Regulamin pracy.","C":"Regulamin opłat i prowizji.","D":"Regulamin gospodarstwa agroturystycznego."},"a":"D","img":[1657,42],"e":{"A":"Regulamin BHP – dla pracowników.","B":"Regulamin pracy – dla pracowników.","C":"Regulamin opłat – dotyczy banków itp.","D":"Poprawna. Regulamin gospodarstwa agroturystycznego określa prawa i obowiązki gości.","tip":"Goście ↔ regulamin obiektu."}},{"n":23,"q":"Którego elementu nie zawiera umowa z biurem podróży?","o":{"A":"Programu imprezy turystycznej.","B":"Miejsca pobytu lub trasy wycieczki.","C":"Informacji o miejscu zamieszkania właściciela biura podróży.","D":"Nazwy organizatora turystyki i numeru jego wpisu do rejestru."},"a":"C","img":[1699,42],"e":{"A":"Program jest w umowie.","B":"Miejsce pobytu jest w umowie.","C":"Poprawna. Adres zamieszkania właściciela biura nie jest elementem umowy.","D":"Nazwa organizatora i numer w rejestrze muszą być w umowie.","tip":"Umowa: organizator, program, miejsce, cena, warunki."}},{"n":24,"q":"Zgodnie z klasyfikacją Światowej Organizacji Turystyki Narodów Zjednoczonych, podróże mieszkańców Mazowsza po Mazurach nazywa się turystyką","o":{"A":"krajową.","B":"wyjazdową.","C":"przyjazdową.","D":"międzynarodową."},"a":"A","img":[1741,73],"e":{"A":"Poprawna. Mieszkańcy Polski podróżujący po Polsce – turystyka krajowa.","B":"Wyjazdowa – za granicę.","C":"Przyjazdowa – cudzoziemcy.","D":"Międzynarodowa – przekroczenie granicy.","tip":"Mazowsze → Mazury = krajowa."}},{"n":25,"q":"Działania na rzecz popierania i ułatwiania rozwoju turystyki wiejskiej w Polsce, to zadania statutowe","o":{"A":"Polskiego Zrzeszenia Hoteli.","B":"Światowej Rady Podróży i Turystyki.","C":"Polskiej Federacji Turystyki Wiejskiej.","D":"Światowej Organizacji Turystyki Narodów Zjednoczonych."},"a":"C","img":[1814,41],"e":{"A":"Zrzeszenie Hoteli – branża hotelowa.","B":"WTTC – światowa organizacja biznesu turystycznego.","C":"Poprawna. PFTW „Gospodarstwa Gościnne” wspiera turystykę wiejską.","D":"UNWTO – organizacja światowa.","tip":"Turystyka wiejska = PFTW."}},{"n":26,"q":"Przy planowaniu wycieczki przez organizatorów turystyki nie uwzględnia się","o":{"A":"celu imprezy.","B":"rodzaju transportu.","C":"własnych upodobań pilota wycieczki.","D":"życzeń klientów zainteresowanych wyjazdem."},"a":"C","img":[1855,43],"e":{"A":"Cel imprezy jest podstawą planu.","B":"Transport trzeba zaplanować.","C":"Poprawna. Prywatne upodobania pilota nie są kryterium planowania.","D":"Życzenia klientów są kluczowe.","tip":"Planujemy dla klienta."}},{"n":27,"q":"Okazanie karty pokładowej, to element odprawy","o":{"A":"celnej.","B":"paszportowej.","C":"bezpieczeństwa.","D":"biletowo-bagażowej."},"a":"D","img":[1898,45],"e":{"A":"Odprawa celna – towary.","B":"Paszportowa – dokumenty tożsamości.","C":"Bezpieczeństwa – kontrola bagażu podręcznego.","D":"Poprawna. Kartę pokładową otrzymuje się/okazuje w odprawie biletowo-bagażowej.","tip":"Check-in = karta pokładowa."}},{"n":28,"q":"Zgodnie z ustawą o usługach turystycznych, za inny obiekt, w którym świadczone są usługi hotelarskie na terenie wiejskim, uważa się","o":{"A":"pokoje gościnne.","B":"pola biwakowe.","C":"pensjonat do Jaskini Nietoperza.","tip":"Brązowa tablica = informacja turystyczna."}},{"n":32,"q":"Główną atrakcją dla rodzin z dziećmi wybierających pobyt wakacyjny w małej miejscowości położonej w pierwszej linii brzegowej, jest możliwość korzystania","o":{"A":"z basenów.","B":"z jazdy konnej.","C":"z dostępu do morza.","D":"z wycieczek rowerowych."},"a":"C","img":[2391,77],"e":{"A":"Baseny – dodatek.","B":"Jazda konna – dodatek.","C":"Poprawna. W pierwszej linii brzegowej główną atrakcją jest dostęp do morza.","D":"Rowery – dodatek.","tip":"Wybrzeże = morze i plaża."}},{"n":33,"q":"W programie imprezy turystycznej dla pasjonatów myślistwa, odbywającej się w terminie od 3 do 4 listopada, nie powinno zabraknąć","o":{"A":"wyjazdu do sklepu myśliwskiego.","B":"obchodów święta „Hubertus”.","C":"przejażdżki bryczkami.","D":"pieczenia prosiaka."},"a":"B","img":[2468,77],"e":{"A":"Sklep – mało ważny.","B":"Poprawna. 3 listopada – dzień św. Huberta, patrona myśliwych (Hubertus).","C":"Bryczki – dodatek.","D":"Prosiak – dodatek.","tip":"Hubertus = 3 listopada."}},{"n":34,"q":"Właściciel gospodarstwa gościnnego na życzenie gościa może wystawić w dniu wyjazdu","o":{"A":"rachunek z kasy fiskalnej.","B":"rachunek uproszczony.","C":"fakturę proforma.","D":"biling."},"a":"B","img":[2545,46],"e":{"A":"Kasa fiskalna nie jest obowiązkowa w gospodarstwie zwolnionym.","B":"Poprawna. Gospodarstwo gościnne może wystawić rachunek uproszczony.","C":"Proforma nie jest dokumentem sprzedaży.","D":"Biling – zestawienie połączeń telefonicznych.","tip":"Agroturystyka = rachunek."}},{"n":35,"q":"Właściciel gospodarstwa gościnnego wystawił rachunek za pobyt w swoim gospodarstwie. Który element powinien znajdować się na wystawionym dokumencie?","o":{"A":"REGON klienta.","B":"Data wystawienia.","C":"Imiona rodziców nabywcy.","D":"Standard zajmowanego pokoju."},"a":"B","img":[2591,76],"e":{"A":"REGON klienta nie jest wymagany.","B":"Poprawna. Data wystawienia jest obowiązkowym elementem rachunku.","C":"Imiona rodziców – nie.","D":"Standard pokoju – nie.","tip":"Rachunek: strony, data, usługa, kwota, podpis."}},{"n":36,"q":"Voucher to dokument","o":{"A":"umożliwiający realizację świadczeń zamówionych przez biuro podróży dla klienta.","B":"upoważniający do wielokrotnego przekraczania granicy państwa.","C":"zezwalający na wjazd i pobyt w kraju wydającym daną wizę.","D":"zezwalający na przejazd przez granicę bez paszportu."},"a":"A","img":[2667,41],"e":{"A":"Poprawna. Voucher uprawnia klienta do świadczeń zamówionych i opłaconych przez biuro.","B":"Wielokrotne przekraczanie granicy – wiza wielokrotna.","C":"Wjazd i pobyt – wiza.","D":"Bez paszportu – dowód osobisty w UE/Schengen.","tip":"Voucher = bon na usługi."}},{"n":37,"q":"Teczka imprezy turystycznej nie musi zawierać","o":{"A":"kalkulacji imprezy.","B":"ksero paszportu uczestnika.","C":"programu imprezy turystycznej.","D":"umowy uczestnictwa w imprezie."},"a":"B","img":[2708,46],"e":{"A":"Kalkulacja jest w teczce.","B":"Poprawna. Ksero paszportu nie musi być w teczce.","C":"Program musi być w teczce.","D":"Umowa musi być w teczce.","tip":"Teczka = dokumentacja imprezy."}},{"n":38,"q":"Przy organizacji imprezy turystycznej kosztem stałym są","o":{"A":"koszty transportu np. autokaru.","B":"bilety jednorazowego wstępu np. do muzeum.","C":"bilety komunikacyjne np. za przejazd tramwajem.","D":"rachunki indywidualne za konsumpcję turystów np. za kawę."},"a":"A","img":[2754,46],"e":{"A":"Poprawna. Autokar kosztuje tyle samo bez względu na liczbę osób – koszt stały.","B":"Bilety na osobę – zmienny.","C":"Bilety tramwajowe na osobę – zmienny.","D":"Kawa – koszt indywidualny klienta.","tip":"Stały = na grupę."}},{"n":39,"q":"W kalkulacji imprez często uwzględnia się miejsce bezpłatne, które zwyczajowo jest przewidziane dla","o":{"A":"pilota wycieczki.","B":"najstarszego klienta.","C":"organizatora wyjazdu.","D":"najmłodszego dziecka."},"a":"A","img":[2800,45],"e":{"A":"Poprawna. Miejsce bezpłatne zwyczajowo dla pilota.","B":"Wiek klienta nie decyduje.","C":"Organizator nie jedzie gratis.","D":"Dziecko – zniżka.","tip":"Gratis = pilot."}},{"n":40,"q":"Stawką akwizycyjną w turystyce jest","o":{"A":"kwota akwizycyjna, ustalana ryczałtowo, za przyjazdy turystów z Polski.","B":"kwota doliczona do ceny, jaką płaci klient, przeznaczona dla agenta.","C":"opłata akwizycyjna dla pracowników lotniska.","D":"opłata za nadbagaż turystów."},"a":"B","img":[2845,44],"e":{"A":"Ryczałt za przyjazdy – nie.","B":"Poprawna. Stawka akwizycyjna – część ceny przeznaczona dla agenta (prowizja).","C":"Pracownicy lotniska – nie.","D":"Nadbagaż – nie.","tip":"Akwizycja = pozyskanie klienta przez agenta."}}],"2013-pazdziernik":[{"n":1,"q":"Imprezą turystyczną zgodnie z ustawą o usługach turystycznych jest","o":{"A":"nocleg w hotelu.","B":"wystawa w muzeum.","C":"wycieczka nad morze.","D":"transfer turysty do hotelu."},"a":"C","img":[0,46],"e":{"A":"Sam nocleg to pojedyncza usługa, nie impreza.","B":"Wystawa to pojedyncza atrakcja.","C":"Poprawna. Wycieczka łączy co najmniej 2 usługi (transport, nocleg, zwiedzanie) we wspólnym programie i cenie – to impreza turystyczna.","D":"Transfer to pojedyncza usługa przewozu.","tip":"Impreza = min. 2 usługi + wspólny program i cena."}},{"n":2,"q":"Rejs wycieczkowy statkiem pasażerskim po morzu określany jest jako","o":{"A":"cruise.","B":"rafting.","C":"treking.","D":"tramping."},"a":"A","img":[46,45],"e":{"A":"Poprawna. Cruise (kruiz) – rejs wycieczkowy statkiem pasażerskim.","B":"Rafting – spływ pontonem po rzece.","C":"Trekking – piesza wędrówka.","D":"Tramping – tanie samodzielne podróżowanie.","tip":"Cruise = statek wycieczkowy."}},{"n":3,"q":"Wskaż taryfę hotelową gwarantującą turyście nocleg ze śniadaniem.","o":{"A":"CB","B":"BB","C":"FB","D":"HB"},"a":"B","img":[91,44],"e":{"A":"CB (Continental Breakfast) to rodzaj śniadania, nie taryfa noclegowa.","B":"Poprawna. BB = bed & breakfast – nocleg ze śniadaniem.","C":"FB – trzy posiłki.","D":"HB – dwa posiłki.","tip":"BB = śniadanie."}},{"n":4,"q":"Na podstawie zamieszczonego programu wycieczki określ, do jakiego rodzaju turystyki ona należy. Dzień 1: godz. 600 – zbiórka, przejazd do Kalwarii Zebrzydowskiej, zwiedzanie sanktuarium, przejazd do Wadowic, zwiedzanie bazyliki oraz zwiedzanie Domu – Muzeum Jana Pawła II, przejazd do Krakowa, zakwaterowanie w hotelu, obiadokolacja; Dzień 2: godz. 800 – śniadanie w hotelu, zwiedzanie Krakowa, Rynek Główny, Kościół Mariacki, Muzeum pod Rynkiem Krakowa, Wawel, przejazd do Sanktuarium Miłosierdzia Bożego w Łagiewnikach, o 1500 nabożeństwo w Łagiewnikach, zwiedzanie sanktuarium, powrót do hotelu, obiadokolacja; Dzień 3: godz. 800 – śniadanie w hotelu, godz. 930 zbiórka i powrót","o":{"A":"Wiejskiej.","B":"Pątniczej.","C":"Etnicznej.","D":"Zdrowotnej."},"a":"B","img":[135,237],"e":{"A":"Turystyka wiejska – pobyt na wsi.","B":"Poprawna. Kalwaria, Wadowice, Łagiewniki, nabożeństwo – to turystyka pątnicza (pielgrzymkowa).","C":"Etniczna – miejsca pochodzenia przodków.","D":"Zdrowotna – uzdrowiska.","tip":"Sanktuaria = pątnicza."}},{"n":5,"q":"Zapewnienie spokojnego snu i wyżywienia to według modelu hierarchii potrzeb Maslowa zaspokojenie potrzeb","o":{"A":"uznania.","B":"fizjologicznych.","C":"samorealizacji.","D":"bezpieczeństwa."},"a":"B","img":[372,76],"e":{"A":"Uznanie – prestiż.","B":"Poprawna. Sen i jedzenie to potrzeby fizjologiczne.","C":"Samorealizacja – rozwój.","D":"Bezpieczeństwo – ochrona, stabilność.","tip":"Fizjologiczne = podstawa piramidy."}},{"n":6,"q":"Turystom lubiącym aktywny wypoczynek i wędrówki po górach należy zaproponować imprezę typu","o":{"A":"incentive.","B":"bumping.","C":"trekking.","D":"rafting."},"a":"C","img":[448,45],"e":{"A":"Incentive – motywacyjna.","B":"Bumping – nie dotyczy gór.","C":"Poprawna. Trekking – aktywne wędrówki górskie.","D":"Rafting – spływ.","tip":"Góry pieszo = trekking."}},{"n":7,"q":"Korzystając z planu Kazimierza Dolnego wybierz najkrótszą trasę dotarcia z Hotelu Wenus na Zamek uwzględniając wszystkie dostępne ulice.","o":{"A":"Tyszkiewicza - Nadwiślańska - Rynek- Zamkowa.","B":"Puławska - Kościelna - Rynek - Zamkowa.","C":"Tyszkiewicza - Podzamcze - Rynek- Zamkowa.","D":"Sadowa - Nadwiślańska - Rynek- Zamkowa."},"a":"C","pic":1,"img":[493,681],"e":{"A":"Nadwiślańska prowadzi okrężnie, w stronę rzeki.","B":"Puławska i Kościelna prowadzą inną, dłuższą drogą.","C":"Poprawna. Od hotelu Wenus ul. Tyszkiewicza i Podzamcze prosto do Rynku, potem Zamkowa – najkrócej.","D":"Sadowa – dłuższa trasa.","tip":"Na planie szukaj najprostszej linii ulic."}},{"n":8,"q":"Jak nazywa się przedstawiony na zdjęciu obiekt w historycznym centrum Krakowa, który zasłynął z legendy o Lajkoniku?","o":{"A":"Bazylika Świętej Anny.","B":"Ratusz Staromiejski.","C":"Brama Floriańska.","D":"Kościół Mariacki."},"a":"D","pic":1,"img":[1174,227],"e":{"A":"Bazylika św. Anny – ul. św. Anny.","B":"Ratusz – zachowana tylko wieża.","C":"Brama Floriańska – początek Drogi Królewskiej.","D":"Poprawna. Na zdjęciu Kościół Mariacki; Lajkonik to krakowski zwyczaj, a z wieży mariackiej grany jest hejnał.","tip":"Kościół Mariacki = hejnał, ołtarz Wita Stwosza."}},{"n":9,"q":"Jak nazywa się słynny ludowy taniec pochodzący z Andaluzji, gdzie rytm tancerzom wyznacza gitara i kastaniety?","o":{"A":"Salsa.","B":"Rumba.","C":"Czardasz.","D":"Flamenco."},"a":"D","img":[1401,77],"e":{"A":"Salsa – Kuba/Ameryka Łacińska.","B":"Rumba – Kuba.","C":"Czardasz – Węgry.","D":"Poprawna. Flamenco – taniec z Andaluzji z gitarą i kastanietami.","tip":"Andaluzja = flamenco."}},{"n":10,"q":"Wskaż kraj, w którym znajduje się piramida Mykerinosa.","o":{"A":"Meksyk.","B":"Sudan.","C":"Egipt.","D":"Irak."},"a":"C","img":[1478,44],"e":{"A":"Meksyk – piramidy Majów i Azteków.","B":"Sudan – piramidy nubijskie.","C":"Poprawna. Piramida Mykerinosa jest w Gizie, w Egipcie.","D":"Irak – zigguraty.","tip":"Cheops, Chefren, Mykerinos = Giza."}},{"n":11,"q":"Która miejscowość posiada jedne z najlepiej zachowanych w Polsce średniowieczne obie const S = Object.fromEntries(DATA.sessions.map(s=>[s.id,s]));
const $ = s => document.querySelector(s);
const esc = t => String(t??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = "ABCD";

// ---------- pamięć (tylko w tej przeglądarce) ----------
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem("t07:"+k)) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem("t07:"+k, JSON.stringify(v)) }catch(e){} }
};
let stats = store.get("stats", {});          // "sid#n" -> {ok, bad, last}
function record(key, good){
  const s = stats[key] || {ok:0, bad:0};
  good ? s.ok++ : s.bad++; s.last = good ? 1 : 0; stats[key] = s; store.set("stats", stats);
}

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2200) }

// ---------- PDF ----------
let dl = null;
(async()=>{ try{ if(window.claude) dl = await claude.use("downloads") }catch(e){} })();
async function getPdf(file, name){
  try{
    if(dl){
      const r = await fetch("pdf/"+file); const b = await r.blob();
      await dl.save({filename: name || file, data: b});
      return;
    }
  }catch(e){ if(e && e.code === "cancelled") return; }
  window.location.href = "pdf/" + file;   // zapasowo: otwórz w przeglądarce
}
const orig = (sid, kind) => `https://arkusze.pl/zawodowy/t07-${sid}-egzamin-zawodowy-${kind}.pdf`;
const page = sid => `https://arkusze.pl/egzamin-zawodowy-t-07-${sid}/`;

// ---------- routing ----------
let view = {name:"home"};
function go(name, arg){ view = {name, arg}; location.hash = name === "home" ? "" : (name + (arg ? "-" + arg : "")); render(); window.scrollTo(0,0) }
function fromHash(){
  const h = location.hash.slice(1);
  if(!h) return {name:"home"};
  const m = h.match(/^(session|study|quiz|prak|sol|ans)-(\d{4}-[a-z]+)$/);
  if(m && S[m[2]]) return {name:m[1], arg:m[2]};
  if(["trainer","mistakes","konspekt"].includes(h)) return {name:h};
  return {name:"home"};
}
window.addEventListener("hashchange", ()=>{ const v = fromHash(); if(v.name!==view.name || v.arg!==view.arg){ view=v; render() } });

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v === view.name || (b.dataset.v==="home" && ["session","study","quiz","prak","sol","ans"].includes(view.name))));
  const f = {home, session, study, quiz, trainer, mistakes, konspekt, sol, ans}[view.name] || home;
  $("#app").innerHTML = ""; f(view.arg);
}

function optHtml(q, chosen, reveal){
  return L.split("").map(k=>{
    const t = q.o[k] ?? "(odpowiedź na obrazku)";
    let cls = "";
    if(reveal){ if(k===q.a) cls="ok"; else if(k===chosen) cls="bad"; }
    const why = reveal && q.e && q.e[k] ? `<div class="why ${k===q.a?'ok':''}">${esc(q.e[k])}</div>` : "";
    return `<button class="opt ${cls}" data-k="${k}" ${reveal?"disabled":""}><b>${k}.</b>${esc(t)}</button>${why}`;
  }).join("");
}
function qBody(q, sid){
  const needImg = q.img && (q.ctx || Object.keys(q.o).length < 4 || q.pic);
  let im = "";
  if(q.img){
    const [W,H] = DATA.spr[sid], [y,h] = q.img;
    const pos = H===h ? 0 : y/(H-h)*100;
    im = `<div class="spr" role="img" aria-label="Zadanie ${q.n} – oryginał" style="aspect-ratio:${W}/${h};background-image:url(spr/${sid}.jpg);background-size:100% ${H/h*100}%;background-position:0 ${pos}%"></div>`;
  }
  // gdy pokazujemy wycinek z arkusza, zawiera on już treść pytania (bez nagłówka i bez odpowiedzi) – nie dublujemy jej
  return `<div class="q">${q.n}.${needImg ? "" : " " + esc(q.q || "(treść pytania na obrazku poniżej)")}</div>
    ${needImg ? `<div class="img">${im}</div>` : (q.ctx ? `<div class="ctx">${esc(q.ctx)}</div>` : "")}
    ${!needImg && q.img ? `<details><summary>Pokaż oryginał z arkusza</summary><div class="img">${im}</div></details>` : ""}`;
}
function after(q, reveal){
  if(!reveal) return "";
  if(!q.e) return `<div class="tip">Poprawna odpowiedź: <b>${q.a}</b>. Szczegółowe wyjaśnienie do tej sesji jest w przygotowaniu.</div>`;
  return (q.e.long ? `<div class="long"><b>📖 Wyjaśnienie prostymi słowami</b><br>${esc(q.e.long)}</div>` : "") +
         (q.e.tip ? `<div class="tip">► Zapamiętaj: ${esc(q.e.tip)}</div>` : "");
}

   qs.map(q=>`<div class="card">${qBody(q,sid)}${optHtml(q,null,true)}${after(q,true)}</div>`).join("");

// ---------- test całej sesji ----------
function quiz(sid){
  const s = S[sid], qs = DATA.q[sid];
  let i = 0, ans = {};
  const draw = () => {
    if(i >= qs.length) return result();
    const q = qs[i], key = sid+"#"+q.n, ch = ans[q.n];
    const ok = Object.values(ans).filter(x=>x.good).length;
    $("#app").innerHTML = `<div class="flex"><button class="btn ghost" onclick="go('session','${sid}')">← Przerwij</button>
      <span class="muted small">${s.month} ${s.year} • pytanie ${i+1}/40 • dobrze: ${ok}</span></div>
      <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="card">${qBody(q,sid)}<div id="opts">${optHtml(q, ch&&ch.k, !!ch)}</div>${after(q,!!ch)}
      ${ch ? `<button class="btn primary" id="next">${i===qs.length-1?"Wynik":"Dalej →"}</button>`:""}</div>`;
    $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k, good=k===q.a; ans[q.n]={k,good}; record(key,good); draw();
    });
    if(ch) $("#next").onclick=()=>{ i++; draw() };
  };
  const result = () => {
    const ok = qs.filter(q=>ans[q.n]&&ans[q.n].good).length, pass = ok >= 20;
    $("#app").innerHTML = `<div class="card"><h2>Wynik: ${ok}/40 (${Math.round(ok/40*100)}%)</h2>
      <div class="pill ${pass?'g':''}">${pass?"Zdane – próg to 20 pkt (50%)":"Niezdane – do zdania potrzeba 20 pkt"}</div>
      <div class="grid40">${qs.map(q=>`<span class="${ans[q.n]&&ans[q.n].good?'ok':'bad'}">${q.n}</span>`).join("")}</div>
      <button class="btn primary" onclick="go('study','${sid}')">Zobacz wyjaśnienia</button>
      <button class="btn" onclick="go('quiz','${sid}')">Jeszcze raz</button></div>`;
  };
  draw();
}

// ---------- losowe pytania ----------
const ALL = Object.entries(DATA.q).flatMap(([sid,qs])=>qs.filter(q=>Object.keys(q.o).length===4 || q.img).map(q=>({sid,q})));
let tr = {pool:"all", ok:0, n:0, recent:[]};

// Którą kartę pokazać jako następną?  Zwraca jeden element z `cands` ({sid, q}).
// cands – pytania dopuszczone filtrem; stats["sid#n"] = {ok, bad, last}; recent – klucze ostatnio pokazanych.
function pickNext(cands, stats, recent){
  // Domyślnie: pytania z błędami i nowe pojawiają się częściej niż te, na które już odpowiadasz dobrze.
  const w = cands.map(({sid,q})=>{
    const k = sid+"#"+q.n, s = stats[k];
    if(recent.includes(k)) return 0.05;
    if(!s) return 3;                       // jeszcze nie widziane
    return 1 + s.bad*2 - Math.min(s.ok,3)*0.25 + (s.last===0 ? 3 : 0);
  });
  let r = Math.random()*w.reduce((a,b)=>a+Math.max(b,0.05),0);
  for(let i=0;i<cands.length;i++){ r -= Math.max(w[i],0.05); if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

function trainer(){
  const years = [...new Set(DATA.sessions.map(s=>s.year))].sort((a,b)=>b-a);
  const cands = ALL.filter(x => tr.pool==="all" ? true : tr.pool==="expl" ? !!x.q.e : String(S[x.sid].year)===tr.pool);
  if(!cands.length){ $("#app").innerHTML = `<div class="card">Brak pytań dla tego filtra.</div>`; return }
  const {sid, q} = pickNext(cands, stats, tr.recent);
  const key = sid+"#"+q.n;
  tr.recent = [key, ...tr.recent].slice(0, 15);
  const s = S[sid];
  const head = () => `<div class="card flex"><div><b>Losowe pytanie</b> <span class="muted small">z ${cands.length} pytań</span></div>
     <div class="row"><select id="pool">
       <option value="all">wszystkie lata</option><option value="expl">tylko z wyjaśnieniami</option>
       ${years.map(y=>`<option value="${y}">${y}</option>`).join("")}</select>
     <span class="pill g">${tr.ok}/${tr.n}</span></div></div>`;
  const drawQ = (ch) => {
    $("#app").innerHTML = head() + `<div class="card"><div class="muted small" style="margin-bottom:6px">${s.month} ${s.year}, zadanie ${q.n}</div>
      ${qBody(q,sid)}<div id="opts">${optHtml(q, ch, !!ch)}</div>${after(q,!!ch)}
      ${ch?`<div class="tip" style="background:${ch===q.a?'var(--green-soft)':'var(--red-soft)'}">${ch===q.a?"✔ Dobrze!":"✘ Źle – poprawna odpowiedź to "+q.a+"."}</div>
      <button class="btn primary" id="next">Następne pytanie →</button>`:""}</div>`;
    $("#pool").value = tr.pool;
    $("#pool").onchange = e => { tr.pool = e.target.value; trainer() };
    if(!ch) $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k, good=k===q.a; tr.n++; if(good) tr.ok++; record(key,good); drawQ(k);
    });
    else $("#next").onclick = trainer;
  };
  drawQ(null);
}

function pagesView(sid, dir, n, title, note, pdf){
  const s = S[sid], w = String(n).length;
  const pages = Array.from({length:n}, (_,i)=>`<img class="solp" loading="lazy" src="${dir}/${sid}-${String(i+1).padStart(w,"0")}.webp" alt="Strona ${i+1} z ${n}">`).join("");
  $("#app").innerHTML = `<button class="btn ghost" onclick="go('session','${sid}')">← ${s.month} ${s.year}</button>
   <div class="card"><h2>${title} – ${s.month} ${s.year}</h2>
   <div class="muted small">${n} stron(y). Przewijaj w dół – wszystko jest tutaj, nic nie trzeba pobierać. ${note}</div>
   <button class="btn ghost" onclick="getPdf('${pdf}')">Pobierz PDF (opcjonalnie)</button></div>${pages}`;
}
function sol(sid){ pagesView(sid, "sol", S[sid].solPages || 0, "Rozwiązanie części praktycznej", "Wpisane wartości są na niebiesko.", `${sid}_praktyczny_rozwiazanie.pdf`) }
function ans(sid){ pagesView(sid, "ans", S[sid].ansPages || 0, "Odpowiedzi z wyjaśnieniami", "Poprawne odpowiedzi są zielone.", `${sid}_odpowiedzi.pdf`) }
function konspekt(){
  $("#app").innerHTML = KONSPEKT;
}
function kFilter(v){
  v = v.trim().toLowerCase();
  document.querySelectorAll("#app .ks").forEach(sec=>{
    let any = false;
    sec.querySelectorAll("tr, .kb, .kl li").forEach(el=>{ const hit = !v || el.textContent.toLowerCase().includes(v); el.style.display = hit ? "" : "none"; any = any || hit; });
    sec.style.display = any ? "" : "none";
  });
}
function mistakes(){
  const list = Object.entries(stats).filter(([k,s])=>s.bad>0 && s.last===0).map(([k])=>k);
  const items = list.map(k=>{ const [sid,n]=k.split("#"); return {sid, q:(DATA.q[sid]||[]).find(q=>q.n==n)} }).filter(x=>x.q);
  $("#app").innerHTML = `<div class="card"><h2>Moje błędy</h2>
    <div class="muted small">Pytania, na które ostatnio odpowiedziałaś źle (zapisane w tej przeglądarce). Gdy odpowiesz dobrze, znikną z listy.</div>
    ${items.length?`<button class="btn primary" onclick="tr.pool='all';go('trainer')">Ćwicz losowo (błędy częściej)</button>`:""}</div>` +
    (items.length ? items.map(({sid,q})=>`<div class="card"><div class="muted small">${S[sid].month} ${S[sid].year}</div>${qBody(q,sid)}${optHtml(q,null,true)}${after(q,true)}</div>`).join("")
                  : `<div class="card muted">Na razie brak błędów 🎉</div>`);
}

view = fromHash(); render();
</script>
</body>
</html>
